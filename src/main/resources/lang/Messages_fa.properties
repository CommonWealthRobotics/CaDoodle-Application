settings.ui_lighting_rim_x.description=جهت نور لبه در مختصات جهان. بازه: -1.0 - 1.0.
settings.ui_lighting_rim_y=نور لبه Y
settings.ui_lighting_rim_y.description=جهت نور لبه در مختصات جهان. بازه: -1.0 - 1.0.
settings.ui_lighting_rim_z=نور لبه Z
settings.ui_lighting_rim_z.description=جهت نور لبه در مختصات جهان. بازه: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=فعال بودن لبه‌های ویژگی
settings.ui_edges_enabled.description=هندسه تیره را در امتداد لبه‌های تیز واقعی اجسام CSG رسم می‌کند. مرزهای چندضلعی هم‌صفحه نادیده گرفته می‌شوند. برای حذف کامل لبه‌ها enabled=false را تنظیم کنید.
settings.ui_edges_angle_degrees=زاویه لبه بر حسب درجه
settings.ui_edges_angle_degrees.description=حداقل زاویه بین وجوه مجاور پیش از رسم لبه مشترک آن‌ها. مقادیر بیشتر خطوط تای کمتری تولید می‌کنند. بازه: 0 - 360.
settings.ui_edges_width_mode=حالت عرض لبه
settings.ui_edges_width_mode.description=screen = طرح کلی را تقریباً ثابت بر حسب پیکسل صفحه نگه می‌دارد. بهترین حالت برای ظاهر خط مویی به سبک CAD در هر سطح بزرگ‌نمایی. world = از شعاع ثابت بر حسب میلی‌متر صحنه استفاده می‌کند.
settings.ui_edges_width_px=عرض لبه بر حسب پیکسل
settings.ui_edges_width_px.description=عرض خط مرئی زمانی که widthMode=screen است. بازه: 0.1 - 10.0.
settings.ui_edges_radius=شعاع لبه
settings.ui_edges_radius.description=شعاع لبه در فضای جهان بر حسب میلی‌متر صحنه. فقط زمانی استفاده می‌شود که widthMode=world باشد. بازه: 0.001 - 100.0.
settings.ui_edges_brightness=روشنایی لبه
settings.ui_edges_brightness.description=0.0 = سیاه، 1.0 = سفید. بازه: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=عمق بزرگ‌نمایی برای نمایان بودن گرید کوچک
settings.ui_grid_small_visible_zoom_depth.description=کنترل می‌کند گرید 1 mm تا چه فاصله‌ای مرئی بماند. مقدار بیشتر = گرید 1 mm زودتر / از فاصله دورتر ظاهر می‌شود. بازه: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=ضریب روشنایی گرید کوچک
settings.ui_grid_small_brightness_multiplier.description=روشنایی RGB را ضرب می‌کند و در عین حال رنگ تم را حفظ می‌کند. 1.0 = رنگ اصلی زمینه. < 1.0 = تیره‌تر. > 1.0 = روشن‌تر. بازه: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=ضریب شفافیت گرید کوچک
settings.ui_grid_small_opacity_multiplier.description=مقدار آلفای ارائه‌شده توسط تم فعلی را ضرب می‌کند. 1.0 = بدون تغییر. بازه: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=عرض خط گرید کوچک (px)
settings.ui_grid_small_line_width_px.description=ضخامت خط گرید در واحدهای پیکسل بافت قدیمی گرید. مقادیر تاریخی فعلی 2 برای 1 mm و 4 برای 10 mm است. بازه: 1 - 10.
settings.ui_grid_small_z_offset_mm=افست Z گرید کوچک (mm)
settings.ui_grid_small_z_offset_mm.description=گرید 1 mm را دقیقاً پشت گرید 10 mm نگه دارید تا از آرتیفکت‌های عمق جلوگیری شود. بازه: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=ضریب روشنایی گرید اصلی
settings.ui_grid_major_brightness_multiplier.description=روشنایی RGB را ضرب می‌کند و در عین حال رنگ تم را حفظ می‌کند. 1.0 = رنگ اصلی زمینه. < 1.0 = تیره‌تر. > 1.0 = روشن‌تر. بازه: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=ضریب شفافیت گرید اصلی
settings.ui_grid_major_opacity_multiplier.description=مقدار آلفای ارائه‌شده توسط تم فعلی را ضرب می‌کند. 1.0 = بدون تغییر. بازه: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=عرض خط گرید اصلی (px)
settings.ui_grid_major_line_width_px.description=ضخامت خط گرید در واحدهای پیکسل بافت قدیمی گرید. مقادیر تاریخی فعلی 2 برای 1 mm و 4 برای 10 mm است. بازه: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=حالت حرکت گرید
settings.ui_grid_motion_mode.description=major = هنگام حرکت فقط گرید 10 mm واضح را مرئی نگه دار و گرید متراکم 1 mm را موقتاً پنهان کن. گرید 1 mm پس از توقف حرکت بازمی‌گردد. all = هنگام حرکت هر دو گرید خط واضح را مرئی نگه دار. بهترین پیوستگی بصری، اما احتمالاً پرهزینه‌تر. texture = رفتار اصلی: هنگام حرکت هندسه خط را با چهارضلعی‌های گرید بافت‌دار عوض کن. سریع‌تر، اما ممکن است آلیاسینگ / الگوهای مویر ایجاد کند. hidden = هنگام حرکت خطوط گرید را پنهان کن و با توقف دوربین آن‌ها را بازگردان.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=شفافیت رندر زمین
settings.ui_grid_ground_render_opacity.description=شفافیت پرکننده اصلی زمین. پرکننده در هر سطح بزرگ‌نمایی در جای خود می‌ماند؛ فقط گرید متراکم 1 mm به بزرگ‌نمایی وابسته است. برای پنهان کردن پرکننده و فعال ماندن سطح برداشت آن، آن را روی 0 بگذارید. صفحه‌های کار سفارشی این تنظیم را نادیده می‌گیرند. بازه: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=کمینه حساسیت چرخش دوربین
settings.ui_camera_orbit_min.description=حساسیت چرخش بر حسب درجه به ازای هر واحد مختصات ماوس JavaFX. min کشیدن‌های بسیار کند را کنترل می‌کند. بازه: 0.0 - 1.0.
settings.ui_camera_orbit_max=بیشینه حساسیت چرخش دوربین
settings.ui_camera_orbit_max.description=حساسیت چرخش بر حسب درجه به ازای هر واحد مختصات ماوس JavaFX. max حد بالای کشیدن‌های سریع است. بازه: 0.0 - 1.0.
settings.ui_camera_orbit_half=سرعت نیمه چرخش دوربین
settings.ui_camera_orbit_half.description=سرعت فیلترشده نشانگر بر حسب واحد مختصات JavaFX در ثانیه که حساسیت در آن نیمه راه بین min و max است. بیشتر = شتاب ملایم‌تر. بازه: 0 - 10000.
settings.ui_camera_orbit_rise_ms=زمان خیز چرخش دوربین (ms)
settings.ui_camera_orbit_rise_ms.description=ثابت‌های زمانی (میلی‌ثانیه) برای تخمین سرعت نشانگر هنگام شتاب گرفتن. riseMs بیشتر شتاب را ملایم می‌کند. بازه: 0 - 10000.
settings.ui_camera_orbit_fall_ms=زمان افت چرخش دوربین (ms)
settings.ui_camera_orbit_fall_ms.description=ثابت‌های زمانی (میلی‌ثانیه) برای تخمین سرعت نشانگر هنگام کاستن سرعت. fallMs کمتر کنترل دقیق را زودتر بازمی‌گرداند. هیچ‌کدام به دوربین اینرسی اضافه نمی‌کنند. بازه: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=تأخیر تثبیت لبه‌های صحنه (ms)
settings.ui_edges_scene_settle_delay_ms.description=تأخیر پس از تغییرات هندسه/نمایش. مقادیر بیشتر کار بیشتری را در هنگام بازپخش سریع تاریخچه سرکوب می‌کند. بازه: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=تأخیر تثبیت لبه‌های دوربین (ms)
settings.ui_edges_camera_settle_delay_ms.description=تأخیر پس از حرکت دوربین پیش از بازسازی ضخامت خط مویی در فضای صفحه. بازه: 0 - 10000.
settings.ui_edges_topology_precision=دقت توپولوژی لبه
settings.ui_edges_topology_precision.description=گام کوانتیزه‌سازی برای نرمال‌سازی توپولوژی لبه‌های ویژگی. هندسه مدل و نرمال‌های وجه بدون تغییر می‌مانند. بازه: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=رواداری پیوند لبه (mm)
settings.ui_edges_stitch_tolerance.description=رواداری پیوند مرزها بر حسب میلی‌متر صحنه. فقط برای لبه‌هایی استفاده می‌شود که پس از مجاورت مش فهرست‌شده ظاهراً تک‌وجه به نظر می‌رسند. به مرزهای هم‌مکان هندسی با تقسیم‌بندی متفاوت اجازه می‌دهد پیش از تصمیم‌گیری درباره واقعی بودن لبه‌های ویژگی، دوباره به هم متصل شوند. بازه: 0.0 - 1.0.
