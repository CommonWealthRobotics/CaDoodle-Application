# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=حالت نورپردازی
settings.ui_lighting_mode.description=دقیقاً یک حالت نورپردازی را نگه دارید. 'stable' = نورهای جهت‌دار ثابت در فضای جهان. نورپردازی با دوربین نمی‌چرخد. برای وفاداری خوب رنگ و هندسه خوانای CAD طراحی شده است. 'kevin' = نورپردازی اصلی BowlerStudio. از سه نور نقطه‌ای استفاده می‌کند؛ یکی دوربین را دنبال می‌کند. تنظیمات نور ثابت زیر در این حالت نادیده گرفته می‌شوند.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=نور محیطی
settings.ui_lighting_ambient.description=نور محیطی به‌طور یکسان بر هر سطح مرئی اثر می‌گذارد. بیشتر: سایه‌های روشن‌تر، رنگ‌ها نزدیک‌تر به رنگ پایه می‌مانند، اما سطوح مسطح‌تر دیده می‌شوند. کمتر: سایه‌پردازی قوی‌تر و تفکیک بهتر سطوح، اما رنگ‌های سایه‌دار تیره‌تر می‌شوند.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=فعال بودن نور اصلی
settings.ui_lighting_key_enabled.description=نور اصلی برای بیان شکل جسم. برای حذف کامل این نور enabled=false را تنظیم کنید.
settings.ui_lighting_key_intensity=شدت نور اصلی
settings.ui_lighting_key_intensity.description=شدت نور اصلی. بازه: 0.0 - 1.0.
settings.ui_lighting_key_x=نور اصلی X
settings.ui_lighting_key_x.description=جهت نور اصلی در مختصات جهان. بازه: -1.0 - 1.0.
settings.ui_lighting_key_y=نور اصلی Y
settings.ui_lighting_key_y.description=جهت نور اصلی در مختصات جهان. بازه: -1.0 - 1.0.
settings.ui_lighting_key_z=نور اصلی Z
settings.ui_lighting_key_z.description=جهت نور اصلی در مختصات جهان. بازه: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=فعال بودن نور پرکننده
settings.ui_lighting_fill_enabled.description=سمت سایه‌ای را که نور اصلی ایجاد می‌کند نرم می‌کند. برای حذف کامل این نور enabled=false را تنظیم کنید.
settings.ui_lighting_fill_intensity=شدت نور پرکننده
settings.ui_lighting_fill_intensity.description=شدت بیشتر: وفاداری رنگ بهتر، سایه‌پردازی نرم‌تر. شدت کمتر: تفاوت بیشتر بین وجوه با جهت‌های مختلف. بازه: 0.0 - 1.0.
settings.ui_lighting_fill_x=نور پرکننده X
settings.ui_lighting_fill_x.description=جهت نور پرکننده در مختصات جهان. بازه: -1.0 - 1.0.
settings.ui_lighting_fill_y=نور پرکننده Y
settings.ui_lighting_fill_y.description=جهت نور پرکننده در مختصات جهان. بازه: -1.0 - 1.0.
settings.ui_lighting_fill_z=نور پرکننده Z
settings.ui_lighting_fill_z.description=جهت نور پرکننده در مختصات جهان. بازه: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=فعال بودن نور لبه
settings.ui_lighting_rim_enabled.description=نور ثانویه ضعیف برای کمک به تفکیک برخی سطوح. این نور معمولاً باید ظریف بماند. برای حذف کامل این نور enabled=false را تنظیم کنید.
