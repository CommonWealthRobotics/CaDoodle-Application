# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Vipengele vya Kiolesura
settings.ui_section_lighting=Mwangaza
settings.ui_section_edges=Kingo za Vipengele
settings.ui_section_grid=Gridi ya Nafasi ya Kazi
settings.ui_section_camera=Mzunguko wa Kamera
settings.ui_section_timing=Muda wa Kingo za Vipengele
settings.ui_description=Maelezo yametolewa kutoka scene-style.properties. Thamani huhifadhiwa katika ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Hali ya Mwangaza
settings.ui_lighting_mode.description=Tumia hali moja ya mwangaza pekee. 'stable' = Taa za mwelekeo zisizobadilika katika nafasi ya dunia. Mwangaza hauzunguki pamoja na kamera. Imeundwa kwa uaminifu mzuri wa rangi na jiometri ya CAD inayosomeka. 'kevin' = Mwangaza wa asili wa BowlerStudio. Hutumia taa tatu za pointi; moja hufuata kamera. Mipangilio ya taa thabiti hapa chini hupuuzwa katika hali hii.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Mwangaza wa Mazingira
settings.ui_lighting_ambient.description=Mwangaza wa mazingira huathiri kila uso unaoonekana kwa usawa. Juu zaidi: vivuli vyenye mwanga zaidi, rangi hukaa karibu na rangi yao ya msingi, lakini nyuso huonekana tambarare zaidi. Chini zaidi: utiaji wa kivuli na utenganishaji wa nyuso wenye nguvu, lakini rangi zilizo kivulini huwa nyeusi zaidi.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Taa Kuu Imewashwa
settings.ui_lighting_key_enabled.description=Taa kuu inayotumiwa kuonyesha umbo la kitu. Weka enabled=false kuondoa taa hii kabisa.
settings.ui_lighting_key_intensity=Ukali wa Taa Kuu
settings.ui_lighting_key_intensity.description=Ukali wa taa kuu. Masafa: 0.0 - 1.0.
settings.ui_lighting_key_x=Taa Kuu X
settings.ui_lighting_key_x.description=Mwelekeo wa taa kuu katika kuratibu za dunia. Masafa: -1.0 - 1.0.
settings.ui_lighting_key_y=Taa Kuu Y
settings.ui_lighting_key_y.description=Mwelekeo wa taa kuu katika kuratibu za dunia. Masafa: -1.0 - 1.0.
settings.ui_lighting_key_z=Taa Kuu Z
settings.ui_lighting_key_z.description=Mwelekeo wa taa kuu katika kuratibu za dunia. Masafa: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Taa ya Kujaza Imewashwa
settings.ui_lighting_fill_enabled.description=Hupunguza upande wa kivuli unaoundwa na taa kuu. Weka enabled=false kuondoa taa hii kabisa.
settings.ui_lighting_fill_intensity=Ukali wa Taa ya Kujaza
settings.ui_lighting_fill_intensity.description=Ukali zaidi: uaminifu bora wa rangi, utiaji kivuli laini. Ukali mdogo: tofauti kubwa kati ya nyuso zenye mwelekeo tofauti. Masafa: 0.0 - 1.0.
settings.ui_lighting_fill_x=Taa ya Kujaza X
settings.ui_lighting_fill_x.description=Mwelekeo wa taa ya kujaza katika kuratibu za dunia. Masafa: -1.0 - 1.0.
settings.ui_lighting_fill_y=Taa ya Kujaza Y
settings.ui_lighting_fill_y.description=Mwelekeo wa taa ya kujaza katika kuratibu za dunia. Masafa: -1.0 - 1.0.
settings.ui_lighting_fill_z=Taa ya Kujaza Z
settings.ui_lighting_fill_z.description=Mwelekeo wa taa ya kujaza katika kuratibu za dunia. Masafa: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Taa ya Pembeni Imewashwa
settings.ui_lighting_rim_enabled.description=Taa dhaifu ya pili inayosaidia kutenganisha baadhi ya nyuso. Kwa kawaida inapaswa kubaki hafifu. Weka enabled=false kuondoa taa hii kabisa.
settings.ui_lighting_rim_intensity=Ukali wa Taa ya Pembeni
settings.ui_lighting_rim_intensity.description=Taa dhaifu ya pili inayosaidia kutenganisha baadhi ya nyuso. Kwa kawaida inapaswa kubaki hafifu. Masafa: 0.0 - 1.0.
settings.ui_lighting_rim_x=Taa ya Pembeni X
settings.ui_lighting_rim_x.description=Mwelekeo wa taa ya pembeni katika kuratibu za dunia. Masafa: -1.0 - 1.0.
settings.ui_lighting_rim_y=Taa ya Pembeni Y
settings.ui_lighting_rim_y.description=Mwelekeo wa taa ya pembeni katika kuratibu za dunia. Masafa: -1.0 - 1.0.
settings.ui_lighting_rim_z=Taa ya Pembeni Z
settings.ui_lighting_rim_z.description=Mwelekeo wa taa ya pembeni katika kuratibu za dunia. Masafa: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Kingo za Vipengele Zimewashwa
settings.ui_edges_enabled.description=Chora jiometri nyeusi kando ya kingo kali halisi za vitu vya CSG. Mipaka ya poligoni zinazolingana hupuuzwa. Weka enabled=false kuondoa kingo kabisa.
settings.ui_edges_angle_degrees=Pembe ya Kingo kwa Digrii
settings.ui_edges_angle_degrees.description=Pembe ya chini kati ya nyuso jirani kabla ukingo wao wa pamoja kuchorwa. Thamani kubwa hutoa mistari michache ya mikunjo. Masafa: 0 - 360.
settings.ui_edges_width_mode=Hali ya Upana wa Kingo
settings.ui_edges_width_mode.description=screen = Huweka mstari wa nje karibu bila kubadilika katika pikseli za skrini. Bora kwa mwonekano mwembamba wa mtindo wa CAD katika kiwango chochote cha kukuza. world = Hutumia nusukipenyo kisichobadilika katika milimita za eneo.
settings.ui_edges_width_px=Upana wa Kingo kwa Pikseli
settings.ui_edges_width_px.description=Upana unaoonekana wa mstari wakati widthMode=screen. Masafa: 0.1 - 10.0.
settings.ui_edges_radius=Nusukipenyo cha Kingo
settings.ui_edges_radius.description=Nusukipenyo cha ukingo katika nafasi ya dunia kwa milimita za eneo. Hutumika tu wakati widthMode=world. Masafa: 0.001 - 100.0.
settings.ui_edges_brightness=Mwangaza wa Kingo
settings.ui_edges_brightness.description=0.0 = nyeusi, 1.0 = nyeupe. Masafa: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Kina cha Kuza cha Gridi Ndogo Inayoonekana
settings.ui_grid_small_visible_zoom_depth.description=Hudhibiti umbali ambao gridi ya 1 mm inabaki kuonekana. Thamani kubwa = gridi ya 1 mm huonekana mapema / mbali zaidi. Masafa: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Kizidishi cha Mwangaza wa Gridi Ndogo
settings.ui_grid_small_brightness_multiplier.description=Huzidisha mwangaza wa RGB huku ikihifadhi rangi ya mandhari. 1.0 = rangi ya asili ya mandhari. < 1.0 = nyeusi zaidi. > 1.0 = angavu zaidi. Masafa: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Kizidishi cha Uwazi wa Gridi Ndogo
settings.ui_grid_small_opacity_multiplier.description=Huzidisha uwazi unaotolewa na mandhari ya sasa. 1.0 = haujabadilika. Masafa: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Upana wa Mstari wa Gridi Ndogo (px)
settings.ui_grid_small_line_width_px.description=Unene wa mstari wa gridi katika vitengo vya pikseli za muundo wa gridi ya zamani. Thamani za kihistoria za sasa ni 2 kwa 1 mm na 4 kwa 10 mm. Masafa: 1 - 10.
settings.ui_grid_small_z_offset_mm=Uhamisho wa Z wa Gridi Ndogo (mm)
settings.ui_grid_small_z_offset_mm.description=Weka gridi ya 1 mm nyuma kidogo ya gridi ya 10 mm ili kuepuka kasoro za kina. Masafa: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Kizidishi cha Mwangaza wa Gridi Kuu
settings.ui_grid_major_brightness_multiplier.description=Huzidisha mwangaza wa RGB huku ikihifadhi rangi ya mandhari. 1.0 = rangi ya asili ya mandhari. < 1.0 = nyeusi zaidi. > 1.0 = angavu zaidi. Masafa: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Kizidishi cha Uwazi wa Gridi Kuu
settings.ui_grid_major_opacity_multiplier.description=Huzidisha uwazi unaotolewa na mandhari ya sasa. 1.0 = haujabadilika. Masafa: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Upana wa Mstari wa Gridi Kuu (px)
settings.ui_grid_major_line_width_px.description=Unene wa mstari wa gridi katika vitengo vya pikseli za muundo wa gridi ya zamani. Thamani za kihistoria za sasa ni 2 kwa 1 mm na 4 kwa 10 mm. Masafa: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Hali ya Mwendo wa Gridi
settings.ui_grid_motion_mode.description=major = Weka gridi safi ya 10 mm pekee ikionekana wakati wa kusogeza na uficha kwa muda gridi mnene ya 1 mm. Gridi ya 1 mm hurudi baada ya mwendo kusimama. all = Weka gridi zote mbili safi za mistari zikionekana wakati wa kusogeza. Mwendelezo bora wa kuona, lakini huenda ukagharimu zaidi. texture = Tabia ya asili: badilisha jiometri ya mistari kwa miraba ya gridi yenye muundo wakati wa kusogeza. Haraka zaidi, lakini inaweza kutoa michirizi ya pikseli / mifumo ya mawimbi. hidden = Ficha mistari ya gridi wakati wa kusogeza na uirejeshe kamera inaposimama.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Uwazi wa Ujazaji wa Ardhi
settings.ui_grid_ground_render_opacity.description=Uwazi wa ujazaji mkuu wa ardhi. Ujazaji hubaki mahali pake katika kila kiwango cha kukuza; ni gridi mnene ya 1 mm pekee inayodhibitiwa na kukuza. Weka 0 ili kuficha ujazaji huku ukiweka uso wake wa kuchagua ukiwa hai. Nafasi za kazi maalum hupuuza mpangilio huu. Masafa: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Unyeti wa Chini wa Mzunguko wa Kamera
settings.ui_camera_orbit_min.description=Unyeti wa mzunguko kwa digrii kwa kila kitengo cha kuratibu cha kipanya cha JavaFX. min hudhibiti kukokota kwa polepole sana. Masafa: 0.0 - 1.0.
settings.ui_camera_orbit_max=Unyeti wa Juu wa Mzunguko wa Kamera
settings.ui_camera_orbit_max.description=Unyeti wa mzunguko kwa digrii kwa kila kitengo cha kuratibu cha kipanya cha JavaFX. max ni kikomo cha juu kwa kukokota kwa haraka. Masafa: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kasi ya Nusu ya Mzunguko wa Kamera
settings.ui_camera_orbit_half.description=Kasi iliyochujwa ya kipanya katika vitengo vya kuratibu vya JavaFX kwa sekunde ambapo unyeti uko katikati kati ya min na max. Juu zaidi = kasi laini zaidi. Masafa: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Muda wa Kupanda wa Mzunguko wa Kamera (ms)
settings.ui_camera_orbit_rise_ms.description=Vipimo vya muda (milisekunde) vya makadirio ya kasi ya kipanya wakati wa kuongeza kasi. riseMs kubwa hulaini kasi. Masafa: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Muda wa Kushuka wa Mzunguko wa Kamera (ms)
settings.ui_camera_orbit_fall_ms.description=Vipimo vya muda (milisekunde) vya makadirio ya kasi ya kipanya wakati wa kupunguza kasi. fallMs ndogo hurejesha udhibiti mzuri mapema. Wala haiongezi inersha ya kamera. Masafa: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Ucheleweshaji wa Utulivu wa Eneo la Kingo (ms)
settings.ui_edges_scene_settle_delay_ms.description=Ucheleweshaji baada ya mabadiliko ya jiometri/onyesho. Thamani kubwa huzuia kazi zaidi wakati wa uchezaji wa haraka wa historia. Masafa: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Ucheleweshaji wa Utulivu wa Kamera wa Kingo (ms)
settings.ui_edges_camera_settle_delay_ms.description=Ucheleweshaji baada ya kusogeza kamera kabla unene mwembamba wa nafasi ya skrini kujengwa upya. Masafa: 0 - 10000.
settings.ui_edges_topology_precision=Usahihi wa Topolojia ya Kingo
settings.ui_edges_topology_precision.description=Hatua ya upimaji inayotumika kurekebisha topolojia ya kingo za vipengele. Jiometri ya modeli na vekta za kawaida za nyuso hubaki bila kubadilika. Masafa: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Uvumilivu wa Kushona wa Kingo (mm)
settings.ui_edges_stitch_tolerance.description=Uvumilivu wa kushona mipaka katika milimita za eneo. Hutumika tu kwa kingo zinazoonekana kuwa za uso mmoja baada ya uunganishaji wa meshi iliyoorodheshwa. Huruhusu mipaka iliyogawanywa tofauti lakini inayolingana kijiometri kuunganishwa upya kabla ya kuamua kama ni kingo halisi za vipengele. Masafa: 0.0 - 1.0.
