# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=UI 元素
settings.ui_section_lighting=光照
settings.ui_section_edges=特征边
settings.ui_section_grid=工作平面网格
settings.ui_section_camera=相机环绕
settings.ui_section_timing=特征边计时
settings.ui_description=取自 scene-style.properties 的说明。该值保存到 ConfigurationDatabase 中。

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=光照模式
settings.ui_lighting_mode.description=只保留一种光照模式。 'stable' = 固定在世界空间的平行光。光照不随相机旋转。为良好的色彩还原和可读的 CAD 几何体而设计。 'kevin' = 原始 BowlerStudio 光照。使用三个点光源；其中一个跟随相机。此模式下忽略下面的稳定光照设置。
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=环境光
settings.ui_lighting_ambient.description=环境光均匀影响每个可见表面。调高：阴影更亮，颜色更接近基色，但表面看起来更平。调低：明暗对比和表面分离更强，但阴影中的颜色会变暗。
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=主光启用
settings.ui_lighting_key_enabled.description=用于表现物体形状的主光源。设置 enabled=false 可完全移除此光源。
settings.ui_lighting_key_intensity=主光强度
settings.ui_lighting_key_intensity.description=主光的强度。范围: 0.0 - 1.0。
settings.ui_lighting_key_x=主光 X
settings.ui_lighting_key_x.description=世界坐标中主光的方向。范围: -1.0 - 1.0。
settings.ui_lighting_key_y=主光 Y
settings.ui_lighting_key_y.description=世界坐标中主光的方向。范围: -1.0 - 1.0。
settings.ui_lighting_key_z=主光 Z
settings.ui_lighting_key_z.description=世界坐标中主光的方向。范围: -1.0 - 1.0。
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=补光启用
settings.ui_lighting_fill_enabled.description=柔化主光产生的阴面。设置 enabled=false 可完全移除此光源。
settings.ui_lighting_fill_intensity=补光强度
settings.ui_lighting_fill_intensity.description=强度越高：色彩还原越好，明暗越柔和。强度越低：不同朝向的面之间差异越强。范围: 0.0 - 1.0。
settings.ui_lighting_fill_x=补光 X
settings.ui_lighting_fill_x.description=世界坐标中补光的方向。范围: -1.0 - 1.0。
settings.ui_lighting_fill_y=补光 Y
settings.ui_lighting_fill_y.description=世界坐标中补光的方向。范围: -1.0 - 1.0。
settings.ui_lighting_fill_z=补光 Z
settings.ui_lighting_fill_z.description=世界坐标中补光的方向。范围: -1.0 - 1.0。
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=轮廓光启用
settings.ui_lighting_rim_enabled.description=用于帮助区分某些表面的弱辅助光源。通常应保持微弱。设置 enabled=false 可完全移除此光源。
settings.ui_lighting_rim_intensity=轮廓光强度
settings.ui_lighting_rim_intensity.description=用于帮助区分某些表面的弱辅助光源。通常应保持微弱。范围: 0.0 - 1.0。
settings.ui_lighting_rim_x=轮廓光 X
settings.ui_lighting_rim_x.description=世界坐标中轮廓光的方向。范围: -1.0 - 1.0。
settings.ui_lighting_rim_y=轮廓光 Y
settings.ui_lighting_rim_y.description=世界坐标中轮廓光的方向。范围: -1.0 - 1.0。
settings.ui_lighting_rim_z=轮廓光 Z
settings.ui_lighting_rim_z.description=世界坐标中轮廓光的方向。范围: -1.0 - 1.0。
# ---------------- edges ----------------
settings.ui_edges_enabled=特征边启用
settings.ui_edges_enabled.description=沿 CSG 对象真实的锐利边绘制深色几何体。忽略共面的多边形边界。设置 enabled=false 可完全移除这些边。
settings.ui_edges_angle_degrees=边角度 (度)
settings.ui_edges_angle_degrees.description=绘制相邻面共享边之前的最小夹角。值越大产生的折痕线越少。范围: 0 - 360。
settings.ui_edges_width_mode=边宽模式
settings.ui_edges_width_mode.description=screen = 使轮廓在屏幕像素中大致保持恒定。最适合任意缩放级别下的 CAD 风格细线外观。 world = 使用场景毫米为单位的固定半径。
settings.ui_edges_width_px=边宽 (px)
settings.ui_edges_width_px.description=widthMode=screen 时的可见线宽。范围: 0.1 - 10.0。
settings.ui_edges_radius=边半径
settings.ui_edges_radius.description=以场景毫米为单位的世界空间边半径。仅在 widthMode=world 时使用。范围: 0.001 - 100.0。
settings.ui_edges_brightness=边亮度
settings.ui_edges_brightness.description=0.0 = 黑色，1.0 = 白色。范围: 0.0 - 1.0。
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=小网格可见缩放深度
settings.ui_grid_small_visible_zoom_depth.description=控制 1 mm 网格保持可见的距离。值越大 = 1 mm 网格更早 / 更远出现。范围: 1 - 10000。
settings.ui_grid_small_brightness_multiplier=小网格亮度倍数
settings.ui_grid_small_brightness_multiplier.description=在保留主题色相的同时乘以 RGB 亮度。1.0 = 原始主题颜色。< 1.0 = 更暗。> 1.0 = 更亮。范围: 0.0 - 3.0。
settings.ui_grid_small_opacity_multiplier=小网格不透明度倍数
settings.ui_grid_small_opacity_multiplier.description=乘以当前主题提供的 alpha。1.0 = 不变。范围: 0.0 - 1.0。
settings.ui_grid_small_line_width_px=小网格线宽 (px)
settings.ui_grid_small_line_width_px.description=以网格传统纹理像素单位表示的网格线粗细。当前历史值为 1 mm 时为 2，10 mm 时为 4。范围: 1 - 10。
settings.ui_grid_small_z_offset_mm=小网格 Z 偏移 (mm)
settings.ui_grid_small_z_offset_mm.description=将 1 mm 网格保持在 10 mm 网格稍后方，以避免深度伪影。范围: -1.0 - 1.0。
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=主网格亮度倍数
settings.ui_grid_major_brightness_multiplier.description=在保留主题色相的同时乘以 RGB 亮度。1.0 = 原始主题颜色。< 1.0 = 更暗。> 1.0 = 更亮。范围: 0.0 - 3.0。
settings.ui_grid_major_opacity_multiplier=主网格不透明度倍数
settings.ui_grid_major_opacity_multiplier.description=乘以当前主题提供的 alpha。1.0 = 不变。范围: 0.0 - 1.0。
settings.ui_grid_major_line_width_px=主网格线宽 (px)
settings.ui_grid_major_line_width_px.description=以网格传统纹理像素单位表示的网格线粗细。当前历史值为 1 mm 时为 2，10 mm 时为 4。范围: 1 - 10。
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=网格运动模式
settings.ui_grid_motion_mode.description=major = 移动时只保留清晰的 10 mm 网格可见，并暂时隐藏密集的 1 mm 网格。移动停止后 1 mm 网格恢复。 all = 移动时保持两个清晰的线网格都可见。视觉连续性最佳，但可能开销更大。 texture = 原始行为: 移动时将线几何体替换为带纹理的网格四边形。更快，但可能产生锯齿 / 摩尔纹。 hidden = 移动时隐藏网格线，相机停止后恢复。
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=地面渲染不透明度
settings.ui_grid_ground_render_opacity.description=主地面填充的不透明度。填充在任何缩放级别都保持原位；只有密集的 1 mm 网格受缩放控制。设为 0 可隐藏填充，同时保持其拾取表面有效。自定义工作平面忽略此设置。范围: 0.0 - 1.0。
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=相机环绕最小灵敏度
settings.ui_camera_orbit_min.description=以每 JavaFX 鼠标坐标单位的度数表示的旋转灵敏度。min 控制非常缓慢的拖动。范围: 0.0 - 1.0。
settings.ui_camera_orbit_max=相机环绕最大灵敏度
settings.ui_camera_orbit_max.description=以每 JavaFX 鼠标坐标单位的度数表示的旋转灵敏度。max 是快速拖动的上限。范围: 0.0 - 1.0。
settings.ui_camera_orbit_half=相机环绕半速
settings.ui_camera_orbit_half.description=灵敏度处于 min 与 max 中间时的过滤光标速度，单位为每秒 JavaFX 坐标单位。值越高 = 加速越平缓。范围: 0 - 10000。
settings.ui_camera_orbit_rise_ms=相机环绕上升时间 (ms)
settings.ui_camera_orbit_rise_ms.description=加速时用于估计光标速度的时间常数 (毫秒)。较大的 riseMs 使加速更柔和。范围: 0 - 10000。
settings.ui_camera_orbit_fall_ms=相机环绕下降时间 (ms)
settings.ui_camera_orbit_fall_ms.description=减速时用于估计光标速度的时间常数 (毫秒)。较小的 fallMs 可更快恢复精细控制。两者都不会增加相机惯性。范围: 0 - 10000。
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=边场景稳定延迟 (ms)
settings.ui_edges_scene_settle_delay_ms.description=几何体 / 显示更改后的延迟。值越大，在快速历史回放期间抑制的工作越多。范围: 0 - 10000。
settings.ui_edges_camera_settle_delay_ms=边相机稳定延迟 (ms)
settings.ui_edges_camera_settle_delay_ms.description=相机移动后到重建屏幕空间细线粗细之间的延迟。范围: 0 - 10000。
settings.ui_edges_topology_precision=边拓扑精度
settings.ui_edges_topology_precision.description=用于规范化特征边拓扑的量化步长。模型几何体和面法线保持不变。范围: 0.0 - 1.0。
settings.ui_edges_stitch_tolerance=边缝合容差 (mm)
settings.ui_edges_stitch_tolerance.description=以场景毫米为单位的边界缝合容差。仅用于索引网格邻接后看似单面的边。它允许在判定是否为真实特征边之前，将细分方式不同但几何上重合的边界重新连接。范围: 0.0 - 1.0。
