# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Sąsajos elementai
settings.ui_section_lighting=Apšvietimas
settings.ui_section_edges=Būdingosios briaunos
settings.ui_section_grid=Darbinio paviršiaus tinklelis
settings.ui_section_camera=Kameros sukimas
settings.ui_section_timing=Būdingųjų briaunų laikas
settings.ui_description=Aprašymas paimtas iš scene-style.properties. Reikšmė išsaugoma ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Apšvietimo režimas
settings.ui_lighting_mode.description=Išlaikykite tiksliai vieną apšvietimo režimą. 'stable' = Fiksuoti kryptiniai šviesos šaltiniai pasaulio koordinatėse. Apšvietimas nesisuka kartu su kamera. Sukurta geram spalvų tikslumui ir įskaitomai CAD geometrijai. 'kevin' = Originalus BowlerStudio apšvietimas. Naudoja tris taškinius šviesos šaltinius; vienas seka kamerą. Toliau pateikti stabilaus apšvietimo nustatymai šiame režime ignoruojami.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Aplinkos šviesa
settings.ui_lighting_ambient.description=Aplinkos šviesa vienodai veikia kiekvieną matomą paviršių. Didesnė: šviesesni šešėliai, spalvos lieka arčiau savo pagrindinės spalvos, bet paviršiai atrodo plokštesni. Mažesnė: stipresnis šešėliavimas ir paviršių atskyrimas, bet šešėlyje esančios spalvos tamsėja.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Pagrindinė šviesa įjungta
settings.ui_lighting_key_enabled.description=Pagrindinė šviesa, apibūdinanti objekto formą. Nustatykite enabled=false, kad visiškai pašalintumėte šią šviesą.
settings.ui_lighting_key_intensity=Pagrindinės šviesos intensyvumas
settings.ui_lighting_key_intensity.description=Pagrindinės šviesos intensyvumas. Diapazonas: 0.0 - 1.0.
settings.ui_lighting_key_x=Pagrindinės šviesos X
settings.ui_lighting_key_x.description=Pagrindinės šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
settings.ui_lighting_key_y=Pagrindinės šviesos Y
settings.ui_lighting_key_y.description=Pagrindinės šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
settings.ui_lighting_key_z=Pagrindinės šviesos Z
settings.ui_lighting_key_z.description=Pagrindinės šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Papildomoji šviesa įjungta
settings.ui_lighting_fill_enabled.description=Sušvelnina šešėlinę pusę, kurią sukuria pagrindinė šviesa. Nustatykite enabled=false, kad visiškai pašalintumėte šią šviesą.
settings.ui_lighting_fill_intensity=Papildomosios šviesos intensyvumas
settings.ui_lighting_fill_intensity.description=Didesnis intensyvumas: geresnis spalvų tikslumas, švelnesnis šešėliavimas. Mažesnis intensyvumas: didesnis skirtumas tarp skirtingai orientuotų paviršių. Diapazonas: 0.0 - 1.0.
settings.ui_lighting_fill_x=Papildomosios šviesos X
settings.ui_lighting_fill_x.description=Papildomosios šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
settings.ui_lighting_fill_y=Papildomosios šviesos Y
settings.ui_lighting_fill_y.description=Papildomosios šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
settings.ui_lighting_fill_z=Papildomosios šviesos Z
settings.ui_lighting_fill_z.description=Papildomosios šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Kontūrinė šviesa įjungta
settings.ui_lighting_rim_enabled.description=Silpna antrinė šviesa, padedanti atskirti kai kuriuos paviršius. Paprastai ji turėtų likti subtili. Nustatykite enabled=false, kad visiškai pašalintumėte šią šviesą.
settings.ui_lighting_rim_intensity=Kontūrinės šviesos intensyvumas
settings.ui_lighting_rim_intensity.description=Silpna antrinė šviesa, padedanti atskirti kai kuriuos paviršius. Paprastai ji turėtų likti subtili. Diapazonas: 0.0 - 1.0.
settings.ui_lighting_rim_x=Kontūrinės šviesos X
settings.ui_lighting_rim_x.description=Kontūrinės šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
settings.ui_lighting_rim_y=Kontūrinės šviesos Y
settings.ui_lighting_rim_y.description=Kontūrinės šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
settings.ui_lighting_rim_z=Kontūrinės šviesos Z
settings.ui_lighting_rim_z.description=Kontūrinės šviesos kryptis pasaulio koordinatėse. Diapazonas: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Būdingosios briaunos įjungtos
settings.ui_edges_enabled.description=Braižo tamsią geometriją išilgai tikrų aštrių CSG objektų briaunų. Tos pačios plokštumos daugiakampių ribos ignoruojamos. Nustatykite enabled=false, kad visiškai pašalintumėte briaunas.
settings.ui_edges_angle_degrees=Briaunos kampas laipsniais
settings.ui_edges_angle_degrees.description=Mažiausias kampas tarp gretimų paviršių, prieš nubraižant jų bendrą briauną. Didesnės reikšmės sukuria mažiau lūžio linijų. Diapazonas: 0 - 360.
settings.ui_edges_width_mode=Briaunos pločio režimas
settings.ui_edges_width_mode.description=screen = Išlaiko kontūrą maždaug pastovią ekrano pikseliuose. Geriausiai tinka CAD stiliaus plonai linijai esant bet kokiam priartinimui. world = Naudoja fiksuotą spindulį scenos milimetrais.
settings.ui_edges_width_px=Briaunos plotis pikseliais
settings.ui_edges_width_px.description=Matomos linijos plotis, kai widthMode=screen. Diapazonas: 0.1 - 10.0.
settings.ui_edges_radius=Briaunos spindulys
settings.ui_edges_radius.description=Briaunos spindulys pasaulio erdvėje scenos milimetrais. Naudojamas tik kai widthMode=world. Diapazonas: 0.001 - 100.0.
settings.ui_edges_brightness=Briaunos ryškumas
settings.ui_edges_brightness.description=0.0 = juoda, 1.0 = balta. Diapazonas: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Mažo tinklelio matomumo gylis
settings.ui_grid_small_visible_zoom_depth.description=Nustato, kokiu atstumu 1 mm tinklelis lieka matomas. Didesnė reikšmė = 1 mm tinklelis pasirodo anksčiau / toliau. Diapazonas: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Mažo tinklelio ryškumo daugiklis
settings.ui_grid_small_brightness_multiplier.description=Daugina RGB ryškumą, išsaugant temos atspalvį. 1.0 = pradinė temos spalva. < 1.0 = tamsesnė. > 1.0 = ryškesnė. Diapazonas: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Mažo tinklelio neskaidrumo daugiklis
settings.ui_grid_small_opacity_multiplier.description=Daugina dabartinės temos pateiktą alfa reikšmę. 1.0 = nepakito. Diapazonas: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Mažo tinklelio linijos plotis (px)
settings.ui_grid_small_line_width_px.description=Tinklelio linijos storis tinklelio senosiose tekstūros pikselių vienetuose. Dabartinės istorinės reikšmės yra 2, kai 1 mm, ir 4, kai 10 mm. Diapazonas: 1 - 10.
settings.ui_grid_small_z_offset_mm=Mažo tinklelio Z poslinkis (mm)
settings.ui_grid_small_z_offset_mm.description=Laikykite 1 mm tinklelį tiesiai už 10 mm tinklelio, kad išvengtumėte gylio artefaktų. Diapazonas: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Pagrindinio tinklelio ryškumo daugiklis
settings.ui_grid_major_brightness_multiplier.description=Daugina RGB ryškumą, išsaugant temos atspalvį. 1.0 = pradinė temos spalva. < 1.0 = tamsesnė. > 1.0 = ryškesnė. Diapazonas: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Pagrindinio tinklelio neskaidrumo daugiklis
settings.ui_grid_major_opacity_multiplier.description=Daugina dabartinės temos pateiktą alfa reikšmę. 1.0 = nepakito. Diapazonas: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Pagrindinio tinklelio linijos plotis (px)
settings.ui_grid_major_line_width_px.description=Tinklelio linijos storis tinklelio senosiose tekstūros pikselių vienetuose. Dabartinės istorinės reikšmės yra 2, kai 1 mm, ir 4, kai 10 mm. Diapazonas: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Tinklelio judėjimo režimas
settings.ui_grid_motion_mode.description=major = Judant palikite matomą tik aiškų 10 mm tinklelį ir laikinai paslėpkite tankų 1 mm tinklelį. 1 mm tinklelis grįžta sustojus judėjimui. all = Judant palikite matomus abu aiškius linijų tinklelius. Geriausias vizualinis tęstinumas, bet galimai brangesnis. texture = Originalus veikimas: judant linijų geometriją pakeiskite tekstūruotais tinklelio keturkampiais. Greičiau, bet gali atsirasti laiptuotumą / moiré raštus. hidden = Judant paslėpkite tinklelio linijas ir atkurkite jas, kai kamera sustoja.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Žemės atvaizdavimo neskaidrumas
settings.ui_grid_ground_render_opacity.description=Pagrindinio žemės užpildo neskaidrumas. Užpildas išlieka vietoje visais priartinimo lygiais; tik tankus 1 mm tinklelis priklauso nuo priartinimo. Nustatykite 0, kad paslėptumėte užpildą, palikdami jo pasirinkimo paviršių aktyvų. Pasirinktini darbiniai paviršiai nepaiso šio nustatymo. Diapazonas: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kameros sukimosi mažiausias jautrumas
settings.ui_camera_orbit_min.description=Sukimo jautrumas laipsniais JavaFX pelės koordinatės vienetui. min valdo labai lėtus tempimus. Diapazonas: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kameros sukimosi didžiausias jautrumas
settings.ui_camera_orbit_max.description=Sukimo jautrumas laipsniais JavaFX pelės koordinatės vienetui. max yra viršutinė greitų tempimų riba. Diapazonas: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kameros sukimosi pusinis greitis
settings.ui_camera_orbit_half.description=Filtruotas žymeklio greitis JavaFX koordinačių vienetais per sekundę, kai jautrumas yra pusiaukelėje tarp min ir max. Didesnis = švelnesnis pagreitėjimas. Diapazonas: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kameros sukimosi kilimo laikas (ms)
settings.ui_camera_orbit_rise_ms.description=Laiko konstantos (milisekundėmis) žymeklio greičio vertinimui greitėjant. Didesnis riseMs sušvelnina pagreitį. Diapazonas: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kameros sukimosi kritimo laikas (ms)
settings.ui_camera_orbit_fall_ms.description=Laiko konstantos (milisekundėmis) žymeklio greičio vertinimui lėtėjant. Mažesnis fallMs greičiau atkuria tikslų valdymą. Nė vienas neprideda kameros inercijos. Diapazonas: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Briaunų scenos nusistovėjimo delsa (ms)
settings.ui_edges_scene_settle_delay_ms.description=Delsa po geometrijos / atvaizdavimo pakeitimų. Didesnės reikšmės nuslopina daugiau darbo greito istorijos atkūrimo metu. Diapazonas: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Briaunų kameros nusistovėjimo delsa (ms)
settings.ui_edges_camera_settle_delay_ms.description=Delsa po kameros judėjimo, prieš atkuriant ekrano erdvės plonos linijos storį. Diapazonas: 0 - 10000.
settings.ui_edges_topology_precision=Briaunų topologijos tikslumas
settings.ui_edges_topology_precision.description=Kvantavimo žingsnis, naudojamas briaunų topologijai normalizuoti. Modelio geometrija ir paviršių normalės lieka nepakitusios. Diapazonas: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Briaunų sujungimo tolerancija (mm)
settings.ui_edges_stitch_tolerance.description=Ribų sujungimo tolerancija scenos milimetrais. Naudojama tik tariamoms vieno paviršiaus briaunoms po indeksuotos tinklelio gretimybių analizės. Ji leidžia skirtingai suskaidytas, bet geometriškai sutampančias ribas sujungti iš naujo prieš nusprendžiant, ar tai tikros būdingosios briaunos. Diapazonas: 0.0 - 1.0.
