# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elemente de interfață
settings.ui_section_lighting=Iluminare
settings.ui_section_edges=Muchii caracteristice
settings.ui_section_grid=Grilă a planului de lucru
settings.ui_section_camera=Orbita camerei
settings.ui_section_timing=Temporizarea muchiilor caracteristice
settings.ui_description=Descriere preluată din scene-style.properties. Valoarea este salvată în ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Mod de iluminare
settings.ui_lighting_mode.description=Păstrați exact un mod de iluminare. 'stable' = Lumini direcționale fixe în coordonate globale. Iluminarea nu se rotește odată cu camera. Concepută pentru fidelitate bună a culorilor și geometrie CAD lizibilă. 'kevin' = Iluminarea originală BowlerStudio. Folosește trei lumini punctiforme; una urmărește camera. Setările pentru lumina stabilă de mai jos sunt ignorate în acest mod.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Lumină ambientală
settings.ui_lighting_ambient.description=Lumina ambientală afectează uniform fiecare suprafață vizibilă. Mai mare: umbre mai deschise, culorile rămân mai aproape de culoarea de bază, dar suprafețele par mai plate. Mai mică: umbrire și separare a suprafețelor mai puternice, dar culorile din umbră devin mai închise.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Lumină principală activată
settings.ui_lighting_key_enabled.description=Lumina principală care descrie forma obiectului. Setați enabled=false pentru a elimina complet această lumină.
settings.ui_lighting_key_intensity=Intensitatea luminii principale
settings.ui_lighting_key_intensity.description=Intensitatea luminii principale. Interval: 0.0 - 1.0.
settings.ui_lighting_key_x=Lumină principală X
settings.ui_lighting_key_x.description=Direcția luminii principale în coordonate globale. Interval: -1.0 - 1.0.
settings.ui_lighting_key_y=Lumină principală Y
settings.ui_lighting_key_y.description=Direcția luminii principale în coordonate globale. Interval: -1.0 - 1.0.
settings.ui_lighting_key_z=Lumină principală Z
settings.ui_lighting_key_z.description=Direcția luminii principale în coordonate globale. Interval: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Lumină de umplere activată
settings.ui_lighting_fill_enabled.description=Atenuează latura umbrită creată de lumina principală. Setați enabled=false pentru a elimina complet această lumină.
settings.ui_lighting_fill_intensity=Intensitatea luminii de umplere
settings.ui_lighting_fill_intensity.description=Intensitate mai mare: fidelitate mai bună a culorilor, umbrire mai blândă. Intensitate mai mică: diferență mai puternică între fețele orientate diferit. Interval: 0.0 - 1.0.
settings.ui_lighting_fill_x=Lumină de umplere X
settings.ui_lighting_fill_x.description=Direcția luminii de umplere în coordonate globale. Interval: -1.0 - 1.0.
settings.ui_lighting_fill_y=Lumină de umplere Y
settings.ui_lighting_fill_y.description=Direcția luminii de umplere în coordonate globale. Interval: -1.0 - 1.0.
settings.ui_lighting_fill_z=Lumină de umplere Z
settings.ui_lighting_fill_z.description=Direcția luminii de umplere în coordonate globale. Interval: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Lumină de contur activată
settings.ui_lighting_rim_enabled.description=Lumină secundară slabă care ajută la separarea unor suprafețe. De obicei ar trebui să rămână subtilă. Setați enabled=false pentru a elimina complet această lumină.
settings.ui_lighting_rim_intensity=Intensitatea luminii de contur
settings.ui_lighting_rim_intensity.description=Lumină secundară slabă care ajută la separarea unor suprafețe. De obicei ar trebui să rămână subtilă. Interval: 0.0 - 1.0.
settings.ui_lighting_rim_x=Lumină de contur X
settings.ui_lighting_rim_x.description=Direcția luminii de contur în coordonate globale. Interval: -1.0 - 1.0.
settings.ui_lighting_rim_y=Lumină de contur Y
settings.ui_lighting_rim_y.description=Direcția luminii de contur în coordonate globale. Interval: -1.0 - 1.0.
settings.ui_lighting_rim_z=Lumină de contur Z
settings.ui_lighting_rim_z.description=Direcția luminii de contur în coordonate globale. Interval: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Muchii caracteristice activate
settings.ui_edges_enabled.description=Desenează geometrie întunecată de-a lungul muchiilor ascuțite reale ale obiectelor CSG. Limitele poligoanelor coplanare sunt ignorate. Setați enabled=false pentru a elimina complet muchiile.
settings.ui_edges_angle_degrees=Unghi muchie în grade
settings.ui_edges_angle_degrees.description=Unghiul minim dintre fețele vecine înainte de a le desena muchia comună. Valorile mai mari produc mai puține linii de pliere. Interval: 0 - 360.
settings.ui_edges_width_mode=Mod lățime muchie
settings.ui_edges_width_mode.description=screen = Menține conturul aproximativ constant în pixeli de ecran. Cel mai bun pentru aspectul de linie subțire în stil CAD la orice nivel de zoom. world = Folosește o rază fixă în milimetri de scenă.
settings.ui_edges_width_px=Lățime muchie în pixeli
settings.ui_edges_width_px.description=Lățimea liniei vizibile când widthMode=screen. Interval: 0.1 - 10.0.
settings.ui_edges_radius=Rază muchie
settings.ui_edges_radius.description=Raza muchiei în spațiul global, în milimetri de scenă. Folosită doar când widthMode=world. Interval: 0.001 - 100.0.
settings.ui_edges_brightness=Luminozitate muchie
settings.ui_edges_brightness.description=0.0 = negru, 1.0 = alb. Interval: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Adâncime de vizibilitate grilă mică
settings.ui_grid_small_visible_zoom_depth.description=Controlează cât de departe rămâne vizibilă grila de 1 mm. Valoare mai mare = grila de 1 mm apare mai devreme / mai departe. Interval: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Multiplicator luminozitate grilă mică
settings.ui_grid_small_brightness_multiplier.description=Multiplică luminozitatea RGB păstrând nuanța temei. 1.0 = culoarea originală a temei. < 1.0 = mai închis. > 1.0 = mai luminos. Interval: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Multiplicator opacitate grilă mică
settings.ui_grid_small_opacity_multiplier.description=Multiplică alfa furnizat de tema curentă. 1.0 = neschimbat. Interval: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Grosimea liniei grilei mici (px)
settings.ui_grid_small_line_width_px.description=Grosimea liniei grilei în unitățile moștenite de pixeli de textură ale grilei. Valorile istorice curente sunt 2 pentru 1 mm și 4 pentru 10 mm. Interval: 1 - 10.
settings.ui_grid_small_z_offset_mm=Decalaj Z grilă mică (mm)
settings.ui_grid_small_z_offset_mm.description=Păstrați grila de 1 mm imediat în spatele grilei de 10 mm pentru a evita artefactele de adâncime. Interval: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Multiplicator luminozitate grilă majoră
settings.ui_grid_major_brightness_multiplier.description=Multiplică luminozitatea RGB păstrând nuanța temei. 1.0 = culoarea originală a temei. < 1.0 = mai închis. > 1.0 = mai luminos. Interval: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Multiplicator opacitate grilă majoră
settings.ui_grid_major_opacity_multiplier.description=Multiplică alfa furnizat de tema curentă. 1.0 = neschimbat. Interval: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Grosimea liniei grilei majore (px)
settings.ui_grid_major_line_width_px.description=Grosimea liniei grilei în unitățile moștenite de pixeli de textură ale grilei. Valorile istorice curente sunt 2 pentru 1 mm și 4 pentru 10 mm. Interval: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Mod de mișcare grilă
settings.ui_grid_motion_mode.description=major = În timpul mișcării, păstrați vizibilă doar grila clară de 10 mm și ascundeți temporar grila densă de 1 mm. Grila de 1 mm revine după oprirea mișcării. all = În timpul mișcării, păstrați vizibile ambele grile clare cu linii. Cea mai bună continuitate vizuală, dar posibil mai costisitoare. texture = Comportament original: în timpul mișcării, înlocuiți geometria liniilor cu patrulatere de grilă texturate. Mai rapid, dar poate produce efect de scară / modele moar. hidden = Ascundeți liniile grilei în timpul mișcării și restabiliți-le când camera se oprește.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacitatea randării solului
settings.ui_grid_ground_render_opacity.description=Opacitatea umplerii principale a solului. Umplerea rămâne pe loc la orice nivel de zoom; doar grila densă de 1 mm este condiționată de zoom. Setați 0 pentru a ascunde umplerea păstrând activă suprafața sa de selecție. Planurile de lucru personalizate ignoră această setare. Interval: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensibilitate minimă a orbitei camerei
settings.ui_camera_orbit_min.description=Sensibilitate de rotație în grade pe unitate de coordonată a mouse-ului JavaFX. min controlează tragerile foarte lente. Interval: 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensibilitate maximă a orbitei camerei
settings.ui_camera_orbit_max.description=Sensibilitate de rotație în grade pe unitate de coordonată a mouse-ului JavaFX. max este limita superioară pentru tragerile rapide. Interval: 0.0 - 1.0.
settings.ui_camera_orbit_half=Viteză pe jumătate a orbitei camerei
settings.ui_camera_orbit_half.description=Viteza filtrată a cursorului în unități de coordonate JavaFX pe secundă la care sensibilitatea este la jumătatea distanței dintre min și max. Mai mare = accelerație mai blândă. Interval: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Timp de creștere a orbitei camerei (ms)
settings.ui_camera_orbit_rise_ms.description=Constante de timp (milisecunde) pentru estimarea vitezei cursorului la accelerare. Un riseMs mai mare înmoaie accelerația. Interval: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Timp de scădere a orbitei camerei (ms)
settings.ui_camera_orbit_fall_ms.description=Constante de timp (milisecunde) pentru estimarea vitezei cursorului la încetinire. Un fallMs mai mic restaurează mai repede controlul fin. Niciuna nu adaugă inerție camerei. Interval: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Întârziere de stabilizare a scenei pentru muchii (ms)
settings.ui_edges_scene_settle_delay_ms.description=Întârziere după modificările de geometrie/afișare. Valorile mai mari suprimă mai multă muncă în timpul redării rapide a istoricului. Interval: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Întârziere de stabilizare a camerei pentru muchii (ms)
settings.ui_edges_camera_settle_delay_ms.description=Întârziere după mișcarea camerei înainte de a reconstrui grosimea liniei subțiri în spațiul ecranului. Interval: 0 - 10000.
settings.ui_edges_topology_precision=Precizia topologiei muchiilor
settings.ui_edges_topology_precision.description=Pasul de cuantizare folosit pentru normalizarea topologiei muchiilor caracteristice. Geometria modelului și normalele fețelor rămân neschimbate. Interval: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Toleranță de îmbinare muchii (mm)
settings.ui_edges_stitch_tolerance.description=Toleranța de îmbinare a limitelor în milimetri de scenă. Folosită doar pentru muchiile aparente ale unei singure fețe după analiza de adiacență a rețelei indexate. Permite reconectarea limitelor subdivizate diferit, dar geometric coincidente, înainte de a decide dacă sunt muchii caracteristice reale. Interval: 0.0 - 1.0.
