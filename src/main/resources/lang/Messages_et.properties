# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Kasutajaliidese elemendid
settings.ui_section_lighting=Valgustus
settings.ui_section_edges=Iseloomulikud servad
settings.ui_section_grid=Tööpinna ruudustik
settings.ui_section_camera=Kaamera orbiit
settings.ui_section_timing=Iseloomulike servade ajastus
settings.ui_description=Kirjeldus võetud failist scene-style.properties. Väärtus salvestatakse andmebaasi ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Valgustusrežiim
settings.ui_lighting_mode.description=Hoidke täpselt üks valgustusrežiim. 'stable' = Fikseeritud suunatud valgusallikad maailmaruumis. Valgustus ei pöörle kaameraga. Mõeldud hea värvitäpsuse ja loetava CAD-geomeetria jaoks. 'kevin' = BowlerStudio algne valgustus. Kasutab kolme punktvalgust; üks järgib kaamerat. Allpool olevaid stabiilse valgustuse seadeid selles režiimis eiratakse.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ümbritsev valgus
settings.ui_lighting_ambient.description=Ümbritsev valgus mõjutab kõiki nähtavaid pindu võrdselt. Suurem: heledamad varjud, värvid jäävad oma põhivärvile lähemale, kuid pinnad tunduvad lamedamad. Väiksem: tugevam varjutus ja pindade eraldumine, kuid varjulised värvid muutuvad tumedamaks.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Põhivalgus lubatud
settings.ui_lighting_key_enabled.description=Põhivalgus, mis kirjeldab objekti kuju. Selle valguse täielikuks eemaldamiseks määrake enabled=false.
settings.ui_lighting_key_intensity=Põhivalguse intensiivsus
settings.ui_lighting_key_intensity.description=Põhivalguse intensiivsus. Vahemik: 0.0 - 1.0.
settings.ui_lighting_key_x=Põhivalgus X
settings.ui_lighting_key_x.description=Põhivalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
settings.ui_lighting_key_y=Põhivalgus Y
settings.ui_lighting_key_y.description=Põhivalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
settings.ui_lighting_key_z=Põhivalgus Z
settings.ui_lighting_key_z.description=Põhivalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Täitevalgus lubatud
settings.ui_lighting_fill_enabled.description=Pehmendab põhivalguse tekitatud varjupoolt. Selle valguse täielikuks eemaldamiseks määrake enabled=false.
settings.ui_lighting_fill_intensity=Täitevalguse intensiivsus
settings.ui_lighting_fill_intensity.description=Suurem intensiivsus: parem värvitäpsus, pehmem varjutus. Väiksem intensiivsus: tugevam erinevus erinevalt orienteeritud tahkude vahel. Vahemik: 0.0 - 1.0.
settings.ui_lighting_fill_x=Täitevalgus X
settings.ui_lighting_fill_x.description=Täitevalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
settings.ui_lighting_fill_y=Täitevalgus Y
settings.ui_lighting_fill_y.description=Täitevalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
settings.ui_lighting_fill_z=Täitevalgus Z
settings.ui_lighting_fill_z.description=Täitevalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Servavalgus lubatud
settings.ui_lighting_rim_enabled.description=Nõrk teisene valgus, mis aitab mõningaid pindu eraldada. Tavaliselt peaks jääma peenetundeliseks. Selle valguse täielikuks eemaldamiseks määrake enabled=false.
settings.ui_lighting_rim_intensity=Servavalguse intensiivsus
settings.ui_lighting_rim_intensity.description=Nõrk teisene valgus, mis aitab mõningaid pindu eraldada. Tavaliselt peaks jääma peenetundeliseks. Vahemik: 0.0 - 1.0.
settings.ui_lighting_rim_x=Servavalgus X
settings.ui_lighting_rim_x.description=Servavalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
settings.ui_lighting_rim_y=Servavalgus Y
settings.ui_lighting_rim_y.description=Servavalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
settings.ui_lighting_rim_z=Servavalgus Z
settings.ui_lighting_rim_z.description=Servavalguse suund maailmakoordinaatides. Vahemik: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Iseloomulikud servad lubatud
settings.ui_edges_enabled.description=Joonistab tumeda geomeetria piki CSG-objektide tegelikke teravaid servi. Koplanaarsete hulknurkade piire eiratakse. Servade täielikuks eemaldamiseks määrake enabled=false.
settings.ui_edges_angle_degrees=Serva nurk (kraadi)
settings.ui_edges_angle_degrees.description=Minimaalne nurk naabertahkude vahel, enne kui nende ühine serv joonistatakse. Suuremad väärtused annavad vähem murdejooni. Vahemik: 0 - 360.
settings.ui_edges_width_mode=Serva laiuse režiim
settings.ui_edges_width_mode.description=screen = Hoiab kontuuri ekraanipikslites ligikaudu muutumatuna. Parim CAD-stiilis õhukese joone välimuse jaoks igal suumimisel. world = Kasutab fikseeritud raadiust stseeni millimeetrites.
settings.ui_edges_width_px=Serva laius (pikslit)
settings.ui_edges_width_px.description=Nähtav joonelaius, kui widthMode=screen. Vahemik: 0.1 - 10.0.
settings.ui_edges_radius=Serva raadius
settings.ui_edges_radius.description=Serva raadius maailmaruumis stseeni millimeetrites. Kasutatakse ainult siis, kui widthMode=world. Vahemik: 0.001 - 100.0.
settings.ui_edges_brightness=Serva heledus
settings.ui_edges_brightness.description=0.0 = must, 1.0 = valge. Vahemik: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Väikese ruudustiku nähtavuse suumimissügavus
settings.ui_grid_small_visible_zoom_depth.description=Juhib, kui kaugel jääb 1 mm ruudustik nähtavaks. Suurem väärtus = 1 mm ruudustik ilmub varem / kaugemal. Vahemik: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Väikese ruudustiku heleduse kordaja
settings.ui_grid_small_brightness_multiplier.description=Korrutab RGB-heledust, säilitades teema tooni. 1.0 = algne teemavärv. < 1.0 = tumedam. > 1.0 = heledam. Vahemik: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Väikese ruudustiku läbipaistmatuse kordaja
settings.ui_grid_small_opacity_multiplier.description=Korrutab praeguse teema antud alfat. 1.0 = muutmata. Vahemik: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Väikese ruudustiku joonelaius (px)
settings.ui_grid_small_line_width_px.description=Ruudustiku joone paksus ruudustiku vanades tekstuuripiksli ühikutes. Praegused ajaloolised väärtused on 2 mõõdu 1 mm ja 4 mõõdu 10 mm jaoks. Vahemik: 1 - 10.
settings.ui_grid_small_z_offset_mm=Väikese ruudustiku Z-nihe (mm)
settings.ui_grid_small_z_offset_mm.description=Hoiab 1 mm ruudustikku vahetult 10 mm ruudustiku taga, et vältida sügavuse artefakte. Vahemik: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Suure ruudustiku heleduse kordaja
settings.ui_grid_major_brightness_multiplier.description=Korrutab RGB-heledust, säilitades teema tooni. 1.0 = algne teemavärv. < 1.0 = tumedam. > 1.0 = heledam. Vahemik: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Suure ruudustiku läbipaistmatuse kordaja
settings.ui_grid_major_opacity_multiplier.description=Korrutab praeguse teema antud alfat. 1.0 = muutmata. Vahemik: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Suure ruudustiku joonelaius (px)
settings.ui_grid_major_line_width_px.description=Ruudustiku joone paksus ruudustiku vanades tekstuuripiksli ühikutes. Praegused ajaloolised väärtused on 2 mõõdu 1 mm ja 4 mõõdu 10 mm jaoks. Vahemik: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Ruudustiku liikumisrežiim
settings.ui_grid_motion_mode.description=major = Liikumise ajal hoiab nähtavana ainult terava 10 mm ruudustiku ja peidab ajutiselt tiheda 1 mm ruudustiku. 1 mm ruudustik taastub pärast liikumise lakkamist. all = Hoiab liikumise ajal nähtavana mõlemad teravad joonruudustikud. Parim visuaalne järjepidevus, kuid võib olla kulukam. texture = Algne käitumine: asendab liikumise ajal joongeomeetria tekstuuritud ruudustikukvadrata. Kiirem, kuid võib tekitada astmelisust / moiré-mustreid. hidden = Peidab liikumise ajal ruudustikujooned ja taastab need, kui kaamera peatub.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Maapinna renderduse läbipaistmatus
settings.ui_grid_ground_render_opacity.description=Peamise maapinna täidise läbipaistmatus. Täidis jääb igal suumimisel paigale; ainult tihe 1 mm ruudustik sõltub suumimisest. Määrake 0, et täidet peita, jättes selle valikupinna aktiivseks. Kohandatud tööpinnad eiravad seda seadet. Vahemik: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kaamera orbiidi minimaalne tundlikkus
settings.ui_camera_orbit_min.description=Pöörlemistundlikkus kraadides JavaFX-i hiirekoordinaadi ühiku kohta. min juhib väga aeglaseid lohistamisi. Vahemik: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kaamera orbiidi maksimaalne tundlikkus
settings.ui_camera_orbit_max.description=Pöörlemistundlikkus kraadides JavaFX-i hiirekoordinaadi ühiku kohta. max on kiirete lohistamiste ülempiir. Vahemik: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kaamera orbiidi poolkiirus
settings.ui_camera_orbit_half.description=Filtreeritud kursori kiirus JavaFX-i koordinaatühikutes sekundis, mille juures tundlikkus on poolel teel min ja max vahel. Suurem = sujuvam kiirendus. Vahemik: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kaamera orbiidi tõusuaeg (ms)
settings.ui_camera_orbit_rise_ms.description=Ajakonstandid (millisekundites) kursori kiiruse hinnangu jaoks kiirendamisel. Suurem riseMs pehmendab kiirendust. Vahemik: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kaamera orbiidi langusaeg (ms)
settings.ui_camera_orbit_fall_ms.description=Ajakonstandid (millisekundites) kursori kiiruse hinnangu jaoks aeglustamisel. Väiksem fallMs taastab täppisjuhtimise varem. Kumbki ei lisa kaamera inertsit. Vahemik: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Serva stseeni stabiliseerumise viivitus (ms)
settings.ui_edges_scene_settle_delay_ms.description=Viivitus pärast geomeetria-/kuvamuudatusi. Suuremad väärtused pärsivad rohkem tööd kiire ajaloo taasesituse ajal. Vahemik: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Servakaamera stabiliseerumise viivitus (ms)
settings.ui_edges_camera_settle_delay_ms.description=Viivitus pärast kaamera liikumist, enne kui ekraaniruumi õhukese joone paksus uuesti üles ehitatakse. Vahemik: 0 - 10000.
settings.ui_edges_topology_precision=Serva topoloogia täpsus
settings.ui_edges_topology_precision.description=Normaliseerimiseks kasutatav kvantimissamm iseloomulike servade topoloogias. Mudeli geomeetria ja tahkude normaalvektorid jäävad muutumatuks. Vahemik: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Servade õmblemise tolerants (mm)
settings.ui_edges_stitch_tolerance.description=Piirjoonte õmblemise tolerants stseeni millimeetrites. Kasutatakse ainult näiliste ühe tahuga servade jaoks pärast indekseeritud võrgu külgnevusanalüüsi. See lubab erinevalt jaotatud, kuid geomeetriliselt kokkulangevad piirid uuesti ühendada, enne kui otsustatakse, kas need on tegelikud iseloomulikud servad. Vahemik: 0.0 - 1.0.
