settings.ui_lighting_fill_intensity.description=მაღალი ინტენსივობა: უკეთესი ფერის სიზუსტე, უფრო რბილი დაჩრდილვა. დაბალი ინტენსივობა: უფრო ძლიერი განსხვავება სხვადასხვა ორიენტაციის წახნაგებს შორის. დიაპაზონი: 0.0 - 1.0.
settings.ui_lighting_fill_x=დამატებითი სინათლე X
settings.ui_lighting_fill_x.description=დამატებითი სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
settings.ui_lighting_fill_y=დამატებითი სინათლე Y
settings.ui_lighting_fill_y.description=დამატებითი სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
