settings.ui_grid_major_brightness_multiplier.description=ამრავლებს RGB სიკაშკაშეს თემის ელფერის შენარჩუნებით. 1.0 = თემის საწყისი ფერი. < 1.0 = უფრო მუქი. > 1.0 = უფრო კაშკაშა. დიაპაზონი: 0.0 - 3.0.
