settings.ui_grid_major_line_width_px.description=ბადის ხაზების სისქე ბადის მოძველებულ ტექსტურის პიქსელების ერთეულებში. მიმდინარე ისტორიული მნიშვნელობებია 2 1 mm-ისთვის და 4 10 mm-ისთვის. დიაპაზონი: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ბადის მოძრაობის რეჟიმი
settings.ui_grid_motion_mode.description=major = მოძრაობის დროს ხილულად ტოვებს მხოლოდ მკვეთრ 10 mm ბადეს და დროებით მალავს მკვრივ 1 mm ბადეს. 1 mm ბადე ბრუნდება მოძრაობის შეწყვეტის შემდეგ. all = მოძრაობის დროს ხილულად ტოვებს ორივე მკვეთრ ხაზოვან ბადეს. საუკეთესო ვიზუალური უწყვეტობა, მაგრამ შესაძლოა უფრო ძვირი. texture = თავდაპირველი ქცევა: მოძრაობის დროს ხაზოვანი გეომეტრია იცვლება ტექსტურირებული ბადის კვადრატებით. უფრო სწრაფი, მაგრამ შეიძლება წარმოქმნას ალიასინგი / მუარეს ნახატები. hidden = მოძრაობის დროს მალავს ბადის ხაზებს და აღადგენს მათ, როცა კამერა ჩერდება.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=მიწის რენდერის გაუმჭვირვალობა
settings.ui_grid_ground_render_opacity.description=მიწის ძირითადი შევსების გაუმჭვირვალობა. შევსება ადგილზე რჩება ნებისმიერი მასშტაბის დროს; მასშტაბით შემოიფარგლება მხოლოდ მკვრივი 1 mm ბადე. დააყენეთ 0, რომ შევსება დაიმალოს და მისი არჩევის ზედაპირი აქტიური დარჩეს. მორგებული სამუშაო სიბრტყეები ამ პარამეტრს იგნორირებენ. დიაპაზონი: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=კამერის ორბიტის მინიმალური მგრძნობელობა
settings.ui_camera_orbit_min.description=ბრუნვის მგრძნობელობა გრადუსებში JavaFX მაუსის კოორდინატის ერთეულზე. min აკონტროლებს ძალიან ნელი გადათრევებს. დიაპაზონი: 0.0 - 1.0.
settings.ui_camera_orbit_max=კამერის ორბიტის მაქსიმალური მგრძნობელობა
settings.ui_camera_orbit_max.description=ბრუნვის მგრძნობელობა გრადუსებში JavaFX მაუსის კოორდინატის ერთეულზე. max არის ზედა ზღვარი სწრაფი გადათრევებისთვის. დიაპაზონი: 0.0 - 1.0.
settings.ui_camera_orbit_half=კამერის ორბიტის ნახევარი სიჩქარე
settings.ui_camera_orbit_half.description=კურსორის გაფილტრული სიჩქარე JavaFX კოორდინატის ერთეულებში წამში, რომლის დროსაც მგრძნობელობა min-სა და max-ს შორის შუაშია. უფრო მაღალი = უფრო რბილი აჩქარება. დიაპაზონი: 0 - 10000.
settings.ui_camera_orbit_rise_ms=კამერის ორბიტის აწევის დრო (ms)
settings.ui_camera_orbit_rise_ms.description=დროის მუდმივები (მილიწამები) კურსორის სიჩქარის შეფასებისთვის აჩქარების დროს. უფრო მაღალი riseMs არბილებს აჩქარებას. დიაპაზონი: 0 - 10000.
settings.ui_camera_orbit_fall_ms=კამერის ორბიტის დაწევის დრო (ms)
settings.ui_camera_orbit_fall_ms.description=დროის მუდმივები (მილიწამები) კურსორის სიჩქარის შეფასებისთვის შენელების დროს. უფრო დაბალი fallMs უფრო ადრე აღადგენს ზუსტ კონტროლს. არც ერთი არ ამატებს კამერას ინერციას. დიაპაზონი: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=კიდეების სცენის დაწყნარების დაყოვნება (ms)
settings.ui_edges_scene_settle_delay_ms.description=დაყოვნება გეომეტრიის ან ჩვენების ცვლილებების შემდეგ. უფრო მაღალი მნიშვნელობები თრგუნავს მეტ სამუშაოს ისტორიის სწრაფი გამეორების დროს. დიაპაზონი: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=კიდეების კამერის დაწყნარების დაყოვნება (ms)
settings.ui_edges_camera_settle_delay_ms.description=დაყოვნება კამერის მოძრაობის შემდეგ, სანამ ეკრანულ სივრცეში თხელი ხაზების სისქე ხელახლა აშენდება. დიაპაზონი: 0 - 10000.
settings.ui_edges_topology_precision=კიდეების ტოპოლოგიის სიზუსტე
settings.ui_edges_topology_precision.description=კვანტიზაციის ნაბიჯი, რომელიც გამოიყენება მახასიათებლის კიდეების ტოპოლოგიის ნორმალიზებისთვის. მოდელის გეომეტრია და წახნაგების ნორმალები უცვლელი რჩება. დიაპაზონი: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=კიდეების შეკერვის ტოლერანტობა (mm)
settings.ui_edges_stitch_tolerance.description=საზღვრების შეკერვის ტოლერანტობა სცენის მილიმეტრებში. გამოიყენება მხოლოდ იმ კიდეებისთვის, რომლებიც ინდექსირებული ბადის მეზობლობის ანალიზის შემდეგ ერთი წახნაგის საზღვრად გამოიყურება. ის საშუალებას აძლევს სხვადასხვაგვარად დაყოფილ, მაგრამ გეომეტრიულად დამთხვეულ საზღვრებს ხელახლა დაუკავშირდნენ, სანამ გადაწყდება, არიან თუ არა ისინი ნამდვილი მახასიათებლის კიდეები. დიაპაზონი: 0.0 - 1.0.
