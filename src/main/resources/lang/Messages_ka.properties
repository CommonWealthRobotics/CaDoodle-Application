settings.ui_lighting_key_z.description=მთავარი სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=დამატებითი სინათლე ჩართულია
settings.ui_lighting_fill_enabled.description=არბილებს მთავარი სინათლის მიერ შექმნილ ჩრდილოვან მხარეს. დააყენეთ enabled=false, რომ ეს სინათლე მთლიანად მოიხსნას.
