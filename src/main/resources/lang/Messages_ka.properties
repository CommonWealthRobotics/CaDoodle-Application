# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=განათების რეჟიმი
settings.ui_lighting_mode.description=შეინარჩუნეთ ზუსტად ერთი განათების რეჟიმი. 'stable' = ფიქსირებული მიმართული სინათლეები მსოფლიო სივრცეში. განათება კამერასთან ერთად არ ბრუნავს. განკუთვნილია კარგი ფერის სიზუსტისა და წაკითხვადი CAD გეომეტრიისთვის. 'kevin' = BowlerStudio-ის თავდაპირველი განათება. იყენებს სამ წერტილოვან სინათლეს; ერთი კამერას მიჰყვება. ქვემოთ მოცემული სტაბილური სინათლეების პარამეტრები ამ რეჟიმში იგნორირდება.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=გარემოს სინათლე
settings.ui_lighting_ambient.description=გარემოს სინათლე თანაბრად მოქმედებს ყველა ხილულ ზედაპირზე. მაღლა: უფრო ნათელი ჩრდილები, ფერები უფრო ახლოს რჩება საბაზისო ფერთან, მაგრამ ზედაპირები უფრო ბრტყლად გამოიყურება. დაბლა: უფრო ძლიერი დაჩრდილვა და ზედაპირების გამოყოფა, მაგრამ ჩრდილში მყოფი ფერები მუქდება.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=მთავარი სინათლე ჩართულია
settings.ui_lighting_key_enabled.description=მთავარი სინათლე, რომელიც ობიექტის ფორმას აღწერს. დააყენეთ enabled=false, რომ ეს სინათლე მთლიანად მოიხსნას.
settings.ui_lighting_key_intensity=მთავარი სინათლის ინტენსივობა
settings.ui_lighting_key_intensity.description=მთავარი სინათლის ინტენსივობა. დიაპაზონი: 0.0 - 1.0.
settings.ui_lighting_key_x=მთავარი სინათლე X
settings.ui_lighting_key_x.description=მთავარი სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
settings.ui_lighting_key_y=მთავარი სინათლე Y
settings.ui_lighting_key_y.description=მთავარი სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
