settings.ui_lighting_rim_enabled.description=სუსტი მეორადი სინათლე, რომელიც ზოგიერთი ზედაპირის გამოყოფას ეხმარება. ჩვეულებრივ უნდა დარჩეს დახვეწილი. დააყენეთ enabled=false, რომ ეს სინათლე მთლიანად მოიხსნას.
