settings.ui_lighting_rim_intensity.description=სუსტი მეორადი სინათლე, რომელიც ზოგიერთი ზედაპირის გამოყოფას ეხმარება. ჩვეულებრივ უნდა დარჩეს დახვეწილი. დიაპაზონი: 0.0 - 1.0.
settings.ui_lighting_rim_x=კონტურის სინათლე X
settings.ui_lighting_rim_x.description=კონტურის სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
settings.ui_lighting_rim_y=კონტურის სინათლე Y
settings.ui_lighting_rim_y.description=კონტურის სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
settings.ui_lighting_rim_z=კონტურის სინათლე Z
settings.ui_lighting_rim_z.description=კონტურის სინათლის მიმართულება მსოფლიო კოორდინატებში. დიაპაზონი: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=მახასიათებლის კიდეები ჩართულია
settings.ui_edges_enabled.description=ხატავს მუქ გეომეტრიას CSG ობიექტების ნამდვილი მკვეთრი კიდეების გასწვრივ. თანაპლენარული მრავალკუთხედების საზღვრები იგნორირდება. დააყენეთ enabled=false, რომ კიდეები მთლიანად მოიხსნას.
settings.ui_edges_angle_degrees=კიდის კუთხე გრადუსებში
settings.ui_edges_angle_degrees.description=მინიმალური კუთხე მეზობელ წახნაგებს შორის, რის შემდეგაც მათი საერთო კიდე იხატება. უფრო მაღალი მნიშვნელობები ნაკლებ დანაოჭების ხაზებს იძლევა. დიაპაზონი: 0 - 360.
settings.ui_edges_width_mode=კიდის სიგანის რეჟიმი
settings.ui_edges_width_mode.description=screen = კონტურს დაახლოებით მუდმივს ინახავს ეკრანის პიქსელებში. საუკეთესო CAD სტილის თხელი კონტურისთვის ნებისმიერი მასშტაბის დროს. world = იყენებს ფიქსირებულ რადიუსს სცენის მილიმეტრებში.
settings.ui_edges_width_px=კიდის სიგანე პიქსელებში
settings.ui_edges_width_px.description=ხაზის ხილული სისქე, როცა widthMode=screen. დიაპაზონი: 0.1 - 10.0.
settings.ui_edges_radius=კიდის რადიუსი
settings.ui_edges_radius.description=კიდის რადიუსი მსოფლიო სივრცეში, სცენის მილიმეტრებში. გამოიყენება მხოლოდ widthMode=world-ის დროს. დიაპაზონი: 0.001 - 100.0.
settings.ui_edges_brightness=კიდის სიკაშკაშე
settings.ui_edges_brightness.description=0.0 = შავი, 1.0 = თეთრი. დიაპაზონი: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=პატარა ბადის ხილვადობის სიღრმე
settings.ui_grid_small_visible_zoom_depth.description=აკონტროლებს, რამდენად შორს რჩება 1 mm ბადე ხილული. უფრო მაღალი მნიშვნელობა = 1 mm ბადე უფრო ადრე / უფრო შორს ჩნდება. დიაპაზონი: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=პატარა ბადის სიკაშკაშის მამრავლი
settings.ui_grid_small_brightness_multiplier.description=ამრავლებს RGB სიკაშკაშეს თემის ელფერის შენარჩუნებით. 1.0 = თემის საწყისი ფერი. < 1.0 = უფრო მუქი. > 1.0 = უფრო კაშკაშა. დიაპაზონი: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=პატარა ბადის გაუმჭვირვალობის მამრავლი
settings.ui_grid_small_opacity_multiplier.description=ამრავლებს მიმდინარე თემის მიერ მოწოდებულ ალფას. 1.0 = უცვლელი. დიაპაზონი: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=პატარა ბადის ხაზის სისქე (px)
settings.ui_grid_small_line_width_px.description=ბადის ხაზების სისქე ბადის მოძველებულ ტექსტურის პიქსელების ერთეულებში. მიმდინარე ისტორიული მნიშვნელობებია 2 1 mm-ისთვის და 4 10 mm-ისთვის. დიაპაზონი: 1 - 10.
settings.ui_grid_small_z_offset_mm=პატარა ბადის Z წანაცვლება (mm)
settings.ui_grid_small_z_offset_mm.description=შეინახეთ 1 mm ბადე 10 mm ბადის ოდნავ უკან, სიღრმის არტეფაქტების თავიდან ასაცილებლად. დიაპაზონი: -1.0 - 1.0.
# ---------------- grid.major ----------------
