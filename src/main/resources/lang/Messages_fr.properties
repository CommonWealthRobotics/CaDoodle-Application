# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Éléments d'interface
settings.ui_section_lighting=Éclairage
settings.ui_section_edges=Arêtes caractéristiques
settings.ui_section_grid=Grille du plan de travail
settings.ui_section_camera=Orbite de la caméra
settings.ui_section_timing=Temporisation des arêtes caractéristiques
settings.ui_description=Description issue de scene-style.properties. La valeur est enregistrée dans ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Mode d'éclairage
settings.ui_lighting_mode.description=Conserver exactement un mode d'éclairage. 'stable' = Lumières directionnelles fixes dans l'espace monde. L'éclairage ne tourne pas avec la caméra. Conçu pour une bonne fidélité des couleurs et une géométrie CAO lisible. 'kevin' = Éclairage d'origine de BowlerStudio. Utilise trois lumières ponctuelles ; une suit la caméra. Les réglages des lumières stables ci-dessous sont ignorés dans ce mode.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Lumière ambiante
settings.ui_lighting_ambient.description=La lumière ambiante affecte toutes les surfaces visibles de la même manière. Plus élevée : ombres plus claires, les couleurs restent plus proches de leur couleur de base, mais les surfaces paraissent plus plates. Plus faible : ombrage et séparation des surfaces plus marqués, mais les couleurs dans l'ombre deviennent plus sombres.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Lumière principale activée
settings.ui_lighting_key_enabled.description=Lumière principale qui décrit la forme de l'objet. Mettez enabled=false pour supprimer complètement cette lumière.
settings.ui_lighting_key_intensity=Intensité de la lumière principale
settings.ui_lighting_key_intensity.description=Intensité de la lumière principale. Plage : 0.0 - 1.0.
settings.ui_lighting_key_x=Lumière principale X
settings.ui_lighting_key_x.description=Direction de la lumière principale en coordonnées monde. Plage : -1.0 - 1.0.
settings.ui_lighting_key_y=Lumière principale Y
settings.ui_lighting_key_y.description=Direction de la lumière principale en coordonnées monde. Plage : -1.0 - 1.0.
settings.ui_lighting_key_z=Lumière principale Z
settings.ui_lighting_key_z.description=Direction de la lumière principale en coordonnées monde. Plage : -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Lumière d'appoint activée
settings.ui_lighting_fill_enabled.description=Adoucit le côté ombré créé par la lumière principale. Mettez enabled=false pour supprimer complètement cette lumière.
settings.ui_lighting_fill_intensity=Intensité de la lumière d'appoint
settings.ui_lighting_fill_intensity.description=Intensité plus élevée : meilleure fidélité des couleurs, ombrage plus doux. Intensité plus faible : différence plus marquée entre les faces d'orientation différente. Plage : 0.0 - 1.0.
settings.ui_lighting_fill_x=Lumière d'appoint X
settings.ui_lighting_fill_x.description=Direction de la lumière d'appoint en coordonnées monde. Plage : -1.0 - 1.0.
settings.ui_lighting_fill_y=Lumière d'appoint Y
settings.ui_lighting_fill_y.description=Direction de la lumière d'appoint en coordonnées monde. Plage : -1.0 - 1.0.
settings.ui_lighting_fill_z=Lumière d'appoint Z
settings.ui_lighting_fill_z.description=Direction de la lumière d'appoint en coordonnées monde. Plage : -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Lumière de contour activée
settings.ui_lighting_rim_enabled.description=Lumière secondaire faible qui aide à séparer certaines surfaces. Elle doit normalement rester discrète. Mettez enabled=false pour supprimer complètement cette lumière.
settings.ui_lighting_rim_intensity=Intensité de la lumière de contour
settings.ui_lighting_rim_intensity.description=Lumière secondaire faible qui aide à séparer certaines surfaces. Elle doit normalement rester discrète. Plage : 0.0 - 1.0.
settings.ui_lighting_rim_x=Lumière de contour X
settings.ui_lighting_rim_x.description=Direction de la lumière de contour en coordonnées monde. Plage : -1.0 - 1.0.
settings.ui_lighting_rim_y=Lumière de contour Y
settings.ui_lighting_rim_y.description=Direction de la lumière de contour en coordonnées monde. Plage : -1.0 - 1.0.
settings.ui_lighting_rim_z=Lumière de contour Z
settings.ui_lighting_rim_z.description=Direction de la lumière de contour en coordonnées monde. Plage : -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Arêtes caractéristiques activées
settings.ui_edges_enabled.description=Dessine une géométrie sombre le long des arêtes réellement vives des objets CSG. Les limites de polygones coplanaires sont ignorées. Mettez enabled=false pour supprimer complètement les arêtes.
settings.ui_edges_angle_degrees=Angle d'arête (degrés)
settings.ui_edges_angle_degrees.description=Angle minimal entre faces voisines avant que leur arête commune ne soit dessinée. Des valeurs plus élevées produisent moins de lignes de pliure. Plage : 0 - 360.
settings.ui_edges_width_mode=Mode de largeur d'arête
settings.ui_edges_width_mode.description=screen = Maintient le contour approximativement constant en pixels écran. Idéal pour un aspect trait fin de type CAO à tout niveau de zoom. world = Utilise un rayon fixe en millimètres de la scène.
settings.ui_edges_width_px=Largeur d'arête (pixels)
settings.ui_edges_width_px.description=Largeur de ligne visible quand widthMode=screen. Plage : 0.1 - 10.0.
settings.ui_edges_radius=Rayon d'arête
settings.ui_edges_radius.description=Rayon d'arête dans l'espace monde, en millimètres de la scène. Utilisé uniquement quand widthMode=world. Plage : 0.001 - 100.0.
settings.ui_edges_brightness=Luminosité d'arête
settings.ui_edges_brightness.description=0.0 = noir, 1.0 = blanc. Plage : 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Profondeur de zoom visible de la petite grille
settings.ui_grid_small_visible_zoom_depth.description=Contrôle la distance à laquelle la grille de 1 mm reste visible. Valeur plus élevée = la grille de 1 mm apparaît plus tôt / plus loin. Plage : 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Multiplicateur de luminosité de la petite grille
settings.ui_grid_small_brightness_multiplier.description=Multiplie la luminosité RVB tout en conservant la teinte du thème. 1.0 = couleur d'origine du thème. < 1.0 = plus sombre. > 1.0 = plus clair. Plage : 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Multiplicateur d'opacité de la petite grille
settings.ui_grid_small_opacity_multiplier.description=Multiplie l'alpha fourni par le thème actuel. 1.0 = inchangé. Plage : 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Largeur de ligne de la petite grille (px)
settings.ui_grid_small_line_width_px.description=Épaisseur des lignes de grille dans les anciennes unités de pixel de texture de la grille. Les valeurs historiques actuelles sont 2 pour 1 mm et 4 pour 10 mm. Plage : 1 - 10.
settings.ui_grid_small_z_offset_mm=Décalage Z de la petite grille (mm)
settings.ui_grid_small_z_offset_mm.description=Garde la grille de 1 mm juste derrière celle de 10 mm pour éviter les artefacts de profondeur. Plage : -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Multiplicateur de luminosité de la grande grille
settings.ui_grid_major_brightness_multiplier.description=Multiplie la luminosité RVB tout en conservant la teinte du thème. 1.0 = couleur d'origine du thème. < 1.0 = plus sombre. > 1.0 = plus clair. Plage : 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Multiplicateur d'opacité de la grande grille
settings.ui_grid_major_opacity_multiplier.description=Multiplie l'alpha fourni par le thème actuel. 1.0 = inchangé. Plage : 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Largeur de ligne de la grande grille (px)
settings.ui_grid_major_line_width_px.description=Épaisseur des lignes de grille dans les anciennes unités de pixel de texture de la grille. Les valeurs historiques actuelles sont 2 pour 1 mm et 4 pour 10 mm. Plage : 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Mode de mouvement de la grille
settings.ui_grid_motion_mode.description=major = Ne garder que la grille nette de 10 mm visible pendant le déplacement et masquer temporairement la grille dense de 1 mm. La grille de 1 mm revient à l'arrêt du mouvement. all = Garder les deux grilles de lignes nettes visibles pendant le déplacement. Meilleure continuité visuelle, mais potentiellement plus coûteux. texture = Comportement d'origine : remplacer la géométrie des lignes par des quadrilatères de grille texturés pendant le déplacement. Plus rapide, mais peut produire de l'aliasing / des motifs de moiré. hidden = Masquer les lignes de grille pendant le déplacement et les restaurer à l'arrêt de la caméra.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacité du sol
settings.ui_grid_ground_render_opacity.description=Opacité du remplissage principal du sol. Le remplissage reste en place à tous les niveaux de zoom ; seule la grille dense de 1 mm dépend du zoom. Mettez 0 pour masquer le remplissage tout en gardant sa surface de sélection active. Les plans de travail personnalisés ignorent ce réglage. Plage : 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensibilité minimale de l'orbite de la caméra
settings.ui_camera_orbit_min.description=Sensibilité de rotation en degrés par unité de coordonnée souris JavaFX. min contrôle les glissements très lents. Plage : 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensibilité maximale de l'orbite de la caméra
settings.ui_camera_orbit_max.description=Sensibilité de rotation en degrés par unité de coordonnée souris JavaFX. max est la limite supérieure pour les glissements rapides. Plage : 0.0 - 1.0.
settings.ui_camera_orbit_half=Vitesse médiane de l'orbite de la caméra
settings.ui_camera_orbit_half.description=Vitesse filtrée du curseur, en unités de coordonnée JavaFX par seconde, à laquelle la sensibilité se situe à mi-chemin entre min et max. Plus élevée = accélération plus douce. Plage : 0 - 10000.
settings.ui_camera_orbit_rise_ms=Temps de montée de l'orbite de la caméra (ms)
settings.ui_camera_orbit_rise_ms.description=Constantes de temps (millisecondes) de l'estimation de la vitesse du curseur lors de l'accélération. Un riseMs plus élevé adoucit l'accélération. Plage : 0 - 10000.
settings.ui_camera_orbit_fall_ms=Temps de descente de l'orbite de la caméra (ms)
settings.ui_camera_orbit_fall_ms.description=Constantes de temps (millisecondes) de l'estimation de la vitesse du curseur lors du ralentissement. Un fallMs plus faible restaure plus tôt le contrôle fin. Aucun des deux n'ajoute d'inertie à la caméra. Plage : 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Délai de stabilisation de la scène des arêtes (ms)
settings.ui_edges_scene_settle_delay_ms.description=Délai après les changements de géométrie ou d'affichage. Des valeurs plus élevées suppriment davantage de travail lors d'une relecture rapide de l'historique. Plage : 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Délai de stabilisation de la caméra des arêtes (ms)
settings.ui_edges_camera_settle_delay_ms.description=Délai après le mouvement de la caméra avant la reconstruction de l'épaisseur du trait fin en espace écran. Plage : 0 - 10000.
settings.ui_edges_topology_precision=Précision de topologie des arêtes
settings.ui_edges_topology_precision.description=Pas de quantification utilisé pour normaliser la topologie des arêtes caractéristiques. La géométrie du modèle et les normales des faces restent inchangées. Plage : 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolérance de couture des arêtes (mm)
settings.ui_edges_stitch_tolerance.description=Tolérance de couture des bords en millimètres de la scène. Utilisée uniquement pour les arêtes apparentes à une seule face après l'analyse d'adjacence du maillage indexé. Elle permet de reconnecter des bords subdivisés différemment mais géométriquement confondus avant de décider s'il s'agit de vraies arêtes caractéristiques. Plage : 0.0 - 1.0.
