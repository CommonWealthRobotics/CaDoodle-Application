# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=UI Elements
settings.ui_section_lighting=Lighting
settings.ui_section_edges=Feature Edges
settings.ui_section_grid=Workplane Grid
settings.ui_section_camera=Camera Orbit
settings.ui_section_timing=Feature Edge Timing
settings.ui_description=Description taken from scene-style.properties. The value is saved to ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Lighting Mode
settings.ui_lighting_mode.description=Keep exactly one lighting mode. 'stable' = Fixed world-space directional lights. Lighting does not rotate with the camera. Designed for good color fidelity and readable CAD geometry. 'kevin' = Original BowlerStudio lighting. Uses three point lights; one follows the camera. The stable-light settings below are ignored in this mode.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ambient Light
settings.ui_lighting_ambient.description=Ambient light affects every visible surface equally. Higher: brighter shadows, colors stay closer to their base color, but surfaces look flatter. Lower: stronger shading and surface separation, but shadowed colors become darker.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Key Light Enabled
settings.ui_lighting_key_enabled.description=Main light used to describe the shape of the object. Set enabled=false to remove this light completely.
settings.ui_lighting_key_intensity=Key Light Intensity
settings.ui_lighting_key_intensity.description=Intensity of the key light. Range: 0.0 - 1.0.
settings.ui_lighting_key_x=Key Light X
settings.ui_lighting_key_x.description=Direction of the key light in world coordinates. Range: -1.0 - 1.0.
settings.ui_lighting_key_y=Key Light Y
settings.ui_lighting_key_y.description=Direction of the key light in world coordinates. Range: -1.0 - 1.0.
settings.ui_lighting_key_z=Key Light Z
settings.ui_lighting_key_z.description=Direction of the key light in world coordinates. Range: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Fill Light Enabled
settings.ui_lighting_fill_enabled.description=Softens the shadow side created by the key light. Set enabled=false to remove this light completely.
settings.ui_lighting_fill_intensity=Fill Light Intensity
settings.ui_lighting_fill_intensity.description=Higher intensity: better color fidelity, softer shading. Lower intensity: stronger difference between differently oriented faces. Range: 0.0 - 1.0.
settings.ui_lighting_fill_x=Fill Light X
settings.ui_lighting_fill_x.description=Direction of the fill light in world coordinates. Range: -1.0 - 1.0.
settings.ui_lighting_fill_y=Fill Light Y
settings.ui_lighting_fill_y.description=Direction of the fill light in world coordinates. Range: -1.0 - 1.0.
settings.ui_lighting_fill_z=Fill Light Z
settings.ui_lighting_fill_z.description=Direction of the fill light in world coordinates. Range: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Rim Light Enabled
settings.ui_lighting_rim_enabled.description=Weak secondary light used to help separate some surfaces. This should normally stay subtle. Set enabled=false to remove this light completely.
settings.ui_lighting_rim_intensity=Rim Light Intensity
settings.ui_lighting_rim_intensity.description=Weak secondary light used to help separate some surfaces. This should normally stay subtle. Range: 0.0 - 1.0.
settings.ui_lighting_rim_x=Rim Light X
settings.ui_lighting_rim_x.description=Direction of the rim light in world coordinates. Range: -1.0 - 1.0.
settings.ui_lighting_rim_y=Rim Light Y
settings.ui_lighting_rim_y.description=Direction of the rim light in world coordinates. Range: -1.0 - 1.0.
settings.ui_lighting_rim_z=Rim Light Z
settings.ui_lighting_rim_z.description=Direction of the rim light in world coordinates. Range: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Feature Edges Enabled
settings.ui_edges_enabled.description=Draw dark geometry along real sharp edges of CSG objects. Coplanar polygon boundaries are ignored. Set enabled=false to remove the edges completely.
settings.ui_edges_angle_degrees=Edge Angle Degrees
settings.ui_edges_angle_degrees.description=Minimum angle between neighboring faces before their shared edge is drawn. Higher values produce fewer crease lines. Range: 0 - 360.
settings.ui_edges_width_mode=Edge Width Mode
settings.ui_edges_width_mode.description=screen = Keeps the outline approximately constant in screen pixels. Best for a CAD-style hairline appearance at any zoom level. world = Uses a fixed radius in scene millimetres.
settings.ui_edges_width_px=Edge Width Pixels
settings.ui_edges_width_px.description=Visible line width when widthMode=screen. Range: 0.1 - 10.0.
settings.ui_edges_radius=Edge Radius
settings.ui_edges_radius.description=World-space edge radius in scene millimeters. Used only when widthMode=world. Range: 0.001 - 100.0.
settings.ui_edges_brightness=Edge Brightness
settings.ui_edges_brightness.description=0.0 = black, 1.0 = white. Range: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Small Grid Visible Zoom Depth
settings.ui_grid_small_visible_zoom_depth.description=Controls how far away the 1 mm grid remains visible. Higher value = 1 mm grid appears earlier / farther away. Range: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Small Grid Brightness Multiplier
settings.ui_grid_small_brightness_multiplier.description=Multiplies RGB brightness while preserving the theme hue. 1.0 = original theme color. < 1.0 = darker. > 1.0 = brighter. Range: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Small Grid Opacity Multiplier
settings.ui_grid_small_opacity_multiplier.description=Multiplies the alpha supplied by the current theme. 1.0 = unchanged. Range: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Small Grid Line Width (px)
settings.ui_grid_small_line_width_px.description=Grid line thickness in the grid's legacy texture-pixel units. Current historical values are 2 for 1 mm and 4 for 10 mm. Range: 1 - 10.
settings.ui_grid_small_z_offset_mm=Small Grid Z Offset (mm)
settings.ui_grid_small_z_offset_mm.description=Keep the 1 mm grid just behind the 10 mm grid to avoid depth artifacts. Range: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Major Grid Brightness Multiplier
settings.ui_grid_major_brightness_multiplier.description=Multiplies RGB brightness while preserving the theme hue. 1.0 = original theme color. < 1.0 = darker. > 1.0 = brighter. Range: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Major Grid Opacity Multiplier
settings.ui_grid_major_opacity_multiplier.description=Multiplies the alpha supplied by the current theme. 1.0 = unchanged. Range: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Major Grid Line Width (px)
settings.ui_grid_major_line_width_px.description=Grid line thickness in the grid's legacy texture-pixel units. Current historical values are 2 for 1 mm and 4 for 10 mm. Range: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Grid Motion Mode
settings.ui_grid_motion_mode.description=major = Keep only the crisp 10 mm grid visible while moving and temporarily hide the dense 1 mm grid. The 1 mm grid returns after movement stops. all = Keep both crisp line grids visible while moving. Best visual continuity, but potentially more expensive. texture = Original behavior: swap line geometry for textured grid quads while moving. Faster, but may produce aliasing / moire patterns. hidden = Hide grid lines while moving and restore them when the camera stops.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Ground Render Opacity
settings.ui_grid_ground_render_opacity.description=Opacity of the main ground fill. The fill stays in place at every zoom level; only the dense 1 mm grid is gated by zoom. Set to 0 to hide the fill while keeping its picking surface active. Custom workplanes ignore this setting. Range: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Camera Orbit Min Sensitivity
settings.ui_camera_orbit_min.description=Rotation sensitivity in degrees per JavaFX mouse-coordinate unit. min controls very slow drags. Range: 0.0 - 1.0.
settings.ui_camera_orbit_max=Camera Orbit Max Sensitivity
settings.ui_camera_orbit_max.description=Rotation sensitivity in degrees per JavaFX mouse-coordinate unit. max is an upper limit for fast drags. Range: 0.0 - 1.0.
settings.ui_camera_orbit_half=Camera Orbit Half Speed
settings.ui_camera_orbit_half.description=Filtered cursor speed in JavaFX coordinate units per second at which sensitivity is halfway between min and max. Higher = gentler acceleration. Range: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Camera Orbit Rise Time (ms)
settings.ui_camera_orbit_rise_ms.description=Time constants (milliseconds) for the cursor-speed estimate when speeding up. Higher riseMs softens acceleration. Range: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Camera Orbit Fall Time (ms)
settings.ui_camera_orbit_fall_ms.description=Time constants (milliseconds) for the cursor-speed estimate when slowing down. Lower fallMs restores fine control sooner. Neither adds camera inertia. Range: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Edge Scene Settle Delay (ms)
settings.ui_edges_scene_settle_delay_ms.description=Delay after geometry/display changes. Higher values suppress more work during rapid history replay. Range: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Edge Camera Settle Delay (ms)
settings.ui_edges_camera_settle_delay_ms.description=Delay after camera movement before screen-space hairline thickness is rebuilt. Range: 0 - 10000.
settings.ui_edges_topology_precision=Edge Topology Precision
settings.ui_edges_topology_precision.description=Quantization step used to normalize feature-edge topology. Model geometry and face normals remain unchanged. Range: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Edge Stitch Tolerance (mm)
settings.ui_edges_stitch_tolerance.description=Boundary stitching tolerance in scene millimeters. Used only for apparent one-face edges after indexed-mesh adjacency. It allows differently subdivided but geometrically coincident borders to be reconnected before deciding whether they are real feature edges. Range: 0.0 - 1.0.
