# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elementy interfejsu
settings.ui_section_lighting=Oświetlenie
settings.ui_section_edges=Krawędzie charakterystyczne
settings.ui_section_grid=Siatka płaszczyzny roboczej
settings.ui_section_camera=Obrót kamery
settings.ui_section_timing=Czas krawędzi charakterystycznych
settings.ui_description=Opis pochodzi z pliku scene-style.properties. Wartość jest zapisywana w ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Tryb oświetlenia
settings.ui_lighting_mode.description=Utrzymuj dokładnie jeden tryb oświetlenia. 'stable' = Stałe kierunkowe światła w przestrzeni świata. Oświetlenie nie obraca się wraz z kamerą. Zaprojektowane z myślą o dobrej wierności kolorów i czytelnej geometrii CAD. 'kevin' = Oryginalne oświetlenie BowlerStudio. Używa trzech świateł punktowych; jedno podąża za kamerą. Poniższe ustawienia stabilnego światła są ignorowane w tym trybie.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Światło otoczenia
settings.ui_lighting_ambient.description=Światło otoczenia wpływa równomiernie na każdą widoczną powierzchnię. Wyższe: jaśniejsze cienie, kolory pozostają bliżej koloru bazowego, ale powierzchnie wyglądają na płaskie. Niższe: mocniejsze cieniowanie i rozdzielenie powierzchni, ale kolory w cieniu stają się ciemniejsze.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Światło główne włączone
settings.ui_lighting_key_enabled.description=Światło główne opisujące kształt obiektu. Ustaw enabled=false, aby całkowicie usunąć to światło.
settings.ui_lighting_key_intensity=Intensywność światła głównego
settings.ui_lighting_key_intensity.description=Intensywność światła głównego. Zakres: 0.0 - 1.0.
settings.ui_lighting_key_x=Światło główne X
settings.ui_lighting_key_x.description=Kierunek światła głównego we współrzędnych świata. Zakres: -1.0 - 1.0.
settings.ui_lighting_key_y=Światło główne Y
settings.ui_lighting_key_y.description=Kierunek światła głównego we współrzędnych świata. Zakres: -1.0 - 1.0.
settings.ui_lighting_key_z=Światło główne Z
settings.ui_lighting_key_z.description=Kierunek światła głównego we współrzędnych świata. Zakres: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Światło wypełniające włączone
settings.ui_lighting_fill_enabled.description=Zmiękcza stronę cienia tworzoną przez światło główne. Ustaw enabled=false, aby całkowicie usunąć to światło.
settings.ui_lighting_fill_intensity=Intensywność światła wypełniającego
settings.ui_lighting_fill_intensity.description=Wyższa intensywność: lepsza wierność kolorów, miększe cieniowanie. Niższa intensywność: większa różnica między różnie zorientowanymi ścianami. Zakres: 0.0 - 1.0.
settings.ui_lighting_fill_x=Światło wypełniające X
settings.ui_lighting_fill_x.description=Kierunek światła wypełniającego we współrzędnych świata. Zakres: -1.0 - 1.0.
settings.ui_lighting_fill_y=Światło wypełniające Y
settings.ui_lighting_fill_y.description=Kierunek światła wypełniającego we współrzędnych świata. Zakres: -1.0 - 1.0.
settings.ui_lighting_fill_z=Światło wypełniające Z
settings.ui_lighting_fill_z.description=Kierunek światła wypełniającego we współrzędnych świata. Zakres: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Światło krawędziowe włączone
settings.ui_lighting_rim_enabled.description=Słabe światło dodatkowe pomagające oddzielić niektóre powierzchnie. Zazwyczaj powinno pozostać subtelne. Ustaw enabled=false, aby całkowicie usunąć to światło.
settings.ui_lighting_rim_intensity=Intensywność światła krawędziowego
settings.ui_lighting_rim_intensity.description=Słabe światło dodatkowe pomagające oddzielić niektóre powierzchnie. Zazwyczaj powinno pozostać subtelne. Zakres: 0.0 - 1.0.
settings.ui_lighting_rim_x=Światło krawędziowe X
settings.ui_lighting_rim_x.description=Kierunek światła krawędziowego we współrzędnych świata. Zakres: -1.0 - 1.0.
settings.ui_lighting_rim_y=Światło krawędziowe Y
settings.ui_lighting_rim_y.description=Kierunek światła krawędziowego we współrzędnych świata. Zakres: -1.0 - 1.0.
settings.ui_lighting_rim_z=Światło krawędziowe Z
settings.ui_lighting_rim_z.description=Kierunek światła krawędziowego we współrzędnych świata. Zakres: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Krawędzie charakterystyczne włączone
settings.ui_edges_enabled.description=Rysuje ciemną geometrię wzdłuż rzeczywistych ostrych krawędzi obiektów CSG. Granice współpłaszczyznowych wielokątów są ignorowane. Ustaw enabled=false, aby całkowicie usunąć krawędzie.
settings.ui_edges_angle_degrees=Kąt krawędzi w stopniach
settings.ui_edges_angle_degrees.description=Minimalny kąt między sąsiednimi ścianami, po którym ich wspólna krawędź jest rysowana. Wyższe wartości dają mniej linii załamania. Zakres: 0 - 360.
settings.ui_edges_width_mode=Tryb szerokości krawędzi
settings.ui_edges_width_mode.description=screen = Utrzymuje kontur w przybliżeniu stały w pikselach ekranu. Najlepsze dla wyglądu cienkiej linii w stylu CAD przy każdym powiększeniu. world = Używa stałego promienia w milimetrach sceny.
settings.ui_edges_width_px=Szerokość krawędzi w pikselach
settings.ui_edges_width_px.description=Szerokość widocznej linii, gdy widthMode=screen. Zakres: 0.1 - 10.0.
settings.ui_edges_radius=Promień krawędzi
settings.ui_edges_radius.description=Promień krawędzi w przestrzeni świata w milimetrach sceny. Używany tylko gdy widthMode=world. Zakres: 0.001 - 100.0.
settings.ui_edges_brightness=Jasność krawędzi
settings.ui_edges_brightness.description=0.0 = czarny, 1.0 = biały. Zakres: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Głębokość widoczności małej siatki
settings.ui_grid_small_visible_zoom_depth.description=Określa, jak daleko siatka 1 mm pozostaje widoczna. Wyższa wartość = siatka 1 mm pojawia się wcześniej / dalej. Zakres: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Mnożnik jasności małej siatki
settings.ui_grid_small_brightness_multiplier.description=Mnoży jasność RGB, zachowując odcień motywu. 1.0 = oryginalny kolor motywu. < 1.0 = ciemniej. > 1.0 = jaśniej. Zakres: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Mnożnik krycia małej siatki
settings.ui_grid_small_opacity_multiplier.description=Mnoży wartość alfa dostarczoną przez bieżący motyw. 1.0 = bez zmian. Zakres: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Szerokość linii małej siatki (px)
settings.ui_grid_small_line_width_px.description=Grubość linii siatki w dawnych jednostkach pikseli tekstury siatki. Bieżące wartości historyczne to 2 dla 1 mm i 4 dla 10 mm. Zakres: 1 - 10.
settings.ui_grid_small_z_offset_mm=Przesunięcie Z małej siatki (mm)
settings.ui_grid_small_z_offset_mm.description=Utrzymuj siatkę 1 mm tuż za siatką 10 mm, aby uniknąć artefaktów głębi. Zakres: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Mnożnik jasności głównej siatki
settings.ui_grid_major_brightness_multiplier.description=Mnoży jasność RGB, zachowując odcień motywu. 1.0 = oryginalny kolor motywu. < 1.0 = ciemniej. > 1.0 = jaśniej. Zakres: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Mnożnik krycia głównej siatki
settings.ui_grid_major_opacity_multiplier.description=Mnoży wartość alfa dostarczoną przez bieżący motyw. 1.0 = bez zmian. Zakres: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Szerokość linii głównej siatki (px)
settings.ui_grid_major_line_width_px.description=Grubość linii siatki w dawnych jednostkach pikseli tekstury siatki. Bieżące wartości historyczne to 2 dla 1 mm i 4 dla 10 mm. Zakres: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Tryb ruchu siatki
settings.ui_grid_motion_mode.description=major = Podczas ruchu pozostaw widoczną tylko wyraźną siatkę 10 mm i tymczasowo ukryj gęstą siatkę 1 mm. Siatka 1 mm wraca po zatrzymaniu ruchu. all = Podczas ruchu pozostaw widoczne obie wyraźne siatki liniowe. Najlepsza ciągłość wizualna, ale potencjalnie kosztowniejsza. texture = Oryginalne zachowanie: podczas ruchu zamień geometrię linii na teksturowane czworokąty siatki. Szybciej, ale może powodować postrzępienie krawędzi / wzory mory. hidden = Ukryj linie siatki podczas ruchu i przywróć je, gdy kamera się zatrzyma.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Krycie renderowania podłoża
settings.ui_grid_ground_render_opacity.description=Krycie głównego wypełnienia podłoża. Wypełnienie pozostaje na miejscu przy każdym powiększeniu; tylko gęsta siatka 1 mm jest uzależniona od powiększenia. Ustaw 0, aby ukryć wypełnienie, zachowując aktywną jego powierzchnię wybierania. Niestandardowe płaszczyzny robocze ignorują to ustawienie. Zakres: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Minimalna czułość obrotu kamery
settings.ui_camera_orbit_min.description=Czułość obrotu w stopniach na jednostkę współrzędnej myszy JavaFX. min steruje bardzo wolnymi przeciągnięciami. Zakres: 0.0 - 1.0.
settings.ui_camera_orbit_max=Maksymalna czułość obrotu kamery
settings.ui_camera_orbit_max.description=Czułość obrotu w stopniach na jednostkę współrzędnej myszy JavaFX. max jest górnym limitem dla szybkich przeciągnięć. Zakres: 0.0 - 1.0.
settings.ui_camera_orbit_half=Połowa prędkości obrotu kamery
settings.ui_camera_orbit_half.description=Przefiltrowana prędkość kursora w jednostkach współrzędnych JavaFX na sekundę, przy której czułość jest w połowie między min i max. Wyższa = łagodniejsze przyspieszenie. Zakres: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Czas narastania obrotu kamery (ms)
settings.ui_camera_orbit_rise_ms.description=Stałe czasowe (milisekundy) dla szacowania prędkości kursora przy przyspieszaniu. Wyższe riseMs łagodzi przyspieszenie. Zakres: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Czas opadania obrotu kamery (ms)
settings.ui_camera_orbit_fall_ms.description=Stałe czasowe (milisekundy) dla szacowania prędkości kursora przy zwalnianiu. Niższe fallMs szybciej przywraca precyzyjną kontrolę. Żadna nie dodaje bezwładności kamery. Zakres: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Opóźnienie ustabilizowania sceny krawędzi (ms)
settings.ui_edges_scene_settle_delay_ms.description=Opóźnienie po zmianach geometrii/wyświetlania. Wyższe wartości tłumią więcej pracy podczas szybkiego odtwarzania historii. Zakres: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Opóźnienie ustabilizowania kamery krawędzi (ms)
settings.ui_edges_camera_settle_delay_ms.description=Opóźnienie po ruchu kamery, zanim zostanie odbudowana grubość cienkiej linii w przestrzeni ekranu. Zakres: 0 - 10000.
settings.ui_edges_topology_precision=Precyzja topologii krawędzi
settings.ui_edges_topology_precision.description=Krok kwantyzacji używany do normalizacji topologii krawędzi charakterystycznych. Geometria modelu i normalne ścian pozostają niezmienione. Zakres: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerancja zszywania krawędzi (mm)
settings.ui_edges_stitch_tolerance.description=Tolerancja zszywania granic w milimetrach sceny. Używana tylko dla pozornych krawędzi jednej ściany po analizie sąsiedztwa indeksowanej siatki. Pozwala ponownie połączyć różnie podzielone, ale geometrycznie pokrywające się granice, zanim zostanie ustalone, czy są to rzeczywiste krawędzie charakterystyczne. Zakres: 0.0 - 1.0.
