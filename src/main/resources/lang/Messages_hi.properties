settings.ui_lighting_mode.description=ठीक एक प्रकाश मोड रखें। 'stable' = स्थिर विश्व-स्थान दिशात्मक प्रकाश। प्रकाश कैमरे के साथ नहीं घूमता। अच्छी रंग-निष्ठा और पठनीय CAD ज्यामिति के लिए बनाया गया। 'kevin' = मूल BowlerStudio प्रकाश। तीन पॉइंट प्रकाश का उपयोग करता है; एक कैमरे का अनुसरण करता है। इस मोड में नीचे की स्थिर-प्रकाश सेटिंग्स अनदेखी की जाती हैं।
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=परिवेश प्रकाश
settings.ui_lighting_ambient.description=परिवेश प्रकाश हर दिखाई देने वाली सतह को समान रूप से प्रभावित करता है। अधिक: चमकीली छायाएं, रंग अपने मूल रंग के करीब रहते हैं, लेकिन सतहें सपाट दिखती हैं। कम: गहरी शेडिंग और सतहों में अधिक अलगाव, लेकिन छाया वाले रंग गहरे हो जाते हैं।
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=मुख्य प्रकाश सक्षम
settings.ui_lighting_key_enabled.description=वस्तु का आकार दर्शाने के लिए उपयोग होने वाला मुख्य प्रकाश। इस प्रकाश को पूरी तरह हटाने के लिए enabled=false सेट करें।
settings.ui_lighting_key_intensity=मुख्य प्रकाश तीव्रता
settings.ui_lighting_key_intensity.description=मुख्य प्रकाश की तीव्रता। सीमा: 0.0 - 1.0।
settings.ui_lighting_key_x=मुख्य प्रकाश X
settings.ui_lighting_key_x.description=विश्व निर्देशांकों में मुख्य प्रकाश की दिशा। सीमा: -1.0 - 1.0।
settings.ui_lighting_key_y=मुख्य प्रकाश Y
settings.ui_lighting_key_y.description=विश्व निर्देशांकों में मुख्य प्रकाश की दिशा। सीमा: -1.0 - 1.0।
settings.ui_lighting_key_z=मुख्य प्रकाश Z
settings.ui_lighting_key_z.description=विश्व निर्देशांकों में मुख्य प्रकाश की दिशा। सीमा: -1.0 - 1.0।
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=फिल प्रकाश सक्षम
settings.ui_lighting_fill_enabled.description=मुख्य प्रकाश से बनी छाया वाली दिशा को नरम करता है। इस प्रकाश को पूरी तरह हटाने के लिए enabled=false सेट करें।
settings.ui_lighting_fill_intensity=फिल प्रकाश तीव्रता
settings.ui_lighting_fill_intensity.description=अधिक तीव्रता: बेहतर रंग-निष्ठा, नरम शेडिंग। कम तीव्रता: अलग-अलग दिशा वाले फलकों के बीच अधिक स्पष्ट अंतर। सीमा: 0.0 - 1.0।
settings.ui_lighting_fill_x=फिल प्रकाश X
settings.ui_lighting_fill_x.description=विश्व निर्देशांकों में फिल प्रकाश की दिशा। सीमा: -1.0 - 1.0।
settings.ui_lighting_fill_y=फिल प्रकाश Y
settings.ui_lighting_fill_y.description=विश्व निर्देशांकों में फिल प्रकाश की दिशा। सीमा: -1.0 - 1.0।
settings.ui_lighting_fill_z=फिल प्रकाश Z
settings.ui_lighting_fill_z.description=विश्व निर्देशांकों में फिल प्रकाश की दिशा। सीमा: -1.0 - 1.0।
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=रिम प्रकाश सक्षम
settings.ui_lighting_rim_enabled.description=कुछ सतहों को अलग दिखाने में मदद करने वाला कमज़ोर द्वितीयक प्रकाश। यह सामान्यतः सूक्ष्म रहना चाहिए। इस प्रकाश को पूरी तरह हटाने के लिए enabled=false सेट करें।
settings.ui_lighting_rim_intensity=रिम प्रकाश तीव्रता
settings.ui_lighting_rim_intensity.description=कुछ सतहों को अलग दिखाने में मदद करने वाला कमज़ोर द्वितीयक प्रकाश। यह सामान्यतः सूक्ष्म रहना चाहिए। सीमा: 0.0 - 1.0।
settings.ui_lighting_rim_x=रिम प्रकाश X
settings.ui_lighting_rim_x.description=विश्व निर्देशांकों में रिम प्रकाश की दिशा। सीमा: -1.0 - 1.0।
settings.ui_lighting_rim_y=रिम प्रकाश Y
settings.ui_lighting_rim_y.description=विश्व निर्देशांकों में रिम प्रकाश की दिशा। सीमा: -1.0 - 1.0।
settings.ui_lighting_rim_z=रिम प्रकाश Z
settings.ui_lighting_rim_z.description=विश्व निर्देशांकों में रिम प्रकाश की दिशा। सीमा: -1.0 - 1.0।
# ---------------- edges ----------------
settings.ui_edges_enabled=फ़ीचर किनारे सक्षम
settings.ui_edges_enabled.description=CSG वस्तुओं के वास्तविक तीखे किनारों पर गहरी ज्यामिति खींचें। समतलीय बहुभुज सीमाओं को अनदेखा किया जाता है। किनारों को पूरी तरह हटाने के लिए enabled=false सेट करें।
settings.ui_edges_angle_degrees=किनारे का कोण (डिग्री)
settings.ui_edges_angle_degrees.description=पड़ोसी फलकों के बीच न्यूनतम कोण, जिसके बाद उनका साझा किनारा खींचा जाता है। अधिक मान कम क्रीज़ रेखाएं बनाते हैं। सीमा: 0 - 360।
settings.ui_edges_width_mode=किनारे की चौड़ाई मोड
settings.ui_edges_width_mode.description=screen = रूपरेखा को स्क्रीन पिक्सेल में लगभग स्थिर रखता है। किसी भी ज़ूम स्तर पर CAD-शैली हेयरलाइन रूप के लिए सर्वोत्तम। world = दृश्य मिलीमीटर में निश्चित त्रिज्या का उपयोग करता है।
settings.ui_edges_width_px=किनारे की चौड़ाई पिक्सेल
settings.ui_edges_width_px.description=widthMode=screen होने पर दिखाई देने वाली रेखा की चौड़ाई। सीमा: 0.1 - 10.0।
settings.ui_edges_radius=किनारे की त्रिज्या
settings.ui_edges_radius.description=दृश्य मिलीमीटर में विश्व-स्थान किनारे की त्रिज्या। केवल तब उपयोग होती है जब widthMode=world हो। सीमा: 0.001 - 100.0।
settings.ui_edges_brightness=किनारे की चमक
settings.ui_edges_brightness.description=0.0 = काला, 1.0 = सफ़ेद। सीमा: 0.0 - 1.0।
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=छोटी ग्रिड दृश्यता ज़ूम गहराई
settings.ui_grid_small_visible_zoom_depth.description=यह नियंत्रित करता है कि 1 mm ग्रिड कितनी दूर तक दिखाई देता रहता है। अधिक मान = 1 mm ग्रिड पहले / अधिक दूर से दिखाई देता है। सीमा: 1 - 10000।
settings.ui_grid_small_brightness_multiplier=छोटी ग्रिड चमक गुणक
settings.ui_grid_small_brightness_multiplier.description=थीम ह्यू को सुरक्षित रखते हुए RGB चमक को गुणा करता है। 1.0 = मूल थीम रंग। < 1.0 = गहरा। > 1.0 = अधिक चमकीला। सीमा: 0.0 - 3.0।
settings.ui_grid_small_opacity_multiplier=छोटी ग्रिड अपारदर्शिता गुणक
settings.ui_grid_small_opacity_multiplier.description=वर्तमान थीम द्वारा दिए गए अल्फा को गुणा करता है। 1.0 = अपरिवर्तित। सीमा: 0.0 - 1.0।
settings.ui_grid_small_line_width_px=छोटी ग्रिड रेखा चौड़ाई (px)
settings.ui_grid_small_line_width_px.description=ग्रिड की लेगेसी टेक्सचर-पिक्सेल इकाइयों में ग्रिड रेखा की मोटाई। वर्तमान ऐतिहासिक मान 1 mm के लिए 2 और 10 mm के लिए 4 हैं। सीमा: 1 - 10।
settings.ui_grid_small_z_offset_mm=छोटी ग्रिड Z ऑफ़सेट (mm)
settings.ui_grid_small_z_offset_mm.description=गहराई विसंगतियों से बचने के लिए 1 mm ग्रिड को 10 mm ग्रिड के ठीक पीछे रखें। सीमा: -1.0 - 1.0।
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=मुख्य ग्रिड चमक गुणक
settings.ui_grid_major_brightness_multiplier.description=थीम ह्यू को सुरक्षित रखते हुए RGB चमक को गुणा करता है। 1.0 = मूल थीम रंग। < 1.0 = गहरा। > 1.0 = अधिक चमकीला। सीमा: 0.0 - 3.0।
settings.ui_grid_major_opacity_multiplier=मुख्य ग्रिड अपारदर्शिता गुणक
settings.ui_grid_major_opacity_multiplier.description=वर्तमान थीम द्वारा दिए गए अल्फा को गुणा करता है। 1.0 = अपरिवर्तित। सीमा: 0.0 - 1.0।
settings.ui_grid_major_line_width_px=मुख्य ग्रिड रेखा चौड़ाई (px)
settings.ui_grid_major_line_width_px.description=ग्रिड की लेगेसी टेक्सचर-पिक्सेल इकाइयों में ग्रिड रेखा की मोटाई। वर्तमान ऐतिहासिक मान 1 mm के लिए 2 और 10 mm के लिए 4 हैं। सीमा: 1 - 10।
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ग्रिड गति मोड
settings.ui_grid_motion_mode.description=major = गति के दौरान केवल स्पष्ट 10 mm ग्रिड दिखाई देता रखें और सघन 1 mm ग्रिड को अस्थायी रूप से छुपाएं। गति रुकने के बाद 1 mm ग्रिड लौट आता है। all = गति के दौरान दोनों स्पष्ट रेखा ग्रिड दिखाई देते रखें। सर्वोत्तम दृश्य निरंतरता, लेकिन संभवतः अधिक महंगा। texture = मूल व्यवहार: गति के दौरान रेखा ज्यामिति के बदले बनावट वाले ग्रिड क्वाड्स रखें। तेज़, लेकिन एलियासिंग / मोइरे पैटर्न बना सकता है। hidden = गति के दौरान ग्रिड रेखाएं छुपाएं और कैमरा रुकने पर उन्हें बहाल करें।
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=ग्राउंड रेंडर अपारदर्शिता
settings.ui_grid_ground_render_opacity.description=मुख्य ग्राउंड भरण की अपारदर्शिता। भरण हर ज़ूम स्तर पर अपनी जगह रहता है; केवल सघन 1 mm ग्रिड ज़ूम पर निर्भर है। भरण को छुपाते हुए उसकी पिकिंग सतह सक्रिय रखने के लिए 0 पर सेट करें। कस्टम वर्कप्लेन इस सेटिंग को अनदेखा करते हैं। सीमा: 0.0 - 1.0।
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=कैमरा ऑर्बिट न्यूनतम संवेदनशीलता
settings.ui_camera_orbit_min.description=JavaFX माउस-निर्देशांक इकाई प्रति डिग्री में घुमाव संवेदनशीलता। min बहुत धीमी खींच को नियंत्रित करता है। सीमा: 0.0 - 1.0।
settings.ui_camera_orbit_max=कैमरा ऑर्बिट अधिकतम संवेदनशीलता
settings.ui_camera_orbit_max.description=JavaFX माउस-निर्देशांक इकाई प्रति डिग्री में घुमाव संवेदनशीलता। max तेज़ खींच के लिए ऊपरी सीमा है। सीमा: 0.0 - 1.0।
settings.ui_camera_orbit_half=कैमरा ऑर्बिट आधी गति
settings.ui_camera_orbit_half.description=फ़िल्टर की गई कर्सर गति (JavaFX निर्देशांक इकाई प्रति सेकंड) जिस पर संवेदनशीलता min और max के बीच आधी होती है। अधिक = कोमल त्वरण। सीमा: 0 - 10000।
settings.ui_camera_orbit_rise_ms=कैमरा ऑर्बिट राइज़ समय (ms)
settings.ui_camera_orbit_rise_ms.description=गति बढ़ाते समय कर्सर-गति अनुमान के लिए समय स्थिरांक (मिलीसेकंड)। अधिक riseMs त्वरण को कोमल बनाता है। सीमा: 0 - 10000।
settings.ui_camera_orbit_fall_ms=कैमरा ऑर्बिट फ़ॉल समय (ms)
settings.ui_camera_orbit_fall_ms.description=गति घटाते समय कर्सर-गति अनुमान के लिए समय स्थिरांक (मिलीसेकंड)। कम fallMs सूक्ष्म नियंत्रण जल्दी बहाल करता है। इनमें से कोई भी कैमरा जड़ता नहीं जोड़ता। सीमा: 0 - 10000।
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=किनारे दृश्य स्थिरता विलंब (ms)
settings.ui_edges_scene_settle_delay_ms.description=ज्यामिति/प्रदर्शन परिवर्तनों के बाद विलंब। अधिक मान तेज़ इतिहास रीप्ले के दौरान अधिक कार्य दबाते हैं। सीमा: 0 - 10000।
settings.ui_edges_camera_settle_delay_ms=किनारे कैमरा स्थिरता विलंब (ms)
settings.ui_edges_camera_settle_delay_ms.description=कैमरा गति के बाद विलंब, जिसके बाद स्क्रीन-स्थान हेयरलाइन मोटाई फिर से बनाई जाती है। सीमा: 0 - 10000।
settings.ui_edges_topology_precision=किनारे टोपोलॉजी परिशुद्धता
settings.ui_edges_topology_precision.description=फ़ीचर-किनारे टोपोलॉजी को सामान्य करने के लिए उपयोग किया जाने वाला क्वांटाइज़ेशन चरण। मॉडल ज्यामिति और फलक नॉर्मल अपरिवर्तित रहते हैं। सीमा: 0.0 - 1.0।
settings.ui_edges_stitch_tolerance=किनारे सिलाई सहनशीलता (mm)
settings.ui_edges_stitch_tolerance.description=दृश्य मिलीमीटर में सीमा सिलाई सहनशीलता। केवल इंडेक्स्ड-मेश निकटता के बाद दिखने वाले एक-फलक किनारों के लिए उपयोग होती है। यह अलग-अलग उपविभाजित लेकिन ज्यामितीय रूप से संपाती सीमाओं को फिर से जोड़ने देती है, इससे पहले कि तय किया जाए कि वे वास्तविक फ़ीचर किनारे हैं या नहीं। सीमा: 0.0 - 1.0।
