# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Prvky uživatelského rozhraní
settings.ui_section_lighting=Osvětlení
settings.ui_section_edges=Význačné hrany
settings.ui_section_grid=Mřížka pracovní roviny
settings.ui_section_camera=Orbit kamery
settings.ui_section_timing=Časování význačných hran
settings.ui_description=Popis převzatý ze scene-style.properties. Hodnota se ukládá do ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Režim osvětlení
settings.ui_lighting_mode.description=Ponechte přesně jeden režim osvětlení. 'stable' = Pevná směrová světla ve světovém prostoru. Osvětlení se neotáčí s kamerou. Navrženo pro dobrou barevnou věrnost a čitelnou geometrii CAD. 'kevin' = Původní osvětlení BowlerStudio. Používá tři bodová světla; jedno sleduje kameru. Nastavení stabilního osvětlení níže se v tomto režimu ignorují.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Okolní světlo
settings.ui_lighting_ambient.description=Okolní světlo ovlivňuje každý viditelný povrch stejně. Vyšší: světlejší stíny, barvy zůstávají blíže své základní barvě, ale povrchy vypadají plošší. Nižší: silnější stínování a oddělení povrchů, ale barvy ve stínu tmavnou.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Hlavní světlo zapnuto
settings.ui_lighting_key_enabled.description=Hlavní světlo používané k popsání tvaru objektu. Nastavte enabled=false pro úplné odstranění tohoto světla.
settings.ui_lighting_key_intensity=Intenzita hlavního světla
settings.ui_lighting_key_intensity.description=Intenzita hlavního světla. Rozsah: 0.0 - 1.0.
settings.ui_lighting_key_x=Hlavní světlo X
settings.ui_lighting_key_x.description=Směr hlavního světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
settings.ui_lighting_key_y=Hlavní světlo Y
settings.ui_lighting_key_y.description=Směr hlavního světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
settings.ui_lighting_key_z=Hlavní světlo Z
settings.ui_lighting_key_z.description=Směr hlavního světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Doplňkové světlo zapnuto
settings.ui_lighting_fill_enabled.description=Změkčuje stinnou stranu vytvořenou hlavním světlem. Nastavte enabled=false pro úplné odstranění tohoto světla.
settings.ui_lighting_fill_intensity=Intenzita doplňkového světla
settings.ui_lighting_fill_intensity.description=Vyšší intenzita: lepší barevná věrnost, měkčí stínování. Nižší intenzita: výraznější rozdíl mezi různě orientovanými plochami. Rozsah: 0.0 - 1.0.
settings.ui_lighting_fill_x=Doplňkové světlo X
settings.ui_lighting_fill_x.description=Směr doplňkového světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
settings.ui_lighting_fill_y=Doplňkové světlo Y
settings.ui_lighting_fill_y.description=Směr doplňkového světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
settings.ui_lighting_fill_z=Doplňkové světlo Z
settings.ui_lighting_fill_z.description=Směr doplňkového světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Obrysové světlo zapnuto
settings.ui_lighting_rim_enabled.description=Slabé sekundární světlo, které pomáhá oddělit některé povrchy. Obvykle by mělo zůstat jemné. Nastavte enabled=false pro úplné odstranění tohoto světla.
settings.ui_lighting_rim_intensity=Intenzita obrysového světla
settings.ui_lighting_rim_intensity.description=Slabé sekundární světlo, které pomáhá oddělit některé povrchy. Obvykle by mělo zůstat jemné. Rozsah: 0.0 - 1.0.
settings.ui_lighting_rim_x=Obrysové světlo X
settings.ui_lighting_rim_x.description=Směr obrysového světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
settings.ui_lighting_rim_y=Obrysové světlo Y
settings.ui_lighting_rim_y.description=Směr obrysového světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
settings.ui_lighting_rim_z=Obrysové světlo Z
settings.ui_lighting_rim_z.description=Směr obrysového světla ve světových souřadnicích. Rozsah: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Význačné hrany zapnuty
settings.ui_edges_enabled.description=Kreslí tmavou geometrii podél skutečných ostrých hran objektů CSG. Hranice koplanárních polygonů se ignorují. Nastavte enabled=false pro úplné odstranění hran.
settings.ui_edges_angle_degrees=Úhel hran (stupně)
settings.ui_edges_angle_degrees.description=Minimální úhel mezi sousedními plochami, než se jejich společná hrana vykreslí. Vyšší hodnoty vytvářejí méně linií přehybu. Rozsah: 0 - 360.
settings.ui_edges_width_mode=Režim šířky hran
settings.ui_edges_width_mode.description=screen = Udržuje obrys přibližně konstantní v pixelech obrazovky. Nejlepší pro vzhled tenké čáry ve stylu CAD při každém přiblížení. world = Používá pevný poloměr v milimetrech scény.
settings.ui_edges_width_px=Šířka hran (pixely)
settings.ui_edges_width_px.description=Viditelná šířka čáry při widthMode=screen. Rozsah: 0.1 - 10.0.
settings.ui_edges_radius=Poloměr hran
settings.ui_edges_radius.description=Poloměr hran ve světovém prostoru v milimetrech scény. Používá se pouze při widthMode=world. Rozsah: 0.001 - 100.0.
settings.ui_edges_brightness=Jas hran
settings.ui_edges_brightness.description=0.0 = černá, 1.0 = bílá. Rozsah: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Hloubka viditelnosti malé mřížky při přiblížení
settings.ui_grid_small_visible_zoom_depth.description=Řídí, jak daleko zůstává mřížka 1 mm viditelná. Vyšší hodnota = mřížka 1 mm se objeví dříve / dále. Rozsah: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Násobitel jasu malé mřížky
settings.ui_grid_small_brightness_multiplier.description=Násobí jas RGB při zachování odstínu motivu. 1.0 = původní barva motivu. < 1.0 = tmavší. > 1.0 = světlejší. Rozsah: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Násobitel krytí malé mřížky
settings.ui_grid_small_opacity_multiplier.description=Násobí alfa hodnotu danou aktuálním motivem. 1.0 = beze změny. Rozsah: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Šířka čar malé mřížky (px)
settings.ui_grid_small_line_width_px.description=Tloušťka čar mřížky ve starých texturových pixelových jednotkách mřížky. Aktuální historické hodnoty jsou 2 pro 1 mm a 4 pro 10 mm. Rozsah: 1 - 10.
settings.ui_grid_small_z_offset_mm=Odsazení Z malé mřížky (mm)
settings.ui_grid_small_z_offset_mm.description=Udržuje mřížku 1 mm těsně za mřížkou 10 mm, aby se zabránilo artefaktům hloubky. Rozsah: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Násobitel jasu hlavní mřížky
settings.ui_grid_major_brightness_multiplier.description=Násobí jas RGB při zachování odstínu motivu. 1.0 = původní barva motivu. < 1.0 = tmavší. > 1.0 = světlejší. Rozsah: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Násobitel krytí hlavní mřížky
settings.ui_grid_major_opacity_multiplier.description=Násobí alfa hodnotu danou aktuálním motivem. 1.0 = beze změny. Rozsah: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Šířka čar hlavní mřížky (px)
settings.ui_grid_major_line_width_px.description=Tloušťka čar mřížky ve starých texturových pixelových jednotkách mřížky. Aktuální historické hodnoty jsou 2 pro 1 mm a 4 pro 10 mm. Rozsah: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Režim pohybu mřížky
settings.ui_grid_motion_mode.description=major = Při pohybu ponechá viditelnou pouze ostrou mřížku 10 mm a hustou mřížku 1 mm dočasně skryje. Mřížka 1 mm se vrátí po zastavení pohybu. all = Při pohybu ponechá viditelné obě ostré čárové mřížky. Nejlepší vizuální kontinuita, ale potenciálně náročnější. texture = Původní chování: při pohybu nahradí čárovou geometrii texturovanými kvady mřížky. Rychlejší, ale může vytvářet aliasing / moaré. hidden = Při pohybu skryje čáry mřížky a obnoví je, když se kamera zastaví.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Krytí vykreslení podkladu
settings.ui_grid_ground_render_opacity.description=Krytí hlavní výplně podkladu. Výplň zůstává na místě při každém přiblížení; pouze hustá mřížka 1 mm je řízena přiblížením. Nastavte na 0 pro skrytí výplně při zachování aktivního povrchu pro výběr. Vlastní pracovní roviny toto nastavení ignorují. Rozsah: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Minimální citlivost orbitu kamery
settings.ui_camera_orbit_min.description=Citlivost rotace ve stupních na jednotku souřadnic myši JavaFX. min řídí velmi pomalé tažení. Rozsah: 0.0 - 1.0.
settings.ui_camera_orbit_max=Maximální citlivost orbitu kamery
settings.ui_camera_orbit_max.description=Citlivost rotace ve stupních na jednotku souřadnic myši JavaFX. max je horní limit pro rychlé tažení. Rozsah: 0.0 - 1.0.
settings.ui_camera_orbit_half=Poloviční rychlost orbitu kamery
settings.ui_camera_orbit_half.description=Filtrovaná rychlost kurzoru v jednotkách souřadnic JavaFX za sekundu, při níž je citlivost přesně mezi min a max. Vyšší = jemnější zrychlení. Rozsah: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Doba náběhu orbitu kamery (ms)
settings.ui_camera_orbit_rise_ms.description=Časové konstanty (milisekundy) pro odhad rychlosti kurzoru při zrychlování. Vyšší riseMs změkčuje zrychlení. Rozsah: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Doba poklesu orbitu kamery (ms)
settings.ui_camera_orbit_fall_ms.description=Časové konstanty (milisekundy) pro odhad rychlosti kurzoru při zpomalování. Nižší fallMs dříve obnoví jemné ovládání. Ani jedna nepřidává kameře setrvačnost. Rozsah: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Prodleva ustálení scény hran (ms)
settings.ui_edges_scene_settle_delay_ms.description=Prodleva po změnách geometrie/zobrazení. Vyšší hodnoty potlačí více práce během rychlého přehrávání historie. Rozsah: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Prodleva ustálení kamery hran (ms)
settings.ui_edges_camera_settle_delay_ms.description=Prodleva po pohybu kamery, než se znovu vytvoří tloušťka tenké čáry v prostoru obrazovky. Rozsah: 0 - 10000.
settings.ui_edges_topology_precision=Přesnost topologie hran
settings.ui_edges_topology_precision.description=Kvantizační krok používaný k normalizaci topologie význačných hran. Geometrie modelu a normály ploch zůstávají nezměněny. Rozsah: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerance sešití hran (mm)
settings.ui_edges_stitch_tolerance.description=Tolerance sešití hranic v milimetrech scény. Používá se pouze pro zdánlivé hrany jednoho povrchu po analýze sousedství indexované sítě. Umožňuje znovu spojit různě rozdělené, ale geometricky shodné hranice, než se rozhodne, zda jde o skutečné význačné hrany. Rozsah: 0.0 - 1.0.
