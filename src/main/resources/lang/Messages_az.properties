# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=İnterfeys elementləri
settings.ui_section_lighting=İşıqlandırma
settings.ui_section_edges=Xüsusiyyət kənarları
settings.ui_section_grid=İş müstəvisi şəbəkəsi
settings.ui_section_camera=Kamera orbiti
settings.ui_section_timing=Xüsusiyyət kənarlarının vaxtı
settings.ui_description=Təsvir scene-style.properties faylından götürülüb. Dəyər ConfigurationDatabase bazasına yazılır.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=İşıqlandırma rejimi
settings.ui_lighting_mode.description=Yalnız bir işıqlandırma rejimi saxlayın. 'stable' = Sabit dünya fəzasında istiqamətli işıqlar. İşıqlandırma kamera ilə fırlanmır. Yaxşı rəng dəqiqliyi və oxunaqlı CAD həndəsəsi üçün nəzərdə tutulub. 'kevin' = Orijinal BowlerStudio işıqlandırması. Üç nöqtə işığı istifadə edir; biri kameranı izləyir. Bu rejimdə aşağıdakı sabit işıq parametrləri nəzərə alınmır.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Mühit işığı
settings.ui_lighting_ambient.description=Mühit işığı hər görünən səthə bərabər təsir edir. Yuxarı: kölgələr daha parlaq olur, rənglər öz əsas rənginə daha yaxın qalır, lakin səthlər daha düz görünür. Aşağı: kölgələmə və səth ayrılığı güclənir, lakin kölgədəki rənglər tündləşir.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Əsas işıq aktivdir
settings.ui_lighting_key_enabled.description=Obyektin formasını təsvir etmək üçün istifadə olunan əsas işıq. Bu işığı tamamilə silmək üçün enabled=false təyin edin.
settings.ui_lighting_key_intensity=Əsas işığın intensivliyi
settings.ui_lighting_key_intensity.description=Əsas işığın intensivliyi. Aralıq: 0.0 - 1.0.
settings.ui_lighting_key_x=Əsas işıq X
settings.ui_lighting_key_x.description=Əsas işığın dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
settings.ui_lighting_key_y=Əsas işıq Y
settings.ui_lighting_key_y.description=Əsas işığın dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
settings.ui_lighting_key_z=Əsas işıq Z
settings.ui_lighting_key_z.description=Əsas işığın dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Doldurucu işıq aktivdir
settings.ui_lighting_fill_enabled.description=Əsas işığın yaratdığı kölgə tərəfini yumşaldır. Bu işığı tamamilə silmək üçün enabled=false təyin edin.
settings.ui_lighting_fill_intensity=Doldurucu işığın intensivliyi
settings.ui_lighting_fill_intensity.description=Daha yüksək intensivlik: daha yaxşı rəng dəqiqliyi, daha yumşaq kölgələmə. Daha aşağı intensivlik: müxtəlif istiqamətli üzlər arasında daha güclü fərq. Aralıq: 0.0 - 1.0.
settings.ui_lighting_fill_x=Doldurucu işıq X
settings.ui_lighting_fill_x.description=Doldurucu işığın dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
settings.ui_lighting_fill_y=Doldurucu işıq Y
settings.ui_lighting_fill_y.description=Doldurucu işığın dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
settings.ui_lighting_fill_z=Doldurucu işıq Z
settings.ui_lighting_fill_z.description=Doldurucu işığın dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Kontur işığı aktivdir
settings.ui_lighting_rim_enabled.description=Bəzi səthləri ayırmağa kömək edən zəif ikinci işıq. Bu normal olaraq çox incə qalmalıdır. Bu işığı tamamilə silmək üçün enabled=false təyin edin.
settings.ui_lighting_rim_intensity=Kontur işığının intensivliyi
settings.ui_lighting_rim_intensity.description=Bəzi səthləri ayırmağa kömək edən zəif ikinci işıq. Bu normal olaraq çox incə qalmalıdır. Aralıq: 0.0 - 1.0.
settings.ui_lighting_rim_x=Kontur işığı X
settings.ui_lighting_rim_x.description=Kontur işığının dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
settings.ui_lighting_rim_y=Kontur işığı Y
settings.ui_lighting_rim_y.description=Kontur işığının dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
settings.ui_lighting_rim_z=Kontur işığı Z
settings.ui_lighting_rim_z.description=Kontur işığının dünya koordinatlarında istiqaməti. Aralıq: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Xüsusiyyət kənarları aktivdir
settings.ui_edges_enabled.description=CSG obyektlərinin həqiqi iti kənarları boyunca tünd həndəsə çəkin. Koplanar çoxbucaqlı sərhədləri nəzərə alınmır. Kənarları tamamilə silmək üçün enabled=false təyin edin.
settings.ui_edges_angle_degrees=Kənar bucağı (dərəcə)
settings.ui_edges_angle_degrees.description=Qonşu üzlər arasında minimum bucaq; bundan sonra onların ortaq kənarı çəkilir. Daha yüksək dəyərlər daha az qırış xətti yaradır. Aralıq: 0 - 360.
settings.ui_edges_width_mode=Kənar eni rejimi
settings.ui_edges_width_mode.description=screen = Konturu ekran pikselində təxminən sabit saxlayır. İstənilən zoom səviyyəsində CAD üslublu incə xətt görünüşü üçün ən yaxşıdır. world = Səhnə millimetrlərində sabit radius istifadə edir.
settings.ui_edges_width_px=Kənar eni (piksel)
settings.ui_edges_width_px.description=widthMode=screen olduqda görünən xətt eni. Aralıq: 0.1 - 10.0.
settings.ui_edges_radius=Kənar radiusu
settings.ui_edges_radius.description=Səhnə millimetrlərində dünya fəzasında kənar radiusu. Yalnız widthMode=world olduqda istifadə olunur. Aralıq: 0.001 - 100.0.
settings.ui_edges_brightness=Kənar parlaqlığı
settings.ui_edges_brightness.description=0.0 = qara, 1.0 = ağ. Aralıq: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Kiçik şəbəkənin görünən zoom dərinliyi
settings.ui_grid_small_visible_zoom_depth.description=1 mm şəbəkənin nə qədər uzaqda görünən qalmasını idarə edir. Daha yüksək dəyər = 1 mm şəbəkə daha erkən / daha uzaqda görünür. Aralıq: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Kiçik şəbəkə parlaqlıq çarpanı
settings.ui_grid_small_brightness_multiplier.description=Tema çalarını saxlayaraq RGB parlaqlığını vurur. 1.0 = orijinal tema rəngi. < 1.0 = daha tünd. > 1.0 = daha parlaq. Aralıq: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Kiçik şəbəkə qeyri-şəffaflıq çarpanı
settings.ui_grid_small_opacity_multiplier.description=Cari tema tərəfindən verilən alfanı vurur. 1.0 = dəyişməz. Aralıq: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Kiçik şəbəkə xətt eni (px)
settings.ui_grid_small_line_width_px.description=Şəbəkə xəttinin qalınlığı şəbəkənin köhnə tekstura-piksel vahidlərində. Cari tarixi dəyərlər 1 mm üçün 2 və 10 mm üçün 4-dür. Aralıq: 1 - 10.
settings.ui_grid_small_z_offset_mm=Kiçik şəbəkə Z ofseti (mm)
settings.ui_grid_small_z_offset_mm.description=Dərinlik artefaktlarının qarşısını almaq üçün 1 mm şəbəkəni 10 mm şəbəkənin bir az arxasında saxlayın. Aralıq: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Böyük şəbəkə parlaqlıq çarpanı
settings.ui_grid_major_brightness_multiplier.description=Tema çalarını saxlayaraq RGB parlaqlığını vurur. 1.0 = orijinal tema rəngi. < 1.0 = daha tünd. > 1.0 = daha parlaq. Aralıq: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Böyük şəbəkə qeyri-şəffaflıq çarpanı
settings.ui_grid_major_opacity_multiplier.description=Cari tema tərəfindən verilən alfanı vurur. 1.0 = dəyişməz. Aralıq: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Böyük şəbəkə xətt eni (px)
settings.ui_grid_major_line_width_px.description=Şəbəkə xəttinin qalınlığı şəbəkənin köhnə tekstura-piksel vahidlərində. Cari tarixi dəyərlər 1 mm üçün 2 və 10 mm üçün 4-dür. Aralıq: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Şəbəkə hərəkət rejimi
settings.ui_grid_motion_mode.description=major = Hərəkət zamanı yalnız aydın 10 mm şəbəkəni görünən saxlayın və sıx 1 mm şəbəkəni müvəqqəti gizlədin. Hərəkət dayandıqdan sonra 1 mm şəbəkə qayıdır. all = Hərəkət zamanı hər iki aydın xətt şəbəkəsini görünən saxlayın. Ən yaxşı vizual davamlılıq, lakin potensial olaraq daha bahalı. texture = Orijinal davranış: hərəkət zamanı xətt həndəsəsini teksturalı şəbəkə dördbucaqları ilə dəyişdirin. Daha sürətli, lakin aliasing / muare naxışları yarada bilər. hidden = Hərəkət zamanı şəbəkə xətlərini gizlədin və kamera dayandıqda onları bərpa edin.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Zəmin render qeyri-şəffaflığı
settings.ui_grid_ground_render_opacity.description=Əsas zəmin doldurmasının qeyri-şəffaflığı. Doldurma hər zoom səviyyəsində yerində qalır; yalnız sıx 1 mm şəbəkə zoom ilə məhdudlaşdırılır. Doldurmanı gizlətmək, lakin onun seçim səthini aktiv saxlamaq üçün 0 təyin edin. Fərdi iş müstəvisləri bu parametri nəzərə almır. Aralıq: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kamera orbitinin minimum həssaslığı
settings.ui_camera_orbit_min.description=JavaFX siçan-koordinat vahidi üzrə dərəcə ilə fırlanma həssaslığı. min çox yavaş dartmalara nəzarət edir. Aralıq: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kamera orbitinin maksimum həssaslığı
settings.ui_camera_orbit_max.description=JavaFX siçan-koordinat vahidi üzrə dərəcə ilə fırlanma həssaslığı. max sürətli dartmalar üçün yuxarı həddir. Aralıq: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kamera orbitinin yarım sürəti
settings.ui_camera_orbit_half.description=Həssaslığın min ilə max arasında yarı olduğu süzülmüş kursor sürəti (JavaFX koordinat vahidi/saniyə). Daha yüksək = daha yumşaq sürətlənmə. Aralıq: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kamera orbitinin yüksəlmə vaxtı (ms)
settings.ui_camera_orbit_rise_ms.description=Sürətlənərkən kursor sürəti təxmini üçün vaxt sabitləri (millisaniyə). Daha yüksək riseMs sürətlənməni yumşaldır. Aralıq: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kamera orbitinin enmə vaxtı (ms)
settings.ui_camera_orbit_fall_ms.description=Sürət azalarkən kursor sürəti təxmini üçün vaxt sabitləri (millisaniyə). Daha aşağı fallMs incə nəzarəti daha tez bərpa edir. Heç biri kamera ətaləti əlavə etmir. Aralıq: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Kənar səhnə sabitləşmə gecikməsi (ms)
settings.ui_edges_scene_settle_delay_ms.description=Həndəsə/ekran dəyişikliklərindən sonra gecikmə. Daha yüksək dəyərlər sürətli tarixçə təkrarı zamanı daha çox işi yatırır. Aralıq: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Kənar kamera sabitləşmə gecikməsi (ms)
settings.ui_edges_camera_settle_delay_ms.description=Ekran fəzasında incə xətt qalınlığı yenidən qurulmazdan əvvəl kamera hərəkətindən sonra gecikmə. Aralıq: 0 - 10000.
settings.ui_edges_topology_precision=Kənar topologiyasının dəqiqliyi
settings.ui_edges_topology_precision.description=Xüsusiyyət kənarı topologiyasını normallaşdırmaq üçün istifadə olunan kvantlaşdırma addımı. Model həndəsəsi və üz normaları dəyişməz qalır. Aralıq: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Kənar tikmə dözümlülüyü (mm)
settings.ui_edges_stitch_tolerance.description=Səhnə millimetrlərində sərhəd tikmə dözümlülüyü. Yalnız indekslənmiş mesh qonşuluğundan sonra bir üz kimi görünən kənarlar üçün istifadə olunur. Fərqli şəkildə bölünmüş, lakin həndəsi olaraq üst-üstə düşən sərhədlərin həqiqi xüsusiyyət kənarları olub-olmadığına qərar verməzdən əvvəl yenidən birləşdirilməsinə imkan verir. Aralıq: 0.0 - 1.0.
