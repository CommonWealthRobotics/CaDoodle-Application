settings.ui_description=scene-style.properties থেকে নেওয়া বিবরণ। মানটি ConfigurationDatabase-এ সংরক্ষিত হয়।

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=আলোকসজ্জা মোড
settings.ui_lighting_mode.description=ঠিক একটি আলোকসজ্জা মোড রাখুন। 'stable' = স্থির বিশ্ব-স্থান দিকনির্দেশক আলো। আলো ক্যামেরার সঙ্গে ঘোরে না। ভালো রঙ-নিষ্ঠা ও পাঠযোগ্য CAD জ্যামিতির জন্য তৈরি। 'kevin' = মূল BowlerStudio আলোকসজ্জা। তিনটি পয়েন্ট আলো ব্যবহার করে; একটি ক্যামেরাকে অনুসরণ করে। এই মোডে নিচের স্থির-আলোর সেটিংস উপেক্ষা করা হয়।
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=পরিবেষ্টন আলো
settings.ui_lighting_ambient.description=পরিবেষ্টন আলো প্রতিটি দৃশ্যমান তলকে সমানভাবে প্রভাবিত করে। বেশি: উজ্জ্বল ছায়া, রং নিজের মূল রঙের কাছাকাছি থাকে, কিন্তু তলগুলো সমতল দেখায়। কম: শক্তিশালী শেডিং ও তলের মধ্যে বেশি পৃথকীকরণ, কিন্তু ছায়াযুক্ত রং গাঢ় হয়।
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=প্রধান আলো সক্ষম
settings.ui_lighting_key_enabled.description=বস্তুর আকৃতি বর্ণনার জন্য ব্যবহৃত প্রধান আলো। এই আলো সম্পূর্ণ সরাতে enabled=false সেট করুন।
settings.ui_lighting_key_intensity=প্রধান আলোর তীব্রতা
settings.ui_lighting_key_intensity.description=প্রধান আলোর তীব্রতা। পরিসর: 0.0 - 1.0।
settings.ui_lighting_key_x=প্রধান আলো X
settings.ui_lighting_key_x.description=বিশ্ব স্থানাঙ্কে প্রধান আলোর দিক। পরিসর: -1.0 - 1.0।
settings.ui_lighting_key_y=প্রধান আলো Y
settings.ui_lighting_key_y.description=বিশ্ব স্থানাঙ্কে প্রধান আলোর দিক। পরিসর: -1.0 - 1.0।
settings.ui_lighting_key_z=প্রধান আলো Z
settings.ui_lighting_key_z.description=বিশ্ব স্থানাঙ্কে প্রধান আলোর দিক। পরিসর: -1.0 - 1.0।
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=ফিল আলো সক্ষম
settings.ui_lighting_fill_enabled.description=প্রধান আলোর তৈরি ছায়ার দিকটি নরম করে। এই আলো সম্পূর্ণ সরাতে enabled=false সেট করুন।
settings.ui_lighting_fill_intensity=ফিল আলোর তীব্রতা
settings.ui_lighting_fill_intensity.description=বেশি তীব্রতা: ভালো রঙ-নিষ্ঠা, নরম শেডিং। কম তীব্রতা: ভিন্নমুখী তলগুলোর মধ্যে বেশি স্পষ্ট পার্থক্য। পরিসর: 0.0 - 1.0।
settings.ui_lighting_fill_x=ফিল আলো X
settings.ui_lighting_fill_x.description=বিশ্ব স্থানাঙ্কে ফিল আলোর দিক। পরিসর: -1.0 - 1.0।
settings.ui_lighting_fill_y=ফিল আলো Y
settings.ui_lighting_fill_y.description=বিশ্ব স্থানাঙ্কে ফিল আলোর দিক। পরিসর: -1.0 - 1.0।
settings.ui_lighting_fill_z=ফিল আলো Z
settings.ui_lighting_fill_z.description=বিশ্ব স্থানাঙ্কে ফিল আলোর দিক। পরিসর: -1.0 - 1.0।
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=রিম আলো সক্ষম
settings.ui_lighting_rim_enabled.description=কিছু তল আলাদা করতে সাহায্যকারী দুর্বল গৌণ আলো। এটি সাধারণত সূক্ষ্ম থাকা উচিত। এই আলো সম্পূর্ণ সরাতে enabled=false সেট করুন।
settings.ui_lighting_rim_intensity=রিম আলোর তীব্রতা
settings.ui_lighting_rim_intensity.description=কিছু তল আলাদা করতে সাহায্যকারী দুর্বল গৌণ আলো। এটি সাধারণত সূক্ষ্ম থাকা উচিত। পরিসর: 0.0 - 1.0।
settings.ui_lighting_rim_x=রিম আলো X
settings.ui_lighting_rim_x.description=বিশ্ব স্থানাঙ্কে রিম আলোর দিক। পরিসর: -1.0 - 1.0।
settings.ui_lighting_rim_y=রিম আলো Y
settings.ui_lighting_rim_y.description=বিশ্ব স্থানাঙ্কে রিম আলোর দিক। পরিসর: -1.0 - 1.0।
settings.ui_lighting_rim_z=রিম আলো Z
settings.ui_lighting_rim_z.description=বিশ্ব স্থানাঙ্কে রিম আলোর দিক। পরিসর: -1.0 - 1.0।
# ---------------- edges ----------------
settings.ui_edges_enabled=ফিচার প্রান্ত সক্ষম
settings.ui_edges_enabled.description=CSG বস্তুর প্রকৃত তীক্ষ্ণ প্রান্ত বরাবর গাঢ় জ্যামিতি আঁকুন। সমতলীয় বহুভুজ সীমা উপেক্ষা করা হয়। প্রান্তগুলো সম্পূর্ণ সরাতে enabled=false সেট করুন।
settings.ui_edges_angle_degrees=প্রান্ত কোণ (ডিগ্রি)
settings.ui_edges_angle_degrees.description=পাশাপাশি তলগুলোর মধ্যে সর্বনিম্ন কোণ, যার পরে তাদের সাধারণ প্রান্ত আঁকা হয়। বেশি মান কম ক্রিজ রেখা তৈরি করে। পরিসর: 0 - 360।
settings.ui_edges_width_mode=প্রান্ত প্রস্থ মোড
settings.ui_edges_width_mode.description=screen = রূপরেখাকে স্ক্রিন পিক্সেলে প্রায় ধ্রুবক রাখে। যেকোনো জুম স্তরে CAD-ধাঁচের হেয়ারলাইন চেহারার জন্য সেরা। world = দৃশ্য মিলিমিটারে নির্দিষ্ট ব্যাসার্ধ ব্যবহার করে।
settings.ui_edges_width_px=প্রান্ত প্রস্থ পিক্সেল
settings.ui_edges_width_px.description=widthMode=screen হলে দৃশ্যমান রেখার প্রস্থ। পরিসর: 0.1 - 10.0।
settings.ui_edges_radius=প্রান্ত ব্যাসার্ধ
settings.ui_edges_radius.description=দৃশ্য মিলিমিটারে বিশ্ব-স্থান প্রান্ত ব্যাসার্ধ। কেবল widthMode=world হলে ব্যবহৃত হয়। পরিসর: 0.001 - 100.0।
settings.ui_edges_brightness=প্রান্ত উজ্জ্বলতা
settings.ui_edges_brightness.description=0.0 = কালো, 1.0 = সাদা। পরিসর: 0.0 - 1.0।
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=ছোট গ্রিড দৃশ্যমানতা জুম গভীরতা
settings.ui_grid_small_visible_zoom_depth.description=1 mm গ্রিড কত দূর পর্যন্ত দৃশ্যমান থাকে তা নিয়ন্ত্রণ করে। বেশি মান = 1 mm গ্রিড আগে / আরও দূরে দেখা যায়। পরিসর: 1 - 10000।
settings.ui_grid_small_brightness_multiplier=ছোট গ্রিড উজ্জ্বলতা গুণক
settings.ui_grid_small_brightness_multiplier.description=থিমের হিউ সংরক্ষণ করে RGB উজ্জ্বলতা গুণ করে। 1.0 = মূল থিম রং। < 1.0 = গাঢ়। > 1.0 = উজ্জ্বলতর। পরিসর: 0.0 - 3.0।
settings.ui_grid_small_opacity_multiplier=ছোট গ্রিড অপাসিটি গুণক
settings.ui_grid_small_opacity_multiplier.description=বর্তমান থিমের দেওয়া আলফা গুণ করে। 1.0 = অপরিবর্তিত। পরিসর: 0.0 - 1.0।
settings.ui_grid_small_line_width_px=ছোট গ্রিড রেখার প্রস্থ (px)
settings.ui_grid_small_line_width_px.description=গ্রিডের লেগেসি টেক্সচার-পিক্সেল এককে গ্রিড রেখার পুরুত্ব। বর্তমান ঐতিহাসিক মান 1 mm-এর জন্য 2 এবং 10 mm-এর জন্য 4। পরিসর: 1 - 10।
settings.ui_grid_small_z_offset_mm=ছোট গ্রিড Z অফসেট (mm)
settings.ui_grid_small_z_offset_mm.description=গভীরতা ত্রুটি এড়াতে 1 mm গ্রিডকে 10 mm গ্রিডের ঠিক পিছনে রাখুন। পরিসর: -1.0 - 1.0।
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=বড় গ্রিড উজ্জ্বলতা গুণক
settings.ui_grid_major_brightness_multiplier.description=থিমের হিউ সংরক্ষণ করে RGB উজ্জ্বলতা গুণ করে। 1.0 = মূল থিম রং। < 1.0 = গাঢ়। > 1.0 = উজ্জ্বলতর। পরিসর: 0.0 - 3.0।
settings.ui_grid_major_opacity_multiplier=বড় গ্রিড অপাসিটি গুণক
settings.ui_grid_major_opacity_multiplier.description=বর্তমান থিমের দেওয়া আলফা গুণ করে। 1.0 = অপরিবর্তিত। পরিসর: 0.0 - 1.0।
settings.ui_grid_major_line_width_px=বড় গ্রিড রেখার প্রস্থ (px)
settings.ui_grid_major_line_width_px.description=গ্রিডের লেগেসি টেক্সচার-পিক্সেল এককে গ্রিড রেখার পুরুত্ব। বর্তমান ঐতিহাসিক মান 1 mm-এর জন্য 2 এবং 10 mm-এর জন্য 4। পরিসর: 1 - 10।
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=গ্রিড গতি মোড
settings.ui_grid_motion_mode.description=major = চলার সময় কেবল স্পষ্ট 10 mm গ্রিড দৃশ্যমান রাখুন এবং ঘন 1 mm গ্রিড সাময়িকভাবে লুকান। চলা থামলে 1 mm গ্রিড ফিরে আসে। all = চলার সময় দুটি স্পষ্ট রেখা গ্রিড দৃশ্যমান রাখুন। সেরা দৃশ্য ধারাবাহিকতা, তবে সম্ভবত বেশি খরচসাপেক্ষ। texture = মূল আচরণ: চলার সময় রেখা জ্যামিতির বদলে টেক্সচারযুক্ত গ্রিড কোয়াড রাখুন। দ্রুততর, তবে অ্যালিয়াসিং / মোয়ার প্যাটার্ন তৈরি করতে পারে। hidden = চলার সময় গ্রিড রেখা লুকান এবং ক্যামেরা থামলে সেগুলো পুনরুদ্ধার করুন।
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=মাটি রেন্ডার অপাসিটি
settings.ui_grid_ground_render_opacity.description=প্রধান মাটি ভরাটের অপাসিটি। ভরাট প্রতিটি জুম স্তরে নিজের জায়গায় থাকে; কেবল ঘন 1 mm গ্রিড জুমের উপর নির্ভর করে। ভরাট লুকিয়ে রেখে তার পিকিং তল সক্রিয় রাখতে 0 সেট করুন। কাস্টম ওয়ার্কপ্ল্যান এই সেটিং উপেক্ষা করে। পরিসর: 0.0 - 1.0।
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=ক্যামেরা অরবিট সর্বনিম্ন সংবেদনশীলতা
settings.ui_camera_orbit_min.description=JavaFX মাউস-স্থানাঙ্ক একক প্রতি ডিগ্রিতে ঘূর্ণন সংবেদনশীলতা। min খুব ধীর টান নিয়ন্ত্রণ করে। পরিসর: 0.0 - 1.0।
settings.ui_camera_orbit_max=ক্যামেরা অরবিট সর্বোচ্চ সংবেদনশীলতা
settings.ui_camera_orbit_max.description=JavaFX মাউস-স্থানাঙ্ক একক প্রতি ডিগ্রিতে ঘূর্ণন সংবেদনশীলতা। max দ্রুত টানের জন্য ঊর্ধ্বসীমা। পরিসর: 0.0 - 1.0।
settings.ui_camera_orbit_half=ক্যামেরা অরবিট অর্ধ গতি
settings.ui_camera_orbit_half.description=ফিল্টার করা কার্সর গতি (JavaFX স্থানাঙ্ক একক প্রতি সেকেন্ড) যেখানে সংবেদনশীলতা min ও max-এর মধ্যে অর্ধেক হয়। বেশি = কোমল ত্বরণ। পরিসর: 0 - 10000।
settings.ui_camera_orbit_rise_ms=ক্যামেরা অরবিট রাইজ সময় (ms)
settings.ui_camera_orbit_rise_ms.description=গতি বাড়ানোর সময় কার্সর-গতি অনুমানের জন্য সময় ধ্রুবক (মিলিসেকেন্ড)। বেশি riseMs ত্বরণকে কোমল করে। পরিসর: 0 - 10000।
settings.ui_camera_orbit_fall_ms=ক্যামেরা অরবিট ফল সময় (ms)
settings.ui_camera_orbit_fall_ms.description=গতি কমানোর সময় কার্সর-গতি অনুমানের জন্য সময় ধ্রুবক (মিলিসেকেন্ড)। কম fallMs সূক্ষ্ম নিয়ন্ত্রণ দ্রুত ফিরিয়ে আনে। এর কোনোটিই ক্যামেরা জড়তা যোগ করে না। পরিসর: 0 - 10000।
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=প্রান্ত দৃশ্য স্থিরতা বিলম্ব (ms)
settings.ui_edges_scene_settle_delay_ms.description=জ্যামিতি/প্রদর্শন পরিবর্তনের পরে বিলম্ব। বেশি মান দ্রুত ইতিহাস রিপ্লের সময় বেশি কাজ দমন করে। পরিসর: 0 - 10000।
settings.ui_edges_camera_settle_delay_ms=প্রান্ত ক্যামেরা স্থিরতা বিলম্ব (ms)
settings.ui_edges_camera_settle_delay_ms.description=ক্যামেরা নড়াচড়ার পরে বিলম্ব, যার পরে স্ক্রিন-স্থান হেয়ারলাইন পুরুত্ব আবার তৈরি হয়। পরিসর: 0 - 10000।
settings.ui_edges_topology_precision=প্রান্ত টোপোলজি নির্ভুলতা
settings.ui_edges_topology_precision.description=ফিচার-প্রান্ত টোপোলজি সাধারণ করতে ব্যবহৃত কোয়ান্টাইজেশন ধাপ। মডেল জ্যামিতি ও তল নর্মাল অপরিবর্তিত থাকে। পরিসর: 0.0 - 1.0।
settings.ui_edges_stitch_tolerance=প্রান্ত সেলাই সহনশীলতা (mm)
settings.ui_edges_stitch_tolerance.description=দৃশ্য মিলিমিটারে সীমা সেলাই সহনশীলতা। কেবল ইনডেক্সড-মেশ সংলগ্নতার পরে আপাত এক-তল প্রান্তের জন্য ব্যবহৃত হয়। এটি ভিন্নভাবে উপবিভক্ত কিন্তু জ্যামিতিকভাবে সমাপতিত সীমাগুলোকে আবার যুক্ত হতে দেয়, তার আগে যে সেগুলো আসল ফিচার প্রান্ত কি না তা নির্ধারিত হয়। পরিসর: 0.0 - 1.0।
