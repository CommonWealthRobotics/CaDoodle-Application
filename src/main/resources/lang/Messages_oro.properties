# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Qabiyyeewwan Fuula Fayyadamaa
settings.ui_section_lighting=Ibsaa
settings.ui_section_edges=Qarqara Amalootaa
settings.ui_section_grid=Giridii Dirree Hojii
settings.ui_section_camera=Naanna'a Kaameraa
settings.ui_section_timing=Yeroo Qarqara Amalootaa
settings.ui_description=Ibsi kun scene-style.properties irraa fudhatame. Gatii isaa ConfigurationDatabase keessaatti olkaa'ama.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Haala Ibsaa
settings.ui_lighting_mode.description=Haala ibsaa tokko qofa qabi. 'stable' = Ibsawwan qajeelfamaa iddoo addunyaa keessatti dhaabbatan. Ibsaan kaameraa waliin hin naanna'u. Sirna halluu amanamaa fi ji'oomitirii CAD dubbifamaa ta'eef qophaa'e. 'kevin' = Ibsaa BowlerStudio jalqabaa. Ibsawwan tuqaa sadii fayyadama; tokko kaameraa hordofa. Qindaa'inni ibsaa dhaabbataa gadii haala kana keessatti tuffatama.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ibsaa Naannoo
settings.ui_lighting_ambient.description=Ibsaan naannoo fuula mul'atu hunda walqixa dhiibbaa irratti qaba. Ol'aanaa: gaaddidduu ifa, halluuwwan halluu bu'uuraa isaaniitti dhihoo hafan, garuu fuulli diriiraa fakkaatu. Gadi aanaa: gaaddisa cimaa fi adda ba'iinsa fuulaa, garuu halluuwwan gaaddisa keessa jiran dukkanaa'u.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Ibsaa Guddaa Banameera
settings.ui_lighting_key_enabled.description=Ibsaa guddaa bocaa wantichaa ibsuuf oolu. Ibsaa kana guutummaatti haquuf enabled=false kaa'i.
settings.ui_lighting_key_intensity=Cimina Ibsaa Guddaa
settings.ui_lighting_key_intensity.description=Cimina ibsaa guddaa. Daangaa: 0.0 - 1.0.
settings.ui_lighting_key_x=Ibsaa Guddaa X
settings.ui_lighting_key_x.description=Qajeelfama ibsaa guddaa qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
settings.ui_lighting_key_y=Ibsaa Guddaa Y
settings.ui_lighting_key_y.description=Qajeelfama ibsaa guddaa qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
settings.ui_lighting_key_z=Ibsaa Guddaa Z
settings.ui_lighting_key_z.description=Qajeelfama ibsaa guddaa qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Ibsaa Guutuu Banameera
settings.ui_lighting_fill_enabled.description=Kutaa gaaddisa ibsaa guddaan uume jajjabeessa. Ibsaa kana guutummaatti haquuf enabled=false kaa'i.
settings.ui_lighting_fill_intensity=Cimina Ibsaa Guutuu
settings.ui_lighting_fill_intensity.description=Cimina ol'aanaa: amanamummaa halluu caalaa, gaaddisa laafaa. Cimina gadi aanaa: garaagarummaa cimaa fuulota qajeelfama adda addaa qaban gidduutti. Daangaa: 0.0 - 1.0.
settings.ui_lighting_fill_x=Ibsaa Guutuu X
settings.ui_lighting_fill_x.description=Qajeelfama ibsaa guutuu qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
settings.ui_lighting_fill_y=Ibsaa Guutuu Y
settings.ui_lighting_fill_y.description=Qajeelfama ibsaa guutuu qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
settings.ui_lighting_fill_z=Ibsaa Guutuu Z
settings.ui_lighting_fill_z.description=Qajeelfama ibsaa guutuu qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Ibsaa Qarqaraa Banameera
settings.ui_lighting_rim_enabled.description=Ibsaa lammaffaa laafaa fuulota tokko tokko adda baasuuf gargaaru. Yeroo baay'ee laafaa ta'ee hafuu qaba. Ibsaa kana guutummaatti haquuf enabled=false kaa'i.
settings.ui_lighting_rim_intensity=Cimina Ibsaa Qarqaraa
settings.ui_lighting_rim_intensity.description=Ibsaa lammaffaa laafaa fuulota tokko tokko adda baasuuf gargaaru. Yeroo baay'ee laafaa ta'ee hafuu qaba. Daangaa: 0.0 - 1.0.
settings.ui_lighting_rim_x=Ibsaa Qarqaraa X
settings.ui_lighting_rim_x.description=Qajeelfama ibsaa qarqaraa qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
settings.ui_lighting_rim_y=Ibsaa Qarqaraa Y
settings.ui_lighting_rim_y.description=Qajeelfama ibsaa qarqaraa qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
settings.ui_lighting_rim_z=Ibsaa Qarqaraa Z
settings.ui_lighting_rim_z.description=Qajeelfama ibsaa qarqaraa qindeessituu addunyaa keessatti. Daangaa: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Qarqarri Amalootaa Banameera
settings.ui_edges_enabled.description=Ji'oomitirii dukkanaa qarqara qara kaka'aa wantoota CSG irratti maxxansi. Daangawwan pooliigoonii fuula tokko irra jiran tuffatamu. Qarqarawwan guutummaatti haquuf enabled=false kaa'i.
settings.ui_edges_angle_degrees=Kofa Qarqaraa Digirii
settings.ui_edges_angle_degrees.description=Kofa xiqqaa fuulota ollaa gidduutti qarqarri isaanii waliinii maxxanamuu isaa dura. Gatiin ol'aanaa sarara madaa xiqqaa uuma. Daangaa: 0 - 360.
settings.ui_edges_width_mode=Haala Bal'ina Qarqaraa
settings.ui_edges_width_mode.description=screen = Bocni qarqaraa pikselii fuulaa keessatti tilmaamaan dhaabbataa ta'ee tura. Mul'ata sarara haphii akka CAD sadarkaa argannaa kamiyyuu irratti milkaa'aa. world = Raadiyeesii dhaabbataa miliimetirii iddoo keessatti fayyadama.
settings.ui_edges_width_px=Bal'ina Qarqaraa Pikselii
settings.ui_edges_width_px.description=Bal'ina sararaa mul'atu yeroo widthMode=screen. Daangaa: 0.1 - 10.0.
settings.ui_edges_radius=Raadiyeesii Qarqaraa
settings.ui_edges_radius.description=Raadiyeesii qarqaraa iddoo addunyaa keessatti miliimetirii iddootti. Yeroo widthMode=world qofa fayyadama. Daangaa: 0.001 - 100.0.
settings.ui_edges_brightness=Ifa Qarqaraa
settings.ui_edges_brightness.description=0.0 = gurraacha, 1.0 = adii. Daangaa: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Gadii Argannaa Giridii Xiqqaa Mul'atu
settings.ui_grid_small_visible_zoom_depth.description=Giridii 1 mm hangam fagaatii mul'achuu akka itti fufe ni to'ata. Gatii ol'aanaa = giridii 1 mm dursee / fagaachaa mul'ata. Daangaa: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Baay'isaa Ifa Giridii Xiqqaa
settings.ui_grid_small_brightness_multiplier.description=Ifa RGB halluu mata duree eeggatee baay'isa. 1.0 = halluu mata duree jalqabaa. < 1.0 = dukkanaa'aa. > 1.0 = ifa. Daangaa: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Baay'isaa Mul'achuu Giridii Xiqqaa
settings.ui_grid_small_opacity_multiplier.description=Mul'achuu mata dureen ammaa kennu baay'isa. 1.0 = hin jijjiiramne. Daangaa: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Bal'ina Sarara Giridii Xiqqaa (px)
settings.ui_grid_small_line_width_px.description=Guddina sarara giridii safartuu pikselii suuraa giridii durii keessatti. Gatiin seenaa ammaa 1 mm fiif 2, 10 mm fiif 4 dha. Daangaa: 1 - 10.
settings.ui_grid_small_z_offset_mm=Fageenya Z Giridii Xiqqaa (mm)
settings.ui_grid_small_z_offset_mm.description=Dogoggora gadi fageenyaa hambisuu fiif giridii 1 mm giridii 10 mm duuba qabi. Daangaa: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Baay'isaa Ifa Giridii Guddaa
settings.ui_grid_major_brightness_multiplier.description=Ifa RGB halluu mata duree eeggatee baay'isa. 1.0 = halluu mata duree jalqabaa. < 1.0 = dukkanaa'aa. > 1.0 = ifa. Daangaa: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Baay'isaa Mul'achuu Giridii Guddaa
settings.ui_grid_major_opacity_multiplier.description=Mul'achuu mata dureen ammaa kennu baay'isa. 1.0 = hin jijjiiramne. Daangaa: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Bal'ina Sarara Giridii Guddaa (px)
settings.ui_grid_major_line_width_px.description=Guddina sarara giridii safartuu pikselii suuraa giridii durii keessatti. Gatiin seenaa ammaa 1 mm fiif 2, 10 mm fiif 4 dha. Daangaa: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Haala Sochii Giridii
settings.ui_grid_motion_mode.description=major = Yeroo socho'u giridii 10 mm qulqulluu qofa mul'isiitii giridii 1 mm cimaan yeroof dhoksi. Sochiin yeroo dhaabbatu booda giridii 1 mm deebi'a. all = Yeroo socho'u giridiiwwan sararaa qulqulluu lamaanuu mul'isi. Itti fufiinsa mul'ataa irra caalaa, garuu baay'ee baasii qabaachuu danda'a. texture = Amala jalqabaa: yeroo socho'u ji'oomitirii sararaa boca afurii giridii suuraa qabuun jijjiiri. Saffisaa, waliin makkarra pikselii / akkaataa dhiibbaa suuraa fiduu danda'a. hidden = Yeroo socho'u sararawwan giridii dhoksiitii kaameraan yeroo dhaabbatu deebisi.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Mul'achuu Guutuu Lafaa
settings.ui_grid_ground_render_opacity.description=Mul'achuu guutuu lafaa guddaa. Guutuun sadarkaa argannaa kamiyyuu irratti iddoo isaa irra tura; giridii 1 mm cimaan qofa argannaan to'atama. Guutuu dhoksuuf garuu fuula filannoo isaa sochii keessa hambisuuf 0 kaa'i. Dirreewwan hojii adda ta'an qindaa'ina kana tuffatu. Daangaa: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Miira Xiqqaa Naanna'a Kaameraa
settings.ui_camera_orbit_min.description=Miira naanna'aa digirii safartuu qindeessituu maayisii JavaFX tokkoof. min harkisuu baay'ee suuta to'ata. Daangaa: 0.0 - 1.0.
settings.ui_camera_orbit_max=Miira Guddaa Naanna'a Kaameraa
settings.ui_camera_orbit_max.description=Miira naanna'aa digirii safartuu qindeessituu maayisii JavaFX tokkoof. max harkisuu saffisaaf daangaa ol'aanaa ti. Daangaa: 0.0 - 1.0.
settings.ui_camera_orbit_half=Walakkaa Saffisa Naanna'a Kaameraa
settings.ui_camera_orbit_half.description=Saffisa maayisii calalame safartuu qindeessituu JavaFX sekondiitti kan miiraan min fi max gidduu walakkaa ta'u. Ol'aanaa = saffisa suuta dabaluu. Daangaa: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Yeroo Olkaa'uu Naanna'a Kaameraa (ms)
settings.ui_camera_orbit_rise_ms.description=Safartuu yeroo (millisekondii) tilmaama saffisa maayisii yeroo saffisni dabalu. riseMs guddaan saffisa jajjabeessa. Daangaa: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Yeroo Bu'uu Naanna'a Kaameraa (ms)
settings.ui_camera_orbit_fall_ms.description=Safartuu yeroo (millisekondii) tilmaama saffisa maayisii yeroo saffisni hir'atu. fallMs xiqqaan to'annoo gaarii dafee deebisa. Lamaanuu inertiyaa kaameraa hin dabalan. Daangaa: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Turtii Tasgabbii Iddoo Qarqaraa (ms)
settings.ui_edges_scene_settle_delay_ms.description=Jijjiirama ji'oomitirii/agarsiisaa booda turtii. Gatiin ol'aanaa yeroo seenaa saffisaan irra deebi'ee taphachuu hojii dabalataa dhiibba. Daangaa: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Turtii Tasgabbii Kaameraa Qarqaraa (ms)
settings.ui_edges_camera_settle_delay_ms.description=Sochii kaameraa booda turtii guddina sarara haphii iddoo fuulaa irra deebi'ee ijaaruu dura. Daangaa: 0 - 10000.
settings.ui_edges_topology_precision=Sirrii Caasaa Qarqaraa
settings.ui_edges_topology_precision.description=Sadarkaa safartuu caasaa qarqara amalootaa walqixxeessuuf olu. Ji'oomitirii moodeelaa fi qajeelfamni fuulaa akkuma jiranitti hafu. Daangaa: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Danda'ama Hodhaa Qarqaraa (mm)
settings.ui_edges_stitch_tolerance.description=Danda'ama hodhaa daangaa miliimetirii iddoo keessatti. Qarqarawwan fuula tokko fakkaatan kanneen walitti dhufeenya caasaa fuulaa tarreeffame booda uumaman qofaaf oola. Daangawwan adda addaatti hir'atan garuu ji'oomitiriidhaan wal siman, qarqara amalaa dhugaa ta'uu isaanii murteessuu dura akka walitti deebi'an hayyama. Daangaa: 0.0 - 1.0.
