# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=روشنيءَ جو موڊ
settings.ui_lighting_mode.description=بلڪل هڪ روشنيءَ جو موڊ رکو. 'stable' = عالمي فضا ۾ مقرر هدايت واريون روشنيون. روشني ڪئميرا سان گهمي نه ٿي. بهتر رنگ جي وفاداري ۽ پڙهڻ لائق CAD جيوميٽري لاءِ ٺهيل. 'kevin' = اصل BowlerStudio روشني. ٽي نقطي روشنيون استعمال ڪري ٿو؛ هڪ ڪئميرا جي پٺيان هلندي آهي. هن موڊ ۾ هيٺيون مقرر روشنيءَ جون سيٽنگون نظرانداز ٿين ٿيون.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=چوڌاري روشني
settings.ui_lighting_ambient.description=چوڌاري روشني هر نظر ايندڙ مٿاڇري تي هڪجهڙو اثر وجهي ٿي. وڌيڪ: روشن پاڇا، رنگ پنهنجي بنيادي رنگ جي ويجهو رهن ٿا، پر مٿاڇريون چپٽيون لڳن ٿيون. گهٽ: مضبوط شيڊنگ ۽ مٿاڇرن جي بهتر عليحدگي، پر پاڇي وارا رنگ اونداهڙا ٿي وڃن ٿا.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=مکيه روشني فعال
settings.ui_lighting_key_enabled.description=مکيه روشني جا شيءِ جي شڪل بيان ڪرڻ لاءِ استعمال ٿئي ٿي. هن روشنيءَ کي مڪمل طور هٽائڻ لاءِ enabled=false مقرر ڪريو.
settings.ui_lighting_key_intensity=مکيه روشنيءَ جي شدت
settings.ui_lighting_key_intensity.description=مکيه روشنيءَ جي شدت. حد: 0.0 - 1.0.
settings.ui_lighting_key_x=مکيه روشني X
settings.ui_lighting_key_x.description=عالمي نقاط ۾ مکيه روشنيءَ جي هدايت. حد: -1.0 - 1.0.
settings.ui_lighting_key_y=مکيه روشني Y
settings.ui_lighting_key_y.description=عالمي نقاط ۾ مکيه روشنيءَ جي هدايت. حد: -1.0 - 1.0.
settings.ui_lighting_key_z=مکيه روشني Z
settings.ui_lighting_key_z.description=عالمي نقاط ۾ مکيه روشنيءَ جي هدايت. حد: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=ڀرڻ واري روشني فعال
settings.ui_lighting_fill_enabled.description=مکيه روشنيءَ سان ٺهندڙ پاڇي واري پاسي کي نرم ڪري ٿي. هن روشنيءَ کي مڪمل طور هٽائڻ لاءِ enabled=false مقرر ڪريو.
settings.ui_lighting_fill_intensity=ڀرڻ واري روشنيءَ جي شدت
settings.ui_lighting_fill_intensity.description=وڌيڪ شدت: بهتر رنگ وفاداري، نرم شيڊنگ. گهٽ شدت: مختلف طرفن وارن چهنڊن وچ ۾ مضبوط فرق. حد: 0.0 - 1.0.
settings.ui_lighting_fill_x=ڀرڻ واري روشني X
settings.ui_lighting_fill_x.description=عالمي نقاط ۾ ڀرڻ واري روشنيءَ جي هدايت. حد: -1.0 - 1.0.
settings.ui_lighting_fill_y=ڀرڻ واري روشني Y
settings.ui_lighting_fill_y.description=عالمي نقاط ۾ ڀرڻ واري روشنيءَ جي هدايت. حد: -1.0 - 1.0.
settings.ui_lighting_fill_z=ڀرڻ واري روشني Z
settings.ui_lighting_fill_z.description=عالمي نقاط ۾ ڀرڻ واري روشنيءَ جي هدايت. حد: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=ڪناري جي روشني فعال
settings.ui_lighting_rim_enabled.description=ڪمزور ثانوي روشني جيڪا ڪجهه مٿاڇرن کي الڳ ڪرڻ ۾ مدد ڪري ٿي. هيءَ عام طور تي سنهي رهڻ گهرجي. هن روشنيءَ کي مڪمل طور هٽائڻ لاءِ enabled=false مقرر ڪريو.
settings.ui_lighting_rim_intensity=ڪناري جي روشنيءَ جي شدت
settings.ui_lighting_rim_intensity.description=ڪمزور ثانوي روشني جيڪا ڪجهه مٿاڇرن کي الڳ ڪرڻ ۾ مدد ڪري ٿي. هيءَ عام طور تي سنهي رهڻ گهرجي. حد: 0.0 - 1.0.
settings.ui_lighting_rim_x=ڪناري جي روشني X
settings.ui_lighting_rim_x.description=عالمي نقاط ۾ ڪناري جي روشنيءَ جي هدايت. حد: -1.0 - 1.0.
settings.ui_lighting_rim_y=ڪناري جي روشني Y
settings.ui_lighting_rim_y.description=عالمي نقاط ۾ ڪناري جي روشنيءَ جي هدايت. حد: -1.0 - 1.0.
settings.ui_lighting_rim_z=ڪناري جي روشني Z
settings.ui_lighting_rim_z.description=عالمي نقاط ۾ ڪناري جي روشنيءَ جي هدايت. حد: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=فيچر ڪنارا فعال
settings.ui_edges_enabled.description=CSG شين جي حقيقي تيز ڪنارن سان گڏ اونداهي جيوميٽري ڪڍو. همسطح گهڻ ڪنڊن جون حدون نظرانداز ٿين ٿيون. ڪنارن کي مڪمل طور هٽائڻ لاءِ enabled=false مقرر ڪريو.
settings.ui_edges_angle_degrees=ڪناري جو زاويو درجن ۾
settings.ui_edges_angle_degrees.description=پاڙيسري چهنڊن وچ ۾ گهٽ ۾ گهٽ زاويو ان کان اڳ جو سندن گڏيل ڪنارو ڪڍيو وڃي. وڌيڪ قدر گهٽ تهه لڪيرون پيدا ڪن ٿا. حد: 0 - 360.
settings.ui_edges_width_mode=ڪناري جي ويڪر جو موڊ
settings.ui_edges_width_mode.description=screen = خاڪي کي اسڪرين پڪسلن ۾ لڳ ڀڳ مستقل رکي ٿو. ڪنهن به زوم سطح تي CAD طرز جي سنهي لڪير لاءِ بهترين. world = منظر جي ملي ميٽرن ۾ مقرر ريڊيس استعمال ڪري ٿو.
settings.ui_edges_width_px=ڪناري جي ويڪر پڪسلن ۾
settings.ui_edges_width_px.description=نظر ايندڙ لڪير جي ويڪر جڏهن widthMode=screen هجي. حد: 0.1 - 10.0.
settings.ui_edges_radius=ڪناري جو ريڊيس
settings.ui_edges_radius.description=عالمي فضا ۾ ڪناري جو ريڊيس منظر جي ملي ميٽرن ۾. رڳو ان وقت استعمال ٿئي ٿو جڏهن widthMode=world هجي. حد: 0.001 - 100.0.
settings.ui_edges_brightness=ڪناري جي چمڪ
settings.ui_edges_brightness.description=0.0 = ڪارو، 1.0 = اڇو. حد: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=ننڍي گرڊ جي نظر اچڻ جي زوم کوٽائي
settings.ui_grid_small_visible_zoom_depth.description=اهو ڪنٽرول ڪري ٿو ته 1 mm گرڊ ڪيتري پري تائين نظر اچي. وڌيڪ قدر = 1 mm گرڊ جلدي / وڌيڪ پري کان ظاهر ٿئي ٿي. حد: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=ننڍي گرڊ جي چمڪ جو ضرب
settings.ui_grid_small_brightness_multiplier.description=RGB چمڪ کي ضرب ڏئي ٿو ۽ ٿيم جو رنگ برقرار رکي ٿو. 1.0 = اصل ٿيم رنگ. < 1.0 = اونداهو. > 1.0 = روشن. حد: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=ننڍي گرڊ جي غير شفافيت جو ضرب
settings.ui_grid_small_opacity_multiplier.description=موجوده ٿيم طرفان ڏنل الفا کي ضرب ڏئي ٿو. 1.0 = بنا تبديلي. حد: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=ننڍي گرڊ جي لڪير جي ويڪر (px)
settings.ui_grid_small_line_width_px.description=گرڊ لڪير جي ٿولهه گرڊ جي پراڻن ٽيڪسچر پڪسل ايڪين ۾. موجوده تاريخي قدر 1 mm لاءِ 2 ۽ 10 mm لاءِ 4 آهن. حد: 1 - 10.
settings.ui_grid_small_z_offset_mm=ننڍي گرڊ جو Z آفسيٽ (mm)
settings.ui_grid_small_z_offset_mm.description=1 mm گرڊ کي 10 mm گرڊ جي بلڪل پويان رکو ته جيئن کوٽائيءَ جي خرابين کان بچجي. حد: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=وڏي گرڊ جي چمڪ جو ضرب
settings.ui_grid_major_brightness_multiplier.description=RGB چمڪ کي ضرب ڏئي ٿو ۽ ٿيم جو رنگ برقرار رکي ٿو. 1.0 = اصل ٿيم رنگ. < 1.0 = اونداهو. > 1.0 = روشن. حد: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=وڏي گرڊ جي غير شفافيت جو ضرب
settings.ui_grid_major_opacity_multiplier.description=موجوده ٿيم طرفان ڏنل الفا کي ضرب ڏئي ٿو. 1.0 = بنا تبديلي. حد: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=وڏي گرڊ جي لڪير جي ويڪر (px)
settings.ui_grid_major_line_width_px.description=گرڊ لڪير جي ٿولهه گرڊ جي پراڻن ٽيڪسچر پڪسل ايڪين ۾. موجوده تاريخي قدر 1 mm لاءِ 2 ۽ 10 mm لاءِ 4 آهن. حد: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=گرڊ حرڪت جو موڊ
settings.ui_grid_motion_mode.description=major = حرڪت دوران رڳو صاف 10 mm گرڊ نظر ايندو رکو ۽ گهاٽي 1 mm گرڊ عارضي طور لڪايو. حرڪت بند ٿيڻ بعد 1 mm گرڊ واپس اچي ٿي. all = حرڪت دوران ٻئي صاف لڪير وارا گرڊ نظر ايندا رکو. بهترين بصري تسلسل، پر ممڪن طور وڌيڪ مهانگو. texture = اصل رويو: حرڪت دوران لڪير جيوميٽري کي ٽيڪسچر وارن گرڊ چورسڪن سان بدلايو. تيز، پر ممڪن طور الياسنگ / لهرن وارا نمونا پيدا ڪري سگهي ٿو. hidden = حرڪت دوران گرڊ لڪيرون لڪايو ۽ ڪئميرا بند ٿيڻ تي بحال ڪريو.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=زمين جي رينڊر غير شفافيت
settings.ui_grid_ground_render_opacity.description=مکيه زميني ڀرائيءَ جي غير شفافيت. ڀرائي هر زوم سطح تي پنهنجي جاءِ تي رهي ٿي؛ رڳو گهاٽي 1 mm گرڊ زوم سان مشروط آهي. ڀرائي لڪائڻ ۽ ان جي پڪ ڪرڻ واري مٿاڇري کي فعال رکڻ لاءِ ان کي 0 تي رکو. حسب ضرورت ورڪپلين هن سيٽنگ کي نظرانداز ڪن ٿا. حد: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=ڪئميرا چڪر جي گهٽ ۾ گهٽ حساسيت
settings.ui_camera_orbit_min.description=چڪر جي حساسيت درجا في JavaFX مائوس نقاطي ايڪو. min تمام سست ڊرگ کي ڪنٽرول ڪري ٿو. حد: 0.0 - 1.0.
settings.ui_camera_orbit_max=ڪئميرا چڪر جي وڌ ۾ وڌ حساسيت
settings.ui_camera_orbit_max.description=چڪر جي حساسيت درجا في JavaFX مائوس نقاطي ايڪو. max تيز ڊرگ لاءِ مٿئين حد آهي. حد: 0.0 - 1.0.
settings.ui_camera_orbit_half=ڪئميرا چڪر جي اڌ رفتار
settings.ui_camera_orbit_half.description=فلٽر ٿيل ڪرسر رفتار JavaFX نقاطي ايڪن ۾ في سيڪنڊ جنهن تي حساسيت min ۽ max جي وچ ۾ اڌ رستي تي هجي. وڌيڪ = نرم اسراع. حد: 0 - 10000.
settings.ui_camera_orbit_rise_ms=ڪئميرا چڪر جي چڙهڻ جو وقت (ms)
settings.ui_camera_orbit_rise_ms.description=ڪرسر رفتار جي اندازي لاءِ وقت جا مستقل (ملي سيڪنڊ) جڏهن رفتار وڌي رهي هجي. وڌيڪ riseMs اسراع کي نرم ڪري ٿو. حد: 0 - 10000.
settings.ui_camera_orbit_fall_ms=ڪئميرا چڪر جي لهڻ جو وقت (ms)
settings.ui_camera_orbit_fall_ms.description=ڪرسر رفتار جي اندازي لاءِ وقت جا مستقل (ملي سيڪنڊ) جڏهن رفتار گهٽجي رهي هجي. گهٽ fallMs عمدو ڪنٽرول جلدي بحال ڪري ٿو. ڪوبه ڪئميرا ۾ جمود نه وڌائي ٿو. حد: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=ڪنارن جي منظر جي استحڪام جي دير (ms)
settings.ui_edges_scene_settle_delay_ms.description=جيوميٽري/ڊسپلي تبديلين کان پوءِ دير. وڌيڪ قدر تيز تاريخ ري پلي دوران وڌيڪ ڪم دٻائي ٿو. حد: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=ڪنارن جي ڪئميرا استحڪام جي دير (ms)
settings.ui_edges_camera_settle_delay_ms.description=ڪئميرا حرڪت کان پوءِ دير ان کان اڳ جو اسڪرين فضا ۾ سنهي لڪير جي ٿولهه ٻيهر ٺهي. حد: 0 - 10000.
settings.ui_edges_topology_precision=ڪنارن جي ٽوپولوجي جي درستگي
settings.ui_edges_topology_precision.description=ڪوانٽائيزيشن جو قدم جيڪو فيچر ڪنارن جي ٽوپولوجي کي معمول تي آڻڻ لاءِ استعمال ٿئي ٿو. ماڊل جيوميٽري ۽ چهنڊن جا نارمل تبديل نه ٿا ٿين. حد: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=ڪنارن کي ڳنڍڻ جي برداشت (mm)
settings.ui_edges_stitch_tolerance.description=حدن کي ڳنڍڻ جي برداشت منظر جي ملي ميٽرن ۾. رڳو انهن ڪنارن لاءِ استعمال ٿئي ٿي جيڪي انڊيڪس ٿيل ميش ملحقيت کان پوءِ هڪ چهري وارا لڳن ٿا. اها مختلف طريقي سان ورهايل پر جاميٽري طور همڪان حدن کي ان فيصلي کان اڳ ٻيهر ڳنڍڻ ڏئي ٿي ته اهي حقيقي فيچر ڪنارا آهن يا نه. حد: 0.0 - 1.0.
