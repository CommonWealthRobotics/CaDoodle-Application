# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elementos de la interfaz
settings.ui_section_lighting=Iluminación
settings.ui_section_edges=Aristas características
settings.ui_section_grid=Cuadrícula del plano de trabajo
settings.ui_section_camera=Órbita de la cámara
settings.ui_section_timing=Temporización de las aristas características
settings.ui_description=Descripción tomada de scene-style.properties. El valor se guarda en ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Modo de iluminación
settings.ui_lighting_mode.description=Mantén exactamente un modo de iluminación. 'stable' = Luces direccionales fijas en el espacio del mundo. La iluminación no gira con la cámara. Diseñado para una buena fidelidad de color y una geometría CAD legible. 'kevin' = Iluminación original de BowlerStudio. Usa tres luces puntuales; una sigue a la cámara. Los ajustes de luces estables de abajo se ignoran en este modo.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Luz ambiental
settings.ui_lighting_ambient.description=La luz ambiental afecta por igual a todas las superficies visibles. Más alta: sombras más claras, los colores se mantienen más cerca de su color base, pero las superficies se ven más planas. Más baja: sombreado y separación de superficies más fuertes, pero los colores en sombra se oscurecen.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Luz principal activada
settings.ui_lighting_key_enabled.description=Luz principal que describe la forma del objeto. Pon enabled=false para eliminar por completo esta luz.
settings.ui_lighting_key_intensity=Intensidad de la luz principal
settings.ui_lighting_key_intensity.description=Intensidad de la luz principal. Rango: 0.0 - 1.0.
settings.ui_lighting_key_x=Luz principal X
settings.ui_lighting_key_x.description=Dirección de la luz principal en coordenadas del mundo. Rango: -1.0 - 1.0.
settings.ui_lighting_key_y=Luz principal Y
settings.ui_lighting_key_y.description=Dirección de la luz principal en coordenadas del mundo. Rango: -1.0 - 1.0.
settings.ui_lighting_key_z=Luz principal Z
settings.ui_lighting_key_z.description=Dirección de la luz principal en coordenadas del mundo. Rango: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Luz de relleno activada
settings.ui_lighting_fill_enabled.description=Suaviza el lado en sombra creado por la luz principal. Pon enabled=false para eliminar por completo esta luz.
settings.ui_lighting_fill_intensity=Intensidad de la luz de relleno
settings.ui_lighting_fill_intensity.description=Mayor intensidad: mejor fidelidad de color, sombreado más suave. Menor intensidad: mayor diferencia entre caras con orientaciones distintas. Rango: 0.0 - 1.0.
settings.ui_lighting_fill_x=Luz de relleno X
settings.ui_lighting_fill_x.description=Dirección de la luz de relleno en coordenadas del mundo. Rango: -1.0 - 1.0.
settings.ui_lighting_fill_y=Luz de relleno Y
settings.ui_lighting_fill_y.description=Dirección de la luz de relleno en coordenadas del mundo. Rango: -1.0 - 1.0.
settings.ui_lighting_fill_z=Luz de relleno Z
settings.ui_lighting_fill_z.description=Dirección de la luz de relleno en coordenadas del mundo. Rango: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Luz de contorno activada
settings.ui_lighting_rim_enabled.description=Luz secundaria débil que ayuda a separar algunas superficies. Normalmente debería mantenerse sutil. Pon enabled=false para eliminar por completo esta luz.
settings.ui_lighting_rim_intensity=Intensidad de la luz de contorno
settings.ui_lighting_rim_intensity.description=Luz secundaria débil que ayuda a separar algunas superficies. Normalmente debería mantenerse sutil. Rango: 0.0 - 1.0.
settings.ui_lighting_rim_x=Luz de contorno X
settings.ui_lighting_rim_x.description=Dirección de la luz de contorno en coordenadas del mundo. Rango: -1.0 - 1.0.
settings.ui_lighting_rim_y=Luz de contorno Y
settings.ui_lighting_rim_y.description=Dirección de la luz de contorno en coordenadas del mundo. Rango: -1.0 - 1.0.
settings.ui_lighting_rim_z=Luz de contorno Z
settings.ui_lighting_rim_z.description=Dirección de la luz de contorno en coordenadas del mundo. Rango: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Aristas características activadas
settings.ui_edges_enabled.description=Dibuja geometría oscura a lo largo de las aristas realmente afiladas de los objetos CSG. Se ignoran los límites de polígonos coplanares. Pon enabled=false para eliminar por completo las aristas.
settings.ui_edges_angle_degrees=Ángulo de arista (grados)
settings.ui_edges_angle_degrees.description=Ángulo mínimo entre caras vecinas antes de dibujar su arista compartida. Valores más altos producen menos líneas de pliegue. Rango: 0 - 360.
settings.ui_edges_width_mode=Modo de ancho de arista
settings.ui_edges_width_mode.description=screen = Mantiene el contorno aproximadamente constante en píxeles de pantalla. Ideal para un aspecto de línea fina estilo CAD a cualquier nivel de zoom. world = Usa un radio fijo en milímetros de la escena.
settings.ui_edges_width_px=Ancho de arista (píxeles)
settings.ui_edges_width_px.description=Ancho de línea visible cuando widthMode=screen. Rango: 0.1 - 10.0.
settings.ui_edges_radius=Radio de arista
settings.ui_edges_radius.description=Radio de arista en el espacio del mundo, en milímetros de la escena. Se usa solo cuando widthMode=world. Rango: 0.001 - 100.0.
settings.ui_edges_brightness=Brillo de arista
settings.ui_edges_brightness.description=0.0 = negro, 1.0 = blanco. Rango: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Profundidad de zoom visible de la cuadrícula pequeña
settings.ui_grid_small_visible_zoom_depth.description=Controla a qué distancia sigue visible la cuadrícula de 1 mm. Valor más alto = la cuadrícula de 1 mm aparece antes / más lejos. Rango: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Multiplicador de brillo de la cuadrícula pequeña
settings.ui_grid_small_brightness_multiplier.description=Multiplica el brillo RGB conservando el tono del tema. 1.0 = color original del tema. < 1.0 = más oscuro. > 1.0 = más claro. Rango: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Multiplicador de opacidad de la cuadrícula pequeña
settings.ui_grid_small_opacity_multiplier.description=Multiplica el alfa proporcionado por el tema actual. 1.0 = sin cambios. Rango: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Ancho de línea de la cuadrícula pequeña (px)
settings.ui_grid_small_line_width_px.description=Grosor de las líneas en las antiguas unidades de píxel de textura de la cuadrícula. Los valores históricos actuales son 2 para 1 mm y 4 para 10 mm. Rango: 1 - 10.
settings.ui_grid_small_z_offset_mm=Desplazamiento Z de la cuadrícula pequeña (mm)
settings.ui_grid_small_z_offset_mm.description=Mantén la cuadrícula de 1 mm justo detrás de la de 10 mm para evitar artefactos de profundidad. Rango: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Multiplicador de brillo de la cuadrícula principal
settings.ui_grid_major_brightness_multiplier.description=Multiplica el brillo RGB conservando el tono del tema. 1.0 = color original del tema. < 1.0 = más oscuro. > 1.0 = más claro. Rango: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Multiplicador de opacidad de la cuadrícula principal
settings.ui_grid_major_opacity_multiplier.description=Multiplica el alfa proporcionado por el tema actual. 1.0 = sin cambios. Rango: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Ancho de línea de la cuadrícula principal (px)
settings.ui_grid_major_line_width_px.description=Grosor de las líneas en las antiguas unidades de píxel de textura de la cuadrícula. Los valores históricos actuales son 2 para 1 mm y 4 para 10 mm. Rango: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Modo de movimiento de la cuadrícula
settings.ui_grid_motion_mode.description=major = Mantiene visible solo la cuadrícula nítida de 10 mm durante el movimiento y oculta temporalmente la densa de 1 mm. La cuadrícula de 1 mm vuelve al detenerse el movimiento. all = Mantiene visibles ambas cuadrículas de líneas nítidas durante el movimiento. Mejor continuidad visual, pero potencialmente más costoso. texture = Comportamiento original: cambia la geometría de líneas por cuadriláteros de cuadrícula texturizados durante el movimiento. Más rápido, pero puede producir aliasing / patrones de muaré. hidden = Oculta las líneas de la cuadrícula durante el movimiento y las restaura cuando la cámara se detiene.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacidad del suelo
settings.ui_grid_ground_render_opacity.description=Opacidad del relleno principal del suelo. El relleno permanece en su sitio en todos los niveles de zoom; solo la densa cuadrícula de 1 mm depende del zoom. Ponlo a 0 para ocultar el relleno manteniendo activa su superficie de selección. Los planos de trabajo personalizados ignoran este ajuste. Rango: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensibilidad mínima de la órbita de la cámara
settings.ui_camera_orbit_min.description=Sensibilidad de rotación en grados por unidad de coordenada del ratón de JavaFX. min controla los arrastres muy lentos. Rango: 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensibilidad máxima de la órbita de la cámara
settings.ui_camera_orbit_max.description=Sensibilidad de rotación en grados por unidad de coordenada del ratón de JavaFX. max es un límite superior para los arrastres rápidos. Rango: 0.0 - 1.0.
settings.ui_camera_orbit_half=Velocidad media de la órbita de la cámara
settings.ui_camera_orbit_half.description=Velocidad filtrada del cursor, en unidades de coordenada de JavaFX por segundo, a la que la sensibilidad está a mitad de camino entre min y max. Más alto = aceleración más suave. Rango: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Tiempo de subida de la órbita de la cámara (ms)
settings.ui_camera_orbit_rise_ms.description=Constantes de tiempo (milisegundos) de la estimación de la velocidad del cursor al acelerar. Un riseMs mayor suaviza la aceleración. Rango: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Tiempo de bajada de la órbita de la cámara (ms)
settings.ui_camera_orbit_fall_ms.description=Constantes de tiempo (milisegundos) de la estimación de la velocidad del cursor al frenar. Un fallMs menor recupera antes el control fino. Ninguno de los dos añade inercia a la cámara. Rango: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Retardo de estabilización de la escena de aristas (ms)
settings.ui_edges_scene_settle_delay_ms.description=Retardo tras cambios de geometría o visualización. Valores más altos suprimen más trabajo durante la reproducción rápida del historial. Rango: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Retardo de estabilización de la cámara de aristas (ms)
settings.ui_edges_camera_settle_delay_ms.description=Retardo tras el movimiento de la cámara antes de reconstruir el grosor de la línea fina en espacio de pantalla. Rango: 0 - 10000.
settings.ui_edges_topology_precision=Precisión de topología de aristas
settings.ui_edges_topology_precision.description=Paso de cuantización usado para normalizar la topología de las aristas características. La geometría del modelo y las normales de las caras no cambian. Rango: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerancia de unión de aristas (mm)
settings.ui_edges_stitch_tolerance.description=Tolerancia de unión de bordes en milímetros de la escena. Se usa solo para aristas aparentes de una sola cara tras la adyacencia de la malla indexada. Permite reconectar bordes subdivididos de forma distinta pero geométricamente coincidentes antes de decidir si son aristas características reales. Rango: 0.0 - 1.0.
