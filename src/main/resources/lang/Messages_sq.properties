# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elementet e ndërfaqes
settings.ui_section_lighting=Ndriçimi
settings.ui_section_edges=Buzët e veçorive
settings.ui_section_grid=Rrjeta e planit të punës
settings.ui_section_camera=Orbita e kamerës
settings.ui_section_timing=Kohëzimi i buzëve të veçorive
settings.ui_description=Përshkrimi merret nga scene-style.properties. Vlera ruhet në ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Mënyra e ndriçimit
settings.ui_lighting_mode.description=Mbaj saktësisht një mënyrë ndriçimi. 'stable' = Drita fikse drejtuese në hapësirën botërore. Ndriçimi nuk rrotullohet me kamerën. Projektuar për besnikëri të mirë të ngjyrave dhe gjeometri CAD të lexueshme. 'kevin' = Ndriçimi origjinal i BowlerStudio. Përdor tre drita pikësore; njëra ndjek kamerën. Cilësimet e dritave të qëndrueshme më poshtë injorohen në këtë mënyrë.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Dritë ambientale
settings.ui_lighting_ambient.description=Drita ambientale ndikon njësoj në çdo sipërfaqe të dukshme. Më e lartë: hije më të ndritshme, ngjyrat mbeten më afër ngjyrës bazë, por sipërfaqet duken më të rrafshëta. Më e ulët: hijezim dhe ndarje më e fortë e sipërfaqeve, por ngjyrat në hije bëhen më të errëta.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Drita kryesore e aktivizuar
settings.ui_lighting_key_enabled.description=Drita kryesore që përshkruan formën e objektit. Vendos enabled=false për ta hequr plotësisht këtë dritë.
settings.ui_lighting_key_intensity=Intensiteti i dritës kryesore
settings.ui_lighting_key_intensity.description=Intensiteti i dritës kryesore. Gama: 0.0 - 1.0.
settings.ui_lighting_key_x=Drita kryesore X
settings.ui_lighting_key_x.description=Drejtimi i dritës kryesore në koordinatat botërore. Gama: -1.0 - 1.0.
settings.ui_lighting_key_y=Drita kryesore Y
settings.ui_lighting_key_y.description=Drejtimi i dritës kryesore në koordinatat botërore. Gama: -1.0 - 1.0.
settings.ui_lighting_key_z=Drita kryesore Z
settings.ui_lighting_key_z.description=Drejtimi i dritës kryesore në koordinatat botërore. Gama: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Drita mbushëse e aktivizuar
settings.ui_lighting_fill_enabled.description=Zbut anën në hije të krijuar nga drita kryesore. Vendos enabled=false për ta hequr plotësisht këtë dritë.
settings.ui_lighting_fill_intensity=Intensiteti i dritës mbushëse
settings.ui_lighting_fill_intensity.description=Intensitet më i lartë: besnikëri më e mirë e ngjyrave, hijezim më i butë. Intensitet më i ulët: dallim më i fortë midis faqeve të orientuara ndryshe. Gama: 0.0 - 1.0.
settings.ui_lighting_fill_x=Drita mbushëse X
settings.ui_lighting_fill_x.description=Drejtimi i dritës mbushëse në koordinatat botërore. Gama: -1.0 - 1.0.
settings.ui_lighting_fill_y=Drita mbushëse Y
settings.ui_lighting_fill_y.description=Drejtimi i dritës mbushëse në koordinatat botërore. Gama: -1.0 - 1.0.
settings.ui_lighting_fill_z=Drita mbushëse Z
settings.ui_lighting_fill_z.description=Drejtimi i dritës mbushëse në koordinatat botërore. Gama: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Drita e skajit e aktivizuar
settings.ui_lighting_rim_enabled.description=Dritë e dobët dytësore që ndihmon në ndarjen e disa sipërfaqeve. Normalisht duhet të mbetet e lehtë. Vendos enabled=false për ta hequr plotësisht këtë dritë.
settings.ui_lighting_rim_intensity=Intensiteti i dritës së skajit
settings.ui_lighting_rim_intensity.description=Dritë e dobët dytësore që ndihmon në ndarjen e disa sipërfaqeve. Normalisht duhet të mbetet e lehtë. Gama: 0.0 - 1.0.
settings.ui_lighting_rim_x=Drita e skajit X
settings.ui_lighting_rim_x.description=Drejtimi i dritës së skajit në koordinatat botërore. Gama: -1.0 - 1.0.
settings.ui_lighting_rim_y=Drita e skajit Y
settings.ui_lighting_rim_y.description=Drejtimi i dritës së skajit në koordinatat botërore. Gama: -1.0 - 1.0.
settings.ui_lighting_rim_z=Drita e skajit Z
settings.ui_lighting_rim_z.description=Drejtimi i dritës së skajit në koordinatat botërore. Gama: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Buzët e veçorive të aktivizuara
settings.ui_edges_enabled.description=Vizaton gjeometri të errët përgjatë buzëve të vërteta të mprehta të objekteve CSG. Kufijtë e shumëkëndëshave koplanarë injorohen. Vendos enabled=false për t'i hequr plotësisht buzët.
settings.ui_edges_angle_degrees=Këndi i buzës në gradë
settings.ui_edges_angle_degrees.description=Këndi minimal midis faqeve fqinje përpara se të vizatohet buza e përbashkët. Vlera më të larta prodhojnë më pak vija palosjeje. Gama: 0 - 360.
settings.ui_edges_width_mode=Mënyra e gjerësisë së buzëve
settings.ui_edges_width_mode.description=screen = Mban konturin pothuajse konstant në piksela ekrani. Më e mira për pamje të hollë në stil CAD në çdo zmadhim. world = Përdor një rreze fikse në milimetra të skenës.
settings.ui_edges_width_px=Gjerësia e buzëve në piksela
settings.ui_edges_width_px.description=Gjerësia e dukshme e vijës kur widthMode=screen. Gama: 0.1 - 10.0.
settings.ui_edges_radius=Rrezja e buzëve
settings.ui_edges_radius.description=Rrezja e buzëve në hapësirën botërore, në milimetra të skenës. Përdoret vetëm kur widthMode=world. Gama: 0.001 - 100.0.
settings.ui_edges_brightness=Ndriçimi i buzëve
settings.ui_edges_brightness.description=0.0 = e zezë, 1.0 = e bardhë. Gama: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Thellësia e dukshmërisë së rrjetës së vogël
settings.ui_grid_small_visible_zoom_depth.description=Kontrollon sa larg mbetet e dukshme rrjeta 1 mm. Vlerë më e lartë = rrjeta 1 mm shfaqet më herët / më larg. Gama: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Shumëzuesi i ndriçimit të rrjetës së vogël
settings.ui_grid_small_brightness_multiplier.description=Shumëzon ndriçimin RGB duke ruajtur nuancën e temës. 1.0 = ngjyra origjinale e temës. < 1.0 = më e errët. > 1.0 = më e ndritshme. Gama: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Shumëzuesi i opacitetit të rrjetës së vogël
settings.ui_grid_small_opacity_multiplier.description=Shumëzon alfën e dhënë nga tema aktuale. 1.0 = e pandryshuar. Gama: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Gjerësia e vijave të rrjetës së vogël (px)
settings.ui_grid_small_line_width_px.description=Trashësia e vijave të rrjetës në njësitë e vjetruara të pikselave të teksturës së rrjetës. Vlerat aktuale historike janë 2 për 1 mm dhe 4 për 10 mm. Gama: 1 - 10.
settings.ui_grid_small_z_offset_mm=Zhvendosja Z e rrjetës së vogël (mm)
settings.ui_grid_small_z_offset_mm.description=Mbaje rrjetën 1 mm pak pas rrjetës 10 mm për të shmangur artefaktet e thellësisë. Gama: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Shumëzuesi i ndriçimit të rrjetës kryesore
settings.ui_grid_major_brightness_multiplier.description=Shumëzon ndriçimin RGB duke ruajtur nuancën e temës. 1.0 = ngjyra origjinale e temës. < 1.0 = më e errët. > 1.0 = më e ndritshme. Gama: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Shumëzuesi i opacitetit të rrjetës kryesore
settings.ui_grid_major_opacity_multiplier.description=Shumëzon alfën e dhënë nga tema aktuale. 1.0 = e pandryshuar. Gama: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Gjerësia e vijave të rrjetës kryesore (px)
settings.ui_grid_major_line_width_px.description=Trashësia e vijave të rrjetës në njësitë e vjetruara të pikselave të teksturës së rrjetës. Vlerat aktuale historike janë 2 për 1 mm dhe 4 për 10 mm. Gama: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Mënyra e lëvizjes së rrjetës
settings.ui_grid_motion_mode.description=major = Mban të dukshme vetëm rrjetën e mprehtë 10 mm gjatë lëvizjes dhe fsheh përkohësisht rrjetën e dendur 1 mm. Rrjeta 1 mm kthehet pasi lëvizja ndalon. all = Mban të dukshme të dyja rrjetat e mprehta me vija gjatë lëvizjes. Vazhdimësi vizuale më e mirë, por potencialisht më e kushtueshme. texture = Sjellja origjinale: zëvendëson gjeometrinë e vijave me kuadrate rrjetë të teksturuar gjatë lëvizjes. Më e shpejtë, por mund të prodhojë aliasing / modele moare. hidden = Fsheh vijat e rrjetës gjatë lëvizjes dhe i rikthen kur kamera ndalon.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opaciteti i vizatimit të tokës
settings.ui_grid_ground_render_opacity.description=Opaciteti i mbushjes kryesore të tokës. Mbushja mbetet në vend në çdo zmadhim; vetëm rrjeta e dendur 1 mm kufizohet nga zmadhimi. Vendos 0 për të fshehur mbushjen duke mbajtur aktive sipërfaqen e saj të zgjedhjes. Planet e punës të personalizuara e injorojnë këtë cilësim. Gama: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Ndjeshmëria minimale e orbitës së kamerës
settings.ui_camera_orbit_min.description=Ndjeshmëria e rrotullimit në gradë për njësi koordinate miu JavaFX. min kontrollon tërheqjet shumë të ngadalta. Gama: 0.0 - 1.0.
settings.ui_camera_orbit_max=Ndjeshmëria maksimale e orbitës së kamerës
settings.ui_camera_orbit_max.description=Ndjeshmëria e rrotullimit në gradë për njësi koordinate miu JavaFX. max është kufiri i sipërm për tërheqjet e shpejta. Gama: 0.0 - 1.0.
settings.ui_camera_orbit_half=Gjysma e shpejtësisë së orbitës së kamerës
settings.ui_camera_orbit_half.description=Shpejtësia e filtruar e kursorit në njësi koordinate JavaFX për sekondë në të cilën ndjeshmëria është në gjysmë të rrugës midis min dhe max. Më e lartë = nxitim më i butë. Gama: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Koha e rritjes së orbitës së kamerës (ms)
settings.ui_camera_orbit_rise_ms.description=Konstantet e kohës (milisekonda) për vlerësimin e shpejtësisë së kursorit gjatë nxitimit. riseMs më i lartë zbut nxitimin. Gama: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Koha e uljes së orbitës së kamerës (ms)
settings.ui_camera_orbit_fall_ms.description=Konstantet e kohës (milisekonda) për vlerësimin e shpejtësisë së kursorit gjatë ngadalësimit. fallMs më i ulët rikthen më shpejt kontrollin e imët. Asnjëra nuk i shton inerci kamerës. Gama: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Vonesa e qetësimit të skenës për buzët (ms)
settings.ui_edges_scene_settle_delay_ms.description=Vonesa pas ndryshimeve të gjeometrisë ose shfaqjes. Vlera më të larta shtypin më shumë punë gjatë riprodhimit të shpejtë të historisë. Gama: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Vonesa e qetësimit të kamerës për buzët (ms)
settings.ui_edges_camera_settle_delay_ms.description=Vonesa pas lëvizjes së kamerës përpara se të rindërtohet trashësia e vijave të holla në hapësirën e ekranit. Gama: 0 - 10000.
settings.ui_edges_topology_precision=Precizioni i topologjisë së buzëve
settings.ui_edges_topology_precision.description=Hapi i kuantizimit i përdorur për normalizimin e topologjisë së buzëve të veçorive. Gjeometria e modelit dhe normalet e faqeve mbeten të pandryshuara. Gama: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Toleranca e bashkimit të buzëve (mm)
settings.ui_edges_stitch_tolerance.description=Toleranca e bashkimit të kufijve në milimetra të skenës. Përdoret vetëm për buzët që duken si kufi i një faqe të vetme pas analizës së fqinjësisë së rrjetës së indeksuar. Lejon kufijtë e ndarë ndryshe, por gjeometrikisht të përputhshëm, të rilidhen përpara se të vendoset nëse janë buzë të vërteta veçorie. Gama: 0.0 - 1.0.
