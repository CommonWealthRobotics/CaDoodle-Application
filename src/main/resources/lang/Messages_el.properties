# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Στοιχεία διεπαφής
settings.ui_section_lighting=Φωτισμός
settings.ui_section_edges=Χαρακτηριστικές ακμές
settings.ui_section_grid=Πλέγμα επιπέδου εργασίας
settings.ui_section_camera=Τροχιά κάμερας
settings.ui_section_timing=Χρονισμός χαρακτηριστικών ακμών
settings.ui_description=Περιγραφή από το scene-style.properties. Η τιμή αποθηκεύεται στο ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Λειτουργία φωτισμού
settings.ui_lighting_mode.description=Διατηρήστε ακριβώς μία λειτουργία φωτισμού. 'stable' = Σταθερά κατευθυντικά φώτα στον χώρο του κόσμου. Ο φωτισμός δεν περιστρέφεται με την κάμερα. Σχεδιασμένο για καλή πιστότητα χρώματος και ευανάγνωστη γεωμετρία CAD. 'kevin' = Αρχικός φωτισμός BowlerStudio. Χρησιμοποιεί τρία σημειακά φώτα· ένα ακολουθεί την κάμερα. Οι ρυθμίσεις σταθερού φωτισμού παρακάτω αγνοούνται σε αυτή τη λειτουργία.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Φως περιβάλλοντος
settings.ui_lighting_ambient.description=Το φως περιβάλλοντος επηρεάζει κάθε ορατή επιφάνεια εξίσου. Υψηλότερο: φωτεινότερες σκιές, τα χρώματα μένουν πιο κοντά στο βασικό τους χρώμα, αλλά οι επιφάνειες φαίνονται πιο επίπεδες. Χαμηλότερο: εντονότερη σκίαση και διαχωρισμός επιφανειών, αλλά τα χρώματα στη σκιά γίνονται πιο σκούρα.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Κύριο φως ενεργό
settings.ui_lighting_key_enabled.description=Κύριο φως που περιγράφει το σχήμα του αντικειμένου. Ορίστε enabled=false για να αφαιρέσετε εντελώς αυτό το φως.
settings.ui_lighting_key_intensity=Ένταση κύριου φωτός
settings.ui_lighting_key_intensity.description=Ένταση του κύριου φωτός. Εύρος: 0.0 - 1.0.
settings.ui_lighting_key_x=Κύριο φως X
settings.ui_lighting_key_x.description=Κατεύθυνση του κύριου φωτός σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
settings.ui_lighting_key_y=Κύριο φως Y
settings.ui_lighting_key_y.description=Κατεύθυνση του κύριου φωτός σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
settings.ui_lighting_key_z=Κύριο φως Z
settings.ui_lighting_key_z.description=Κατεύθυνση του κύριου φωτός σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Φως συμπλήρωσης ενεργό
settings.ui_lighting_fill_enabled.description=Απαλύνει την πλευρά σκιάς που δημιουργεί το κύριο φως. Ορίστε enabled=false για να αφαιρέσετε εντελώς αυτό το φως.
settings.ui_lighting_fill_intensity=Ένταση φωτός συμπλήρωσης
settings.ui_lighting_fill_intensity.description=Υψηλότερη ένταση: καλύτερη πιστότητα χρώματος, απαλότερη σκίαση. Χαμηλότερη ένταση: εντονότερη διαφορά μεταξύ διαφορετικά προσανατολισμένων επιφανειών. Εύρος: 0.0 - 1.0.
settings.ui_lighting_fill_x=Φως συμπλήρωσης X
settings.ui_lighting_fill_x.description=Κατεύθυνση του φωτός συμπλήρωσης σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
settings.ui_lighting_fill_y=Φως συμπλήρωσης Y
settings.ui_lighting_fill_y.description=Κατεύθυνση του φωτός συμπλήρωσης σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
settings.ui_lighting_fill_z=Φως συμπλήρωσης Z
settings.ui_lighting_fill_z.description=Κατεύθυνση του φωτός συμπλήρωσης σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Φως περιγράμματος ενεργό
settings.ui_lighting_rim_enabled.description=Αδύναμο δευτερεύον φως που βοηθά στον διαχωρισμό ορισμένων επιφανειών. Κανονικά πρέπει να παραμένει διακριτικό. Ορίστε enabled=false για να αφαιρέσετε εντελώς αυτό το φως.
settings.ui_lighting_rim_intensity=Ένταση φωτός περιγράμματος
settings.ui_lighting_rim_intensity.description=Αδύναμο δευτερεύον φως που βοηθά στον διαχωρισμό ορισμένων επιφανειών. Κανονικά πρέπει να παραμένει διακριτικό. Εύρος: 0.0 - 1.0.
settings.ui_lighting_rim_x=Φως περιγράμματος X
settings.ui_lighting_rim_x.description=Κατεύθυνση του φωτός περιγράμματος σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
settings.ui_lighting_rim_y=Φως περιγράμματος Y
settings.ui_lighting_rim_y.description=Κατεύθυνση του φωτός περιγράμματος σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
settings.ui_lighting_rim_z=Φως περιγράμματος Z
settings.ui_lighting_rim_z.description=Κατεύθυνση του φωτός περιγράμματος σε συντεταγμένες κόσμου. Εύρος: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Χαρακτηριστικές ακμές ενεργές
settings.ui_edges_enabled.description=Σχεδιάζει σκοτεινή γεωμετρία κατά μήκος των πραγματικών αιχμηρών ακμών των αντικειμένων CSG. Τα όρια των συνεπίπεδων πολυγώνων αγνοούνται. Ορίστε enabled=false για να αφαιρέσετε εντελώς τις ακμές.
settings.ui_edges_angle_degrees=Γωνία ακμών (μοίρες)
settings.ui_edges_angle_degrees.description=Ελάχιστη γωνία μεταξύ γειτονικών επιφανειών πριν σχεδιαστεί η κοινή τους ακμή. Υψηλότερες τιμές παράγουν λιγότερες γραμμές πτυχώσεων. Εύρος: 0 - 360.
settings.ui_edges_width_mode=Λειτουργία πλάτους ακμών
settings.ui_edges_width_mode.description=screen = Διατηρεί το περίγραμμα περίπου σταθερό σε pixel οθόνης. Ιδανικό για εμφάνιση λεπτής γραμμής τύπου CAD σε κάθε ζουμ. world = Χρησιμοποιεί σταθερή ακτίνα σε χιλιοστά της σκηνής.
settings.ui_edges_width_px=Πλάτος ακμών (pixel)
settings.ui_edges_width_px.description=Ορατό πλάτος γραμμής όταν widthMode=screen. Εύρος: 0.1 - 10.0.
settings.ui_edges_radius=Ακτίνα ακμών
settings.ui_edges_radius.description=Ακτίνα ακμών στον χώρο του κόσμου σε χιλιοστά της σκηνής. Χρησιμοποιείται μόνο όταν widthMode=world. Εύρος: 0.001 - 100.0.
settings.ui_edges_brightness=Φωτεινότητα ακμών
settings.ui_edges_brightness.description=0.0 = μαύρο, 1.0 = λευκό. Εύρος: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Βάθος ορατότητας μικρού πλέγματος στο ζουμ
settings.ui_grid_small_visible_zoom_depth.description=Ελέγχει σε πόση απόσταση το πλέγμα 1 mm παραμένει ορατό. Υψηλότερη τιμή = το πλέγμα 1 mm εμφανίζεται νωρίτερα / πιο μακριά. Εύρος: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Πολλαπλασιαστής φωτεινότητας μικρού πλέγματος
settings.ui_grid_small_brightness_multiplier.description=Πολλαπλασιάζει τη φωτεινότητα RGB διατηρώντας την απόχρωση του θέματος. 1.0 = αρχικό χρώμα θέματος. < 1.0 = πιο σκούρο. > 1.0 = πιο φωτεινό. Εύρος: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Πολλαπλασιαστής αδιαφάνειας μικρού πλέγματος
settings.ui_grid_small_opacity_multiplier.description=Πολλαπλασιάζει το άλφα που παρέχει το τρέχον θέμα. 1.0 = αμετάβλητο. Εύρος: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Πλάτος γραμμών μικρού πλέγματος (px)
settings.ui_grid_small_line_width_px.description=Πάχος γραμμών πλέγματος στις παλιές μονάδες pixel υφής του πλέγματος. Οι τρέχουσες ιστορικές τιμές είναι 2 για 1 mm και 4 για 10 mm. Εύρος: 1 - 10.
settings.ui_grid_small_z_offset_mm=Μετατόπιση Z μικρού πλέγματος (mm)
settings.ui_grid_small_z_offset_mm.description=Κρατά το πλέγμα 1 mm ακριβώς πίσω από το πλέγμα 10 mm για αποφυγή τεχνητών σφαλμάτων βάθους. Εύρος: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Πολλαπλασιαστής φωτεινότητας κύριου πλέγματος
settings.ui_grid_major_brightness_multiplier.description=Πολλαπλασιάζει τη φωτεινότητα RGB διατηρώντας την απόχρωση του θέματος. 1.0 = αρχικό χρώμα θέματος. < 1.0 = πιο σκούρο. > 1.0 = πιο φωτεινό. Εύρος: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Πολλαπλασιαστής αδιαφάνειας κύριου πλέγματος
settings.ui_grid_major_opacity_multiplier.description=Πολλαπλασιάζει το άλφα που παρέχει το τρέχον θέμα. 1.0 = αμετάβλητο. Εύρος: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Πλάτος γραμμών κύριου πλέγματος (px)
settings.ui_grid_major_line_width_px.description=Πάχος γραμμών πλέγματος στις παλιές μονάδες pixel υφής του πλέγματος. Οι τρέχουσες ιστορικές τιμές είναι 2 για 1 mm και 4 για 10 mm. Εύρος: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Λειτουργία κίνησης πλέγματος
settings.ui_grid_motion_mode.description=major = Κατά την κίνηση κρατά ορατό μόνο το καθαρό πλέγμα 10 mm και κρύβει προσωρινά το πυκνό πλέγμα 1 mm. Το πλέγμα 1 mm επανέρχεται όταν σταματήσει η κίνηση. all = Κατά την κίνηση κρατά ορατά και τα δύο καθαρά πλέγματα γραμμών. Καλύτερη οπτική συνέχεια, αλλά δυνητικά πιο ακριβό. texture = Αρχική συμπεριφορά: κατά την κίνηση αντικαθιστά τη γεωμετρία γραμμών με υφές τετραγώνων πλέγματος. Ταχύτερο, αλλά μπορεί να προκαλέσει ψευδογραμμώσεις / μοτίβα μουαρέ. hidden = Κρύβει τις γραμμές του πλέγματος κατά την κίνηση και τις επαναφέρει όταν σταματήσει η κάμερα.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Αδιαφάνεια απόδοσης εδάφους
settings.ui_grid_ground_render_opacity.description=Αδιαφάνεια του κύριου γεμίσματος εδάφους. Το γέμισμα μένει στη θέση του σε κάθε ζουμ· μόνο το πυκνό πλέγμα 1 mm ελέγχεται από το ζουμ. Ορίστε 0 για να κρύψετε το γέμισμα κρατώντας ενεργή την επιφάνεια επιλογής του. Τα προσαρμοσμένα επίπεδα εργασίας αγνοούν αυτή τη ρύθμιση. Εύρος: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Ελάχιστη ευαισθησία τροχιάς κάμερας
settings.ui_camera_orbit_min.description=Ευαισθησία περιστροφής σε μοίρες ανά μονάδα συντεταγμένης ποντικιού JavaFX. Το min ελέγχει πολύ αργές μετακινήσεις. Εύρος: 0.0 - 1.0.
settings.ui_camera_orbit_max=Μέγιστη ευαισθησία τροχιάς κάμερας
settings.ui_camera_orbit_max.description=Ευαισθησία περιστροφής σε μοίρες ανά μονάδα συντεταγμένης ποντικιού JavaFX. Το max είναι ανώτατο όριο για γρήγορες μετακινήσεις. Εύρος: 0.0 - 1.0.
settings.ui_camera_orbit_half=Μισή ταχύτητα τροχιάς κάμερας
settings.ui_camera_orbit_half.description=Φιλτραρισμένη ταχύτητα δείκτη σε μονάδες συντεταγμένων JavaFX ανά δευτερόλεπτο, όπου η ευαισθησία είναι στο μέσο μεταξύ min και max. Υψηλότερη = απαλότερη επιτάχυνση. Εύρος: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Χρόνος ανόδου τροχιάς κάμερας (ms)
settings.ui_camera_orbit_rise_ms.description=Χρονικές σταθερές (χιλιοστά του δευτερολέπτου) για την εκτίμηση της ταχύτητας του δείκτη κατά την επιτάχυνση. Υψηλότερο riseMs απαλύνει την επιτάχυνση. Εύρος: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Χρόνος καθόδου τροχιάς κάμερας (ms)
settings.ui_camera_orbit_fall_ms.description=Χρονικές σταθερές (χιλιοστά του δευτερολέπτου) για την εκτίμηση της ταχύτητας του δείκτη κατά την επιβράδυνση. Χαμηλότερο fallMs επαναφέρει ταχύτερα τον λεπτό έλεγχο. Κανένα από τα δύο δεν προσθέτει αδράνεια στην κάμερα. Εύρος: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Καθυστέρηση σταθεροποίησης σκηνής ακμών (ms)
settings.ui_edges_scene_settle_delay_ms.description=Καθυστέρηση μετά από αλλαγές γεωμετρίας/εμφάνισης. Υψηλότερες τιμές καταστέλλουν περισσότερη εργασία κατά τη γρήγορη αναπαραγωγή ιστορικού. Εύρος: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Καθυστέρηση σταθεροποίησης κάμερας ακμών (ms)
settings.ui_edges_camera_settle_delay_ms.description=Καθυστέρηση μετά την κίνηση της κάμερας πριν ξαναχτιστεί το πάχος της λεπτής γραμμής στον χώρο της οθόνης. Εύρος: 0 - 10000.
settings.ui_edges_topology_precision=Ακρίβεια τοπολογίας ακμών
settings.ui_edges_topology_precision.description=Βήμα κβαντισμού που χρησιμοποιείται για την κανονικοποίηση της τοπολογίας των χαρακτηριστικών ακμών. Η γεωμετρία του μοντέλου και τα κάθετα διανύσματα των επιφανειών παραμένουν αμετάβλητα. Εύρος: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Ανοχή συρραφής ακμών (mm)
settings.ui_edges_stitch_tolerance.description=Ανοχή συρραφής ορίων σε χιλιοστά της σκηνής. Χρησιμοποιείται μόνο για φαινόμενες ακμές μίας επιφάνειας μετά τη γειτονική ανάλυση του ευρετηριασμένου πλέγματος. Επιτρέπει σε διαφορετικά υποδιαιρεμένα αλλά γεωμετρικά συμπίπτοντα όρια να επανασυνδεθούν πριν αποφασιστεί αν είναι πραγματικές χαρακτηριστικές ακμές. Εύρος: 0.0 - 1.0.
