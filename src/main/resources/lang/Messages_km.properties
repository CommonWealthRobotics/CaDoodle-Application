# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=របៀបបំភ្លឺ
settings.ui_lighting_mode.description=រក្សារបៀបបំភ្លឺតែមួយប៉ុណ្ណោះ។ 'stable' = ពន្លឺមានទិសដៅថេរក្នុងលំហពិភពលោក។ ការបំភ្លឺមិនវិលតាមកាមេរ៉ាទេ។ រចនាឡើងសម្រាប់ភាពត្រឹមត្រូវពណ៌ល្អ និងធរណីមាត្រ CAD ដែលអានបាន។ 'kevin' = ការបំភ្លឺ BowlerStudio ដើម។ ប្រើពន្លឺបីចំណុច; មួយដើរតាមកាមេរ៉ា។ ការកំណត់ពន្លឺថេរខាងក្រោមត្រូវបានមិនយកចិត្តទុកដាក់ក្នុងរបៀបនេះ។
