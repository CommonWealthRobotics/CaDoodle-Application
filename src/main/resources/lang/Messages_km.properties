settings.ui_grid_small_line_width_px.description=កម្រាស់បន្ទាត់ក្រឡាចត្រង្គជាឯកតាភិចសែលវាយនភាពបុរាណរបស់ក្រឡាចត្រង្គ។ តម្លៃប្រវត្តិបច្ចុប្បន្នគឺ 2 សម្រាប់ 1 mm និង 4 សម្រាប់ 10 mm ។ ជួរ៖ 1 - 10 ។
