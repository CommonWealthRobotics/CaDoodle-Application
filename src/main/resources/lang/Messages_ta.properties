# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=பயனர் இடைமுக உறுப்புகள்
settings.ui_section_lighting=விளக்கு அமைப்பு
settings.ui_section_edges=அம்ச விளிம்புகள்
settings.ui_section_grid=வேலைத்தள கிரிட்
settings.ui_section_camera=கேமரா சுற்றுப்பாதை
settings.ui_section_timing=அம்ச விளிம்பு நேரம்
settings.ui_description=scene-style.properties இலிருந்து எடுக்கப்பட்ட விவரணம். மதிப்பு ConfigurationDatabase இல் சேமிக்கப்படுகிறது.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=விளக்கு முறை
settings.ui_lighting_mode.description=சரியாக ஒரு விளக்கு முறையை வைத்திருங்கள். 'stable' = நிலையான உலக-வெளி திசை விளக்குகள். விளக்கு கேமராவுடன் சுழலாது. நல்ல நிறத் துல்லியத்திற்கும் படிக்கக்கூடிய CAD வடிவியலுக்கும் வடிவமைக்கப்பட்டது. 'kevin' = அசல் BowlerStudio விளக்கு. மூன்று புள்ளி விளக்குகளைப் பயன்படுத்துகிறது; ஒன்று கேமராவைப் பின்தொடர்கிறது. இந்த முறையில் கீழே உள்ள நிலையான-விளக்கு அமைப்புகள் புறக்கணிக்கப்படும்.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=சுற்றுப்புற விளக்கு
settings.ui_lighting_ambient.description=சுற்றுப்புற விளக்கு ஒவ்வொரு தெரியும் மேற்பரப்பையும் சமமாகப் பாதிக்கிறது. அதிகம்: பிரகாசமான நிழல்கள், நிறங்கள் அவற்றின் அடிப்படை நிறத்திற்கு அருகில் இருக்கும், ஆனால் மேற்பரப்புகள் தட்டையாகத் தெரியும். குறைவு: வலுவான நிழலிடல் மற்றும் மேற்பரப்புகளுக்கு இடையே அதிக பிரிப்பு, ஆனால் நிழலான நிறங்கள் இருளும்.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=முதன்மை விளக்கு இயக்கப்பட்டது
settings.ui_lighting_key_enabled.description=பொருளின் வடிவத்தை விவரிக்கும் முதன்மை விளக்கு. இந்த விளக்கை முழுவதுமாக நீக்க enabled=false என அமைக்கவும்.
settings.ui_lighting_key_intensity=முதன்மை விளக்கு தீவிரம்
settings.ui_lighting_key_intensity.description=முதன்மை விளக்கின் தீவிரம். வரம்பு: 0.0 - 1.0.
settings.ui_lighting_key_x=முதன்மை விளக்கு X
settings.ui_lighting_key_x.description=உலக ஆயத்தொலைவுகளில் முதன்மை விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
settings.ui_lighting_key_y=முதன்மை விளக்கு Y
settings.ui_lighting_key_y.description=உலக ஆயத்தொலைவுகளில் முதன்மை விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
settings.ui_lighting_key_z=முதன்மை விளக்கு Z
settings.ui_lighting_key_z.description=உலக ஆயத்தொலைவுகளில் முதன்மை விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=நிரப்பு விளக்கு இயக்கப்பட்டது
settings.ui_lighting_fill_enabled.description=முதன்மை விளக்கு உருவாக்கும் நிழல் பக்கத்தை மென்மையாக்குகிறது. இந்த விளக்கை முழுவதுமாக நீக்க enabled=false என அமைக்கவும்.
settings.ui_lighting_fill_intensity=நிரப்பு விளக்கு தீவிரம்
settings.ui_lighting_fill_intensity.description=அதிக தீவிரம்: சிறந்த நிறத் துல்லியம், மென்மையான நிழலிடல். குறை தீவிரம்: வெவ்வேறு திசைகொண்ட முகங்களுக்கு இடையே வலுவான வேறுபாடு. வரம்பு: 0.0 - 1.0.
settings.ui_lighting_fill_x=நிரப்பு விளக்கு X
settings.ui_lighting_fill_x.description=உலக ஆயத்தொலைவுகளில் நிரப்பு விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
settings.ui_lighting_fill_y=நிரப்பு விளக்கு Y
settings.ui_lighting_fill_y.description=உலக ஆயத்தொலைவுகளில் நிரப்பு விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
settings.ui_lighting_fill_z=நிரப்பு விளக்கு Z
settings.ui_lighting_fill_z.description=உலக ஆயத்தொலைவுகளில் நிரப்பு விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=விளிம்பு விளக்கு இயக்கப்பட்டது
settings.ui_lighting_rim_enabled.description=சில மேற்பரப்புகளைப் பிரிக்க உதவும் பலவீனமான துணை விளக்கு. இது இயல்பாக நுட்பமாக இருக்க வேண்டும். இந்த விளக்கை முழுவதுமாக நீக்க enabled=false என அமைக்கவும்.
settings.ui_lighting_rim_intensity=விளிம்பு விளக்கு தீவிரம்
settings.ui_lighting_rim_intensity.description=சில மேற்பரப்புகளைப் பிரிக்க உதவும் பலவீனமான துணை விளக்கு. இது இயல்பாக நுட்பமாக இருக்க வேண்டும். வரம்பு: 0.0 - 1.0.
settings.ui_lighting_rim_x=விளிம்பு விளக்கு X
settings.ui_lighting_rim_x.description=உலக ஆயத்தொலைவுகளில் விளிம்பு விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
settings.ui_lighting_rim_y=விளிம்பு விளக்கு Y
settings.ui_lighting_rim_y.description=உலக ஆயத்தொலைவுகளில் விளிம்பு விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
settings.ui_lighting_rim_z=விளிம்பு விளக்கு Z
settings.ui_lighting_rim_z.description=உலக ஆயத்தொலைவுகளில் விளிம்பு விளக்கின் திசை. வரம்பு: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=அம்ச விளிம்புகள் இயக்கப்பட்டது
settings.ui_edges_enabled.description=CSG பொருட்களின் உண்மையான கூர்மையான விளிம்புகளில் இருண்ட வடிவியலை வரையவும். ஒரே தளத்தில் உள்ள பலகோண எல்லைகள் புறக்கணிக்கப்படும். விளிம்புகளை முழுவதுமாக நீக்க enabled=false என அமைக்கவும்.
settings.ui_edges_angle_degrees=விளிம்பு கோணம் (டிகிரி)
settings.ui_edges_angle_degrees.description=அடுத்துள்ள முகங்களுக்கு இடையேயான குறைந்தபட்ச கோணம், அதற்குப் பிறகு அவற்றின் பகிரப்பட்ட விளிம்பு வரையப்படும். அதிக மதிப்புகள் குறைவான மடிப்புக் கோடுகளை உருவாக்கும். வரம்பு: 0 - 360.
settings.ui_edges_width_mode=விளிம்பு அகல முறை
settings.ui_edges_width_mode.description=screen = வெளிப்புறக் கோட்டை திரை பிக்சல்களில் தோராயமாக நிலையாக வைத்திருக்கும். எந்த பெரிதாக்க நிலையிலும் CAD-பாணி மெல்லியகோட்டுத் தோற்றத்திற்கு சிறந்தது. world = காட்சி மில்லிமீட்டர்களில் நிலையான ஆரத்தைப் பயன்படுத்தும்.
settings.ui_edges_width_px=விளிம்பு அகலம் பிக்சல்
settings.ui_edges_width_px.description=widthMode=screen ஆக இருக்கும்போது தெரியும் கோட்டு அகலம். வரம்பு: 0.1 - 10.0.
settings.ui_edges_radius=விளிம்பு ஆரம்
settings.ui_edges_radius.description=காட்சி மில்லிமீட்டர்களில் உலக-வெளி விளிம்பு ஆரம். widthMode=world ஆக இருக்கும்போது மட்டுமே பயன்படுத்தப்படும். வரம்பு: 0.001 - 100.0.
settings.ui_edges_brightness=விளிம்பு பிரகாசம்
settings.ui_edges_brightness.description=0.0 = கருப்பு, 1.0 = வெள்ளை. வரம்பு: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=சிறிய கிரிட் தெரிவு பெரிதாக்க ஆழம்
settings.ui_grid_small_visible_zoom_depth.description=1 mm கிரிட் எவ்வளவு தூரம் வரை தெரியும் என்பதைக் கட்டுப்படுத்துகிறது. அதிக மதிப்பு = 1 mm கிரிட் முன்னதாக / அதிக தூரத்திலிருந்து தெரியும். வரம்பு: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=சிறிய கிரிட் பிரகாச பெருக்கி
settings.ui_grid_small_brightness_multiplier.description=தீம் நிறமை வேறுபாட்டைப் பாதுகாத்து RGB பிரகாசத்தைப் பெருக்குகிறது. 1.0 = அசல் தீம் நிறம். < 1.0 = இருண்டது. > 1.0 = பிரகாசமானது. வரம்பு: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=சிறிய கிரிட் ஒளிபுகாப் பெருக்கி
settings.ui_grid_small_opacity_multiplier.description=தற்போதைய தீம் வழங்கும் ஆல்ஃபாவைப் பெருக்குகிறது. 1.0 = மாற்றமில்லை. வரம்பு: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=சிறிய கிரிட் கோட்டு அகலம் (px)
settings.ui_grid_small_line_width_px.description=கிரிட்டின் பாரம்பரிய அமைப்பு-பிக்சல் அலகுகளில் கிரிட் கோட்டுத் தடிமன். தற்போதைய வரலாற்று மதிப்புகள் 1 mm க்கு 2 மற்றும் 10 mm க்கு 4. வரம்பு: 1 - 10.
settings.ui_grid_small_z_offset_mm=சிறிய கிரிட் Z இடமாற்றம் (mm)
settings.ui_grid_small_z_offset_mm.description=ஆழக் குறைபாடுகளைத் தவிர்க்க 1 mm கிரிட்டை 10 mm கிரிட்டிற்கு சற்றுப் பின்னால் வைக்கவும். வரம்பு: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=பெரிய கிரிட் பிரகாச பெருக்கி
settings.ui_grid_major_brightness_multiplier.description=தீம் நிறமை வேறுபாட்டைப் பாதுகாத்து RGB பிரகாசத்தைப் பெருக்குகிறது. 1.0 = அசல் தீம் நிறம். < 1.0 = இருண்டது. > 1.0 = பிரகாசமானது. வரம்பு: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=பெரிய கிரிட் ஒளிபுகாப் பெருக்கி
settings.ui_grid_major_opacity_multiplier.description=தற்போதைய தீம் வழங்கும் ஆல்ஃபாவைப் பெருக்குகிறது. 1.0 = மாற்றமில்லை. வரம்பு: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=பெரிய கிரிட் கோட்டு அகலம் (px)
settings.ui_grid_major_line_width_px.description=கிரிட்டின் பாரம்பரிய அமைப்பு-பிக்சல் அலகுகளில் கிரிட் கோட்டுத் தடிமன். தற்போதைய வரலாற்று மதிப்புகள் 1 mm க்கு 2 மற்றும் 10 mm க்கு 4. வரம்பு: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=கிரிட் இயக்க முறை
settings.ui_grid_motion_mode.description=major = நகரும் போது தெளிவான 10 mm கிரிட்டை மட்டும் தெரியச் செய்து அடர்த்தியான 1 mm கிரிட்டை தற்காலிகமாக மறைக்கவும். நகர்வு நின்ற பிறகு 1 mm கிரிட் திரும்பும். all = நகரும் போது இரண்டு தெளிவான கோட்டு கிரிட்களையும் தெரியச் செய்யவும். சிறந்த காட்சித் தொடர்ச்சி, ஆனால் அதிக விலைக்குரியதாக இருக்கலாம். texture = அசல் நடத்தை: நகரும் போது கோட்டு வடிவியலுக்குப் பதிலாக அமைப்பு உள்ள கிரிட் நாற்கரங்களைப் பயன்படுத்தவும். வேகமானது, ஆனால் மென்முனைப்பு / மொய்ரே வடிவங்களை உருவாக்கலாம். hidden = நகரும் போது கிரிட் கோடுகளை மறைத்து கேமரா நிற்கும்போது அவற்றை மீட்டெடுக்கவும்.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=தரை வழங்கல் ஒளிபுகாமை
settings.ui_grid_ground_render_opacity.description=முதன்மை தரை நிரப்பின் ஒளிபுகாமை. நிரப்பு ஒவ்வொரு பெரிதாக்க நிலையிலும் தன் இடத்தில் இருக்கும்; அடர்த்தியான 1 mm கிரிட் மட்டுமே பெரிதாக்கத்தால் கட்டுப்படுத்தப்படுகிறது. நிரப்பை மறைத்து அதன் தேர்வு மேற்பரப்பை செயலில் வைக்க 0 என அமைக்கவும். தனிப்பயன் வேலைத்தளங்கள் இந்த அமைப்பைப் புறக்கணிக்கும். வரம்பு: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=கேமரா சுற்றுப்பாதை குறைந்த உணர்திறன்
settings.ui_camera_orbit_min.description=JavaFX சுட்டி-ஆய அலகுக்கு டிகிரியில் சுழற்சி உணர்திறன். min மிக மெதுவான இழுவைகளைக் கட்டுப்படுத்துகிறது. வரம்பு: 0.0 - 1.0.
settings.ui_camera_orbit_max=கேமரா சுற்றுப்பாதை அதிக உணர்திறன்
settings.ui_camera_orbit_max.description=JavaFX சுட்டி-ஆய அலகுக்கு டிகிரியில் சுழற்சி உணர்திறன். max வேகமான இழுவைகளுக்கான மேல் வரம்பு. வரம்பு: 0.0 - 1.0.
settings.ui_camera_orbit_half=கேமரா சுற்றுப்பாதை அரை வேகம்
settings.ui_camera_orbit_half.description=வடிகட்டப்பட்ட சுட்டி வேகம் (JavaFX ஆய அலகு வினாடிக்கு); இதில் உணர்திறன் min மற்றும் max இடையே பாதியாக இருக்கும். அதிகம் = மென்மையான முடுக்கம். வரம்பு: 0 - 10000.
settings.ui_camera_orbit_rise_ms=கேமரா சுற்றுப்பாதை எழுச்சி நேரம் (ms)
settings.ui_camera_orbit_rise_ms.description=வேகத்தை அதிகரிக்கும்போது சுட்டி-வேக மதிப்பீட்டிற்கான நேர மாறிலிகள் (மில்லிவினாடி). அதிக riseMs முடுக்கத்தை மென்மையாக்கும். வரம்பு: 0 - 10000.
settings.ui_camera_orbit_fall_ms=கேமரா சுற்றுப்பாதை வீழ்ச்சி நேரம் (ms)
settings.ui_camera_orbit_fall_ms.description=வேகத்தைக் குறைக்கும்போது சுட்டி-வேக மதிப்பீட்டிற்கான நேர மாறிலிகள் (மில்லிவினாடி). குறைவான fallMs நுட்பமான கட்டுப்பாட்டை விரைவில் மீட்டெடுக்கும். இவை எதுவும் கேமரா உறைமையைச் சேர்க்காது. வரம்பு: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=விளிம்பு காட்சி நிலைத்தன்மை தாமதம் (ms)
settings.ui_edges_scene_settle_delay_ms.description=வடிவியல்/காட்சி மாற்றங்களுக்குப் பிறகான தாமதம். அதிக மதிப்புகள் விரைவான வரலாற்று மறுஇயக்கத்தின்போது அதிக வேலையை அடக்கும். வரம்பு: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=விளிம்பு கேமரா நிலைத்தன்மை தாமதம் (ms)
settings.ui_edges_camera_settle_delay_ms.description=கேமரா நகர்வுக்குப் பிறகான தாமதம், அதன் பிறகு திரை-வெளி மெல்லியகோட்டுத் தடிமன் மீண்டும் கட்டப்படும். வரம்பு: 0 - 10000.
settings.ui_edges_topology_precision=விளிம்பு இடவியல் துல்லியம்
settings.ui_edges_topology_precision.description=அம்ச-விளிம்பு இடவியலை இயல்பாக்கப் பயன்படும் அளவீட்டுப் படி. மாதிரி வடிவியலும் முகச் செங்குத்துகளும் மாறாமல் இருக்கும். வரம்பு: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=விளிம்பு தையல் பொறுதி (mm)
settings.ui_edges_stitch_tolerance.description=காட்சி மில்லிமீட்டர்களில் எல்லைத் தையல் பொறுதி. குறியிடப்பட்ட வலை அடுத்துள்ளமைக்குப் பிறகு தோன்றும் ஒரு-முக விளிம்புகளுக்கு மட்டுமே பயன்படும். இது வெவ்வேறாக உட்பிரிக்கப்பட்டாலும் வடிவியலாக ஒன்றிணையும் எல்லைகளை மீண்டும் இணைக்க அனுமதிக்கிறது, அவை உண்மையான அம்ச விளிம்புகளா எனத் தீர்மானிப்பதற்கு முன். வரம்பு: 0.0 - 1.0.
