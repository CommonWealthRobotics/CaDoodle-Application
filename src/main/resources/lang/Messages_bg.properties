# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Елементи на интерфейса
settings.ui_section_lighting=Осветление
settings.ui_section_edges=Характерни ръбове
settings.ui_section_grid=Решетка на работната равнина
settings.ui_section_camera=Орбита на камерата
settings.ui_section_timing=Времеви настройки на характерните ръбове
settings.ui_description=Описание, взето от scene-style.properties. Стойността се записва в ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Режим на осветление
settings.ui_lighting_mode.description=Поддържайте точно един режим на осветление. 'stable' = Фиксирани насочени светлини в световното пространство. Осветлението не се върти с камерата. Създадено за добра цветова точност и четлива CAD геометрия. 'kevin' = Оригинално осветление на BowlerStudio. Използва три точкови светлини; една следва камерата. Настройките за стабилна светлина по-долу се игнорират в този режим.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Околна светлина
settings.ui_lighting_ambient.description=Околната светлина влияе еднакво на всяка видима повърхност. По-висока: по-светли сенки, цветовете остават по-близо до основния си цвят, но повърхностите изглеждат по-плоски. По-ниска: по-силно засенчване и разделяне на повърхностите, но цветовете в сянка стават по-тъмни.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Основна светлина включена
settings.ui_lighting_key_enabled.description=Основна светлина, използвана за описание на формата на обекта. Задайте enabled=false, за да премахнете напълно тази светлина.
settings.ui_lighting_key_intensity=Интензитет на основната светлина
settings.ui_lighting_key_intensity.description=Интензитет на основната светлина. Диапазон: 0.0 - 1.0.
settings.ui_lighting_key_x=Основна светлина X
settings.ui_lighting_key_x.description=Посока на основната светлина в световни координати. Диапазон: -1.0 - 1.0.
settings.ui_lighting_key_y=Основна светлина Y
settings.ui_lighting_key_y.description=Посока на основната светлина в световни координати. Диапазон: -1.0 - 1.0.
settings.ui_lighting_key_z=Основна светлина Z
settings.ui_lighting_key_z.description=Посока на основната светлина в световни координати. Диапазон: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Запълваща светлина включена
settings.ui_lighting_fill_enabled.description=Омекотява сенчестата страна, създадена от основната светлина. Задайте enabled=false, за да премахнете напълно тази светлина.
settings.ui_lighting_fill_intensity=Интензитет на запълващата светлина
settings.ui_lighting_fill_intensity.description=По-висок интензитет: по-добра цветова точност, по-меко засенчване. По-нисък интензитет: по-силна разлика между различно ориентираните лица. Диапазон: 0.0 - 1.0.
settings.ui_lighting_fill_x=Запълваща светлина X
settings.ui_lighting_fill_x.description=Посока на запълващата светлина в световни координати. Диапазон: -1.0 - 1.0.
settings.ui_lighting_fill_y=Запълваща светлина Y
settings.ui_lighting_fill_y.description=Посока на запълващата светлина в световни координати. Диапазон: -1.0 - 1.0.
settings.ui_lighting_fill_z=Запълваща светлина Z
settings.ui_lighting_fill_z.description=Посока на запълващата светлина в световни координати. Диапазон: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Контурна светлина включена
settings.ui_lighting_rim_enabled.description=Слаба вторична светлина, която помага за разделянето на някои повърхности. Обикновено трябва да остане фина. Задайте enabled=false, за да премахнете напълно тази светлина.
settings.ui_lighting_rim_intensity=Интензитет на контурната светлина
settings.ui_lighting_rim_intensity.description=Слаба вторична светлина, която помага за разделянето на някои повърхности. Обикновено трябва да остане фина. Диапазон: 0.0 - 1.0.
settings.ui_lighting_rim_x=Контурна светлина X
settings.ui_lighting_rim_x.description=Посока на контурната светлина в световни координати. Диапазон: -1.0 - 1.0.
settings.ui_lighting_rim_y=Контурна светлина Y
settings.ui_lighting_rim_y.description=Посока на контурната светлина в световни координати. Диапазон: -1.0 - 1.0.
settings.ui_lighting_rim_z=Контурна светлина Z
settings.ui_lighting_rim_z.description=Посока на контурната светлина в световни координати. Диапазон: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Характерни ръбове включени
settings.ui_edges_enabled.description=Чертае тъмна геометрия по реалните остри ръбове на обектите CSG. Границите на копланарните полигони се игнорират. Задайте enabled=false, за да премахнете ръбовете напълно.
settings.ui_edges_angle_degrees=Ъгъл на ръбовете (градуси)
settings.ui_edges_angle_degrees.description=Минимален ъгъл между съседни лица, преди общият им ръб да бъде начертан. По-високи стойности дават по-малко линии на прегъване. Диапазон: 0 - 360.
settings.ui_edges_width_mode=Режим на ширината на ръбовете
settings.ui_edges_width_mode.description=screen = Поддържа контура приблизително постоянен в пиксели на екрана. Най-добро за CAD-подобен вид на тънка линия при всяко увеличение. world = Използва фиксиран радиус в милиметри на сцената.
settings.ui_edges_width_px=Ширина на ръбовете (пиксели)
settings.ui_edges_width_px.description=Видима ширина на линията при widthMode=screen. Диапазон: 0.1 - 10.0.
settings.ui_edges_radius=Радиус на ръбовете
settings.ui_edges_radius.description=Радиус на ръбовете в световното пространство в милиметри на сцената. Използва се само при widthMode=world. Диапазон: 0.001 - 100.0.
settings.ui_edges_brightness=Яркост на ръбовете
settings.ui_edges_brightness.description=0.0 = черно, 1.0 = бяло. Диапазон: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Дълбочина на видимост на малката решетка при увеличение
settings.ui_grid_small_visible_zoom_depth.description=Контролира на какво разстояние решетката 1 mm остава видима. По-висока стойност = решетката 1 mm се появява по-рано / по-далеч. Диапазон: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Множител на яркостта на малката решетка
settings.ui_grid_small_brightness_multiplier.description=Умножава яркостта на RGB, като запазва оттенъка на темата. 1.0 = оригинален цвят на темата. < 1.0 = по-тъмно. > 1.0 = по-ярко. Диапазон: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Множител на непрозрачността на малката решетка
settings.ui_grid_small_opacity_multiplier.description=Умножава алфата, зададена от текущата тема. 1.0 = без промяна. Диапазон: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Дебелина на линиите на малката решетка (px)
settings.ui_grid_small_line_width_px.description=Дебелина на линиите на решетката в старите текстурни пикселни единици на решетката. Текущите исторически стойности са 2 за 1 mm и 4 за 10 mm. Диапазон: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z отместване на малката решетка (mm)
settings.ui_grid_small_z_offset_mm.description=Задържа решетката 1 mm точно зад решетката 10 mm, за да се избегнат артефакти на дълбочината. Диапазон: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Множител на яркостта на основната решетка
settings.ui_grid_major_brightness_multiplier.description=Умножава яркостта на RGB, като запазва оттенъка на темата. 1.0 = оригинален цвят на темата. < 1.0 = по-тъмно. > 1.0 = по-ярко. Диапазон: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Множител на непрозрачността на основната решетка
settings.ui_grid_major_opacity_multiplier.description=Умножава алфата, зададена от текущата тема. 1.0 = без промяна. Диапазон: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Дебелина на линиите на основната решетка (px)
settings.ui_grid_major_line_width_px.description=Дебелина на линиите на решетката в старите текстурни пикселни единици на решетката. Текущите исторически стойности са 2 за 1 mm и 4 за 10 mm. Диапазон: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Режим на движение на решетката
settings.ui_grid_motion_mode.description=major = При движение показва само ясната решетка 10 mm и временно скрива гъстата решетка 1 mm. Решетката 1 mm се връща след спиране на движението. all = Показва и двете ясни линейни решетки по време на движение. Най-добра визуална непрекъснатост, но потенциално по-скъпо. texture = Оригинално поведение: заменя линейната геометрия с текстурирани квадри на решетката по време на движение. По-бързо, но може да създаде заглаждане / моар. hidden = Скрива линиите на решетката по време на движение и ги възстановява, когато камерата спре.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Непрозрачност на рендирането на основата
settings.ui_grid_ground_render_opacity.description=Непрозрачност на основното запълване на основата. Запълването остава на място при всяко увеличение; само гъстата решетка 1 mm се управлява от увеличението. Задайте 0, за да скриете запълването, като запазите повърхността му за избор активна. Персонализираните работни равнини игнорират тази настройка. Диапазон: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Минимална чувствителност на орбитата на камерата
settings.ui_camera_orbit_min.description=Чувствителност на въртене в градуси за единица координата на мишката на JavaFX. min управлява много бавните плъзгания. Диапазон: 0.0 - 1.0.
settings.ui_camera_orbit_max=Максимална чувствителност на орбитата на камерата
settings.ui_camera_orbit_max.description=Чувствителност на въртене в градуси за единица координата на мишката на JavaFX. max е горна граница за бързите плъзгания. Диапазон: 0.0 - 1.0.
settings.ui_camera_orbit_half=Полускорост на орбитата на камерата
settings.ui_camera_orbit_half.description=Филтрирана скорост на курсора в единици координати на JavaFX за секунда, при която чувствителността е наполовина между min и max. По-висока = по-плавно ускорение. Диапазон: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Време за нарастване на орбитата на камерата (ms)
settings.ui_camera_orbit_rise_ms.description=Времеви константи (милисекунди) за оценката на скоростта на курсора при ускоряване. По-високо riseMs омекотява ускорението. Диапазон: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Време за спадане на орбитата на камерата (ms)
settings.ui_camera_orbit_fall_ms.description=Времеви константи (милисекунди) за оценката на скоростта на курсора при забавяне. По-ниско fallMs възстановява по-бързо финия контрол. Нито едно от двете не добавя инерция на камерата. Диапазон: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Закъснение на установяване на сцената с ръбове (ms)
settings.ui_edges_scene_settle_delay_ms.description=Закъснение след промени в геометрията/дисплея. По-високи стойности потискат повече работа при бързо възпроизвеждане на историята. Диапазон: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Закъснение на установяване на камерата за ръбовете (ms)
settings.ui_edges_camera_settle_delay_ms.description=Закъснение след движение на камерата, преди дебелината на тънката линия в екранното пространство да бъде изградена отново. Диапазон: 0 - 10000.
settings.ui_edges_topology_precision=Прецизност на топологията на ръбовете
settings.ui_edges_topology_precision.description=Стъпка на квантуване, използвана за нормализиране на топологията на характерните ръбове. Геометрията на модела и нормалите на лицата остават непроменени. Диапазон: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Допуск на зашиване на ръбовете (mm)
settings.ui_edges_stitch_tolerance.description=Допуск на зашиване на границите в милиметри на сцената. Използва се само за привидни ръбове на едно лице след анализ на съседството на индексирана мрежа. Позволява различно подразделени, но геометрично съвпадащи граници да бъдат свързани отново, преди да се реши дали са реални характерни ръбове. Диапазон: 0.0 - 1.0.
