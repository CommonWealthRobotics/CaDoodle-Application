settings.ui_grid_small_brightness_multiplier.description=คูณความสว่าง RGB โดยรักษาเฉดสีของธีมไว้ 1.0 = สีธีมดั้งเดิม < 1.0 = เข้มขึ้น > 1.0 = สว่างขึ้น ช่วง: 0.0 - 3.0
