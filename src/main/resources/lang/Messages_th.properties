settings.ui_grid_small_z_offset_mm.description=เก็บกริด 1 mm ไว้ด้านหลังกริด 10 mm เล็กน้อยเพื่อหลีกเลี่ยงสิ่งแปลกปลอมจากความลึก ช่วง: -1.0 - 1.0
