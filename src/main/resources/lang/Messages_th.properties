# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=ความลึกการซูมที่มองเห็นกริดย่อย
settings.ui_grid_small_visible_zoom_depth.description=ควบคุมระยะที่กริด 1 mm ยังคงมองเห็น ค่าที่สูงขึ้น = กริด 1 mm ปรากฏเร็วขึ้น / ไกลขึ้น ช่วง: 1 - 10000
