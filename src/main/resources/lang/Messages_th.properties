# ---------------- edges ----------------
settings.ui_edges_enabled=เปิดใช้ขอบลักษณะเฉพาะ
settings.ui_edges_enabled.description=วาดรูปทรงเข้มตามขอบคมจริงของวัตถุ CSG ขอบเขตโพลีกอนที่ระนาบเดียวกันจะถูกละเว้น ตั้งค่า enabled=false เพื่อลบขอบออกทั้งหมด
