settings.ui_grid_small_line_width_px.description=ความหนาของเส้นกริดในหน่วยพิกเซลเท็กซ์เจอร์แบบเดิมของกริด ค่าทางประวัติศาสตร์ปัจจุบันคือ 2 สำหรับ 1 mm และ 4 สำหรับ 10 mm ช่วง: 1 - 10
