settings.ui_edges_width_mode=โหมดความกว้างขอบ
settings.ui_edges_width_mode.description=screen = รักษาเส้นรอบนอกให้เกือบคงที่ในหน่วยพิกเซลหน้าจอ เหมาะที่สุดสำหรับลักษณะเส้นบางแบบ CAD ในทุกระดับการซูม world = ใช้รัศมีคงที่ในหน่วยมิลลิเมตรของฉาก
