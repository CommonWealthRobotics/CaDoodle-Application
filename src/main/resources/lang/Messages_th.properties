# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=โหมดการเคลื่อนที่ของกริด
settings.ui_grid_motion_mode.description=major = แสดงเฉพาะกริด 10 mm ที่คมชัดขณะเคลื่อนที่ และซ่อนกริด 1 mm ที่แน่นชั่วคราว กริด 1 mm จะกลับมาเมื่อการเคลื่อนที่หยุดลง all = แสดงกริดเส้นที่คมชัดทั้งสองแบบขณะเคลื่อนที่ ความต่อเนื่องทางภาพดีที่สุด แต่อาจมีต้นทุนสูงกว่า texture = พฤติกรรมดั้งเดิม: สลับรูปทรงเส้นเป็นสี่เหลี่ยมกริดแบบเท็กซ์เจอร์ขณะเคลื่อนที่ เร็วกว่า แต่อาจเกิดรอยหยัก / ลวดลายมัวเร่ hidden = ซ่อนเส้นกริดขณะเคลื่อนที่และคืนค่าเมื่อกล้องหยุด
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=ความทึบการเรนเดอร์พื้น
settings.ui_grid_ground_render_opacity.description=ความทึบของการเติมพื้นหลัก การเติมจะอยู่กับที่ในทุกระดับการซูม มีเพียงกริด 1 mm ที่แน่นเท่านั้นที่ถูกควบคุมด้วยการซูม ตั้งเป็น 0 เพื่อซ่อนการเติมโดยยังคงพื้นผิวการเลือกให้ใช้งานอยู่ ระนาบงานที่กำหนดเองจะละเว้นการตั้งค่านี้ ช่วง: 0.0 - 1.0
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=ความไวต่ำสุดของการโคจรกล้อง
settings.ui_camera_orbit_min.description=ความไวการหมุนเป็นองศาต่อหน่วยพิกัดเมาส์ของ JavaFX min ควบคุมการลากที่ช้ามาก ช่วง: 0.0 - 1.0
settings.ui_camera_orbit_max=ความไวสูงสุดของการโคจรกล้อง
settings.ui_camera_orbit_max.description=ความไวการหมุนเป็นองศาต่อหน่วยพิกัดเมาส์ของ JavaFX max คือขีดจำกัดบนสำหรับการลากเร็ว ช่วง: 0.0 - 1.0
settings.ui_camera_orbit_half=ความเร็วครึ่งหนึ่งของการโคจรกล้อง
settings.ui_camera_orbit_half.description=ความเร็วเคอร์เซอร์ที่ผ่านการกรองในหน่วยพิกัด JavaFX ต่อวินาที ซึ่งความไวอยู่กึ่งกลางระหว่าง min และ max ค่าที่สูงขึ้น = การเร่งที่นุ่มนวลขึ้น ช่วง: 0 - 10000
settings.ui_camera_orbit_rise_ms=เวลาขึ้นของการโคจรกล้อง (ms)
settings.ui_camera_orbit_rise_ms.description=ค่าคงเวลา (มิลลิวินาที) สำหรับการประมาณความเร็วเคอร์เซอร์เมื่อเร่งความเร็ว riseMs ที่สูงขึ้นจะทำให้การเร่งนุ่มนวลขึ้น ช่วง: 0 - 10000
settings.ui_camera_orbit_fall_ms=เวลาลงของการโคจรกล้อง (ms)
settings.ui_camera_orbit_fall_ms.description=ค่าคงเวลา (มิลลิวินาที) สำหรับการประมาณความเร็วเคอร์เซอร์เมื่อลดความเร็ว fallMs ที่ต่ำลงจะคืนการควบคุมละเอียดได้เร็วขึ้น ทั้งสองค่าไม่เพิ่มความเฉื่อยให้กล้อง ช่วง: 0 - 10000
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=ความหน่วงการนิ่งของฉากขอบ (ms)
settings.ui_edges_scene_settle_delay_ms.description=ความหน่วงหลังการเปลี่ยนแปลงรูปทรง / การแสดงผล ค่าที่สูงขึ้นจะระงับงานได้มากขึ้นระหว่างการเล่นประวัติซ้ำอย่างรวดเร็ว ช่วง: 0 - 10000
settings.ui_edges_camera_settle_delay_ms=ความหน่วงการนิ่งของกล้องขอบ (ms)
settings.ui_edges_camera_settle_delay_ms.description=ความหน่วงหลังการเคลื่อนกล้องก่อนที่ความหนาเส้นบางในปริภูมิหน้าจอจะถูกสร้างใหม่ ช่วง: 0 - 10000
settings.ui_edges_topology_precision=ความแม่นยำโทโพโลยีขอบ
settings.ui_edges_topology_precision.description=ขั้นการควอนไทซ์ที่ใช้ปรับโทโพโลยีขอบลักษณะเฉพาะให้เป็นมาตรฐาน รูปทรงของแบบจำลองและเส้นตั้งฉากของหน้าจะไม่เปลี่ยนแปลง ช่วง: 0.0 - 1.0
settings.ui_edges_stitch_tolerance=ค่าความคลาดเคลื่อนการเย็บขอบ (mm)
settings.ui_edges_stitch_tolerance.description=ค่าความคลาดเคลื่อนการเย็บขอบเขตในหน่วยมิลลิเมตรของฉาก ใช้เฉพาะกับขอบที่ดูเหมือนเป็นหน้าเดียวหลังการเชื่อมโยงเมชแบบมีดัชนี ช่วยให้ขอบเขตที่แบ่งย่อยต่างกันแต่ตรงกันทางเรขาคณิตถูกเชื่อมต่อใหม่ก่อนตัดสินว่าเป็นขอบลักษณะเฉพาะจริงหรือไม่ ช่วง: 0.0 - 1.0
