settings.ui_lighting_mode.description=เก็บโหมดการจัดแสงไว้เพียงหนึ่งโหมดเท่านั้น 'stable' = ไฟทิศทางที่ตรึงอยู่ในปริภูมิโลก การจัดแสงไม่หมุนตามกล้อง ออกแบบมาเพื่อความเที่ยงตรงของสีและรูปทรง CAD ที่อ่านง่าย 'kevin' = การจัดแสงแบบ BowlerStudio ดั้งเดิม ใช้ไฟจุดสามดวง โดยดวงหนึ่งติดตามกล้อง การตั้งค่าไฟแบบคงที่ด้านล่างจะถูกละเว้นในโหมดนี้
