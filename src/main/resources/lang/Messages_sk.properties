# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Prvky používateľského rozhrania
settings.ui_section_lighting=Osvetlenie
settings.ui_section_edges=Charakteristické hrany
settings.ui_section_grid=Mriežka pracovnej roviny
settings.ui_section_camera=Rotácia kamery
settings.ui_section_timing=Časovanie charakteristických hrán
settings.ui_description=Popis prevzatý zo súboru scene-style.properties. Hodnota sa ukladá do ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Režim osvetlenia
settings.ui_lighting_mode.description=Používajte presne jeden režim osvetlenia. 'stable' = Pevné smerové svetlá vo svetových súradniciach. Osvetlenie sa neotáča spolu s kamerou. Navrhnuté pre dobrú vernosť farieb a čitateľnú geometriu CAD. 'kevin' = Pôvodné osvetlenie BowlerStudio. Používa tri bodové svetlá; jedno sleduje kameru. Nižšie uvedené nastavenia stabilného svetla sa v tomto režime ignorujú.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Svetlo okolia
settings.ui_lighting_ambient.description=Svetlo okolia pôsobí rovnako na každý viditeľný povrch. Vyššie: svetlejšie tiene, farby zostávajú bližšie k základnej farbe, ale povrchy vyzerajú plochšie. Nižšie: silnejšie tieňovanie a oddelenie povrchov, ale farby v tieni stmavnú.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Hlavné svetlo povolené
settings.ui_lighting_key_enabled.description=Hlavné svetlo opisujúce tvar objektu. Nastavte enabled=false, aby ste toto svetlo úplne odstránili.
settings.ui_lighting_key_intensity=Intenzita hlavného svetla
settings.ui_lighting_key_intensity.description=Intenzita hlavného svetla. Rozsah: 0.0 - 1.0.
settings.ui_lighting_key_x=Hlavné svetlo X
settings.ui_lighting_key_x.description=Smer hlavného svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
settings.ui_lighting_key_y=Hlavné svetlo Y
settings.ui_lighting_key_y.description=Smer hlavného svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
settings.ui_lighting_key_z=Hlavné svetlo Z
settings.ui_lighting_key_z.description=Smer hlavného svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Doplnkové svetlo povolené
settings.ui_lighting_fill_enabled.description=Zmierňuje tieňovú stranu vytvorenú hlavným svetlom. Nastavte enabled=false, aby ste toto svetlo úplne odstránili.
settings.ui_lighting_fill_intensity=Intenzita doplnkového svetla
settings.ui_lighting_fill_intensity.description=Vyššia intenzita: lepšia vernosť farieb, mäkšie tieňovanie. Nižšia intenzita: väčší rozdiel medzi rôzne orientovanými stenami. Rozsah: 0.0 - 1.0.
settings.ui_lighting_fill_x=Doplnkové svetlo X
settings.ui_lighting_fill_x.description=Smer doplnkového svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
settings.ui_lighting_fill_y=Doplnkové svetlo Y
settings.ui_lighting_fill_y.description=Smer doplnkového svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
settings.ui_lighting_fill_z=Doplnkové svetlo Z
settings.ui_lighting_fill_z.description=Smer doplnkového svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Obrysové svetlo povolené
settings.ui_lighting_rim_enabled.description=Slabé sekundárne svetlo pomáhajúce oddeliť niektoré povrchy. Zvyčajne by malo zostať jemné. Nastavte enabled=false, aby ste toto svetlo úplne odstránili.
settings.ui_lighting_rim_intensity=Intenzita obrysového svetla
settings.ui_lighting_rim_intensity.description=Slabé sekundárne svetlo pomáhajúce oddeliť niektoré povrchy. Zvyčajne by malo zostať jemné. Rozsah: 0.0 - 1.0.
settings.ui_lighting_rim_x=Obrysové svetlo X
settings.ui_lighting_rim_x.description=Smer obrysového svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
settings.ui_lighting_rim_y=Obrysové svetlo Y
settings.ui_lighting_rim_y.description=Smer obrysového svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
settings.ui_lighting_rim_z=Obrysové svetlo Z
settings.ui_lighting_rim_z.description=Smer obrysového svetla vo svetových súradniciach. Rozsah: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Charakteristické hrany povolené
settings.ui_edges_enabled.description=Kreslí tmavú geometriu pozdĺž skutočných ostrých hrán objektov CSG. Hranice koplanárnych polygónov sa ignorujú. Nastavte enabled=false, aby ste hrany úplne odstránili.
settings.ui_edges_angle_degrees=Uhol hrany v stupňoch
settings.ui_edges_angle_degrees.description=Minimálny uhol medzi susednými stenami, po ktorom sa ich spoločná hrana vykreslí. Vyššie hodnoty vytvárajú menej čiar zlomu. Rozsah: 0 - 360.
settings.ui_edges_width_mode=Režim šírky hrán
settings.ui_edges_width_mode.description=screen = Udržiava obrys približne konštantný v pixeloch obrazovky. Najlepšie pre vzhľad jemnej čiary v štýle CAD pri akomkoľvek priblížení. world = Používa pevný polomer v milimetroch scény.
settings.ui_edges_width_px=Šírka hrany v pixeloch
settings.ui_edges_width_px.description=Šírka viditeľnej čiary, keď widthMode=screen. Rozsah: 0.1 - 10.0.
settings.ui_edges_radius=Polomer hrany
settings.ui_edges_radius.description=Polomer hrany v priestore sveta v milimetroch scény. Používa sa len keď widthMode=world. Rozsah: 0.001 - 100.0.
settings.ui_edges_brightness=Jas hrany
settings.ui_edges_brightness.description=0.0 = čierna, 1.0 = biela. Rozsah: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Hĺbka viditeľnosti malej mriežky
settings.ui_grid_small_visible_zoom_depth.description=Určuje, ako ďaleko zostáva mriežka 1 mm viditeľná. Vyššia hodnota = mriežka 1 mm sa objaví skôr / ďalej. Rozsah: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Násobok jasu malej mriežky
settings.ui_grid_small_brightness_multiplier.description=Násobí jas RGB pri zachovaní odtieňa témy. 1.0 = pôvodná farba témy. < 1.0 = tmavšia. > 1.0 = svetlejšia. Rozsah: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Násobok krytia malej mriežky
settings.ui_grid_small_opacity_multiplier.description=Násobí alfa hodnotu poskytnutú aktuálnou témou. 1.0 = nezmenené. Rozsah: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Šírka čiary malej mriežky (px)
settings.ui_grid_small_line_width_px.description=Hrúbka čiary mriežky v pôvodných jednotkách textúrových pixelov mriežky. Aktuálne historické hodnoty sú 2 pre 1 mm a 4 pre 10 mm. Rozsah: 1 - 10.
settings.ui_grid_small_z_offset_mm=Posun Z malej mriežky (mm)
settings.ui_grid_small_z_offset_mm.description=Udržujte mriežku 1 mm tesne za mriežkou 10 mm, aby ste sa vyhli artefaktom hĺbky. Rozsah: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Násobok jasu hlavnej mriežky
settings.ui_grid_major_brightness_multiplier.description=Násobí jas RGB pri zachovaní odtieňa témy. 1.0 = pôvodná farba témy. < 1.0 = tmavšia. > 1.0 = svetlejšia. Rozsah: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Násobok krytia hlavnej mriežky
settings.ui_grid_major_opacity_multiplier.description=Násobí alfa hodnotu poskytnutú aktuálnou témou. 1.0 = nezmenené. Rozsah: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Šírka čiary hlavnej mriežky (px)
settings.ui_grid_major_line_width_px.description=Hrúbka čiary mriežky v pôvodných jednotkách textúrových pixelov mriežky. Aktuálne historické hodnoty sú 2 pre 1 mm a 4 pre 10 mm. Rozsah: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Režim pohybu mriežky
settings.ui_grid_motion_mode.description=major = Počas pohybu nechajte viditeľnú len ostrú mriežku 10 mm a dočasne skryte hustú mriežku 1 mm. Mriežka 1 mm sa vráti po zastavení pohybu. all = Počas pohybu nechajte viditeľné obe ostré čiarové mriežky. Najlepšia vizuálna kontinuita, ale potenciálne nákladnejšia. texture = Pôvodné správanie: počas pohybu nahraďte geometriu čiar textúrovanými štvorcami mriežky. Rýchlejšie, ale môže spôsobiť schodkovanie hrán / moaré vzory. hidden = Počas pohybu skryte čiary mriežky a obnovte ich, keď sa kamera zastaví.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Krytie vykreslenia podkladu
settings.ui_grid_ground_render_opacity.description=Krytie hlavnej výplne podkladu. Výplň zostáva na mieste pri každom priblížení; len hustá mriežka 1 mm je závislá od priblíženia. Nastavte 0 na skrytie výplne pri zachovaní aktívneho povrchu na výber. Vlastné pracovné roviny toto nastavenie ignorujú. Rozsah: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Minimálna citlivosť rotácie kamery
settings.ui_camera_orbit_min.description=Citlivosť rotácie v stupňoch na jednotku súradnice myši JavaFX. min riadi veľmi pomalé ťahanie. Rozsah: 0.0 - 1.0.
settings.ui_camera_orbit_max=Maximálna citlivosť rotácie kamery
settings.ui_camera_orbit_max.description=Citlivosť rotácie v stupňoch na jednotku súradnice myši JavaFX. max je horný limit pre rýchle ťahanie. Rozsah: 0.0 - 1.0.
settings.ui_camera_orbit_half=Polovičná rýchlosť rotácie kamery
settings.ui_camera_orbit_half.description=Filtrovaná rýchlosť kurzora v jednotkách súradníc JavaFX za sekundu, pri ktorej je citlivosť na polceste medzi min a max. Vyššia = jemnejšie zrýchlenie. Rozsah: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Čas nábehu rotácie kamery (ms)
settings.ui_camera_orbit_rise_ms.description=Časové konštanty (milisekundy) pre odhad rýchlosti kurzora pri zrýchľovaní. Vyššie riseMs zmierňuje zrýchlenie. Rozsah: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Čas poklesu rotácie kamery (ms)
settings.ui_camera_orbit_fall_ms.description=Časové konštanty (milisekundy) pre odhad rýchlosti kurzora pri spomaľovaní. Nižšie fallMs skôr obnoví presnú kontrolu. Ani jedno nepridáva zotrvačnosť kamery. Rozsah: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Oneskorenie ustálenia scény pre hrany (ms)
settings.ui_edges_scene_settle_delay_ms.description=Oneskorenie po zmenách geometrie/zobrazenia. Vyššie hodnoty potlačia viac práce pri rýchlom prehrávaní histórie. Rozsah: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Oneskorenie ustálenia kamery pre hrany (ms)
settings.ui_edges_camera_settle_delay_ms.description=Oneskorenie po pohybe kamery, kým sa obnoví hrúbka jemnej čiary v priestore obrazovky. Rozsah: 0 - 10000.
settings.ui_edges_topology_precision=Presnosť topológie hrán
settings.ui_edges_topology_precision.description=Krok kvantovania používaný na normalizáciu topológie charakteristických hrán. Geometria modelu a normály stien zostávajú nezmenené. Rozsah: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerancia zošívania hrán (mm)
settings.ui_edges_stitch_tolerance.description=Tolerancia zošívania hraníc v milimetroch scény. Používa sa len pre zdanlivé hrany jednej steny po analýze susednosti indexovanej siete. Umožňuje znovu spojiť rôzne rozdelené, ale geometricky zhodné hranice pred rozhodnutím, či ide o skutočné charakteristické hrany. Rozsah: 0.0 - 1.0.
