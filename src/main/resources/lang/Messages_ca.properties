# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elements d'interfície
settings.ui_section_lighting=Il·luminació
settings.ui_section_edges=Arestes característiques
settings.ui_section_grid=Graella del pla de treball
settings.ui_section_camera=Òrbita de la càmera
settings.ui_section_timing=Temporització de les arestes característiques
settings.ui_description=Descripció presa de scene-style.properties. El valor es desa a ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Mode d'il·luminació
settings.ui_lighting_mode.description=Mantén exactament un mode d'il·luminació. 'stable' = Llums direccionals fixes a l'espai món. La il·luminació no gira amb la càmera. Dissenyat per a una bona fidelitat de color i una geometria CAD llegible. 'kevin' = Il·luminació original de BowlerStudio. Fa servir tres llums puntuals; una segueix la càmera. Els ajustos de llums estables d'aquí sota s'ignoren en aquest mode.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Llum ambiental
settings.ui_lighting_ambient.description=La llum ambiental afecta per igual totes les superfícies visibles. Més alta: ombres més clares, els colors es mantenen més a prop del seu color base, però les superfícies es veuen més planes. Més baixa: ombrejat i separació de superfícies més forts, però els colors a l'ombra es tornen més foscos.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Llum principal activada
settings.ui_lighting_key_enabled.description=Llum principal que descriu la forma de l'objecte. Posa enabled=false per eliminar completament aquesta llum.
settings.ui_lighting_key_intensity=Intensitat de la llum principal
settings.ui_lighting_key_intensity.description=Intensitat de la llum principal. Rang: 0.0 - 1.0.
settings.ui_lighting_key_x=Llum principal X
settings.ui_lighting_key_x.description=Direcció de la llum principal en coordenades món. Rang: -1.0 - 1.0.
settings.ui_lighting_key_y=Llum principal Y
settings.ui_lighting_key_y.description=Direcció de la llum principal en coordenades món. Rang: -1.0 - 1.0.
settings.ui_lighting_key_z=Llum principal Z
settings.ui_lighting_key_z.description=Direcció de la llum principal en coordenades món. Rang: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Llum d'ompliment activada
settings.ui_lighting_fill_enabled.description=Suavitza el costat en ombra creat per la llum principal. Posa enabled=false per eliminar completament aquesta llum.
settings.ui_lighting_fill_intensity=Intensitat de la llum d'ompliment
settings.ui_lighting_fill_intensity.description=Més intensitat: millor fidelitat de color, ombrejat més suau. Menys intensitat: més diferència entre cares amb orientacions diferents. Rang: 0.0 - 1.0.
settings.ui_lighting_fill_x=Llum d'ompliment X
settings.ui_lighting_fill_x.description=Direcció de la llum d'ompliment en coordenades món. Rang: -1.0 - 1.0.
settings.ui_lighting_fill_y=Llum d'ompliment Y
settings.ui_lighting_fill_y.description=Direcció de la llum d'ompliment en coordenades món. Rang: -1.0 - 1.0.
settings.ui_lighting_fill_z=Llum d'ompliment Z
settings.ui_lighting_fill_z.description=Direcció de la llum d'ompliment en coordenades món. Rang: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Llum de contorn activada
settings.ui_lighting_rim_enabled.description=Llum secundària feble que ajuda a separar algunes superfícies. Normalment hauria de ser subtil. Posa enabled=false per eliminar completament aquesta llum.
settings.ui_lighting_rim_intensity=Intensitat de la llum de contorn
settings.ui_lighting_rim_intensity.description=Llum secundària feble que ajuda a separar algunes superfícies. Normalment hauria de ser subtil. Rang: 0.0 - 1.0.
settings.ui_lighting_rim_x=Llum de contorn X
settings.ui_lighting_rim_x.description=Direcció de la llum de contorn en coordenades món. Rang: -1.0 - 1.0.
settings.ui_lighting_rim_y=Llum de contorn Y
settings.ui_lighting_rim_y.description=Direcció de la llum de contorn en coordenades món. Rang: -1.0 - 1.0.
settings.ui_lighting_rim_z=Llum de contorn Z
settings.ui_lighting_rim_z.description=Direcció de la llum de contorn en coordenades món. Rang: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Arestes característiques activades
settings.ui_edges_enabled.description=Dibuixa geometria fosca al llarg de les arestes realment esmolades dels objectes CSG. Els límits de polígons coplanaris s'ignoren. Posa enabled=false per eliminar completament les arestes.
settings.ui_edges_angle_degrees=Angle de l'aresta (graus)
settings.ui_edges_angle_degrees.description=Angle mínim entre cares veïnes abans de dibuixar la seva aresta compartida. Valors més alts produeixen menys línies de plec. Rang: 0 - 360.
settings.ui_edges_width_mode=Mode d'amplada de l'aresta
settings.ui_edges_width_mode.description=screen = Manté el contorn aproximadament constant en píxels de pantalla. El millor per a un aspecte de línia fina estil CAD a qualsevol nivell de zoom. world = Fa servir un radi fix en mil·límetres de l'escena.
settings.ui_edges_width_px=Amplada de l'aresta (píxels)
settings.ui_edges_width_px.description=Amplada visible de la línia quan widthMode=screen. Rang: 0.1 - 10.0.
settings.ui_edges_radius=Radi de l'aresta
settings.ui_edges_radius.description=Radi de l'aresta a l'espai món, en mil·límetres de l'escena. Només s'usa quan widthMode=world. Rang: 0.001 - 100.0.
settings.ui_edges_brightness=Brillantor de l'aresta
settings.ui_edges_brightness.description=0.0 = negre, 1.0 = blanc. Rang: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Profunditat de zoom visible de la graella petita
settings.ui_grid_small_visible_zoom_depth.description=Controla a quina distància la graella d'1 mm continua essent visible. Valor més alt = la graella d'1 mm apareix abans / més lluny. Rang: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Multiplicador de brillantor de la graella petita
settings.ui_grid_small_brightness_multiplier.description=Multiplica la brillantor RGB tot conservant el to del tema. 1.0 = color original del tema. < 1.0 = més fosc. > 1.0 = més clar. Rang: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Multiplicador d'opacitat de la graella petita
settings.ui_grid_small_opacity_multiplier.description=Multiplica l'alfa que proporciona el tema actual. 1.0 = sense canvis. Rang: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Amplada de línia de la graella petita (px)
settings.ui_grid_small_line_width_px.description=Gruix de les línies de la graella en les antigues unitats de píxel de textura de la graella. Els valors històrics actuals són 2 per a 1 mm i 4 per a 10 mm. Rang: 1 - 10.
settings.ui_grid_small_z_offset_mm=Desplaçament Z de la graella petita (mm)
settings.ui_grid_small_z_offset_mm.description=Mantén la graella d'1 mm just darrere de la de 10 mm per evitar artefactes de profunditat. Rang: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Multiplicador de brillantor de la graella principal
settings.ui_grid_major_brightness_multiplier.description=Multiplica la brillantor RGB tot conservant el to del tema. 1.0 = color original del tema. < 1.0 = més fosc. > 1.0 = més clar. Rang: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Multiplicador d'opacitat de la graella principal
settings.ui_grid_major_opacity_multiplier.description=Multiplica l'alfa que proporciona el tema actual. 1.0 = sense canvis. Rang: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Amplada de línia de la graella principal (px)
settings.ui_grid_major_line_width_px.description=Gruix de les línies de la graella en les antigues unitats de píxel de textura de la graella. Els valors històrics actuals són 2 per a 1 mm i 4 per a 10 mm. Rang: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Mode de moviment de la graella
settings.ui_grid_motion_mode.description=major = Manté visible només la graella nítida de 10 mm durant el moviment i amaga temporalment la graella densa d'1 mm. La graella d'1 mm torna quan s'atura el moviment. all = Manté visibles les dues graelles de línies nítides durant el moviment. Millor continuïtat visual, però potencialment més costós. texture = Comportament original: canvia la geometria de línies per quadrilàters de graella texturitzats durant el moviment. Més ràpid, però pot produir aliasing / patrons de moaré. hidden = Amaga les línies de la graella durant el moviment i les restaura quan la càmera s'atura.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacitat del terra
settings.ui_grid_ground_render_opacity.description=Opacitat del farciment principal del terra. El farciment es manté al seu lloc a tots els nivells de zoom; només la graella densa d'1 mm depèn del zoom. Posa 0 per amagar el farciment mantenint activa la seva superfície de selecció. Els plans de treball personalitzats ignoren aquest ajust. Rang: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensibilitat mínima de l'òrbita de la càmera
settings.ui_camera_orbit_min.description=Sensibilitat de rotació en graus per unitat de coordenada de ratolí de JavaFX. min controla els arrossegaments molt lents. Rang: 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensibilitat màxima de l'òrbita de la càmera
settings.ui_camera_orbit_max.description=Sensibilitat de rotació en graus per unitat de coordenada de ratolí de JavaFX. max és un límit superior per als arrossegaments ràpids. Rang: 0.0 - 1.0.
settings.ui_camera_orbit_half=Velocitat mitjana de l'òrbita de la càmera
settings.ui_camera_orbit_half.description=Velocitat filtrada del cursor, en unitats de coordenada de JavaFX per segon, a la qual la sensibilitat és a mig camí entre min i max. Més alt = acceleració més suau. Rang: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Temps de pujada de l'òrbita de la càmera (ms)
settings.ui_camera_orbit_rise_ms.description=Constants de temps (mil·lisegons) per a l'estimació de la velocitat del cursor en accelerar. Un riseMs més alt suavitza l'acceleració. Rang: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Temps de baixada de l'òrbita de la càmera (ms)
settings.ui_camera_orbit_fall_ms.description=Constants de temps (mil·lisegons) per a l'estimació de la velocitat del cursor en frenar. Un fallMs més baix recupera abans el control fi. Cap dels dos afegeix inèrcia a la càmera. Rang: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Retard d'estabilització de l'escena d'arestes (ms)
settings.ui_edges_scene_settle_delay_ms.description=Retard després de canvis de geometria o visualització. Valors més alts suprimeixen més feina durant la reproducció ràpida de l'historial. Rang: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Retard d'estabilització de la càmera d'arestes (ms)
settings.ui_edges_camera_settle_delay_ms.description=Retard després del moviment de la càmera abans de reconstruir el gruix de la línia fina a l'espai de pantalla. Rang: 0 - 10000.
settings.ui_edges_topology_precision=Precisió de topologia de les arestes
settings.ui_edges_topology_precision.description=Pas de quantització emprat per normalitzar la topologia de les arestes característiques. La geometria del model i les normals de les cares no canvien. Rang: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerància de costura de les arestes (mm)
settings.ui_edges_stitch_tolerance.description=Tolerància de costura de límits en mil·límetres de l'escena. Només s'usa per a arestes aparents d'una sola cara després de l'adjacència de la malla indexada. Permet reconectar vores subdividides de manera diferent però geomètricament coincidents abans de decidir si són arestes característiques reals. Rang: 0.0 - 1.0.
