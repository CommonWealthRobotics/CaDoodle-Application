settings.ui_edges_enabled=ફીચર કિનારીઓ સક્ષમ
settings.ui_edges_enabled.description=CSG ઑબ્જેક્ટ્સની વાસ્તવિક તીવ્ર કિનારીઓ પર ઘેરી ભૂમિતિ દોરો. સમતલીય બહુકોણ સીમાઓ અવગણવામાં આવે છે. કિનારીઓ સંપૂર્ણપણે દૂર કરવા enabled=false સેટ કરો.
settings.ui_edges_angle_degrees=કિનારીનો કોણ (ડિગ્રી)
settings.ui_edges_angle_degrees.description=પડોશી ફલકો વચ્ચેનો લઘુત્તમ કોણ, જે પછી તેમની સામાન્ય કિનારી દોરવામાં આવે છે. વધુ મૂલ્યો ઓછી ક્રીઝ રેખાઓ બનાવે છે. શ્રેણી: 0 - 360.
settings.ui_edges_width_mode=કિનારી પહોળાઈ મોડ
settings.ui_edges_width_mode.description=screen = રૂપરેખાને સ્ક્રીન પિક્સેલમાં લગભગ સ્થિર રાખે છે. કોઈપણ ઝૂમ સ્તરે CAD-શૈલી હેરલાઇન દેખાવ માટે શ્રેષ્ઠ. world = દૃશ્ય મિલિમીટરમાં નિશ્ચિત ત્રિજ્યા વાપરે છે.
settings.ui_edges_width_px=કિનારી પહોળાઈ પિક્સેલ
settings.ui_edges_width_px.description=widthMode=screen હોય ત્યારે દૃશ્યમાન રેખાની પહોળાઈ. શ્રેણી: 0.1 - 10.0.
settings.ui_edges_radius=કિનારીની ત્રિજ્યા
settings.ui_edges_radius.description=દૃશ્ય મિલિમીટરમાં વિશ્વ-અવકાશ કિનારીની ત્રિજ્યા. ફક્ત ત્યારે વપરાય છે જ્યારે widthMode=world હોય. શ્રેણી: 0.001 - 100.0.
