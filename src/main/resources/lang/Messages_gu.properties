settings.ui_grid_small_line_width_px.description=ગ્રિડની લેગસી ટેક્સચર-પિક્સેલ એકમોમાં ગ્રિડ રેખાની જાડાઈ. વર્તમાન ઐતિહાસિક મૂલ્યો 1 mm માટે 2 અને 10 mm માટે 4 છે. શ્રેણી: 1 - 10.
