settings.ui_lighting_key_x.description=વિશ્વ કોઓર્ડિનેટ્સમાં મુખ્ય પ્રકાશની દિશા. શ્રેણી: -1.0 - 1.0.
settings.ui_lighting_key_y=મુખ્ય પ્રકાશ Y
