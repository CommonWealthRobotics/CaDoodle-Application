# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ગ્રિડ ગતિ મોડ
settings.ui_grid_motion_mode.description=major = હલનચલન દરમિયાન ફક્ત સ્પષ્ટ 10 mm ગ્રિડ દૃશ્યમાન રાખો અને ગાઢ 1 mm ગ્રિડ કામચલાઉ છુપાવો. હલનચલન બંધ થાય પછી 1 mm ગ્રિડ પાછી આવે છે. all = હલનચલન દરમિયાન બંને સ્પષ્ટ રેખા ગ્રિડ દૃશ્યમાન રાખો. શ્રેષ્ઠ દૃશ્ય સાતત્ય, પણ સંભવિત રીતે વધુ ખર્ચાળ. texture = મૂળ વર્તન: હલનચલન દરમિયાન રેખા ભૂમિતિને બદલે ટેક્સચરવાળા ગ્રિડ ક્વૉડ્સ વાપરો. ઝડપી, પણ એલિયાસિંગ / મોઇરે પેટર્ન બનાવી શકે છે. hidden = હલનચલન દરમિયાન ગ્રિડ રેખાઓ છુપાવો અને કેમેરા અટકે ત્યારે તેમને પુનઃસ્થાપિત કરો.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=ગ્રાઉન્ડ રેન્ડર અપારદર્શકતા
settings.ui_grid_ground_render_opacity.description=મુખ્ય ગ્રાઉન્ડ ભરણની અપારદર્શકતા. ભરણ દરેક ઝૂમ સ્તરે પોતાની જગ્યાએ રહે છે; ફક્ત ગાઢ 1 mm ગ્રિડ ઝૂમ પર આધારિત છે. ભરણ છુપાવીને તેની પિકિંગ સપાટી સક્રિય રાખવા 0 પર સેટ કરો. કસ્ટમ વર્કપ્લેન આ સેટિંગ અવગણે છે. શ્રેણી: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=કેમેરા ઓર્બિટ લઘુત્તમ સંવેદનશીલતા
settings.ui_camera_orbit_min.description=JavaFX માઉસ-કોઓર્ડિનેટ એકમ દીઠ ડિગ્રીમાં પરિભ્રમણ સંવેદનશીલતા. min ખૂબ ધીમા ખેંચાણને નિયંત્રિત કરે છે. શ્રેણી: 0.0 - 1.0.
settings.ui_camera_orbit_max=કેમેરા ઓર્બિટ મહત્તમ સંવેદનશીલતા
settings.ui_camera_orbit_max.description=JavaFX માઉસ-કોઓર્ડિનેટ એકમ દીઠ ડિગ્રીમાં પરિભ્રમણ સંવેદનશીલતા. max ઝડપી ખેંચાણ માટે ઉપલી મર્યાદા છે. શ્રેણી: 0.0 - 1.0.
settings.ui_camera_orbit_half=કેમેરા ઓર્બિટ અડધી ગતિ
settings.ui_camera_orbit_half.description=ફિલ્ટર કરેલ કર્સર ગતિ (JavaFX કોઓર્ડિનેટ એકમ પ્રતિ સેકન્ડ) જેના પર સંવેદનશીલતા min અને max વચ્ચે અડધી હોય છે. વધુ = નરમ પ્રવેગ. શ્રેણી: 0 - 10000.
settings.ui_camera_orbit_rise_ms=કેમેરા ઓર્બિટ રાઇઝ સમય (ms)
settings.ui_camera_orbit_rise_ms.description=ગતિ વધારતી વખતે કર્સર-ગતિ અંદાજ માટે સમય સ્થિરાંકો (મિલિસેકન્ડ). વધુ riseMs પ્રવેગને નરમ બનાવે છે. શ્રેણી: 0 - 10000.
settings.ui_camera_orbit_fall_ms=કેમેરા ઓર્બિટ ફૉલ સમય (ms)
settings.ui_camera_orbit_fall_ms.description=ગતિ ઘટાડતી વખતે કર્સર-ગતિ અંદાજ માટે સમય સ્થિરાંકો (મિલિસેકન્ડ). ઓછો fallMs સૂક્ષ્મ નિયંત્રણ જલદી પુનઃસ્થાપિત કરે છે. આમાંથી કોઈ પણ કેમેરા જડતા ઉમેરતું નથી. શ્રેણી: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=કિનારી દૃશ્ય સ્થિરતા વિલંબ (ms)
settings.ui_edges_scene_settle_delay_ms.description=ભૂમિતિ/પ્રદર્શન ફેરફારો પછીનો વિલંબ. વધુ મૂલ્યો ઝડપી ઇતિહાસ રીપ્લે દરમિયાન વધુ કાર્ય દબાવે છે. શ્રેણી: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=કિનારી કેમેરા સ્થિરતા વિલંબ (ms)
settings.ui_edges_camera_settle_delay_ms.description=કેમેરા હલનચલન પછીનો વિલંબ, જે પછી સ્ક્રીન-અવકાશ હેરલાઇન જાડાઈ ફરી બને છે. શ્રેણી: 0 - 10000.
settings.ui_edges_topology_precision=કિનારી ટોપોલોજી ચોકસાઈ
settings.ui_edges_topology_precision.description=ફીચર-કિનારી ટોપોલોજીને સામાન્ય બનાવવા વપરાતું ક્વોન્ટાઇઝેશન પગલું. મોડેલ ભૂમિતિ અને ફલક નોર્મલ્સ અપરિવર્તિત રહે છે. શ્રેણી: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=કિનારી સ્ટિચ સહનશીલતા (mm)
settings.ui_edges_stitch_tolerance.description=દૃશ્ય મિલિમીટરમાં સીમા સ્ટિચિંગ સહનશીલતા. ફક્ત ઇન્ડેક્સ્ડ-મેશ સામીપ્ય પછી દેખાતી એક-ફલક કિનારીઓ માટે વપરાય છે. તે જુદી રીતે ઉપવિભાજિત પણ ભૌમિતિક રીતે સંપાતી સીમાઓને ફરી જોડવા દે છે, તે પહેલાં કે તેઓ ખરેખર ફીચર કિનારીઓ છે કે નહીં તે નક્કી થાય. શ્રેણી: 0.0 - 1.0.
