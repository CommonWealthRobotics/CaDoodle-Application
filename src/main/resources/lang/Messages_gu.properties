# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=પ્રકાશ મોડ
settings.ui_lighting_mode.description=બરાબર એક પ્રકાશ મોડ રાખો. 'stable' = સ્થિર વિશ્વ-અવકાશ દિશાત્મક પ્રકાશ. પ્રકાશ કેમેરા સાથે ફરતો નથી. સારી રંગ-નિષ્ઠા અને વાંચી શકાય તેવી CAD ભૂમિતિ માટે બનાવેલ. 'kevin' = મૂળ BowlerStudio પ્રકાશ. ત્રણ પોઇન્ટ પ્રકાશ વાપરે છે; એક કેમેરાને અનુસરે છે. આ મોડમાં નીચેની સ્થિર-પ્રકાશ સેટિંગ્સ અવગણવામાં આવે છે.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=આસપાસનો પ્રકાશ
settings.ui_lighting_ambient.description=આસપાસનો પ્રકાશ દરેક દૃશ્યમાન સપાટીને સમાન રીતે અસર કરે છે. વધુ: તેજસ્વી પડછાયા, રંગો તેમના મૂળ રંગની નજીક રહે છે, પણ સપાટીઓ સપાટ દેખાય છે. ઓછું: વધુ મજબૂત શેડિંગ અને સપાટીઓ વચ્ચે વધુ અલગતા, પણ પડછાયાવાળા રંગો ઘેરા થાય છે.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=મુખ્ય પ્રકાશ સક્ષમ
settings.ui_lighting_key_enabled.description=ઑબ્જેક્ટનો આકાર દર્શાવવા વપરાતો મુખ્ય પ્રકાશ. આ પ્રકાશ સંપૂર્ણપણે દૂર કરવા enabled=false સેટ કરો.
