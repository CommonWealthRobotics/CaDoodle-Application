settings.ui_edges_brightness.description=0.0 = કાળો, 1.0 = સફેદ. શ્રેણી: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=નાની ગ્રિડ દૃશ્યતા ઝૂમ ઊંડાઈ
settings.ui_grid_small_visible_zoom_depth.description=1 mm ગ્રિડ કેટલે દૂર સુધી દૃશ્યમાન રહે છે તે નિયંત્રિત કરે છે. વધુ મૂલ્ય = 1 mm ગ્રિડ વહેલા / વધુ દૂરથી દેખાય છે. શ્રેણી: 1 - 10000.
