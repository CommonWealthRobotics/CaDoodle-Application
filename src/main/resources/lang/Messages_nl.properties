# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=UI-elementen
settings.ui_section_lighting=Verlichting
settings.ui_section_edges=Kenmerkende randen
settings.ui_section_grid=Werkvlakraster
settings.ui_section_camera=Camera-orbit
settings.ui_section_timing=Timing van kenmerkende randen
settings.ui_description=Beschrijving overgenomen uit scene-style.properties. De waarde wordt opgeslagen in ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Verlichtingsmodus
settings.ui_lighting_mode.description=Houd precies één verlichtingsmodus aan. 'stable' = Vaste directionele lichten in wereldruimte. De verlichting draait niet mee met de camera. Ontworpen voor goede kleurgetrouwheid en leesbare CAD-geometrie. 'kevin' = Oorspronkelijke verlichting van BowlerStudio. Gebruikt drie puntlichten; één volgt de camera. De instellingen voor stabiel licht hieronder worden in deze modus genegeerd.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Omgevingslicht
settings.ui_lighting_ambient.description=Omgevingslicht beïnvloedt elk zichtbaar oppervlak gelijkmatig. Hoger: lichtere schaduwen, kleuren blijven dichter bij hun basiskleur, maar oppervlakken lijken vlakker. Lager: sterkere schaduwvorming en oppervlaktescheiding, maar kleuren in de schaduw worden donkerder.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Hoofdlicht ingeschakeld
settings.ui_lighting_key_enabled.description=Hoofdlicht dat de vorm van het object beschrijft. Zet enabled=false om dit licht volledig te verwijderen.
settings.ui_lighting_key_intensity=Intensiteit hoofdlicht
settings.ui_lighting_key_intensity.description=Intensiteit van het hoofdlicht. Bereik: 0.0 - 1.0.
settings.ui_lighting_key_x=Hoofdlicht X
settings.ui_lighting_key_x.description=Richting van het hoofdlicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
settings.ui_lighting_key_y=Hoofdlicht Y
settings.ui_lighting_key_y.description=Richting van het hoofdlicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
settings.ui_lighting_key_z=Hoofdlicht Z
settings.ui_lighting_key_z.description=Richting van het hoofdlicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Vullicht ingeschakeld
settings.ui_lighting_fill_enabled.description=Verzacht de schaduwzijde die door het hoofdlicht ontstaat. Zet enabled=false om dit licht volledig te verwijderen.
settings.ui_lighting_fill_intensity=Intensiteit vullicht
settings.ui_lighting_fill_intensity.description=Hogere intensiteit: betere kleurgetrouwheid, zachtere schaduwvorming. Lagere intensiteit: sterker verschil tussen verschillend georiënteerde vlakken. Bereik: 0.0 - 1.0.
settings.ui_lighting_fill_x=Vullicht X
settings.ui_lighting_fill_x.description=Richting van het vullicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
settings.ui_lighting_fill_y=Vullicht Y
settings.ui_lighting_fill_y.description=Richting van het vullicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
settings.ui_lighting_fill_z=Vullicht Z
settings.ui_lighting_fill_z.description=Richting van het vullicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Randlicht ingeschakeld
settings.ui_lighting_rim_enabled.description=Zwak secundair licht dat helpt sommige oppervlakken te scheiden. Dit moet normaal subtiel blijven. Zet enabled=false om dit licht volledig te verwijderen.
settings.ui_lighting_rim_intensity=Intensiteit randlicht
settings.ui_lighting_rim_intensity.description=Zwak secundair licht dat helpt sommige oppervlakken te scheiden. Dit moet normaal subtiel blijven. Bereik: 0.0 - 1.0.
settings.ui_lighting_rim_x=Randlicht X
settings.ui_lighting_rim_x.description=Richting van het randlicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
settings.ui_lighting_rim_y=Randlicht Y
settings.ui_lighting_rim_y.description=Richting van het randlicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
settings.ui_lighting_rim_z=Randlicht Z
settings.ui_lighting_rim_z.description=Richting van het randlicht in wereldcoördinaten. Bereik: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Kenmerkende randen ingeschakeld
settings.ui_edges_enabled.description=Tekent donkere geometrie langs echte scherpe randen van CSG-objecten. Grenzen van coplanaire polygonen worden genegeerd. Zet enabled=false om de randen volledig te verwijderen.
settings.ui_edges_angle_degrees=Randhoek (graden)
settings.ui_edges_angle_degrees.description=Minimale hoek tussen naburige vlakken voordat hun gedeelde rand wordt getekend. Hogere waarden geven minder kniklijnen. Bereik: 0 - 360.
settings.ui_edges_width_mode=Modus randbreedte
settings.ui_edges_width_mode.description=screen = Houdt de omtrek ongeveer constant in schermpixels. Het beste voor een CAD-achtig haarlijnuiterlijk bij elk zoomniveau. world = Gebruikt een vaste straal in scènemillimeters.
settings.ui_edges_width_px=Randbreedte (pixels)
settings.ui_edges_width_px.description=Zichtbare lijnbreedte bij widthMode=screen. Bereik: 0.1 - 10.0.
settings.ui_edges_radius=Randstraal
settings.ui_edges_radius.description=Randstraal in wereldruimte, in scènemillimeters. Alleen gebruikt bij widthMode=world. Bereik: 0.001 - 100.0.
settings.ui_edges_brightness=Randhelderheid
settings.ui_edges_brightness.description=0.0 = zwart, 1.0 = wit. Bereik: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Zichtbare zoomdiepte van het kleine raster
settings.ui_grid_small_visible_zoom_depth.description=Bepaalt hoever weg het 1 mm-raster zichtbaar blijft. Hogere waarde = het 1 mm-raster verschijnt eerder / verder weg. Bereik: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Helderheidsfactor van het kleine raster
settings.ui_grid_small_brightness_multiplier.description=Vermenigvuldigt de RGB-helderheid met behoud van de tint van het thema. 1.0 = oorspronkelijke themakleur. < 1.0 = donkerder. > 1.0 = helderder. Bereik: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Dekkingsfactor van het kleine raster
settings.ui_grid_small_opacity_multiplier.description=Vermenigvuldigt de alpha die het huidige thema levert. 1.0 = ongewijzigd. Bereik: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Lijnbreedte van het kleine raster (px)
settings.ui_grid_small_line_width_px.description=Dikte van de rasterlijnen in de oude textuurpixel-eenheden van het raster. De huidige historische waarden zijn 2 voor 1 mm en 4 voor 10 mm. Bereik: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z-offset van het kleine raster (mm)
settings.ui_grid_small_z_offset_mm.description=Houdt het 1 mm-raster net achter het 10 mm-raster om diepte-artefacten te voorkomen. Bereik: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Helderheidsfactor van het grote raster
settings.ui_grid_major_brightness_multiplier.description=Vermenigvuldigt de RGB-helderheid met behoud van de tint van het thema. 1.0 = oorspronkelijke themakleur. < 1.0 = donkerder. > 1.0 = helderder. Bereik: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Dekkingsfactor van het grote raster
settings.ui_grid_major_opacity_multiplier.description=Vermenigvuldigt de alpha die het huidige thema levert. 1.0 = ongewijzigd. Bereik: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Lijnbreedte van het grote raster (px)
settings.ui_grid_major_line_width_px.description=Dikte van de rasterlijnen in de oude textuurpixel-eenheden van het raster. De huidige historische waarden zijn 2 voor 1 mm en 4 voor 10 mm. Bereik: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Bewegingsmodus van het raster
settings.ui_grid_motion_mode.description=major = Houd tijdens bewegen alleen het scherpe 10 mm-raster zichtbaar en verberg tijdelijk het dichte 1 mm-raster. Het 1 mm-raster komt terug zodra de beweging stopt. all = Houd tijdens bewegen beide scherpe lijnrasters zichtbaar. Beste visuele continuïteit, maar mogelijk duurder. texture = Oorspronkelijk gedrag: vervang lijngoemetrie tijdens bewegen door getextureerde rasterquads. Sneller, maar kan aliasing / moirépatronen opleveren. hidden = Verberg rasterlijnen tijdens bewegen en herstel ze wanneer de camera stopt.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Dekking van de grond
settings.ui_grid_ground_render_opacity.description=Dekking van de hoofdgrondvulling. De vulling blijft op zijn plaats bij elk zoomniveau; alleen het dichte 1 mm-raster is afhankelijk van de zoom. Zet op 0 om de vulling te verbergen terwijl het picking-oppervlak actief blijft. Aangepaste werkvlakken negeren deze instelling. Bereik: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Minimale gevoeligheid van de camera-orbit
settings.ui_camera_orbit_min.description=Rotatiegevoeligheid in graden per JavaFX-muiscoördinateneenheid. min regelt zeer langzame slepen. Bereik: 0.0 - 1.0.
settings.ui_camera_orbit_max=Maximale gevoeligheid van de camera-orbit
settings.ui_camera_orbit_max.description=Rotatiegevoeligheid in graden per JavaFX-muiscoördinateneenheid. max is een bovengrens voor snelle slepen. Bereik: 0.0 - 1.0.
settings.ui_camera_orbit_half=Halve snelheid van de camera-orbit
settings.ui_camera_orbit_half.description=Gefilterde cursorsnelheid in JavaFX-coördinateneenheden per seconde waarbij de gevoeligheid halverwege min en max ligt. Hoger = zachtere versnelling. Bereik: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Stijgtijd van de camera-orbit (ms)
settings.ui_camera_orbit_rise_ms.description=Tijdconstanten (milliseconden) voor de schatting van de cursorsnelheid bij versnellen. Een hogere riseMs verzacht de versnelling. Bereik: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Daaltijd van de camera-orbit (ms)
settings.ui_camera_orbit_fall_ms.description=Tijdconstanten (milliseconden) voor de schatting van de cursorsnelheid bij vertragen. Een lagere fallMs herstelt eerder fijnbesturing. Geen van beide voegt cameratraagheid toe. Bereik: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Vertraging tot de randenscène tot rust komt (ms)
settings.ui_edges_scene_settle_delay_ms.description=Vertraging na wijzigingen in geometrie of weergave. Hogere waarden onderdrukken meer werk tijdens snelle weergave van de geschiedenis. Bereik: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Vertraging tot de randencamera tot rust komt (ms)
settings.ui_edges_camera_settle_delay_ms.description=Vertraging na camerabeweging voordat de haarlijndikte in schermruimte opnieuw wordt opgebouwd. Bereik: 0 - 10000.
settings.ui_edges_topology_precision=Topologieprecisie van de randen
settings.ui_edges_topology_precision.description=Quantisatiestap om de topologie van kenmerkende randen te normaliseren. Modelgeometrie en vlaknormalen blijven ongewijzigd. Bereik: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Aansluitingstolerantie van de randen (mm)
settings.ui_edges_stitch_tolerance.description=Tolerantie voor het aaneensluiten van grenzen in scènemillimeters. Alleen gebruikt voor schijnbare randen met één vlak na nabuurschapsanalyse van het geïndexeerde mesh. Hiermee kunnen verschillend onderverdeelde maar geometrisch samenvallende randen opnieuw worden verbonden voordat wordt bepaald of het echte kenmerkende randen zijn. Bereik: 0.0 - 1.0.
