# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Käyttöliittymäelementit
settings.ui_section_lighting=Valaistus
settings.ui_section_edges=Piirteiden reunat
settings.ui_section_grid=Työtason ruudukko
settings.ui_section_camera=Kameran kierto
settings.ui_section_timing=Piirteiden reunojen ajoitus
settings.ui_description=Kuvaus on otettu tiedostosta scene-style.properties. Arvo tallennetaan kohteeseen ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Valaistustila
settings.ui_lighting_mode.description=Pidä täsmälleen yksi valaistustila. 'stable' = Kiinteät suunnatut valot maailman koordinaateissa. Valaistus ei kierrä kameran mukana. Suunniteltu hyvään väritoistoon ja luettavaan CAD-geometriaan. 'kevin' = Alkuperäinen BowlerStudio-valaistus. Käyttää kolmea pistevaloa; yksi seuraa kameraa. Alla olevat vakaan valon asetukset ohitetaan tässä tilassa.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ympäristövalo
settings.ui_lighting_ambient.description=Ympäristövalo vaikuttaa jokaiseen näkyvään pintaan samalla tavalla. Suurempi: vaaleammat varjot, värit pysyvät lähempänä perusväriään, mutta pinnat näyttävät litteämmiltä. Pienempi: voimakkaampi varjostus ja pintojen erottelu, mutta varjossa olevat värit tummenevat.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Päävalo käytössä
settings.ui_lighting_key_enabled.description=Päävalo, joka kuvaa kohteen muotoa. Aseta enabled=false poistaaksesi tämän valon kokonaan.
settings.ui_lighting_key_intensity=Päävalon voimakkuus
settings.ui_lighting_key_intensity.description=Päävalon voimakkuus. Alue: 0.0 - 1.0.
settings.ui_lighting_key_x=Päävalon X
settings.ui_lighting_key_x.description=Päävalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
settings.ui_lighting_key_y=Päävalon Y
settings.ui_lighting_key_y.description=Päävalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
settings.ui_lighting_key_z=Päävalon Z
settings.ui_lighting_key_z.description=Päävalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Täytevalo käytössä
settings.ui_lighting_fill_enabled.description=Pehmentää päävalon luomaa varjopuolta. Aseta enabled=false poistaaksesi tämän valon kokonaan.
settings.ui_lighting_fill_intensity=Täytevalon voimakkuus
settings.ui_lighting_fill_intensity.description=Suurempi voimakkuus: parempi väritoisto, pehmeämpi varjostus. Pienempi voimakkuus: suurempi ero eri suuntiin kääntyneiden pintojen välillä. Alue: 0.0 - 1.0.
settings.ui_lighting_fill_x=Täytevalon X
settings.ui_lighting_fill_x.description=Täytevalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
settings.ui_lighting_fill_y=Täytevalon Y
settings.ui_lighting_fill_y.description=Täytevalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
settings.ui_lighting_fill_z=Täytevalon Z
settings.ui_lighting_fill_z.description=Täytevalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Reunavalo käytössä
settings.ui_lighting_rim_enabled.description=Heikko toissijainen valo, joka auttaa erottamaan joitakin pintoja. Tämän tulisi yleensä pysyä hienovaraisena. Aseta enabled=false poistaaksesi tämän valon kokonaan.
settings.ui_lighting_rim_intensity=Reunavalon voimakkuus
settings.ui_lighting_rim_intensity.description=Heikko toissijainen valo, joka auttaa erottamaan joitakin pintoja. Tämän tulisi yleensä pysyä hienovaraisena. Alue: 0.0 - 1.0.
settings.ui_lighting_rim_x=Reunavalon X
settings.ui_lighting_rim_x.description=Reunavalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
settings.ui_lighting_rim_y=Reunavalon Y
settings.ui_lighting_rim_y.description=Reunavalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
settings.ui_lighting_rim_z=Reunavalon Z
settings.ui_lighting_rim_z.description=Reunavalon suunta maailmankoordinaateissa. Alue: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Piirteiden reunat käytössä
settings.ui_edges_enabled.description=Piirtää tummaa geometriaa CSG-objektien todellisia teräviä reunoja pitkin. Samassa tasossa olevien monikulmioiden rajat ohitetaan. Aseta enabled=false poistaaksesi reunat kokonaan.
settings.ui_edges_angle_degrees=Reunan kulma asteina
settings.ui_edges_angle_degrees.description=Pienin kulma vierekkäisten pintojen välillä ennen niiden yhteisen reunan piirtämistä. Suuremmat arvot tuottavat vähemmän taiteviivoja. Alue: 0 - 360.
settings.ui_edges_width_mode=Reunan leveystila
settings.ui_edges_width_mode.description=screen = Pitää ääriviivan suunnilleen vakiona näytön pikseleissä. Paras CAD-tyyliseen hiusviivaulkoasuun millä tahansa suurennustasolla. world = Käyttää kiinteää sädettä kohtauksen millimetreinä.
settings.ui_edges_width_px=Reunan leveys pikseleinä
settings.ui_edges_width_px.description=Näkyvän viivan leveys, kun widthMode=screen. Alue: 0.1 - 10.0.
settings.ui_edges_radius=Reunan säde
settings.ui_edges_radius.description=Reunan säde maailman koordinaateissa kohtauksen millimetreinä. Käytetään vain, kun widthMode=world. Alue: 0.001 - 100.0.
settings.ui_edges_brightness=Reunan kirkkaus
settings.ui_edges_brightness.description=0.0 = musta, 1.0 = valkoinen. Alue: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Pienen ruudukon näkyvyyden suurennussyvyys
settings.ui_grid_small_visible_zoom_depth.description=Määrittää, kuinka kauas 1 mm ruudukko pysyy näkyvissä. Suurempi arvo = 1 mm ruudukko ilmestyy aikaisemmin / kauemmas. Alue: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Pienen ruudukon kirkkauskerroin
settings.ui_grid_small_brightness_multiplier.description=Kertoo RGB-kirkkauden säilyttäen teeman sävyn. 1.0 = alkuperäinen teeman väri. < 1.0 = tummempi. > 1.0 = kirkkaampi. Alue: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Pienen ruudukon peittävyyskerroin
settings.ui_grid_small_opacity_multiplier.description=Kertoo nykyisen teeman toimittaman alfan. 1.0 = ennallaan. Alue: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Pienen ruudukon viivan leveys (px)
settings.ui_grid_small_line_width_px.description=Ruudukkoviivan paksuus ruudukon perinteisissä tekstuuripikseliyksiköissä. Nykyiset historialliset arvot ovat 2 (1 mm) ja 4 (10 mm). Alue: 1 - 10.
settings.ui_grid_small_z_offset_mm=Pienen ruudukon Z-siirtymä (mm)
settings.ui_grid_small_z_offset_mm.description=Pidä 1 mm ruudukko juuri 10 mm ruudukon takana syvyysartefaktien välttämiseksi. Alue: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Pääruudukon kirkkauskerroin
settings.ui_grid_major_brightness_multiplier.description=Kertoo RGB-kirkkauden säilyttäen teeman sävyn. 1.0 = alkuperäinen teeman väri. < 1.0 = tummempi. > 1.0 = kirkkaampi. Alue: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Pääruudukon peittävyyskerroin
settings.ui_grid_major_opacity_multiplier.description=Kertoo nykyisen teeman toimittaman alfan. 1.0 = ennallaan. Alue: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Pääruudukon viivan leveys (px)
settings.ui_grid_major_line_width_px.description=Ruudukkoviivan paksuus ruudukon perinteisissä tekstuuripikseliyksiköissä. Nykyiset historialliset arvot ovat 2 (1 mm) ja 4 (10 mm). Alue: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Ruudukon liiketila
settings.ui_grid_motion_mode.description=major = Pidä liikkuessa näkyvissä vain terävä 10 mm ruudukko ja piilota tilapäisesti tiheä 1 mm ruudukko. 1 mm ruudukko palaa liikkeen pysähdyttyä. all = Pidä molemmat terävät viivaruudukot näkyvissä liikkuessa. Paras visuaalinen jatkuvuus, mutta mahdollisesti raskaampi. texture = Alkuperäinen toiminta: vaihda viivageometria teksturoituihin ruudukkoneliöihin liikkuessa. Nopeampi, mutta voi aiheuttaa sahalaitaisuutta / moiré-kuvioita. hidden = Piilota ruudukkoviivat liikkuessa ja palauta ne, kun kamera pysähtyy.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Maapinnan piirron peittävyys
settings.ui_grid_ground_render_opacity.description=Pääasiallisen maapintatäytön peittävyys. Täyttö pysyy paikallaan kaikilla suurennustasoilla; vain tiheää 1 mm ruudukkoa säädetään suurennuksen mukaan. Aseta arvoon 0 piilottaaksesi täytön ja pitääksesi sen valintapinnan aktiivisena. Mukautetut työtasot ohittavat tämän asetuksen. Alue: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kameran kierron minimiherkkyys
settings.ui_camera_orbit_min.description=Kiertonopeus asteina JavaFX:n hiiren koordinaattiyksikköä kohden. min säätelee erittäin hitaita vetoja. Alue: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kameran kierron maksimiherkkyys
settings.ui_camera_orbit_max.description=Kiertonopeus asteina JavaFX:n hiiren koordinaattiyksikköä kohden. max on yläraja nopeille vedoille. Alue: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kameran kierron puolinopeus
settings.ui_camera_orbit_half.description=Suodatettu kohdistimen nopeus JavaFX-koordinaattiyksikköinä sekunnissa, jolla herkkyys on puolivälissä min ja max välillä. Suurempi = maltillisempi kiihtyvyys. Alue: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kameran kierron nousuaika (ms)
settings.ui_camera_orbit_rise_ms.description=Aikavakiot (millisekunteina) kohdistimen nopeuden arviolle kiihdytettäessä. Suurempi riseMs pehmentää kiihtyvyyttä. Alue: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kameran kierron laskuaika (ms)
settings.ui_camera_orbit_fall_ms.description=Aikavakiot (millisekunteina) kohdistimen nopeuden arviolle hidastettaessa. Pienempi fallMs palauttaa tarkan hallinnan nopeammin. Kumpikaan ei lisää kameran hitautta. Alue: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Reunojen asettumisviive kohtauksen muutosten jälkeen (ms)
settings.ui_edges_scene_settle_delay_ms.description=Viive geometrian/näytön muutosten jälkeen. Suuremmat arvot vaimentavat enemmän työtä nopean historian toiston aikana. Alue: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Reunojen asettumisviive kameran liikkeen jälkeen (ms)
settings.ui_edges_camera_settle_delay_ms.description=Viive kameran liikkeen jälkeen ennen kuin näyttöavaruuden hiusviivan paksuus rakennetaan uudelleen. Alue: 0 - 10000.
settings.ui_edges_topology_precision=Reunojen topologian tarkkuus
settings.ui_edges_topology_precision.description=Kvantisointiaskel, jota käytetään piirteiden reunojen topologian normalisointiin. Mallin geometria ja pintanormaalit pysyvät ennallaan. Alue: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Reunojen yhdistämistoleranssi (mm)
settings.ui_edges_stitch_tolerance.description=Rajojen yhdistämistoleranssi kohtauksen millimetreinä. Käytetään vain näennäisille yhden pinnan reunoille indeksöidyn verkon vierekkäisyyden jälkeen. Sen avulla eri tavoin jaetut mutta geometrisesti yhtenevät rajat voidaan yhdistää uudelleen ennen päätöstä siitä, ovatko ne todellisia piirteiden reunoja. Alue: 0.0 - 1.0.
