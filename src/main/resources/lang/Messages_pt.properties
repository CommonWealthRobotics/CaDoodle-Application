# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elementos da interface
settings.ui_section_lighting=Iluminação
settings.ui_section_edges=Arestas características
settings.ui_section_grid=Grade do plano de trabalho
settings.ui_section_camera=Órbita da câmera
settings.ui_section_timing=Temporização das arestas características
settings.ui_description=Descrição obtida de scene-style.properties. O valor é salvo em ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Modo de iluminação
settings.ui_lighting_mode.description=Mantenha exatamente um modo de iluminação. 'stable' = Luzes direcionais fixas no espaço do mundo. A iluminação não gira com a câmera. Projetado para boa fidelidade de cor e geometria CAD legível. 'kevin' = Iluminação original do BowlerStudio. Usa três luzes pontuais; uma segue a câmera. As configurações de luzes estáveis abaixo são ignoradas neste modo.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Luz ambiente
settings.ui_lighting_ambient.description=A luz ambiente afeta igualmente todas as superfícies visíveis. Mais alta: sombras mais claras, as cores ficam mais próximas da cor base, mas as superfícies parecem mais planas. Mais baixa: sombreamento e separação de superfícies mais fortes, mas as cores na sombra ficam mais escuras.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Luz principal ativada
settings.ui_lighting_key_enabled.description=Luz principal usada para descrever a forma do objeto. Defina enabled=false para remover completamente esta luz.
settings.ui_lighting_key_intensity=Intensidade da luz principal
settings.ui_lighting_key_intensity.description=Intensidade da luz principal. Faixa: 0.0 - 1.0.
settings.ui_lighting_key_x=Luz principal X
settings.ui_lighting_key_x.description=Direção da luz principal em coordenadas do mundo. Faixa: -1.0 - 1.0.
settings.ui_lighting_key_y=Luz principal Y
settings.ui_lighting_key_y.description=Direção da luz principal em coordenadas do mundo. Faixa: -1.0 - 1.0.
settings.ui_lighting_key_z=Luz principal Z
settings.ui_lighting_key_z.description=Direção da luz principal em coordenadas do mundo. Faixa: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Luz de preenchimento ativada
settings.ui_lighting_fill_enabled.description=Suaviza o lado sombreado criado pela luz principal. Defina enabled=false para remover completamente esta luz.
settings.ui_lighting_fill_intensity=Intensidade da luz de preenchimento
settings.ui_lighting_fill_intensity.description=Maior intensidade: melhor fidelidade de cor, sombreamento mais suave. Menor intensidade: maior diferença entre faces com orientações diferentes. Faixa: 0.0 - 1.0.
settings.ui_lighting_fill_x=Luz de preenchimento X
settings.ui_lighting_fill_x.description=Direção da luz de preenchimento em coordenadas do mundo. Faixa: -1.0 - 1.0.
settings.ui_lighting_fill_y=Luz de preenchimento Y
settings.ui_lighting_fill_y.description=Direção da luz de preenchimento em coordenadas do mundo. Faixa: -1.0 - 1.0.
settings.ui_lighting_fill_z=Luz de preenchimento Z
settings.ui_lighting_fill_z.description=Direção da luz de preenchimento em coordenadas do mundo. Faixa: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Luz de contorno ativada
settings.ui_lighting_rim_enabled.description=Luz secundária fraca que ajuda a separar algumas superfícies. Normalmente deve permanecer sutil. Defina enabled=false para remover completamente esta luz.
settings.ui_lighting_rim_intensity=Intensidade da luz de contorno
settings.ui_lighting_rim_intensity.description=Luz secundária fraca que ajuda a separar algumas superfícies. Normalmente deve permanecer sutil. Faixa: 0.0 - 1.0.
settings.ui_lighting_rim_x=Luz de contorno X
settings.ui_lighting_rim_x.description=Direção da luz de contorno em coordenadas do mundo. Faixa: -1.0 - 1.0.
settings.ui_lighting_rim_y=Luz de contorno Y
settings.ui_lighting_rim_y.description=Direção da luz de contorno em coordenadas do mundo. Faixa: -1.0 - 1.0.
settings.ui_lighting_rim_z=Luz de contorno Z
settings.ui_lighting_rim_z.description=Direção da luz de contorno em coordenadas do mundo. Faixa: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Arestas de contorno ativadas
settings.ui_edges_enabled.description=Desenha geometria escura ao longo das arestas realmente afiadas dos objetos CSG. Limites de polígonos coplanares são ignorados. Defina enabled=false para remover completamente as arestas.
settings.ui_edges_angle_degrees=Ângulo da aresta (graus)
settings.ui_edges_angle_degrees.description=Ângulo mínimo entre faces vizinhas antes de desenhar a aresta compartilhada. Valores mais altos produzem menos linhas de dobra. Faixa: 0 - 360.
settings.ui_edges_width_mode=Modo de largura da aresta
settings.ui_edges_width_mode.description=screen = Mantém o contorno aproximadamente constante em pixels da tela. Melhor para um aspecto de linha fina estilo CAD em qualquer nível de zoom. world = Usa um raio fixo em milímetros da cena.
settings.ui_edges_width_px=Largura da aresta (pixels)
settings.ui_edges_width_px.description=Largura visual da linha quando widthMode=screen. Faixa: 0.1 - 10.0.
settings.ui_edges_radius=Raio da aresta
settings.ui_edges_radius.description=Raio da aresta no espaço do mundo, em milímetros da cena. Usado apenas quando widthMode=world. Faixa: 0.001 - 100.0.
settings.ui_edges_brightness=Brilho da aresta
settings.ui_edges_brightness.description=0.0 = preto, 1.0 = branco. Faixa: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Profundidade de zoom visível da grade pequena
settings.ui_grid_small_visible_zoom_depth.description=Controla a que distância a grade de 1 mm continua visível. Valor mais alto = a grade de 1 mm aparece antes / mais longe. Faixa: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Multiplicador de brilho da grade pequena
settings.ui_grid_small_brightness_multiplier.description=Multiplica o brilho RGB preservando o matiz do tema. 1.0 = cor original do tema. < 1.0 = mais escuro. > 1.0 = mais claro. Faixa: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Multiplicador de opacidade da grade pequena
settings.ui_grid_small_opacity_multiplier.description=Multiplica o alfa fornecido pelo tema atual. 1.0 = inalterado. Faixa: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Largura da linha da grade pequena (px)
settings.ui_grid_small_line_width_px.description=Espessura das linhas da grade nas antigas unidades de pixel de textura da grade. Os valores históricos atuais são 2 para 1 mm e 4 para 10 mm. Faixa: 1 - 10.
settings.ui_grid_small_z_offset_mm=Deslocamento Z da grade pequena (mm)
settings.ui_grid_small_z_offset_mm.description=Mantém a grade de 1 mm logo atrás da de 10 mm para evitar artefatos de profundidade. Faixa: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Multiplicador de brilho da grade principal
settings.ui_grid_major_brightness_multiplier.description=Multiplica o brilho RGB preservando o matiz do tema. 1.0 = cor original do tema. < 1.0 = mais escuro. > 1.0 = mais claro. Faixa: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Multiplicador de opacidade da grade principal
settings.ui_grid_major_opacity_multiplier.description=Multiplica o alfa fornecido pelo tema atual. 1.0 = inalterado. Faixa: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Largura da linha da grade principal (px)
settings.ui_grid_major_line_width_px.description=Espessura das linhas da grade nas antigas unidades de pixel de textura da grade. Os valores históricos atuais são 2 para 1 mm e 4 para 10 mm. Faixa: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Modo de movimento da grade
settings.ui_grid_motion_mode.description=major = Mantém visível apenas a grade nítida de 10 mm durante o movimento e oculta temporariamente a grade densa de 1 mm. A grade de 1 mm retorna quando o movimento para. all = Mantém ambas as grades de linhas nítidas visíveis durante o movimento. Melhor continuidade visual, mas potencialmente mais custoso. texture = Comportamento original: troca a geometria de linhas por quadriláteros de grade texturizados durante o movimento. Mais rápido, mas pode produzir aliasing / padrões de moiré. hidden = Oculta as linhas da grade durante o movimento e as restaura quando a câmera para.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacidade do chão
settings.ui_grid_ground_render_opacity.description=Opacidade do preenchimento principal do chão. O preenchimento fica no lugar em todos os níveis de zoom; apenas a grade densa de 1 mm depende do zoom. Defina 0 para ocultar o preenchimento mantendo sua superfície de seleção ativa. Planos de trabalho personalizados ignoram esta configuração. Faixa: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensibilidade mínima da órbita da câmera
settings.ui_camera_orbit_min.description=Sensibilidade de rotação em graus por unidade de coordenada de mouse do JavaFX. min controla arrastos muito lentos. Faixa: 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensibilidade máxima da órbita da câmera
settings.ui_camera_orbit_max.description=Sensibilidade de rotação em graus por unidade de coordenada de mouse do JavaFX. max é um limite superior para arrastos rápidos. Faixa: 0.0 - 1.0.
settings.ui_camera_orbit_half=Velocidade média da órbita da câmera
settings.ui_camera_orbit_half.description=Velocidade filtrada do cursor, em unidades de coordenada do JavaFX por segundo, na qual a sensibilidade fica no meio entre min e max. Mais alta = aceleração mais suave. Faixa: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Tempo de subida da órbita da câmera (ms)
settings.ui_camera_orbit_rise_ms.description=Constantes de tempo (milissegundos) da estimativa de velocidade do cursor ao acelerar. Um riseMs maior suaviza a aceleração. Faixa: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Tempo de descida da órbita da câmera (ms)
settings.ui_camera_orbit_fall_ms.description=Constantes de tempo (milissegundos) da estimativa de velocidade do cursor ao desacelerar. Um fallMs menor restaura o controle fino mais cedo. Nenhum dos dois adiciona inércia à câmera. Faixa: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Atraso de estabilização da cena das arestas (ms)
settings.ui_edges_scene_settle_delay_ms.description=Atraso após mudanças de geometria/exibição. Valores mais altos suprimem mais trabalho durante a reprodução rápida do histórico. Faixa: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Atraso de estabilização da câmera das arestas (ms)
settings.ui_edges_camera_settle_delay_ms.description=Atraso após o movimento da câmera antes de reconstruir a espessura da linha fina no espaço da tela. Faixa: 0 - 10000.
settings.ui_edges_topology_precision=Precisão de topologia das arestas
settings.ui_edges_topology_precision.description=Passo de quantização usado para normalizar a topologia das arestas de contorno. A geometria do modelo e as normais das faces permanecem inalteradas. Faixa: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerância de costura das arestas (mm)
settings.ui_edges_stitch_tolerance.description=Tolerância de costura de limites em milímetros da cena. Usada apenas para arestas aparentes de uma única face após a adjacência da malha indexada. Permite reconectar bordas subdivididas de forma diferente mas geometricamente coincidentes antes de decidir se são arestas de contorno reais. Faixa: 0.0 - 1.0.
