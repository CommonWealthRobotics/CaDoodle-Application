settings.ui_lighting_fill_enabled.description=ਮੁੱਖ ਰੋਸ਼ਨੀ ਨਾਲ ਬਣੀ ਪਰਛਾਵੇਂ ਵਾਲੀ ਬਾਜ਼ੂ ਨੂੰ ਨਰਮ ਕਰਦੀ ਹੈ। ਇਹ ਰੋਸ਼ਨੀ ਪੂਰੀ ਤਰ੍ਹਾਂ ਹਟਾਉਣ ਲਈ enabled=false ਸੈੱਟ ਕਰੋ।
