settings.ui_lighting_fill_y=ਫਿਲ ਰੋਸ਼ਨੀ Y
settings.ui_lighting_fill_y.description=ਸੰਸਾਰ ਨਿਰਦੇਸ਼ਾਂਕਾਂ ਵਿੱਚ ਫਿਲ ਰੋਸ਼ਨੀ ਦੀ ਦਿਸ਼ਾ। ਰੇਂਜ: -1.0 - 1.0।
