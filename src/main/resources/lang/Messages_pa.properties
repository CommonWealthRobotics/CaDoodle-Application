# ---------------- edges ----------------
settings.ui_edges_enabled=ਫੀਚਰ ਕਿਨਾਰੇ ਸਮਰੱਥ
settings.ui_edges_enabled.description=CSG ਆਬਜੈਕਟਾਂ ਦੇ ਅਸਲ ਤਿੱਖੇ ਕਿਨਾਰਿਆਂ ਉੱਤੇ ਗੂੜ੍ਹੀ ਜਿਓਮੈਟਰੀ ਖਿੱਚੋ। ਸਮਤਲ ਬਹੁਭੁਜ ਸੀਮਾਵਾਂ ਨਜ਼ਰਅੰਦਾਜ਼ ਕੀਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਕਿਨਾਰੇ ਪੂਰੀ ਤਰ੍ਹਾਂ ਹਟਾਉਣ ਲਈ enabled=false ਸੈੱਟ ਕਰੋ।
settings.ui_edges_angle_degrees=ਕਿਨਾਰੇ ਦਾ ਕੋਣ (ਡਿਗਰੀ)
settings.ui_edges_angle_degrees.description=ਨਾਲ ਲੱਗਦੇ ਫਲਕਾਂ ਵਿਚਕਾਰ ਘੱਟੋ-ਘੱਟ ਕੋਣ, ਜਿਸ ਤੋਂ ਬਾਅਦ ਉਨ੍ਹਾਂ ਦਾ ਸਾਂਝਾ ਕਿਨਾਰਾ ਖਿੱਚਿਆ ਜਾਂਦਾ ਹੈ। ਵੱਧ ਮੁੱਲ ਘੱਟ ਕ੍ਰੀਜ਼ ਲਾਈਨਾਂ ਬਣਾਉਂਦੇ ਹਨ। ਰੇਂਜ: 0 - 360।
settings.ui_edges_width_mode=ਕਿਨਾਰੇ ਦੀ ਚੌੜਾਈ ਮੋਡ
settings.ui_edges_width_mode.description=screen = ਰੂਪਰੇਖਾ ਨੂੰ ਸਕ੍ਰੀਨ ਪਿਕਸਲਾਂ ਵਿੱਚ ਲਗਭਗ ਸਥਿਰ ਰੱਖਦਾ ਹੈ। ਕਿਸੇ ਵੀ ਜ਼ੂਮ ਪੱਧਰ 'ਤੇ CAD-ਸ਼ੈਲੀ ਹੇਅਰਲਾਈਨ ਦਿੱਖ ਲਈ ਸਭ ਤੋਂ ਵਧੀਆ। world = ਦ੍ਰਿਸ਼ ਮਿਲੀਮੀਟਰਾਂ ਵਿੱਚ ਨਿਸ਼ਚਿਤ ਅਰਧ-ਵਿਆਸ ਵਰਤਦਾ ਹੈ।
settings.ui_edges_width_px=ਕਿਨਾਰੇ ਦੀ ਚੌੜਾਈ ਪਿਕਸਲ
settings.ui_edges_width_px.description=widthMode=screen ਹੋਣ 'ਤੇ ਦਿੱਸਦੀ ਲਾਈਨ ਦੀ ਚੌੜਾਈ। ਰੇਂਜ: 0.1 - 10.0।
settings.ui_edges_radius=ਕਿਨਾਰੇ ਦਾ ਅਰਧ-ਵਿਆਸ
settings.ui_edges_radius.description=ਦ੍ਰਿਸ਼ ਮਿਲੀਮੀਟਰਾਂ ਵਿੱਚ ਸੰਸਾਰ-ਸਥਾਨ ਕਿਨਾਰੇ ਦਾ ਅਰਧ-ਵਿਆਸ। ਸਿਰਫ਼ ਤਦ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ ਜਦੋਂ widthMode=world ਹੋਵੇ। ਰੇਂਜ: 0.001 - 100.0।
settings.ui_edges_brightness=ਕਿਨਾਰੇ ਦੀ ਚਮਕ
settings.ui_edges_brightness.description=0.0 = ਕਾਲਾ, 1.0 = ਚਿੱਟਾ। ਰੇਂਜ: 0.0 - 1.0।
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=ਛੋਟੀ ਗ੍ਰਿਡ ਦਿੱਖ ਜ਼ੂਮ ਡੂੰਘਾਈ
settings.ui_grid_small_visible_zoom_depth.description=ਇਹ ਨਿਯੰਤਰਿਤ ਕਰਦਾ ਹੈ ਕਿ 1 mm ਗ੍ਰਿਡ ਕਿੰਨੀ ਦੂਰ ਤੱਕ ਦਿੱਸਦੀ ਰਹਿੰਦੀ ਹੈ। ਵੱਧ ਮੁੱਲ = 1 mm ਗ੍ਰਿਡ ਪਹਿਲਾਂ / ਵੱਧ ਦੂਰੋਂ ਦਿੱਸਦੀ ਹੈ। ਰੇਂਜ: 1 - 10000।
settings.ui_grid_small_brightness_multiplier=ਛੋਟੀ ਗ੍ਰਿਡ ਚਮਕ ਗੁਣਕ
settings.ui_grid_small_brightness_multiplier.description=ਥੀਮ ਹਿਊ ਸੰਭਾਲਦਿਆਂ RGB ਚਮਕ ਨੂੰ ਗੁਣਾ ਕਰਦਾ ਹੈ। 1.0 = ਮੂਲ ਥੀਮ ਰੰਗ। < 1.0 = ਗੂੜ੍ਹਾ। > 1.0 = ਵੱਧ ਚਮਕਦਾਰ। ਰੇਂਜ: 0.0 - 3.0।
settings.ui_grid_small_opacity_multiplier=ਛੋਟੀ ਗ੍ਰਿਡ ਅਪਾਰਦਰਸ਼ਤਾ ਗੁਣਕ
settings.ui_grid_small_opacity_multiplier.description=ਮੌਜੂਦਾ ਥੀਮ ਵੱਲੋਂ ਦਿੱਤੇ ਅਲਫ਼ਾ ਨੂੰ ਗੁਣਾ ਕਰਦਾ ਹੈ। 1.0 = ਬਦਲਿਆ ਨਹੀਂ। ਰੇਂਜ: 0.0 - 1.0।
settings.ui_grid_small_line_width_px=ਛੋਟੀ ਗ੍ਰਿਡ ਲਾਈਨ ਚੌੜਾਈ (px)
settings.ui_grid_small_line_width_px.description=ਗ੍ਰਿਡ ਦੀਆਂ ਲੈਗੇਸੀ ਟੈਕਸਚਰ-ਪਿਕਸਲ ਇਕਾਈਆਂ ਵਿੱਚ ਗ੍ਰਿਡ ਲਾਈਨ ਦੀ ਮੋਟਾਈ। ਮੌਜੂਦਾ ਇਤਿਹਾਸਕ ਮੁੱਲ 1 mm ਲਈ 2 ਅਤੇ 10 mm ਲਈ 4 ਹਨ। ਰੇਂਜ: 1 - 10।
settings.ui_grid_small_z_offset_mm=ਛੋਟੀ ਗ੍ਰਿਡ Z ਆਫਸੈੱਟ (mm)
settings.ui_grid_small_z_offset_mm.description=ਡੂੰਘਾਈ ਵਿਗਾੜ ਤੋਂ ਬਚਣ ਲਈ 1 mm ਗ੍ਰਿਡ ਨੂੰ 10 mm ਗ੍ਰਿਡ ਦੇ ਠੀਕ ਪਿੱਛੇ ਰੱਖੋ। ਰੇਂਜ: -1.0 - 1.0।
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=ਮੁੱਖ ਗ੍ਰਿਡ ਚਮਕ ਗੁਣਕ
settings.ui_grid_major_brightness_multiplier.description=ਥੀਮ ਹਿਊ ਸੰਭਾਲਦਿਆਂ RGB ਚਮਕ ਨੂੰ ਗੁਣਾ ਕਰਦਾ ਹੈ। 1.0 = ਮੂਲ ਥੀਮ ਰੰਗ। < 1.0 = ਗੂੜ੍ਹਾ। > 1.0 = ਵੱਧ ਚਮਕਦਾਰ। ਰੇਂਜ: 0.0 - 3.0।
settings.ui_grid_major_opacity_multiplier=ਮੁੱਖ ਗ੍ਰਿਡ ਅਪਾਰਦਰਸ਼ਤਾ ਗੁਣਕ
settings.ui_grid_major_opacity_multiplier.description=ਮੌਜੂਦਾ ਥੀਮ ਵੱਲੋਂ ਦਿੱਤੇ ਅਲਫ਼ਾ ਨੂੰ ਗੁਣਾ ਕਰਦਾ ਹੈ। 1.0 = ਬਦਲਿਆ ਨਹੀਂ। ਰੇਂਜ: 0.0 - 1.0।
settings.ui_grid_major_line_width_px=ਮੁੱਖ ਗ੍ਰਿਡ ਲਾਈਨ ਚੌੜਾਈ (px)
settings.ui_grid_major_line_width_px.description=ਗ੍ਰਿਡ ਦੀਆਂ ਲੈਗੇਸੀ ਟੈਕਸਚਰ-ਪਿਕਸਲ ਇਕਾਈਆਂ ਵਿੱਚ ਗ੍ਰਿਡ ਲਾਈਨ ਦੀ ਮੋਟਾਈ। ਮੌਜੂਦਾ ਇਤਿਹਾਸਕ ਮੁੱਲ 1 mm ਲਈ 2 ਅਤੇ 10 mm ਲਈ 4 ਹਨ। ਰੇਂਜ: 1 - 10।
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ਗ੍ਰਿਡ ਗਤੀ ਮੋਡ
settings.ui_grid_motion_mode.description=major = ਹਿੱਲਜੁੱਲ ਵੇਲੇ ਸਿਰਫ਼ ਸਪੱਸ਼ਟ 10 mm ਗ੍ਰਿਡ ਦਿੱਸਦੀ ਰੱਖੋ ਅਤੇ ਸੰਘਣੀ 1 mm ਗ੍ਰਿਡ ਨੂੰ ਕੁਝ ਸਮੇਂ ਲਈ ਲੁਕਾਓ। ਹਿੱਲਜੁੱਲ ਰੁਕਣ ਤੋਂ ਬਾਅਦ 1 mm ਗ੍ਰਿਡ ਵਾਪਸ ਆ ਜਾਂਦੀ ਹੈ। all = ਹਿੱਲਜੁੱਲ ਵੇਲੇ ਦੋਵੇਂ ਸਪੱਸ਼ਟ ਲਾਈਨ ਗ੍ਰਿਡ ਦਿੱਸਦੀਆਂ ਰੱਖੋ। ਸਭ ਤੋਂ ਵਧੀਆ ਦਿੱਖ ਨਿਰੰਤਰਤਾ, ਪਰ ਸੰਭਵ ਤੌਰ 'ਤੇ ਵੱਧ ਖਰਚੀਲਾ। texture = ਮੂਲ ਵਿਵਹਾਰ: ਹਿੱਲਜੁੱਲ ਵੇਲੇ ਲਾਈਨ ਜਿਓਮੈਟਰੀ ਦੀ ਥਾਂ ਟੈਕਸਚਰ ਵਾਲੇ ਗ੍ਰਿਡ ਕਵਾਡ ਵਰਤੋ। ਤੇਜ਼, ਪਰ ਐਲੀਆਸਿੰਗ / ਮੋਇਰੇ ਪੈਟਰਨ ਬਣਾ ਸਕਦਾ ਹੈ। hidden = ਹਿੱਲਜੁੱਲ ਵੇਲੇ ਗ੍ਰਿਡ ਲਾਈਨਾਂ ਲੁਕਾਓ ਅਤੇ ਕੈਮਰਾ ਰੁਕਣ 'ਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਬਹਾਲ ਕਰੋ।
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=ਗ੍ਰਾਊਂਡ ਰੈਂਡਰ ਅਪਾਰਦਰਸ਼ਤਾ
settings.ui_grid_ground_render_opacity.description=ਮੁੱਖ ਗ੍ਰਾਊਂਡ ਭਰਨ ਦੀ ਅਪਾਰਦਰਸ਼ਤਾ। ਭਰਨ ਹਰ ਜ਼ੂਮ ਪੱਧਰ 'ਤੇ ਆਪਣੀ ਥਾਂ ਰਹਿੰਦਾ ਹੈ; ਸਿਰਫ਼ ਸੰਘਣੀ 1 mm ਗ੍ਰਿਡ ਜ਼ੂਮ 'ਤੇ ਨਿਰਭਰ ਹੈ। ਭਰਨ ਲੁਕਾਉਂਦਿਆਂ ਉਸ ਦੀ ਪਿਕਿੰਗ ਸਤ੍ਹਾ ਸਰਗਰਮ ਰੱਖਣ ਲਈ 0 'ਤੇ ਸੈੱਟ ਕਰੋ। ਕਸਟਮ ਵਰਕਪਲੇਨ ਇਸ ਸੈਟਿੰਗ ਨੂੰ ਨਜ਼ਰਅੰਦਾਜ਼ ਕਰਦੇ ਹਨ। ਰੇਂਜ: 0.0 - 1.0।
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=ਕੈਮਰਾ ਆਰਬਿਟ ਘੱਟੋ-ਘੱਟ ਸੰਵੇਦਨਸ਼ੀਲਤਾ
settings.ui_camera_orbit_min.description=JavaFX ਮਾਊਸ-ਨਿਰਦੇਸ਼ਾਂਕ ਇਕਾਈ ਪ੍ਰਤੀ ਡਿਗਰੀ ਵਿੱਚ ਘੁੰਮਾਉਣ ਦੀ ਸੰਵੇਦਨਸ਼ੀਲਤਾ। min ਬਹੁਤ ਹੌਲੀ ਖਿੱਚ ਨੂੰ ਨਿਯੰਤਰਿਤ ਕਰਦਾ ਹੈ। ਰੇਂਜ: 0.0 - 1.0।
settings.ui_camera_orbit_max=ਕੈਮਰਾ ਆਰਬਿਟ ਵੱਧ ਤੋਂ ਵੱਧ ਸੰਵੇਦਨਸ਼ੀਲਤਾ
settings.ui_camera_orbit_max.description=JavaFX ਮਾਊਸ-ਨਿਰਦੇਸ਼ਾਂਕ ਇਕਾਈ ਪ੍ਰਤੀ ਡਿਗਰੀ ਵਿੱਚ ਘੁੰਮਾਉਣ ਦੀ ਸੰਵੇਦਨਸ਼ੀਲਤਾ। max ਤੇਜ਼ ਖਿੱਚ ਲਈ ਉੱਪਰੀ ਸੀਮਾ ਹੈ। ਰੇਂਜ: 0.0 - 1.0।
settings.ui_camera_orbit_half=ਕੈਮਰਾ ਆਰਬਿਟ ਅੱਧੀ ਗਤੀ
settings.ui_camera_orbit_half.description=ਫਿਲਟਰ ਕੀਤੀ ਕਰਸਰ ਗਤੀ (JavaFX ਨਿਰਦੇਸ਼ਾਂਕ ਇਕਾਈ ਪ੍ਰਤੀ ਸਕਿੰਟ) ਜਿਸ 'ਤੇ ਸੰਵੇਦਨਸ਼ੀਲਤਾ min ਅਤੇ max ਵਿਚਕਾਰ ਅੱਧੀ ਹੁੰਦੀ ਹੈ। ਵੱਧ = ਨਰਮ ਪ੍ਰਵੇਗ। ਰੇਂਜ: 0 - 10000।
settings.ui_camera_orbit_rise_ms=ਕੈਮਰਾ ਆਰਬਿਟ ਰਾਈਜ਼ ਸਮਾਂ (ms)
settings.ui_camera_orbit_rise_ms.description=ਗਤੀ ਵਧਾਉਂਦਿਆਂ ਕਰਸਰ-ਗਤੀ ਅੰਦਾਜ਼ੇ ਲਈ ਸਮਾਂ ਸਥਿਰਾਂਕ (ਮਿਲੀਸਕਿੰਟ)। ਵੱਧ riseMs ਪ੍ਰਵੇਗ ਨੂੰ ਨਰਮ ਬਣਾਉਂਦਾ ਹੈ। ਰੇਂਜ: 0 - 10000।
settings.ui_camera_orbit_fall_ms=ਕੈਮਰਾ ਆਰਬਿਟ ਫਾਲ ਸਮਾਂ (ms)
settings.ui_camera_orbit_fall_ms.description=ਗਤੀ ਘਟਾਉਂਦਿਆਂ ਕਰਸਰ-ਗਤੀ ਅੰਦਾਜ਼ੇ ਲਈ ਸਮਾਂ ਸਥਿਰਾਂਕ (ਮਿਲੀਸਕਿੰਟ)। ਘੱਟ fallMs ਸੂਖਮ ਨਿਯੰਤਰਣ ਜਲਦੀ ਬਹਾਲ ਕਰਦਾ ਹੈ। ਇਨ੍ਹਾਂ ਵਿੱਚੋਂ ਕੋਈ ਵੀ ਕੈਮਰਾ ਜੜ੍ਹਤਾ ਨਹੀਂ ਜੋੜਦਾ। ਰੇਂਜ: 0 - 10000।
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=ਕਿਨਾਰੇ ਦ੍ਰਿਸ਼ ਸਥਿਰਤਾ ਦੇਰੀ (ms)
settings.ui_edges_scene_settle_delay_ms.description=ਜਿਓਮੈਟਰੀ/ਡਿਸਪਲੇ ਬਦਲਾਅ ਤੋਂ ਬਾਅਦ ਦੇਰੀ। ਵੱਧ ਮੁੱਲ ਤੇਜ਼ ਇਤਿਹਾਸ ਰੀਪਲੇ ਦੌਰਾਨ ਵੱਧ ਕੰਮ ਦਬਾਉਂਦੇ ਹਨ। ਰੇਂਜ: 0 - 10000।
settings.ui_edges_camera_settle_delay_ms=ਕਿਨਾਰੇ ਕੈਮਰਾ ਸਥਿਰਤਾ ਦੇਰੀ (ms)
settings.ui_edges_camera_settle_delay_ms.description=ਕੈਮਰਾ ਹਿੱਲਜੁੱਲ ਤੋਂ ਬਾਅਦ ਦੇਰੀ, ਜਿਸ ਤੋਂ ਬਾਅਦ ਸਕ੍ਰੀਨ-ਸਥਾਨ ਹੇਅਰਲਾਈਨ ਮੋਟਾਈ ਦੁਬਾਰਾ ਬਣਦੀ ਹੈ। ਰੇਂਜ: 0 - 10000।
settings.ui_edges_topology_precision=ਕਿਨਾਰੇ ਟੋਪੋਲੋਜੀ ਸ਼ੁੱਧਤਾ
settings.ui_edges_topology_precision.description=ਫੀਚਰ-ਕਿਨਾਰੇ ਟੋਪੋਲੋਜੀ ਨੂੰ ਸਧਾਰਨ ਕਰਨ ਲਈ ਵਰਤਿਆ ਕੁਆਂਟਾਈਜ਼ੇਸ਼ਨ ਕਦਮ। ਮਾਡਲ ਜਿਓਮੈਟਰੀ ਅਤੇ ਫਲਕ ਨੌਰਮਲ ਬਦਲਦੇ ਨਹੀਂ। ਰੇਂਜ: 0.0 - 1.0।
settings.ui_edges_stitch_tolerance=ਕਿਨਾਰੇ ਸਿਲਾਈ ਸਹਿਣਸ਼ੀਲਤਾ (mm)
settings.ui_edges_stitch_tolerance.description=ਦ੍ਰਿਸ਼ ਮਿਲੀਮੀਟਰਾਂ ਵਿੱਚ ਸੀਮਾ ਸਿਲਾਈ ਸਹਿਣਸ਼ੀਲਤਾ। ਸਿਰਫ਼ ਇੰਡੈਕਸਡ-ਮੈਸ਼ ਨੇੜਤਾ ਤੋਂ ਬਾਅਦ ਦਿੱਸਦੇ ਇੱਕ-ਫਲਕ ਕਿਨਾਰਿਆਂ ਲਈ ਵਰਤੀ ਜਾਂਦੀ ਹੈ। ਇਹ ਵੱਖ-ਵੱਖ ਉਪਵੰਡੇ ਪਰ ਜਿਓਮੈਟਰੀ ਨਾਲ ਮੇਲ ਖਾਂਦੇ ਸੀਮਾਂਵਾਂ ਨੂੰ ਦੁਬਾਰਾ ਜੋੜਨ ਦਿੰਦੀ ਹੈ, ਇਸ ਤੋਂ ਪਹਿਲਾਂ ਕਿ ਇਹ ਤੈਅ ਹੋਵੇ ਕਿ ਉਹ ਅਸਲ ਫੀਚਰ ਕਿਨਾਰੇ ਹਨ ਜਾਂ ਨਹੀਂ। ਰੇਂਜ: 0.0 - 1.0।
