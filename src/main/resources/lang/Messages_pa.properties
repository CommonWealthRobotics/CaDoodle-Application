settings.ui_lighting_rim_enabled.description=ਕੁਝ ਸਤ੍ਹਾਵਾਂ ਨੂੰ ਵੱਖ ਦਿਖਾਉਣ ਵਿੱਚ ਮਦਦ ਕਰਨ ਵਾਲੀ ਕਮਜ਼ੋਰ ਦੂਜੀ ਰੋਸ਼ਨੀ। ਇਹ ਆਮ ਤੌਰ 'ਤੇ ਸੂਖਮ ਰਹਿਣੀ ਚਾਹੀਦੀ ਹੈ। ਇਹ ਰੋਸ਼ਨੀ ਪੂਰੀ ਤਰ੍ਹਾਂ ਹਟਾਉਣ ਲਈ enabled=false ਸੈੱਟ ਕਰੋ।
