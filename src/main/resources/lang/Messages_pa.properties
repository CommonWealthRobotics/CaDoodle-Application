settings.ui_lighting_key_enabled.description=ਆਬਜੈਕਟ ਦਾ ਆਕਾਰ ਦਰਸਾਉਣ ਲਈ ਵਰਤੀ ਜਾਂਦੀ ਮੁੱਖ ਰੋਸ਼ਨੀ। ਇਹ ਰੋਸ਼ਨੀ ਪੂਰੀ ਤਰ੍ਹਾਂ ਹਟਾਉਣ ਲਈ enabled=false ਸੈੱਟ ਕਰੋ।
settings.ui_lighting_key_intensity=ਮੁੱਖ ਰੋਸ਼ਨੀ ਦੀ ਤੀਬਰਤਾ
settings.ui_lighting_key_intensity.description=ਮੁੱਖ ਰੋਸ਼ਨੀ ਦੀ ਤੀਬਰਤਾ। ਰੇਂਜ: 0.0 - 1.0।
