settings.ui_description=scene-style.properties ਤੋਂ ਲਿਆ ਵੇਰਵਾ। ਮੁੱਲ ConfigurationDatabase ਵਿੱਚ ਸੰਭਾਲਿਆ ਜਾਂਦਾ ਹੈ।

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=ਰੋਸ਼ਨੀ ਮੋਡ
settings.ui_lighting_mode.description=ਠੀਕ ਇੱਕ ਰੋਸ਼ਨੀ ਮੋਡ ਰੱਖੋ। 'stable' = ਸਥਿਰ ਸੰਸਾਰ-ਸਥਾਨ ਦਿਸ਼ਾਤਮਕ ਰੋਸ਼ਨੀ। ਰੋਸ਼ਨੀ ਕੈਮਰੇ ਨਾਲ ਨਹੀਂ ਘੁੰਮਦੀ। ਚੰਗੀ ਰੰਗ-ਨਿਸ਼ਠਾ ਅਤੇ ਪੜ੍ਹਨਯੋਗ CAD ਜਿਓਮੈਟਰੀ ਲਈ ਬਣਾਈ ਗਈ। 'kevin' = ਮੂਲ BowlerStudio ਰੋਸ਼ਨੀ। ਤਿੰਨ ਪੁਆਇੰਟ ਰੋਸ਼ਨੀ ਵਰਤਦੀ ਹੈ; ਇੱਕ ਕੈਮਰੇ ਦਾ ਪਿੱਛਾ ਕਰਦੀ ਹੈ। ਇਸ ਮੋਡ ਵਿੱਚ ਹੇਠਾਂ ਦੀਆਂ ਸਥਿਰ-ਰੋਸ਼ਨੀ ਸੈਟਿੰਗਾਂ ਨਜ਼ਰਅੰਦਾਜ਼ ਕੀਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ।
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=ਆਲੇ-ਦੁਆਲੇ ਦੀ ਰੋਸ਼ਨੀ
settings.ui_lighting_ambient.description=ਆਲੇ-ਦੁਆਲੇ ਦੀ ਰੋਸ਼ਨੀ ਹਰ ਦਿੱਸਦੀ ਸਤ੍ਹਾ ਨੂੰ ਬਰਾਬਰ ਪ੍ਰਭਾਵਿਤ ਕਰਦੀ ਹੈ। ਵੱਧ: ਚਮਕਦਾਰ ਪਰਛਾਵੇਂ, ਰੰਗ ਆਪਣੇ ਮੂਲ ਰੰਗ ਦੇ ਨੇੜੇ ਰਹਿੰਦੇ ਹਨ, ਪਰ ਸਤ੍ਹਾਵਾਂ ਸਪਾਟ ਦਿੱਸਦੀਆਂ ਹਨ। ਘੱਟ: ਵਧੇਰੇ ਮਜ਼ਬੂਤ ਸ਼ੇਡਿੰਗ ਅਤੇ ਸਤ੍ਹਾਵਾਂ ਵਿੱਚ ਵੱਧ ਵੱਖਰਤਾ, ਪਰ ਪਰਛਾਵੇਂ ਵਾਲੇ ਰੰਗ ਗੂੜ੍ਹੇ ਹੋ ਜਾਂਦੇ ਹਨ।
