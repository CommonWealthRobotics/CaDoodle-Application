settings.ui_lighting_fill_intensity.description=ਵੱਧ ਤੀਬਰਤਾ: ਬਿਹਤਰ ਰੰਗ-ਨਿਸ਼ਠਾ, ਨਰਮ ਸ਼ੇਡਿੰਗ। ਘੱਟ ਤੀਬਰਤਾ: ਵੱਖ-ਵੱਖ ਦਿਸ਼ਾਵਾਂ ਵਾਲੇ ਫਲਕਾਂ ਵਿਚਕਾਰ ਵੱਧ ਸਪੱਸ਼ਟ ਅੰਤਰ। ਰੇਂਜ: 0.0 - 1.0।
