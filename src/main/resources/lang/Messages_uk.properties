# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Елементи інтерфейсу
settings.ui_section_lighting=Освітлення
settings.ui_section_edges=Ребра форми
settings.ui_section_grid=Сітка робочої площини
settings.ui_section_camera=Орбіта камери
settings.ui_section_timing=Таймінги ребер форми
settings.ui_description=Опис узято з scene-style.properties. Значення зберігається в ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Режим освітлення
settings.ui_lighting_mode.description=Тримайте рівно один режим освітлення. 'stable' = Фіксовані напрямні джерела у світовому просторі. Освітлення не обертається разом із камерою. Розраховано на добру передачу кольору та читабельну геометрію CAD. 'kevin' = Початкове освітлення BowlerStudio. Використовує три точкові джерела; одне з них іде за камерою. Налаштування стабільного освітлення нижче в цьому режимі ігноруються.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Фонове світло
settings.ui_lighting_ambient.description=Фонове світло діє на кожну видиму поверхню однаково. Вище: світліші тіні, кольори залишаються ближчими до базового кольору, але поверхні виглядають плоскішими. Нижче: сильніше затінення й розділення поверхонь, але затінені кольори стають темнішими.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Основне світло ввімкнене
settings.ui_lighting_key_enabled.description=Головне джерело світла, що описує форму об'єкта. Встановіть enabled=false, щоб повністю прибрати це джерело.
settings.ui_lighting_key_intensity=Інтенсивність основного світла
settings.ui_lighting_key_intensity.description=Інтенсивність основного світла. Діапазон: 0.0 - 1.0.
settings.ui_lighting_key_x=Основне світло X
settings.ui_lighting_key_x.description=Напрямок основного світла в світових координатах. Діапазон: -1.0 - 1.0.
settings.ui_lighting_key_y=Основне світло Y
settings.ui_lighting_key_y.description=Напрямок основного світла в світових координатах. Діапазон: -1.0 - 1.0.
settings.ui_lighting_key_z=Основне світло Z
settings.ui_lighting_key_z.description=Напрямок основного світла в світових координатах. Діапазон: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Заповнювальне світло ввімкнене
settings.ui_lighting_fill_enabled.description=Пом'якшує тіньовий бік, створений основним світлом. Встановіть enabled=false, щоб повністю прибрати це джерело.
settings.ui_lighting_fill_intensity=Інтенсивність заповнювального світла
settings.ui_lighting_fill_intensity.description=Вища інтенсивність: краща передача кольору, м'якше затінення. Нижча інтенсивність: сильніша різниця між по-різному орієнтованими гранями. Діапазон: 0.0 - 1.0.
settings.ui_lighting_fill_x=Заповнювальне світло X
settings.ui_lighting_fill_x.description=Напрямок заповнювального світла в світових координатах. Діапазон: -1.0 - 1.0.
settings.ui_lighting_fill_y=Заповнювальне світло Y
settings.ui_lighting_fill_y.description=Напрямок заповнювального світла в світових координатах. Діапазон: -1.0 - 1.0.
settings.ui_lighting_fill_z=Заповнювальне світло Z
settings.ui_lighting_fill_z.description=Напрямок заповнювального світла в світових координатах. Діапазон: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Контурне світло ввімкнене
settings.ui_lighting_rim_enabled.description=Слабке вторинне джерело, що допомагає розділяти деякі поверхні. Зазвичай має залишатися непомітним. Встановіть enabled=false, щоб повністю прибрати це джерело.
settings.ui_lighting_rim_intensity=Інтенсивність контурного світла
settings.ui_lighting_rim_intensity.description=Слабке вторинне джерело, що допомагає розділяти деякі поверхні. Зазвичай має залишатися непомітним. Діапазон: 0.0 - 1.0.
settings.ui_lighting_rim_x=Контурне світло X
settings.ui_lighting_rim_x.description=Напрямок контурного світла в світових координатах. Діапазон: -1.0 - 1.0.
settings.ui_lighting_rim_y=Контурне світло Y
settings.ui_lighting_rim_y.description=Напрямок контурного світла в світових координатах. Діапазон: -1.0 - 1.0.
settings.ui_lighting_rim_z=Контурне світло Z
settings.ui_lighting_rim_z.description=Напрямок контурного світла в світових координатах. Діапазон: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Ребра форми ввімкнені
settings.ui_edges_enabled.description=Малює темну геометрію вздовж справжніх гострих ребер об'єктів CSG. Межі компланарних полігонів ігноруються. Встановіть enabled=false, щоб повністю прибрати ребра.
settings.ui_edges_angle_degrees=Кут ребра в градусах
settings.ui_edges_angle_degrees.description=Мінімальний кут між сусідніми гранями, починаючи з якого малюється їхнє спільне ребро. Більші значення дають менше ліній згину. Діапазон: 0 - 360.
settings.ui_edges_width_mode=Режим ширини ребер
settings.ui_edges_width_mode.description=screen = Тримає контур приблизно сталим у пікселях екрана. Найкраще для тонкого контуру в стилі CAD за будь-якого масштабу. world = Використовує фіксований радіус у міліметрах сцени.
settings.ui_edges_width_px=Ширина ребер у пікселях
settings.ui_edges_width_px.description=Видима товщина лінії при widthMode=screen. Діапазон: 0.1 - 10.0.
settings.ui_edges_radius=Радіус ребер
settings.ui_edges_radius.description=Радіус ребер у світовому просторі, у міліметрах сцени. Використовується лише при widthMode=world. Діапазон: 0.001 - 100.0.
settings.ui_edges_brightness=Яскравість ребер
settings.ui_edges_brightness.description=0.0 = чорний, 1.0 = білий. Діапазон: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Глибина видимості дрібної сітки
settings.ui_grid_small_visible_zoom_depth.description=Керує тим, наскільки далеко залишається видимою сітка 1 mm. Більше значення = сітка 1 mm з'являється раніше / далі. Діапазон: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Множник яскравості дрібної сітки
settings.ui_grid_small_brightness_multiplier.description=Множить яскравість RGB, зберігаючи відтінок теми. 1.0 = початковий колір теми. < 1.0 = темніше. > 1.0 = яскравіше. Діапазон: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Множник непрозорості дрібної сітки
settings.ui_grid_small_opacity_multiplier.description=Множить альфу, задану поточною темою. 1.0 = без змін. Діапазон: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Товщина ліній дрібної сітки (px)
settings.ui_grid_small_line_width_px.description=Товщина ліній сітки в застарілих текстурних пікселях сітки. Поточні історичні значення: 2 для 1 mm і 4 для 10 mm. Діапазон: 1 - 10.
settings.ui_grid_small_z_offset_mm=Зсув Z дрібної сітки (mm)
settings.ui_grid_small_z_offset_mm.description=Тримайте сітку 1 mm трохи позаду сітки 10 mm, щоб уникнути артефактів глибини. Діапазон: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Множник яскравості основної сітки
settings.ui_grid_major_brightness_multiplier.description=Множить яскравість RGB, зберігаючи відтінок теми. 1.0 = початковий колір теми. < 1.0 = темніше. > 1.0 = яскравіше. Діапазон: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Множник непрозорості основної сітки
settings.ui_grid_major_opacity_multiplier.description=Множить альфу, задану поточною темою. 1.0 = без змін. Діапазон: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Товщина ліній основної сітки (px)
settings.ui_grid_major_line_width_px.description=Товщина ліній сітки в застарілих текстурних пікселях сітки. Поточні історичні значення: 2 для 1 mm і 4 для 10 mm. Діапазон: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Режим руху сітки
settings.ui_grid_motion_mode.description=major = Залишати видимою лише чітку сітку 10 mm під час руху й тимчасово ховати щільну сітку 1 mm. Сітка 1 mm повертається після зупинки руху. all = Залишати обидві чіткі лінійні сітки видимими під час руху. Найкраща візуальна безперервність, але потенційно дорожче. texture = Початкова поведінка: підміна лінійної геометрії на текстуровані квади сітки під час руху. Швидше, але може давати аліасинг / муар. hidden = Ховати лінії сітки під час руху й відновлювати їх, коли камера зупиняється.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Непрозорість відображення землі
settings.ui_grid_ground_render_opacity.description=Непрозорість основної заливки землі. Заливка залишається на місці за будь-якого масштабу; масштабом обмежується лише щільна сітка 1 mm. Встановіть 0, щоб сховати заливку, лишивши її поверхню вибору активною. Користувацькі робочі площини ігнорують це налаштування. Діапазон: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Мін. чутливість орбіти камери
settings.ui_camera_orbit_min.description=Чутливість обертання в градусах на одиницю координат миші JavaFX. min керує дуже повільними перетягуваннями. Діапазон: 0.0 - 1.0.
settings.ui_camera_orbit_max=Макс. чутливість орбіти камери
settings.ui_camera_orbit_max.description=Чутливість обертання в градусах на одиницю координат миші JavaFX. max — верхня межа для швидких перетягувань. Діапазон: 0.0 - 1.0.
settings.ui_camera_orbit_half=Половина швидкості орбіти камери
settings.ui_camera_orbit_half.description=Відфільтрована швидкість курсора в одиницях координат JavaFX за секунду, за якої чутливість перебуває посередині між min і max. Вище = м'якше прискорення. Діапазон: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Час наростання орбіти камери (ms)
settings.ui_camera_orbit_rise_ms.description=Сталі часу (мілісекунди) для оцінки швидкості курсора при прискоренні. Більше riseMs пом'якшує прискорення. Діапазон: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Час спадання орбіти камери (ms)
settings.ui_camera_orbit_fall_ms.description=Сталі часу (мілісекунди) для оцінки швидкості курсора при сповільненні. Менше fallMs швидше повертає точне керування. Ні те, ні інше не додає камері інерцію. Діапазон: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Затримка стабілізації сцени для ребер (ms)
settings.ui_edges_scene_settle_delay_ms.description=Затримка після змін геометрії або відображення. Більші значення пригнічують більше роботи під час швидкого відтворення історії. Діапазон: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Затримка стабілізації камери для ребер (ms)
settings.ui_edges_camera_settle_delay_ms.description=Затримка після руху камери перед перебудовою товщини тонких ліній у екранному просторі. Діапазон: 0 - 10000.
settings.ui_edges_topology_precision=Точність топології ребер
settings.ui_edges_topology_precision.description=Крок квантування, що використовується для нормалізації топології ребер форми. Геометрія моделі й нормалі граней залишаються незмінними. Діапазон: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Допуск зшивання ребер (mm)
settings.ui_edges_stitch_tolerance.description=Допуск зшивання меж у міліметрах сцени. Використовується лише для ребер, що виглядають як межа однієї грані після аналізу суміжності індексованої сітки. Дозволяє по-різному розбитим, але геометрично збіжним межам з'єднатися до рішення, чи є вони справжніми ребрами форми. Діапазон: 0.0 - 1.0.
