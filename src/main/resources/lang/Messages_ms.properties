# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elemen UI
settings.ui_section_lighting=Pencahayaan
settings.ui_section_edges=Tepi Ciri
settings.ui_section_grid=Grid Satah Kerja
settings.ui_section_camera=Orbit Kamera
settings.ui_section_timing=Masa Tepi Ciri
settings.ui_description=Perihalan diambil daripada scene-style.properties. Nilai disimpan ke ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Mod Pencahayaan
settings.ui_lighting_mode.description=Kekalkan tepat satu mod pencahayaan. 'stable' = Cahaya berarah tetap dalam ruang dunia. Pencahayaan tidak berputar bersama kamera. Direka untuk kesetiaan warna yang baik dan geometri CAD yang mudah dibaca. 'kevin' = Pencahayaan BowlerStudio asal. Menggunakan tiga lampu titik; satu mengikut kamera. Tetapan cahaya stabil di bawah diabaikan dalam mod ini.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Cahaya Ambien
settings.ui_lighting_ambient.description=Cahaya ambien mempengaruhi setiap permukaan yang kelihatan secara sama rata. Lebih tinggi: bayang lebih terang, warna lebih hampir kepada warna asasnya, tetapi permukaan kelihatan lebih rata. Lebih rendah: lorekan dan pemisahan permukaan lebih kuat, tetapi warna dalam bayang menjadi lebih gelap.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Lampu Utama Diaktifkan
settings.ui_lighting_key_enabled.description=Lampu utama yang digunakan untuk menggambarkan bentuk objek. Tetapkan enabled=false untuk membuang lampu ini sepenuhnya.
settings.ui_lighting_key_intensity=Keamatan Lampu Utama
settings.ui_lighting_key_intensity.description=Keamatan lampu utama. Julat: 0.0 - 1.0.
settings.ui_lighting_key_x=Lampu Utama X
settings.ui_lighting_key_x.description=Arah lampu utama dalam koordinat dunia. Julat: -1.0 - 1.0.
settings.ui_lighting_key_y=Lampu Utama Y
settings.ui_lighting_key_y.description=Arah lampu utama dalam koordinat dunia. Julat: -1.0 - 1.0.
settings.ui_lighting_key_z=Lampu Utama Z
settings.ui_lighting_key_z.description=Arah lampu utama dalam koordinat dunia. Julat: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Lampu Isian Diaktifkan
settings.ui_lighting_fill_enabled.description=Melembutkan sisi bayang yang dicipta oleh lampu utama. Tetapkan enabled=false untuk membuang lampu ini sepenuhnya.
settings.ui_lighting_fill_intensity=Keamatan Lampu Isian
settings.ui_lighting_fill_intensity.description=Keamatan lebih tinggi: kesetiaan warna lebih baik, lorekan lebih lembut. Keamatan lebih rendah: perbezaan antara permukaan berorientasi berbeza lebih kuat. Julat: 0.0 - 1.0.
settings.ui_lighting_fill_x=Lampu Isian X
settings.ui_lighting_fill_x.description=Arah lampu isian dalam koordinat dunia. Julat: -1.0 - 1.0.
settings.ui_lighting_fill_y=Lampu Isian Y
settings.ui_lighting_fill_y.description=Arah lampu isian dalam koordinat dunia. Julat: -1.0 - 1.0.
settings.ui_lighting_fill_z=Lampu Isian Z
settings.ui_lighting_fill_z.description=Arah lampu isian dalam koordinat dunia. Julat: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Lampu Tepi Diaktifkan
settings.ui_lighting_rim_enabled.description=Lampu sekunder lemah yang membantu memisahkan sesetengah permukaan. Biasanya patut kekal halus. Tetapkan enabled=false untuk membuang lampu ini sepenuhnya.
settings.ui_lighting_rim_intensity=Keamatan Lampu Tepi
settings.ui_lighting_rim_intensity.description=Lampu sekunder lemah yang membantu memisahkan sesetengah permukaan. Biasanya patut kekal halus. Julat: 0.0 - 1.0.
settings.ui_lighting_rim_x=Lampu Tepi X
settings.ui_lighting_rim_x.description=Arah lampu tepi dalam koordinat dunia. Julat: -1.0 - 1.0.
settings.ui_lighting_rim_y=Lampu Tepi Y
settings.ui_lighting_rim_y.description=Arah lampu tepi dalam koordinat dunia. Julat: -1.0 - 1.0.
settings.ui_lighting_rim_z=Lampu Tepi Z
settings.ui_lighting_rim_z.description=Arah lampu tepi dalam koordinat dunia. Julat: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Tepi Ciri Diaktifkan
settings.ui_edges_enabled.description=Lukis geometri gelap di sepanjang tepi tajam sebenar objek CSG. Sempadan poligon koplanar diabaikan. Tetapkan enabled=false untuk membuang tepi sepenuhnya.
settings.ui_edges_angle_degrees=Sudut Tepi (darjah)
settings.ui_edges_angle_degrees.description=Sudut minimum antara permukaan bersebelahan sebelum tepi kongsinya dilukis. Nilai lebih tinggi menghasilkan lebih sedikit garis lipatan. Julat: 0 - 360.
settings.ui_edges_width_mode=Mod Lebar Tepi
settings.ui_edges_width_mode.description=screen = Mengekalkan garis luar hampir malar dalam piksel skrin. Terbaik untuk rupa garis halus gaya CAD pada mana-mana tahap zum. world = Menggunakan jejari tetap dalam milimeter babak.
settings.ui_edges_width_px=Lebar Tepi (px)
settings.ui_edges_width_px.description=Lebar garis yang kelihatan apabila widthMode=screen. Julat: 0.1 - 10.0.
settings.ui_edges_radius=Jejari Tepi
settings.ui_edges_radius.description=Jejari tepi dalam ruang dunia dalam milimeter babak. Digunakan hanya apabila widthMode=world. Julat: 0.001 - 100.0.
settings.ui_edges_brightness=Kecerahan Tepi
settings.ui_edges_brightness.description=0.0 = hitam, 1.0 = putih. Julat: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Kedalaman Zum Papar Grid Kecil
settings.ui_grid_small_visible_zoom_depth.description=Mengawal sejauh mana grid 1 mm kekal kelihatan. Nilai lebih tinggi = grid 1 mm muncul lebih awal / lebih jauh. Julat: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Pengganda Kecerahan Grid Kecil
settings.ui_grid_small_brightness_multiplier.description=Mendarab kecerahan RGB sambil mengekalkan rona tema. 1.0 = warna tema asal. < 1.0 = lebih gelap. > 1.0 = lebih terang. Julat: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Pengganda Kelegapan Grid Kecil
settings.ui_grid_small_opacity_multiplier.description=Mendarab alpha yang dibekalkan oleh tema semasa. 1.0 = tidak berubah. Julat: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Lebar Garis Grid Kecil (px)
settings.ui_grid_small_line_width_px.description=Ketebalan garis grid dalam unit piksel tekstur lama grid. Nilai sejarah semasa ialah 2 untuk 1 mm dan 4 untuk 10 mm. Julat: 1 - 10.
settings.ui_grid_small_z_offset_mm=Ofset Z Grid Kecil (mm)
settings.ui_grid_small_z_offset_mm.description=Kekalkan grid 1 mm tepat di belakang grid 10 mm untuk mengelakkan artifak kedalaman. Julat: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Pengganda Kecerahan Grid Utama
settings.ui_grid_major_brightness_multiplier.description=Mendarab kecerahan RGB sambil mengekalkan rona tema. 1.0 = warna tema asal. < 1.0 = lebih gelap. > 1.0 = lebih terang. Julat: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Pengganda Kelegapan Grid Utama
settings.ui_grid_major_opacity_multiplier.description=Mendarab alpha yang dibekalkan oleh tema semasa. 1.0 = tidak berubah. Julat: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Lebar Garis Grid Utama (px)
settings.ui_grid_major_line_width_px.description=Ketebalan garis grid dalam unit piksel tekstur lama grid. Nilai sejarah semasa ialah 2 untuk 1 mm dan 4 untuk 10 mm. Julat: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Mod Pergerakan Grid
settings.ui_grid_motion_mode.description=major = Kekalkan hanya grid 10 mm yang tajam kelihatan semasa bergerak dan sembunyikan grid 1 mm yang padat buat sementara. Grid 1 mm kembali selepas pergerakan berhenti. all = Kekalkan kedua-dua grid garis tajam kelihatan semasa bergerak. Kesinambungan visual terbaik, tetapi berpotensi lebih mahal. texture = Tingkah laku asal: tukar geometri garis dengan kuad grid bertekstur semasa bergerak. Lebih pantas, tetapi mungkin menghasilkan aliasing / corak moire. hidden = Sembunyikan garis grid semasa bergerak dan pulihkannya apabila kamera berhenti.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Kelegapan Render Tanah
settings.ui_grid_ground_render_opacity.description=Kelegapan isian tanah utama. Isian kekal di tempatnya pada setiap tahap zum; hanya grid 1 mm yang padat dikawal oleh zum. Tetapkan kepada 0 untuk menyembunyikan isian sambil mengekalkan permukaan pemilihnya aktif. Satah kerja tersuai mengabaikan tetapan ini. Julat: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kepekaan Minimum Orbit Kamera
settings.ui_camera_orbit_min.description=Kepekaan putaran dalam darjah per unit koordinat tetikus JavaFX. min mengawal seret yang sangat perlahan. Julat: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kepekaan Maksimum Orbit Kamera
settings.ui_camera_orbit_max.description=Kepekaan putaran dalam darjah per unit koordinat tetikus JavaFX. max ialah had atas untuk seret pantas. Julat: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kelajuan Separuh Orbit Kamera
settings.ui_camera_orbit_half.description=Kelajuan kursor yang ditapis dalam unit koordinat JavaFX sesaat apabila kepekaan berada di tengah antara min dan max. Lebih tinggi = pecutan lebih lembut. Julat: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Masa Naik Orbit Kamera (ms)
settings.ui_camera_orbit_rise_ms.description=Pemalar masa (milisaat) untuk anggaran kelajuan kursor semasa memecut. riseMs lebih tinggi melembutkan pecutan. Julat: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Masa Turun Orbit Kamera (ms)
settings.ui_camera_orbit_fall_ms.description=Pemalar masa (milisaat) untuk anggaran kelajuan kursor semasa memperlahankan. fallMs lebih rendah memulihkan kawalan halus lebih awal. Kedua-duanya tidak menambah inersia kamera. Julat: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Lengah Penetapan Babak Tepi (ms)
settings.ui_edges_scene_settle_delay_ms.description=Lengah selepas perubahan geometri / paparan. Nilai lebih tinggi menekan lebih banyak kerja semasa main semula sejarah yang pantas. Julat: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Lengah Penetapan Kamera Tepi (ms)
settings.ui_edges_camera_settle_delay_ms.description=Lengah selepas pergerakan kamera sebelum ketebalan garis halus ruang skrin dibina semula. Julat: 0 - 10000.
settings.ui_edges_topology_precision=Ketepatan Topologi Tepi
settings.ui_edges_topology_precision.description=Langkah pengkuantuman yang digunakan untuk menormalkan topologi tepi ciri. Geometri model dan normal permukaan kekal tidak berubah. Julat: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Toleransi Jahitan Tepi (mm)
settings.ui_edges_stitch_tolerance.description=Toleransi penjahitan sempadan dalam milimeter babak. Digunakan hanya untuk tepi yang kelihatan satu permukaan selepas ketetanggaan mesh berindeks. Ia membolehkan sempadan yang dibahagikan secara berbeza tetapi bertindih secara geometri disambung semula sebelum memutuskan sama ada ia tepi ciri sebenar. Julat: 0.0 - 1.0.
