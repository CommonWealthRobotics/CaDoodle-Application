# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=UI-Elemente
settings.ui_section_lighting=Beleuchtung
settings.ui_section_edges=Kantenmerkmale
settings.ui_section_grid=Arbeitsebenen-Raster
settings.ui_section_camera=Kameraorbit
settings.ui_section_timing=Zeitsteuerung der Kantenmerkmale
settings.ui_description=Beschreibung aus scene-style.properties. Der Wert wird in der ConfigurationDatabase gespeichert.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Beleuchtungsmodus
settings.ui_lighting_mode.description=Genau einen Beleuchtungsmodus beibehalten. 'stable' = Feste gerichtete Lichter im Weltkoordinatensystem. Die Beleuchtung dreht sich nicht mit der Kamera. Für gute Farbtreue und gut lesbare CAD-Geometrie ausgelegt. 'kevin' = Originalbeleuchtung von BowlerStudio. Verwendet drei Punktlichter; eines folgt der Kamera. Die Einstellungen für die stabilen Lichter unten werden in diesem Modus ignoriert.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Umgebungslicht
settings.ui_lighting_ambient.description=Umgebungslicht wirkt gleichmäßig auf jede sichtbare Oberfläche. Höher: hellere Schatten, Farben bleiben näher an ihrer Grundfarbe, Oberflächen wirken aber flacher. Niedriger: stärkere Schattierung und Trennung der Oberflächen, verschattete Farben werden jedoch dunkler.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Hauptlicht aktiviert
settings.ui_lighting_key_enabled.description=Hauptlicht, das die Form des Objekts beschreibt. enabled=false setzen, um dieses Licht vollständig zu entfernen.
settings.ui_lighting_key_intensity=Hauptlicht-Intensität
settings.ui_lighting_key_intensity.description=Intensität des Hauptlichts. Bereich: 0.0 - 1.0.
settings.ui_lighting_key_x=Hauptlicht X
settings.ui_lighting_key_x.description=Richtung des Hauptlichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
settings.ui_lighting_key_y=Hauptlicht Y
settings.ui_lighting_key_y.description=Richtung des Hauptlichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
settings.ui_lighting_key_z=Hauptlicht Z
settings.ui_lighting_key_z.description=Richtung des Hauptlichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Fülllicht aktiviert
settings.ui_lighting_fill_enabled.description=Mildert die Schattenseite, die vom Hauptlicht erzeugt wird. enabled=false setzen, um dieses Licht vollständig zu entfernen.
settings.ui_lighting_fill_intensity=Fülllicht-Intensität
settings.ui_lighting_fill_intensity.description=Höhere Intensität: bessere Farbtreue, weichere Schattierung. Niedrigere Intensität: stärkerer Unterschied zwischen unterschiedlich ausgerichteten Flächen. Bereich: 0.0 - 1.0.
settings.ui_lighting_fill_x=Fülllicht X
settings.ui_lighting_fill_x.description=Richtung des Fülllichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
settings.ui_lighting_fill_y=Fülllicht Y
settings.ui_lighting_fill_y.description=Richtung des Fülllichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
settings.ui_lighting_fill_z=Fülllicht Z
settings.ui_lighting_fill_z.description=Richtung des Fülllichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Konturlicht aktiviert
settings.ui_lighting_rim_enabled.description=Schwaches Sekundärlicht, das hilft, einige Oberflächen zu trennen. Sollte normalerweise dezent bleiben. enabled=false setzen, um dieses Licht vollständig zu entfernen.
settings.ui_lighting_rim_intensity=Konturlicht-Intensität
settings.ui_lighting_rim_intensity.description=Schwaches Sekundärlicht, das hilft, einige Oberflächen zu trennen. Sollte normalerweise dezent bleiben. Bereich: 0.0 - 1.0.
settings.ui_lighting_rim_x=Konturlicht X
settings.ui_lighting_rim_x.description=Richtung des Konturlichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
settings.ui_lighting_rim_y=Konturlicht Y
settings.ui_lighting_rim_y.description=Richtung des Konturlichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
settings.ui_lighting_rim_z=Konturlicht Z
settings.ui_lighting_rim_z.description=Richtung des Konturlichts in Weltkoordinaten. Bereich: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Kantenmerkmale aktiviert
settings.ui_edges_enabled.description=Zeichnet dunkle Geometrie entlang echter scharfer Kanten von CSG-Objekten. Grenzen koplanarer Polygone werden ignoriert. enabled=false setzen, um die Kanten vollständig zu entfernen.
settings.ui_edges_angle_degrees=Kantenwinkel (Grad)
settings.ui_edges_angle_degrees.description=Minimaler Winkel zwischen benachbarten Flächen, bevor ihre gemeinsame Kante gezeichnet wird. Höhere Werte erzeugen weniger Knicklinien. Bereich: 0 - 360.
settings.ui_edges_width_mode=Kantenbreitenmodus
settings.ui_edges_width_mode.description=screen = Hält die Kontur in Bildschirmpixeln annähernd konstant. Am besten für ein CAD-artiges Haarlinien-Aussehen bei jedem Zoom. world = Verwendet einen festen Radius in Szenenmillimetern.
settings.ui_edges_width_px=Kantenbreite (Pixel)
settings.ui_edges_width_px.description=Sichtbare Linienbreite bei widthMode=screen. Bereich: 0.1 - 10.0.
settings.ui_edges_radius=Kantenradius
settings.ui_edges_radius.description=Kantenradius in Weltkoordinaten, in Szenenmillimetern. Wird nur bei widthMode=world verwendet. Bereich: 0.001 - 100.0.
settings.ui_edges_brightness=Kantenhelligkeit
settings.ui_edges_brightness.description=0.0 = schwarz, 1.0 = weiß. Bereich: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Sichtbare Zoomtiefe des kleinen Rasters
settings.ui_grid_small_visible_zoom_depth.description=Steuert, wie weit entfernt das 1-mm-Raster sichtbar bleibt. Höherer Wert = 1-mm-Raster erscheint früher / weiter entfernt. Bereich: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Helligkeitsfaktor des kleinen Rasters
settings.ui_grid_small_brightness_multiplier.description=Multipliziert die RGB-Helligkeit, während der Farbton des Themes erhalten bleibt. 1.0 = ursprüngliche Themenfarbe. < 1.0 = dunkler. > 1.0 = heller. Bereich: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Deckkraftfaktor des kleinen Rasters
settings.ui_grid_small_opacity_multiplier.description=Multipliziert das Alpha, das das aktuelle Theme vorgibt. 1.0 = unverändert. Bereich: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Linienbreite des kleinen Rasters (px)
settings.ui_grid_small_line_width_px.description=Rasterlinienstärke in den alten Texturpixeleinheiten des Rasters. Aktuelle historische Werte sind 2 für 1 mm und 4 für 10 mm. Bereich: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z-Versatz des kleinen Rasters (mm)
settings.ui_grid_small_z_offset_mm.description=Hält das 1-mm-Raster knapp hinter dem 10-mm-Raster, um Tiefenartefakte zu vermeiden. Bereich: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Helligkeitsfaktor des großen Rasters
settings.ui_grid_major_brightness_multiplier.description=Multipliziert die RGB-Helligkeit, während der Farbton des Themes erhalten bleibt. 1.0 = ursprüngliche Themenfarbe. < 1.0 = dunkler. > 1.0 = heller. Bereich: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Deckkraftfaktor des großen Rasters
settings.ui_grid_major_opacity_multiplier.description=Multipliziert das Alpha, das das aktuelle Theme vorgibt. 1.0 = unverändert. Bereich: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Linienbreite des großen Rasters (px)
settings.ui_grid_major_line_width_px.description=Rasterlinienstärke in den alten Texturpixeleinheiten des Rasters. Aktuelle historische Werte sind 2 für 1 mm und 4 für 10 mm. Bereich: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Raster-Bewegungsmodus
settings.ui_grid_motion_mode.description=major = Beim Bewegen nur das scharfe 10-mm-Raster sichtbar lassen und das dichte 1-mm-Raster vorübergehend ausblenden. Das 1-mm-Raster kehrt zurück, sobald die Bewegung stoppt. all = Beide scharfen Linienraster beim Bewegen sichtbar lassen. Beste visuelle Kontinuität, aber möglicherweise teurer. texture = Ursprüngliches Verhalten: Liniengeometrie beim Bewegen gegen texturierte Raster-Quads tauschen. Schneller, kann aber Aliasing / Moiré-Muster erzeugen. hidden = Rasterlinien beim Bewegen ausblenden und wiederherstellen, wenn die Kamera stoppt.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Deckkraft der Bodenfüllung
settings.ui_grid_ground_render_opacity.description=Deckkraft der Hauptbodenfüllung. Die Füllung bleibt bei jedem Zoom an Ort und Stelle; nur das dichte 1-mm-Raster wird vom Zoom abhängig ein- und ausgeblendet. Auf 0 setzen, um die Füllung auszublenden, während ihre Auswahloberfläche aktiv bleibt. Benutzerdefinierte Arbeitsebenen ignorieren diese Einstellung. Bereich: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Minimale Empfindlichkeit des Kameraorbits
settings.ui_camera_orbit_min.description=Rotationsempfindlichkeit in Grad pro JavaFX-Mauskoordinateneinheit. min steuert sehr langsame Züge. Bereich: 0.0 - 1.0.
settings.ui_camera_orbit_max=Maximale Empfindlichkeit des Kameraorbits
settings.ui_camera_orbit_max.description=Rotationsempfindlichkeit in Grad pro JavaFX-Mauskoordinateneinheit. max ist die Obergrenze für schnelle Züge. Bereich: 0.0 - 1.0.
settings.ui_camera_orbit_half=Halbe Geschwindigkeit des Kameraorbits
settings.ui_camera_orbit_half.description=Gefilterte Cursorgeschwindigkeit in JavaFX-Koordinateneinheiten pro Sekunde, bei der die Empfindlichkeit genau zwischen min und max liegt. Höher = sanftere Beschleunigung. Bereich: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Anstiegszeit des Kameraorbits (ms)
settings.ui_camera_orbit_rise_ms.description=Zeitkonstanten (Millisekunden) für die Schätzung der Cursorgeschwindigkeit beim Beschleunigen. Höhere riseMs dämpfen die Beschleunigung. Bereich: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Abfallzeit des Kameraorbits (ms)
settings.ui_camera_orbit_fall_ms.description=Zeitkonstanten (Millisekunden) für die Schätzung der Cursorgeschwindigkeit beim Verlangsamen. Niedrigere fallMs stellen die Feinsteuerung schneller wieder her. Keine der beiden fügt Kameraträgheit hinzu. Bereich: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Beruhigungsverzögerung der Kantenszene (ms)
settings.ui_edges_scene_settle_delay_ms.description=Verzögerung nach Geometrie- oder Anzeigeänderungen. Höhere Werte unterdrücken mehr Arbeit bei schneller Wiedergabe des Verlaufs. Bereich: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Beruhigungsverzögerung der Kantenkamera (ms)
settings.ui_edges_camera_settle_delay_ms.description=Verzögerung nach Kamerabewegungen, bevor die Haarliniendicke im Bildschirmraum neu aufgebaut wird. Bereich: 0 - 10000.
settings.ui_edges_topology_precision=Topologiepräzision der Kanten
settings.ui_edges_topology_precision.description=Quantisierungsschritt zum Normalisieren der Topologie der Kantenmerkmale. Modellgeometrie und Flächennormalen bleiben unverändert. Bereich: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Toleranz beim Vernähen der Kanten (mm)
settings.ui_edges_stitch_tolerance.description=Toleranz beim Vernähen von Grenzen in Szenenmillimetern. Wird nur für Kanten verwendet, die nach der Nachbarschaftsanalyse des indizierten Netzes scheinbar zu einer einzigen Fläche gehören. Sie erlaubt, unterschiedlich unterteilte, aber geometrisch übereinstimmende Ränder wieder zu verbinden, bevor entschieden wird, ob es echte Kantenmerkmale sind. Bereich: 0.0 - 1.0.
