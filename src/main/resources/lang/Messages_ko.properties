settings.ui_description=scene-style.properties 에서 가져온 설명입니다. 값은 ConfigurationDatabase 에 저장됩니다.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=조명 모드
settings.ui_lighting_mode.description=조명 모드를 정확히 하나만 유지하십시오. 'stable' = 월드 공간에 고정된 방향 조명. 조명이 카메라와 함께 회전하지 않습니다. 우수한 색 정확도와 읽기 쉬운 CAD 형상을 위해 설계되었습니다. 'kevin' = 원래의 BowlerStudio 조명. 세 개의 포인트 조명을 사용하며 그중 하나가 카메라를 따릅니다. 이 모드에서는 아래의 안정 조명 설정이 무시됩니다.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=주변광
settings.ui_lighting_ambient.description=주변광은 모든 가시 표면에 균등하게 영향을 줍니다. 높이면 그림자가 밝아지고 색상이 기본 색에 가까워지지만 표면이 평평해 보입니다. 낮추면 셰이딩과 표면 분리가 강해지지만 그림자 색상이 어두워집니다.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=키 라이트 사용
settings.ui_lighting_key_enabled.description=개체의 형태를 표현하는 주 조명. enabled=false 로 설정하면 이 조명을 완전히 제거합니다.
settings.ui_lighting_key_intensity=키 라이트 강도
settings.ui_lighting_key_intensity.description=키 라이트의 강도. 범위: 0.0 - 1.0.
settings.ui_lighting_key_x=키 라이트 X
settings.ui_lighting_key_x.description=월드 좌표에서의 키 라이트 방향. 범위: -1.0 - 1.0.
settings.ui_lighting_key_y=키 라이트 Y
settings.ui_lighting_key_y.description=월드 좌표에서의 키 라이트 방향. 범위: -1.0 - 1.0.
settings.ui_lighting_key_z=키 라이트 Z
settings.ui_lighting_key_z.description=월드 좌표에서의 키 라이트 방향. 범위: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=필 라이트 사용
settings.ui_lighting_fill_enabled.description=키 라이트가 만드는 그림자 쪽을 부드럽게 합니다. enabled=false 로 설정하면 이 조명을 완전히 제거합니다.
settings.ui_lighting_fill_intensity=필 라이트 강도
settings.ui_lighting_fill_intensity.description=강도를 높이면 색 정확도가 좋아지고 셰이딩이 부드러워집니다. 강도를 낮추면 방향이 다른 면 사이의 차이가 강해집니다. 범위: 0.0 - 1.0.
settings.ui_lighting_fill_x=필 라이트 X
settings.ui_lighting_fill_x.description=월드 좌표에서의 필 라이트 방향. 범위: -1.0 - 1.0.
settings.ui_lighting_fill_y=필 라이트 Y
settings.ui_lighting_fill_y.description=월드 좌표에서의 필 라이트 방향. 범위: -1.0 - 1.0.
settings.ui_lighting_fill_z=필 라이트 Z
settings.ui_lighting_fill_z.description=월드 좌표에서의 필 라이트 방향. 범위: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=림 라이트 사용
settings.ui_lighting_rim_enabled.description=일부 표면을 분리하는 데 도움을 주는 약한 보조 조명. 일반적으로 은은하게 유지해야 합니다. enabled=false 로 설정하면 이 조명을 완전히 제거합니다.
settings.ui_lighting_rim_intensity=림 라이트 강도
settings.ui_lighting_rim_intensity.description=일부 표면을 분리하는 데 도움을 주는 약한 보조 조명. 일반적으로 은은하게 유지해야 합니다. 범위: 0.0 - 1.0.
settings.ui_lighting_rim_x=림 라이트 X
settings.ui_lighting_rim_x.description=월드 좌표에서의 림 라이트 방향. 범위: -1.0 - 1.0.
settings.ui_lighting_rim_y=림 라이트 Y
settings.ui_lighting_rim_y.description=월드 좌표에서의 림 라이트 방향. 범위: -1.0 - 1.0.
settings.ui_lighting_rim_z=림 라이트 Z
settings.ui_lighting_rim_z.description=월드 좌표에서의 림 라이트 방향. 범위: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=피처 에지 사용
settings.ui_edges_enabled.description=CSG 개체의 실제 날카로운 에지를 따라 어두운 형상을 그립니다. 동일 평면의 폴리곤 경계는 무시됩니다. enabled=false 로 설정하면 에지를 완전히 제거합니다.
settings.ui_edges_angle_degrees=에지 각도 (도)
settings.ui_edges_angle_degrees.description=인접한 면의 공유 에지가 그려지기 전의 최소 각도. 값을 높이면 주름선이 줄어듭니다. 범위: 0 - 360.
settings.ui_edges_width_mode=에지 너비 모드
settings.ui_edges_width_mode.description=screen = 윤곽선을 화면 픽셀 단위로 거의 일정하게 유지합니다. 어떤 확대/축소 수준에서도 CAD 스타일의 가는 선 모양에 가장 적합합니다. world = 장면 밀리미터 단위로 고정된 반지름을 사용합니다.
settings.ui_edges_width_px=에지 너비 (px)
settings.ui_edges_width_px.description=widthMode=screen 일 때의 표시 선 너비. 범위: 0.1 - 10.0.
settings.ui_edges_radius=에지 반지름
settings.ui_edges_radius.description=장면 밀리미터 단위의 월드 공간 에지 반지름. widthMode=world 일 때만 사용됩니다. 범위: 0.001 - 100.0.
settings.ui_edges_brightness=에지 밝기
settings.ui_edges_brightness.description=0.0 = 검정, 1.0 = 흰색. 범위: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=작은 그리드 표시 줌 깊이
settings.ui_grid_small_visible_zoom_depth.description=1 mm 그리드가 보이는 거리를 제어합니다. 값이 높을수록 = 1 mm 그리드가 더 빨리 / 더 멀리 나타납니다. 범위: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=작은 그리드 밝기 배율
settings.ui_grid_small_brightness_multiplier.description=테마 색조를 유지하면서 RGB 밝기를 곱합니다. 1.0 = 원래 테마 색상. < 1.0 = 어둡게. > 1.0 = 밝게. 범위: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=작은 그리드 불투명도 배율
settings.ui_grid_small_opacity_multiplier.description=현재 테마에서 제공하는 알파를 곱합니다. 1.0 = 변경 없음. 범위: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=작은 그리드 선 너비 (px)
settings.ui_grid_small_line_width_px.description=그리드의 기존 텍스처 픽셀 단위로 나타낸 그리드 선 두께. 현재 기록 값은 1 mm 에서 2, 10 mm 에서 4 입니다. 범위: 1 - 10.
settings.ui_grid_small_z_offset_mm=작은 그리드 Z 오프셋 (mm)
settings.ui_grid_small_z_offset_mm.description=깊이 아티팩트를 피하기 위해 1 mm 그리드를 10 mm 그리드 바로 뒤에 유지합니다. 범위: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=큰 그리드 밝기 배율
settings.ui_grid_major_brightness_multiplier.description=테마 색조를 유지하면서 RGB 밝기를 곱합니다. 1.0 = 원래 테마 색상. < 1.0 = 어둡게. > 1.0 = 밝게. 범위: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=큰 그리드 불투명도 배율
settings.ui_grid_major_opacity_multiplier.description=현재 테마에서 제공하는 알파를 곱합니다. 1.0 = 변경 없음. 범위: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=큰 그리드 선 너비 (px)
settings.ui_grid_major_line_width_px.description=그리드의 기존 텍스처 픽셀 단위로 나타낸 그리드 선 두께. 현재 기록 값은 1 mm 에서 2, 10 mm 에서 4 입니다. 범위: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=그리드 동작 모드
settings.ui_grid_motion_mode.description=major = 이동하는 동안 선명한 10 mm 그리드만 표시하고 조밀한 1 mm 그리드를 일시적으로 숨깁니다. 이동이 멈추면 1 mm 그리드가 돌아옵니다. all = 이동하는 동안 두 선명한 선 그리드를 모두 표시합니다. 시각적 연속성이 가장 좋지만 비용이 더 많이 들 수 있습니다. texture = 원래 동작: 이동하는 동안 선 형상을 텍스처가 입혀진 그리드 쿼드로 교체합니다. 더 빠르지만 앨리어싱 / 모아레 패턴이 발생할 수 있습니다. hidden = 이동하는 동안 그리드 선을 숨기고 카메라가 멈추면 복원합니다.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=바닥 렌더링 불투명도
settings.ui_grid_ground_render_opacity.description=주 바닥 채우기의 불투명도. 채우기는 모든 확대/축소 수준에서 제자리에 유지되며, 조밀한 1 mm 그리드만 확대/축소에 의해 제어됩니다. 0 으로 설정하면 선택 표면을 활성 상태로 유지하면서 채우기를 숨깁니다. 사용자 지정 작업 평면은 이 설정을 무시합니다. 범위: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=카메라 궤도 최소 감도
settings.ui_camera_orbit_min.description=JavaFX 마우스 좌표 단위당 도 단위의 회전 감도. min 은 매우 느린 드래그를 제어합니다. 범위: 0.0 - 1.0.
settings.ui_camera_orbit_max=카메라 궤도 최대 감도
settings.ui_camera_orbit_max.description=JavaFX 마우스 좌표 단위당 도 단위의 회전 감도. max 는 빠른 드래그의 상한입니다. 범위: 0.0 - 1.0.
settings.ui_camera_orbit_half=카메라 궤도 절반 속도
settings.ui_camera_orbit_half.description=감도가 min 과 max 의 중간이 되는 초당 JavaFX 좌표 단위의 필터링된 커서 속도. 값이 높을수록 = 가속이 부드러워집니다. 범위: 0 - 10000.
settings.ui_camera_orbit_rise_ms=카메라 궤도 상승 시간 (ms)
settings.ui_camera_orbit_rise_ms.description=가속할 때 커서 속도 추정을 위한 시정수 (밀리초). 이 riseMs 가 높을수록 가속이 부드러워집니다. 범위: 0 - 10000.
settings.ui_camera_orbit_fall_ms=카메라 궤도 하강 시간 (ms)
settings.ui_camera_orbit_fall_ms.description=감속할 때 커서 속도 추정을 위한 시정수 (밀리초). 이 fallMs 가 낮을수록 미세 제어가 더 빨리 돌아옵니다. 둘 다 카메라 관성을 추가하지 않습니다. 범위: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=에지 장면 안정화 지연 (ms)
settings.ui_edges_scene_settle_delay_ms.description=형상 / 표시 변경 후의 지연. 값이 높을수록 빠른 기록 재생 중 더 많은 작업을 억제합니다. 범위: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=에지 카메라 안정화 지연 (ms)
settings.ui_edges_camera_settle_delay_ms.description=카메라 이동 후 화면 공간의 가는 선 두께가 다시 작성되기까지의 지연. 범위: 0 - 10000.
settings.ui_edges_topology_precision=에지 토폴로지 정밀도
settings.ui_edges_topology_precision.description=피처 에지 토폴로지를 정규화하는 데 사용되는 양자화 단계. 모델 형상과 면 법선은 변경되지 않습니다. 범위: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=에지 스티치 허용 오차 (mm)
settings.ui_edges_stitch_tolerance.description=장면 밀리미터 단위의 경계 스티치 허용 오차. 인덱스 메시 인접성 이후 겉보기 단일 면 에지에만 사용됩니다. 세분화가 다르지만 기하학적으로 일치하는 경계를 실제 피처 에지인지 판단하기 전에 다시 연결할 수 있게 합니다. 범위: 0.0 - 1.0.
