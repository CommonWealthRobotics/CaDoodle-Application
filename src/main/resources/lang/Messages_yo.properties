# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Àwọn Ohun Èlò Ìfarahàn
settings.ui_section_lighting=Ìmọ́lẹ̀
settings.ui_section_edges=Etí Àwọn Ẹ̀yà
settings.ui_section_grid=Gríìdì Ìpìlẹ̀ Iṣẹ́
settings.ui_section_camera=Yíyí Kámẹ́rà
settings.ui_section_timing=Àkókò Etí Àwọn Ẹ̀yà
settings.ui_description=Àpèjúwe láti scene-style.properties. Wọ́n ń fi iye náà pamọ́ sínú ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Ipò Ìmọ́lẹ̀
settings.ui_lighting_mode.description=Jẹ́ kí ipò ìmọ́lẹ̀ kan ṣoṣo wà ní pípé. 'stable' = Àwọn ìmọ́lẹ̀ ìtọ́sọ́nà tí ó dúró ṣinṣin nínú àyè ayé. Ìmọ́lẹ̀ kì í yí pẹ̀lú kámẹ́rà. Wọ́n ṣe é fún ìdúróṣinṣin àwòrán tí ó dára àti jẹ́ọ́mẹ́tírì CAD tí ó ṣeé kà. 'kevin' = Ìmọ́lẹ̀ àkọ́kọ́ BowlerStudio. Ó ń lo àwọn ìmọ́lẹ̀ ojú mẹ́ta; ọ̀kan ń tẹ̀lé kámẹ́rà. A kì í kọbiara sí àwọn ètò ìmọ́lẹ̀ dúró ṣinṣin tí ó wà nísàlẹ̀ nínú ipò yìí.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ìmọ́lẹ̀ Àyíká
settings.ui_lighting_ambient.description=Ìmọ́lẹ̀ àyíká ń kan gbogbo ojú tí ó hàn ní ìdọ́gba. Bí ó bá ga: òjìji tí ó túbọ̀ mọ́lẹ̀, àwọn àwọ̀ ń dúró súnmọ́ àwọ̀ ìpilẹ̀ wọn, ṣùgbọ́n àwọn ojú dà bíi pẹrẹsẹ. Bí ó bá kéré: òjìji tí ó lágbára àti ìpínyà ojú, ṣùgbọ́n àwọn àwọ̀ inú òjìji ń di dúdú sí i.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Ìmọ́lẹ̀ Àkọ́kọ́ Ti Tan
settings.ui_lighting_key_enabled.description=Ìmọ́lẹ̀ àkọ́kọ́ tí wọ́n ń lò láti ṣàlàyé ìrísí ohun. Fi enabled=false pamọ́ láti yọ ìmọ́lẹ̀ yìí kúrò pátápátá.
settings.ui_lighting_key_intensity=Agbára Ìmọ́lẹ̀ Àkọ́kọ́
settings.ui_lighting_key_intensity.description=Agbára ìmọ́lẹ̀ àkọ́kọ́. Ìwọ̀n: 0.0 - 1.0.
settings.ui_lighting_key_x=Ìmọ́lẹ̀ Àkọ́kọ́ X
settings.ui_lighting_key_x.description=Ìtọ́sọ́nà ìmọ́lẹ̀ àkọ́kọ́ nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
settings.ui_lighting_key_y=Ìmọ́lẹ̀ Àkọ́kọ́ Y
settings.ui_lighting_key_y.description=Ìtọ́sọ́nà ìmọ́lẹ̀ àkọ́kọ́ nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
settings.ui_lighting_key_z=Ìmọ́lẹ̀ Àkọ́kọ́ Z
settings.ui_lighting_key_z.description=Ìtọ́sọ́nà ìmọ́lẹ̀ àkọ́kọ́ nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Ìmọ́lẹ̀ Àkún Ti Tan
settings.ui_lighting_fill_enabled.description=Ó ń mú ẹ̀gbẹ́ òjìji tí ìmọ́lẹ̀ àkọ́kọ́ dá rọ̀. Fi enabled=false pamọ́ láti yọ ìmọ́lẹ̀ yìí kúrò pátápátá.
settings.ui_lighting_fill_intensity=Agbára Ìmọ́lẹ̀ Àkún
settings.ui_lighting_fill_intensity.description=Agbára tí ó ga: ìdúróṣinṣin àwọ̀ tí ó dára, òjìji rírọ̀. Agbára tí ó kéré: ìyàtọ̀ tí ó lágbára láàrín àwọn ojú tí ó ní ìtọ́sọ́nà ọ̀tọ̀ọ̀tọ̀. Ìwọ̀n: 0.0 - 1.0.
settings.ui_lighting_fill_x=Ìmọ́lẹ̀ Àkún X
settings.ui_lighting_fill_x.description=Ìtọ́sọ́nà ìmọ́lẹ̀ àkún nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
settings.ui_lighting_fill_y=Ìmọ́lẹ̀ Àkún Y
settings.ui_lighting_fill_y.description=Ìtọ́sọ́nà ìmọ́lẹ̀ àkún nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
settings.ui_lighting_fill_z=Ìmọ́lẹ̀ Àkún Z
settings.ui_lighting_fill_z.description=Ìtọ́sọ́nà ìmọ́lẹ̀ àkún nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Ìmọ́lẹ̀ Etí Ti Tan
settings.ui_lighting_rim_enabled.description=Ìmọ́lẹ̀ kejì tí ó jẹ́ aláìlágbára tí ó ń ṣèrànwọ́ láti pín àwọn ojú kan. Ó yẹ kí ó máa wà ní àìlágbára nígbà gbogbo. Fi enabled=false pamọ́ láti yọ ìmọ́lẹ̀ yìí kúrò pátápátá.
settings.ui_lighting_rim_intensity=Agbára Ìmọ́lẹ̀ Etí
settings.ui_lighting_rim_intensity.description=Ìmọ́lẹ̀ kejì tí ó jẹ́ aláìlágbára tí ó ń ṣèrànwọ́ láti pín àwọn ojú kan. Ó yẹ kí ó máa wà ní àìlágbára nígbà gbogbo. Ìwọ̀n: 0.0 - 1.0.
settings.ui_lighting_rim_x=Ìmọ́lẹ̀ Etí X
settings.ui_lighting_rim_x.description=Ìtọ́sọ́nà ìmọ́lẹ̀ etí nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
settings.ui_lighting_rim_y=Ìmọ́lẹ̀ Etí Y
settings.ui_lighting_rim_y.description=Ìtọ́sọ́nà ìmọ́lẹ̀ etí nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
settings.ui_lighting_rim_z=Ìmọ́lẹ̀ Etí Z
settings.ui_lighting_rim_z.description=Ìtọ́sọ́nà ìmọ́lẹ̀ etí nínú àwọn ipò àkójọpọ̀ ayé. Ìwọ̀n: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Etí Àwọn Ẹ̀yà Ti Tan
settings.ui_edges_enabled.description=Ya jẹ́ọ́mẹ́tírì dúdú lẹ́gbẹ̀ẹ́ àwọn etí mímú gidi ti àwọn ohun CSG. Wọ́n ń pa àwọn ààlà pọ́lìgọ́nì tí ó wà lórí ojú kan tì. Fi enabled=false pamọ́ láti yọ àwọn etí kúrò pátápátá.
settings.ui_edges_angle_degrees=Ìwọ̀n Igun Etí
settings.ui_edges_angle_degrees.description=Igun tí ó kéré jù láàrín àwọn ojú aládùúgbò kí wọ́n tó ya etí tí wọ́n pín. Àwọn iye tí ó ga ń mú kí àwọn ìlà ìkọ́ dín kù. Ìwọ̀n: 0 - 360.
settings.ui_edges_width_mode=Ipò Ìbú Etí
settings.ui_edges_width_mode.description=screen = Ó ń pa àwòrán ìtẹ́lẹ̀ mọ́ ní pẹ̀tẹ́lẹ̀ nínú píkítì ojú. Ó dára jù fún ìrísí ìlà tínrín irú CAD ní ibi ìsun mọ́kànlójú yóò wù. world = Ó ń lo rédíọ̀sì tí ó dúró ṣinṣin nínú milimita àyè.
settings.ui_edges_width_px=Ìbú Etí Nínú Píkítì
settings.ui_edges_width_px.description=Ìbú ìlà tí ó hàn nígbà widthMode=screen. Ìwọ̀n: 0.1 - 10.0.
settings.ui_edges_radius=Rédíọ̀sì Etí
settings.ui_edges_radius.description=Rédíọ̀sì etí nínú àyè ayé ní milimita àyè. Wọ́n ń lò ó nígbà tí widthMode=world nìkan. Ìwọ̀n: 0.001 - 100.0.
settings.ui_edges_brightness=Ìmọ́lẹ̀ Etí
settings.ui_edges_brightness.description=0.0 = dúdú, 1.0 = funfun. Ìwọ̀n: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Ìjìnnà Ìsun Mọ́kànlójú Gríìdì Kékeré Tí Ó Hàn
settings.ui_grid_small_visible_zoom_depth.description=Ó ń ṣàkóso bí gríìdì 1 mm ṣe máa wà ní ìríran tó jìnnà tó. Iye tí ó ga = gríìdì 1 mm ń hàn ní àkọ́kọ́ / ní ọ̀nà jíjìnnà. Ìwọ̀n: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Olùpín Ìmọ́lẹ̀ Gríìdì Kékeré
settings.ui_grid_small_brightness_multiplier.description=Ó ń pín ìmọ́lẹ̀ RGB nígbà tí ó ń pa àwọ̀ àkòrí mọ́. 1.0 = àwọ̀ àkòrí ìpilẹ̀. < 1.0 = dúdú sí i. > 1.0 = mọ́lẹ̀ sí i. Ìwọ̀n: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Olùpín Ìfarahàn Gríìdì Kékeré
settings.ui_grid_small_opacity_multiplier.description=Ó ń pín ìfarahàn tí àkòrí lọ́wọ́lọ́wọ́ fi fúnni. 1.0 = kò yí padà. Ìwọ̀n: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Ìbú Ìlà Gríìdì Kékeré (px)
settings.ui_grid_small_line_width_px.description=Nípọn ìlà gríìdì nínú àwọn ẹ̀yà píkítì àwòrán gríìdì àtijọ́. Àwọn iye ìtàn lọ́wọ́lọ́wọ́ ni 2 fún 1 mm àti 4 fún 10 mm. Ìwọ̀n: 1 - 10.
settings.ui_grid_small_z_offset_mm=Ìṣípò Z Gríìdì Kékeré (mm)
settings.ui_grid_small_z_offset_mm.description=Pa gríìdì 1 mm mọ́ sẹ́yìn gríìdì 10 mm láti yẹra fún àwọn àbùkù ìjìnnà. Ìwọ̀n: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Olùpín Ìmọ́lẹ̀ Gríìdì Àkọ́kọ́
settings.ui_grid_major_brightness_multiplier.description=Ó ń pín ìmọ́lẹ̀ RGB nígbà tí ó ń pa àwọ̀ àkòrí mọ́. 1.0 = àwọ̀ àkòrí ìpilẹ̀. < 1.0 = dúdú sí i. > 1.0 = mọ́lẹ̀ sí i. Ìwọ̀n: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Olùpín Ìfarahàn Gríìdì Àkọ́kọ́
settings.ui_grid_major_opacity_multiplier.description=Ó ń pín ìfarahàn tí àkòrí lọ́wọ́lọ́wọ́ fi fúnni. 1.0 = kò yí padà. Ìwọ̀n: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Ìbú Ìlà Gríìdì Àkọ́kọ́ (px)
settings.ui_grid_major_line_width_px.description=Nípọn ìlà gríìdì nínú àwọn ẹ̀yà píkítì àwòrán gríìdì àtijọ́. Àwọn iye ìtàn lọ́wọ́lọ́wọ́ ni 2 fún 1 mm àti 4 fún 10 mm. Ìwọ̀n: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Ipò Ìṣíkiri Gríìdì
settings.ui_grid_motion_mode.description=major = Jẹ́ kí gríìdì 10 mm tí ó yé gànàn hàn nìkan nígbà ìṣíkiri kí o sì fi gríìdì 1 mm tí ó kúnnú pamọ́ fún ìgbà díẹ̀. Gríìdì 1 mm yóò padà bọ̀ lẹ́yìn tí ìṣíkiri bá dúró. all = Jẹ́ kí àwọn gríìdì ìlà méjèèjì tí ó yé gànàn hàn nígbà ìṣíkiri. Ìtẹ̀síwájú ìríran tí ó dára jù, ṣùgbọ́n ó lè náni púpọ̀. texture = Ìhùwàsí ìpilẹ̀: pààrọ̀ jẹ́ọ́mẹ́tírì ìlà pẹ̀lú onígun mẹ́rin gríìdì aláwòrán nígbà ìṣíkiri. Ó yára, ṣùgbọ́n ó lè mú àkópọ̀ píkítì / àpẹẹrẹ ìgbì jáde. hidden = Fi àwọn ìlà gríìdì pamọ́ nígbà ìṣíkiri kí o sì dá wọn padà nígbà tí kámẹ́rà bá dúró.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Ìfarahàn Ìkún Ilẹ̀
settings.ui_grid_ground_render_opacity.description=Ìfarahàn ìkún ilẹ̀ àkọ́kọ́. Ìkún náà dúró ní ibùdó rẹ̀ ní ibi ìsun mọ́kànlójú yóò wù; gríìdì 1 mm tí ó kúnnú nìkan ni ìsun mọ́kànlójú ń ṣàkóso. Fi 0 láti fi ìkún pamọ́ nígbà tí o ń pa ojú àṣàyàn rẹ̀ mọ́ ní ṣíṣe. Àwọn ìpìlẹ̀ iṣẹ́ àkànṣe ń pa ètò yìí tì. Ìwọ̀n: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Ìmúnútó Kéré Jù Ti Yíyí Kámẹ́rà
settings.ui_camera_orbit_min.description=Ìmúnútó yíyí ní ìwọ̀n ìgun fún ẹ̀yà ipò àkójọpọ̀ eku kọ̀m̀pútà JavaFX kan. min ń ṣàkóso ìjànpẹ̀ tí ó lọ jẹ́jẹ́. Ìwọ̀n: 0.0 - 1.0.
settings.ui_camera_orbit_max=Ìmúnútó Tí Ó Ga Jù Ti Yíyí Kámẹ́rà
settings.ui_camera_orbit_max.description=Ìmúnútó yíyí ní ìwọ̀n ìgun fún ẹ̀yà ipò àkójọpọ̀ eku kọ̀m̀pútà JavaFX kan. max jẹ́ ààlà òkè fún ìjànpẹ̀ tí ó yára. Ìwọ̀n: 0.0 - 1.0.
settings.ui_camera_orbit_half=Ìlààárín Ìyára Yíyí Kámẹ́rà
settings.ui_camera_orbit_half.description=Ìyára eku kọ̀m̀pútà tí wọ́n yọ̀ǹda nínú àwọn ẹ̀yà ipò àkójọpọ̀ JavaFX ní ìṣẹ́jú àáyá kan níbi tí ìmúnútó ti wà ní àárín min àti max. Bí ó bá ga = ìmúdàgba tí ó rọ̀. Ìwọ̀n: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Àkókò Ìgòkè Yíyí Kámẹ́rà (ms)
settings.ui_camera_orbit_rise_ms.description=Àwọn ìwọ̀n àkókò (mìlísẹ́kọ́ndì) fún ìdíwọ̀n ìyára eku kọ̀m̀pútà nígbà tí ó ń yára sí i. riseMs tí ó ga ń mú ìmúdàgba rọ̀. Ìwọ̀n: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Àkókò Ìsọ̀kalẹ̀ Yíyí Kámẹ́rà (ms)
settings.ui_camera_orbit_fall_ms.description=Àwọn ìwọ̀n àkókò (mìlísẹ́kọ́ndì) fún ìdíwọ̀n ìyára eku kọ̀m̀pútà nígbà tí ó ń lọ jẹ́jẹ́. fallMs tí ó kéré ń dá ìṣàkóso tí ó dára padà ní kíákíá. Èyí méjèèjì kò fi ìnẹ́tíṣà kámẹ́rà kún. Ìwọ̀n: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Ìdúró Ìdálẹ́ Ìran Etí (ms)
settings.ui_edges_scene_settle_delay_ms.description=Ìdádúró lẹ́yìn àwọn ìyípadà jẹ́ọ́mẹ́tírì/ìfarahàn. Àwọn iye tí ó ga ń dín iṣẹ́ kù nígbà àtúnṣe ìtàn tí ó yára. Ìwọ̀n: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Ìdúró Ìdálẹ́ Kámẹ́rà Etí (ms)
settings.ui_edges_camera_settle_delay_ms.description=Ìdádúró lẹ́yìn ìṣíkiri kámẹ́rà kí wọ́n tó tún nípọn ìlà tínrín àyè ojú kọ́. Ìwọ̀n: 0 - 10000.
settings.ui_edges_topology_precision=Pípé Tọ́pọ́lọ́jì Ọnụ
settings.ui_edges_topology_precision.description=Ìgbésẹ̀ ìdíwọ̀n tí wọ́n ń lò láti tún tọ́pọ́lọ́jì etí ẹ̀yà ṣe. Jẹ́ọ́mẹ́tírì àwòṣe àti ìtọ́sọ́nà ojú kò yí padà. Ìwọ̀n: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Ìfaradà Ìrán Etí (mm)
settings.ui_edges_stitch_tolerance.description=Ìfaradà ìrán ààlà nínú milimita àyè. Wọ́n ń lò ó fún àwọn etí tí ó dàbí ojú kan lẹ́yìn ìsopọ̀ mẹ́ṣì alákaọ̀wé nìkan. Ó ń jẹ́ kí àwọn ààlà tí wọ́n pín lọ́nà ọ̀tọ̀ọ̀tọ̀ ṣùgbọ́n tí wọ́n bá ara wọn mu ní jẹ́ọ́mẹ́tírì lè tún so pọ̀ kí wọ́n tó pinnu bóyá wọ́n jẹ́ etí ẹ̀yà gidi. Ìwọ̀n: 0.0 - 1.0.
