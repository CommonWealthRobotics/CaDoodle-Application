# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elemen UI
settings.ui_section_lighting=Pencahayaan
settings.ui_section_edges=Tepi Fitur
settings.ui_section_grid=Kisi Bidang Kerja
settings.ui_section_camera=Orbit Kamera
settings.ui_section_timing=Waktu Tepi Fitur
settings.ui_description=Deskripsi diambil dari scene-style.properties. Nilai disimpan ke ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Mode Pencahayaan
settings.ui_lighting_mode.description=Pertahankan tepat satu mode pencahayaan. 'stable' = Cahaya terarah tetap dalam ruang dunia. Pencahayaan tidak berputar bersama kamera. Dirancang untuk kesetiaan warna yang baik dan geometri CAD yang mudah dibaca. 'kevin' = Pencahayaan BowlerStudio asli. Menggunakan tiga lampu titik; satu mengikuti kamera. Pengaturan cahaya stabil di bawah ini diabaikan dalam mode ini.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Cahaya Ambien
settings.ui_lighting_ambient.description=Cahaya ambien memengaruhi setiap permukaan yang terlihat secara merata. Lebih tinggi: bayangan lebih terang, warna lebih dekat ke warna dasarnya, tetapi permukaan tampak lebih datar. Lebih rendah: peneduhan dan pemisahan permukaan lebih kuat, tetapi warna dalam bayangan menjadi lebih gelap.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Lampu Utama Aktif
settings.ui_lighting_key_enabled.description=Lampu utama yang digunakan untuk menggambarkan bentuk objek. Setel enabled=false untuk menghapus lampu ini sepenuhnya.
settings.ui_lighting_key_intensity=Intensitas Lampu Utama
settings.ui_lighting_key_intensity.description=Intensitas lampu utama. Rentang: 0.0 - 1.0.
settings.ui_lighting_key_x=Lampu Utama X
settings.ui_lighting_key_x.description=Arah lampu utama dalam koordinat dunia. Rentang: -1.0 - 1.0.
settings.ui_lighting_key_y=Lampu Utama Y
settings.ui_lighting_key_y.description=Arah lampu utama dalam koordinat dunia. Rentang: -1.0 - 1.0.
settings.ui_lighting_key_z=Lampu Utama Z
settings.ui_lighting_key_z.description=Arah lampu utama dalam koordinat dunia. Rentang: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Lampu Isi Aktif
settings.ui_lighting_fill_enabled.description=Melembutkan sisi bayangan yang dibuat oleh lampu utama. Setel enabled=false untuk menghapus lampu ini sepenuhnya.
settings.ui_lighting_fill_intensity=Intensitas Lampu Isi
settings.ui_lighting_fill_intensity.description=Intensitas lebih tinggi: kesetiaan warna lebih baik, peneduhan lebih lembut. Intensitas lebih rendah: perbedaan antara permukaan dengan orientasi berbeda lebih kuat. Rentang: 0.0 - 1.0.
settings.ui_lighting_fill_x=Lampu Isi X
settings.ui_lighting_fill_x.description=Arah lampu isi dalam koordinat dunia. Rentang: -1.0 - 1.0.
settings.ui_lighting_fill_y=Lampu Isi Y
settings.ui_lighting_fill_y.description=Arah lampu isi dalam koordinat dunia. Rentang: -1.0 - 1.0.
settings.ui_lighting_fill_z=Lampu Isi Z
settings.ui_lighting_fill_z.description=Arah lampu isi dalam koordinat dunia. Rentang: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Lampu Tepi Aktif
settings.ui_lighting_rim_enabled.description=Lampu sekunder lemah yang membantu memisahkan sebagian permukaan. Biasanya sebaiknya tetap halus. Setel enabled=false untuk menghapus lampu ini sepenuhnya.
settings.ui_lighting_rim_intensity=Intensitas Lampu Tepi
settings.ui_lighting_rim_intensity.description=Lampu sekunder lemah yang membantu memisahkan sebagian permukaan. Biasanya sebaiknya tetap halus. Rentang: 0.0 - 1.0.
settings.ui_lighting_rim_x=Lampu Tepi X
settings.ui_lighting_rim_x.description=Arah lampu tepi dalam koordinat dunia. Rentang: -1.0 - 1.0.
settings.ui_lighting_rim_y=Lampu Tepi Y
settings.ui_lighting_rim_y.description=Arah lampu tepi dalam koordinat dunia. Rentang: -1.0 - 1.0.
settings.ui_lighting_rim_z=Lampu Tepi Z
settings.ui_lighting_rim_z.description=Arah lampu tepi dalam koordinat dunia. Rentang: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Tepi Fitur Aktif
settings.ui_edges_enabled.description=Gambar geometri gelap di sepanjang tepi tajam nyata objek CSG. Batas poligon koplanar diabaikan. Setel enabled=false untuk menghapus tepi sepenuhnya.
settings.ui_edges_angle_degrees=Sudut Tepi (derajat)
settings.ui_edges_angle_degrees.description=Sudut minimum antar permukaan bertetangga sebelum tepi bersamanya digambar. Nilai lebih tinggi menghasilkan lebih sedikit garis lipatan. Rentang: 0 - 360.
settings.ui_edges_width_mode=Mode Lebar Tepi
settings.ui_edges_width_mode.description=screen = Menjaga garis luar kira-kira konstan dalam piksel layar. Terbaik untuk tampilan garis tipis bergaya CAD pada tingkat zoom apa pun. world = Menggunakan radius tetap dalam milimeter adegan.
settings.ui_edges_width_px=Lebar Tepi (px)
settings.ui_edges_width_px.description=Lebar garis yang terlihat saat widthMode=screen. Rentang: 0.1 - 10.0.
settings.ui_edges_radius=Radius Tepi
settings.ui_edges_radius.description=Radius tepi dalam ruang dunia dalam milimeter adegan. Hanya digunakan saat widthMode=world. Rentang: 0.001 - 100.0.
settings.ui_edges_brightness=Kecerahan Tepi
settings.ui_edges_brightness.description=0.0 = hitam, 1.0 = putih. Rentang: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Kedalaman Zoom Tampil Kisi Kecil
settings.ui_grid_small_visible_zoom_depth.description=Mengontrol seberapa jauh kisi 1 mm tetap terlihat. Nilai lebih tinggi = kisi 1 mm muncul lebih awal / lebih jauh. Rentang: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Pengali Kecerahan Kisi Kecil
settings.ui_grid_small_brightness_multiplier.description=Mengalikan kecerahan RGB sambil mempertahankan rona tema. 1.0 = warna tema asli. < 1.0 = lebih gelap. > 1.0 = lebih terang. Rentang: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Pengali Opasitas Kisi Kecil
settings.ui_grid_small_opacity_multiplier.description=Mengalikan alpha yang diberikan oleh tema saat ini. 1.0 = tidak berubah. Rentang: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Lebar Garis Kisi Kecil (px)
settings.ui_grid_small_line_width_px.description=Ketebalan garis kisi dalam satuan piksel tekstur lama kisi. Nilai historis saat ini adalah 2 untuk 1 mm dan 4 untuk 10 mm. Rentang: 1 - 10.
settings.ui_grid_small_z_offset_mm=Offset Z Kisi Kecil (mm)
settings.ui_grid_small_z_offset_mm.description=Jaga kisi 1 mm tepat di belakang kisi 10 mm untuk menghindari artefak kedalaman. Rentang: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Pengali Kecerahan Kisi Utama
settings.ui_grid_major_brightness_multiplier.description=Mengalikan kecerahan RGB sambil mempertahankan rona tema. 1.0 = warna tema asli. < 1.0 = lebih gelap. > 1.0 = lebih terang. Rentang: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Pengali Opasitas Kisi Utama
settings.ui_grid_major_opacity_multiplier.description=Mengalikan alpha yang diberikan oleh tema saat ini. 1.0 = tidak berubah. Rentang: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Lebar Garis Kisi Utama (px)
settings.ui_grid_major_line_width_px.description=Ketebalan garis kisi dalam satuan piksel tekstur lama kisi. Nilai historis saat ini adalah 2 untuk 1 mm dan 4 untuk 10 mm. Rentang: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Mode Gerak Kisi
settings.ui_grid_motion_mode.description=major = Pertahankan hanya kisi 10 mm yang tajam terlihat saat bergerak dan sembunyikan sementara kisi 1 mm yang padat. Kisi 1 mm kembali setelah gerakan berhenti. all = Pertahankan kedua kisi garis tajam terlihat saat bergerak. Kesinambungan visual terbaik, tetapi berpotensi lebih mahal. texture = Perilaku asli: tukar geometri garis dengan kuad kisi bertekstur saat bergerak. Lebih cepat, tetapi dapat menghasilkan aliasing / pola moire. hidden = Sembunyikan garis kisi saat bergerak dan pulihkan saat kamera berhenti.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opasitas Render Tanah
settings.ui_grid_ground_render_opacity.description=Opasitas isian tanah utama. Isian tetap di tempatnya pada setiap tingkat zoom; hanya kisi 1 mm yang padat yang dibatasi oleh zoom. Setel ke 0 untuk menyembunyikan isian sambil menjaga permukaan pemilihnya tetap aktif. Bidang kerja kustom mengabaikan pengaturan ini. Rentang: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensitivitas Minimum Orbit Kamera
settings.ui_camera_orbit_min.description=Sensitivitas rotasi dalam derajat per unit koordinat mouse JavaFX. min mengontrol seret yang sangat lambat. Rentang: 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensitivitas Maksimum Orbit Kamera
settings.ui_camera_orbit_max.description=Sensitivitas rotasi dalam derajat per unit koordinat mouse JavaFX. max adalah batas atas untuk seret cepat. Rentang: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kecepatan Setengah Orbit Kamera
settings.ui_camera_orbit_half.description=Kecepatan kursor tersaring dalam unit koordinat JavaFX per detik saat sensitivitas berada di tengah antara min dan max. Lebih tinggi = akselerasi lebih lembut. Rentang: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Waktu Naik Orbit Kamera (ms)
settings.ui_camera_orbit_rise_ms.description=Konstanta waktu (milidetik) untuk perkiraan kecepatan kursor saat mempercepat. riseMs lebih tinggi melembutkan akselerasi. Rentang: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Waktu Turun Orbit Kamera (ms)
settings.ui_camera_orbit_fall_ms.description=Konstanta waktu (milidetik) untuk perkiraan kecepatan kursor saat memperlambat. fallMs lebih rendah memulihkan kontrol halus lebih cepat. Keduanya tidak menambahkan inersia kamera. Rentang: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Jeda Penetapan Adegan Tepi (ms)
settings.ui_edges_scene_settle_delay_ms.description=Jeda setelah perubahan geometri / tampilan. Nilai lebih tinggi menekan lebih banyak pekerjaan selama pemutaran ulang riwayat yang cepat. Rentang: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Jeda Penetapan Kamera Tepi (ms)
settings.ui_edges_camera_settle_delay_ms.description=Jeda setelah pergerakan kamera sebelum ketebalan garis tipis ruang layar dibangun ulang. Rentang: 0 - 10000.
settings.ui_edges_topology_precision=Presisi Topologi Tepi
settings.ui_edges_topology_precision.description=Langkah kuantisasi yang digunakan untuk menormalkan topologi tepi fitur. Geometri model dan normal permukaan tetap tidak berubah. Rentang: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Toleransi Jahitan Tepi (mm)
settings.ui_edges_stitch_tolerance.description=Toleransi penjahitan batas dalam milimeter adegan. Hanya digunakan untuk tepi yang tampak satu permukaan setelah ketetanggaan mesh terindeks. Ini memungkinkan batas yang dibagi halus secara berbeda tetapi berimpit secara geometris untuk disambungkan kembali sebelum memutuskan apakah itu tepi fitur nyata. Rentang: 0.0 - 1.0.
