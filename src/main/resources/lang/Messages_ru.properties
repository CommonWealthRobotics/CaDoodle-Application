# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Элементы интерфейса
settings.ui_section_lighting=Освещение
settings.ui_section_edges=Рёбра формы
settings.ui_section_grid=Сетка рабочей плоскости
settings.ui_section_camera=Орбита камеры
settings.ui_section_timing=Тайминги рёбер формы
settings.ui_description=Описание взято из scene-style.properties. Значение сохраняется в ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Режим освещения
settings.ui_lighting_mode.description=Держите ровно один режим освещения. 'stable' = Фиксированные направленные источники в мировом пространстве. Освещение не вращается вместе с камерой. Рассчитано на хорошую цветопередачу и читаемую геометрию CAD. 'kevin' = Исходное освещение BowlerStudio. Использует три точечных источника; один следует за камерой. Настройки стабильного освещения ниже в этом режиме игнорируются.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Фоновый свет
settings.ui_lighting_ambient.description=Фоновый свет действует на каждую видимую поверхность одинаково. Выше: светлее тени, цвета остаются ближе к базовому цвету, но поверхности выглядят площе. Ниже: сильнее затенение и разделение поверхностей, но затенённые цвета становятся темнее.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Основной свет включён
settings.ui_lighting_key_enabled.description=Главный источник света, описывающий форму объекта. Установите enabled=false, чтобы полностью убрать этот источник.
settings.ui_lighting_key_intensity=Интенсивность основного света
settings.ui_lighting_key_intensity.description=Интенсивность основного света. Диапазон: 0.0 - 1.0.
settings.ui_lighting_key_x=Основной свет X
settings.ui_lighting_key_x.description=Направление основного света в мировых координатах. Диапазон: -1.0 - 1.0.
settings.ui_lighting_key_y=Основной свет Y
settings.ui_lighting_key_y.description=Направление основного света в мировых координатах. Диапазон: -1.0 - 1.0.
settings.ui_lighting_key_z=Основной свет Z
settings.ui_lighting_key_z.description=Направление основного света в мировых координатах. Диапазон: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Заполняющий свет включён
settings.ui_lighting_fill_enabled.description=Смягчает теневую сторону, создаваемую основным светом. Установите enabled=false, чтобы полностью убрать этот источник.
settings.ui_lighting_fill_intensity=Интенсивность заполняющего света
settings.ui_lighting_fill_intensity.description=Выше интенсивность: лучше цветопередача, мягче затенение. Ниже интенсивность: сильнее разница между по-разному ориентированными гранями. Диапазон: 0.0 - 1.0.
settings.ui_lighting_fill_x=Заполняющий свет X
settings.ui_lighting_fill_x.description=Направление заполняющего света в мировых координатах. Диапазон: -1.0 - 1.0.
settings.ui_lighting_fill_y=Заполняющий свет Y
settings.ui_lighting_fill_y.description=Направление заполняющего света в мировых координатах. Диапазон: -1.0 - 1.0.
settings.ui_lighting_fill_z=Заполняющий свет Z
settings.ui_lighting_fill_z.description=Направление заполняющего света в мировых координатах. Диапазон: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Контурный свет включён
settings.ui_lighting_rim_enabled.description=Слабый вторичный источник, помогающий разделять некоторые поверхности. Обычно должен оставаться ненавязчивым. Установите enabled=false, чтобы полностью убрать этот источник.
settings.ui_lighting_rim_intensity=Интенсивность контурного света
settings.ui_lighting_rim_intensity.description=Слабый вторичный источник, помогающий разделять некоторые поверхности. Обычно должен оставаться ненавязчивым. Диапазон: 0.0 - 1.0.
settings.ui_lighting_rim_x=Контурный свет X
settings.ui_lighting_rim_x.description=Направление контурного света в мировых координатах. Диапазон: -1.0 - 1.0.
settings.ui_lighting_rim_y=Контурный свет Y
settings.ui_lighting_rim_y.description=Направление контурного света в мировых координатах. Диапазон: -1.0 - 1.0.
settings.ui_lighting_rim_z=Контурный свет Z
settings.ui_lighting_rim_z.description=Направление контурного света в мировых координатах. Диапазон: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Рёбра формы включены
settings.ui_edges_enabled.description=Рисует тёмную геометрию вдоль настоящих острых рёбер объектов CSG. Границы компланарных полигонов игнорируются. Установите enabled=false, чтобы полностью убрать рёбра.
settings.ui_edges_angle_degrees=Угол ребра в градусах
settings.ui_edges_angle_degrees.description=Минимальный угол между соседними гранями, начиная с которого рисуется их общее ребро. Большие значения дают меньше линий сгиба. Диапазон: 0 - 360.
settings.ui_edges_width_mode=Режим ширины рёбер
settings.ui_edges_width_mode.description=screen = Сохраняет контур примерно постоянным в пикселях экрана. Лучший вариант для тонкого контура в стиле CAD при любом масштабе. world = Использует фиксированный радиус в миллиметрах сцены.
settings.ui_edges_width_px=Ширина рёбер в пикселях
settings.ui_edges_width_px.description=Видимая толщина линии при widthMode=screen. Диапазон: 0.1 - 10.0.
settings.ui_edges_radius=Радиус рёбер
settings.ui_edges_radius.description=Радиус рёбер в мировом пространстве, в миллиметрах сцены. Используется только при widthMode=world. Диапазон: 0.001 - 100.0.
settings.ui_edges_brightness=Яркость рёбер
settings.ui_edges_brightness.description=0.0 = чёрный, 1.0 = белый. Диапазон: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Глубина видимости мелкой сетки
settings.ui_grid_small_visible_zoom_depth.description=Управляет тем, насколько далеко остаётся видимой сетка 1 mm. Большее значение = сетка 1 mm появляется раньше / дальше. Диапазон: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Множитель яркости мелкой сетки
settings.ui_grid_small_brightness_multiplier.description=Умножает яркость RGB, сохраняя оттенок темы. 1.0 = исходный цвет темы. < 1.0 = темнее. > 1.0 = ярче. Диапазон: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Множитель непрозрачности мелкой сетки
settings.ui_grid_small_opacity_multiplier.description=Умножает альфу, заданную текущей темой. 1.0 = без изменений. Диапазон: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Толщина линий мелкой сетки (px)
settings.ui_grid_small_line_width_px.description=Толщина линий сетки в устаревших текстурных пикселях сетки. Текущие исторические значения: 2 для 1 mm и 4 для 10 mm. Диапазон: 1 - 10.
settings.ui_grid_small_z_offset_mm=Смещение Z мелкой сетки (mm)
settings.ui_grid_small_z_offset_mm.description=Держите сетку 1 mm чуть позади сетки 10 mm, чтобы избежать артефактов глубины. Диапазон: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Множитель яркости основной сетки
settings.ui_grid_major_brightness_multiplier.description=Умножает яркость RGB, сохраняя оттенок темы. 1.0 = исходный цвет темы. < 1.0 = темнее. > 1.0 = ярче. Диапазон: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Множитель непрозрачности основной сетки
settings.ui_grid_major_opacity_multiplier.description=Умножает альфу, заданную текущей темой. 1.0 = без изменений. Диапазон: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Толщина линий основной сетки (px)
settings.ui_grid_major_line_width_px.description=Толщина линий сетки в устаревших текстурных пикселях сетки. Текущие исторические значения: 2 для 1 mm и 4 для 10 mm. Диапазон: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Режим движения сетки
settings.ui_grid_motion_mode.description=major = Оставлять видимой только чёткую сетку 10 mm во время движения и временно скрывать плотную сетку 1 mm. Сетка 1 mm возвращается после остановки движения. all = Оставлять обе чёткие линейные сетки видимыми во время движения. Лучшая визуальная непрерывность, но потенциально дороже. texture = Исходное поведение: подмена линейной геометрии на текстурированные квады сетки во время движения. Быстрее, но может давать алиасинг / муар. hidden = Скрывать линии сетки во время движения и восстанавливать их, когда камера останавливается.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Непрозрачность отрисовки земли
settings.ui_grid_ground_render_opacity.description=Непрозрачность основной заливки земли. Заливка остаётся на месте при любом масштабе; масштабом ограничивается только плотная сетка 1 mm. Установите 0, чтобы скрыть заливку, оставив её поверхность выбора активной. Пользовательские рабочие плоскости игнорируют эту настройку. Диапазон: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Мин. чувствительность орбиты камеры
settings.ui_camera_orbit_min.description=Чувствительность вращения в градусах на единицу координат мыши JavaFX. min управляет очень медленными перетаскиваниями. Диапазон: 0.0 - 1.0.
settings.ui_camera_orbit_max=Макс. чувствительность орбиты камеры
settings.ui_camera_orbit_max.description=Чувствительность вращения в градусах на единицу координат мыши JavaFX. max — верхний предел для быстрых перетаскиваний. Диапазон: 0.0 - 1.0.
settings.ui_camera_orbit_half=Половина скорости орбиты камеры
settings.ui_camera_orbit_half.description=Отфильтрованная скорость курсора в единицах координат JavaFX в секунду, при которой чувствительность находится посередине между min и max. Выше = мягче ускорение. Диапазон: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Время нарастания орбиты камеры (ms)
settings.ui_camera_orbit_rise_ms.description=Постоянные времени (миллисекунды) для оценки скорости курсора при ускорении. Большее riseMs смягчает ускорение. Диапазон: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Время спада орбиты камеры (ms)
settings.ui_camera_orbit_fall_ms.description=Постоянные времени (миллисекунды) для оценки скорости курсора при замедлении. Меньшее fallMs быстрее возвращает точное управление. Ни то, ни другое не добавляет камере инерцию. Диапазон: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Задержка стабилизации сцены для рёбер (ms)
settings.ui_edges_scene_settle_delay_ms.description=Задержка после изменений геометрии или отображения. Большие значения подавляют больше работы при быстром воспроизведении истории. Диапазон: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Задержка стабилизации камеры для рёбер (ms)
settings.ui_edges_camera_settle_delay_ms.description=Задержка после движения камеры перед перестроением толщины тонких линий в экранном пространстве. Диапазон: 0 - 10000.
settings.ui_edges_topology_precision=Точность топологии рёбер
settings.ui_edges_topology_precision.description=Шаг квантования, используемый для нормализации топологии рёбер формы. Геометрия модели и нормали граней остаются неизменными. Диапазон: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Допуск сшивания рёбер (mm)
settings.ui_edges_stitch_tolerance.description=Допуск сшивания границ в миллиметрах сцены. Используется только для рёбер, кажущихся границей одной грани после анализа смежности индексированной сетки. Позволяет по-разному разбитым, но геометрически совпадающим границам воссоединяться до решения, являются ли они настоящими рёбрами формы. Диапазон: 0.0 - 1.0.
