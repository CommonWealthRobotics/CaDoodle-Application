# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Arayüz Öğeleri
settings.ui_section_lighting=Aydınlatma
settings.ui_section_edges=Özellik Kenarları
settings.ui_section_grid=Çalışma Düzlemi Izgarası
settings.ui_section_camera=Kamera Yörüngesi
settings.ui_section_timing=Özellik Kenarı Zamanlaması
settings.ui_description=Açıklama scene-style.properties dosyasından alınmıştır. Değer ConfigurationDatabase içine kaydedilir.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Aydınlatma Modu
settings.ui_lighting_mode.description=Tam olarak bir aydınlatma modu tutun. 'stable' = Sabit dünya uzayı yönlü ışıkları. Aydınlatma kamera ile birlikte dönmez. İyi renk doğruluğu ve okunabilir CAD geometrisi için tasarlanmıştır. 'kevin' = Özgün BowlerStudio aydınlatması. Üç adet nokta ışık kullanır; biri kamerayı izler. Bu modda aşağıdaki kararlı ışık ayarları yok sayılır.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ortam Işığı
settings.ui_lighting_ambient.description=Ortam ışığı her görünür yüzeyi eşit etkiler. Daha yüksek: gölgeler daha parlak, renkler temel renklerine daha yakın kalır, ancak yüzeyler daha düz görünür. Daha düşük: gölgeleme ve yüzey ayrımı daha güçlü, ancak gölgeli renkler daha koyu olur.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Ana Işık Etkin
settings.ui_lighting_key_enabled.description=Nesnenin şeklini tanımlamak için kullanılan ana ışık. Bu ışığı tamamen kaldırmak için enabled=false ayarlayın.
settings.ui_lighting_key_intensity=Ana Işık Yoğunluğu
settings.ui_lighting_key_intensity.description=Ana ışığın yoğunluğu. Aralık: 0.0 - 1.0.
settings.ui_lighting_key_x=Ana Işık X
settings.ui_lighting_key_x.description=Ana ışığın dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
settings.ui_lighting_key_y=Ana Işık Y
settings.ui_lighting_key_y.description=Ana ışığın dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
settings.ui_lighting_key_z=Ana Işık Z
settings.ui_lighting_key_z.description=Ana ışığın dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Dolgu Işığı Etkin
settings.ui_lighting_fill_enabled.description=Ana ışığın oluşturduğu gölgeli tarafı yumuşatır. Bu ışığı tamamen kaldırmak için enabled=false ayarlayın.
settings.ui_lighting_fill_intensity=Dolgu Işığı Yoğunluğu
settings.ui_lighting_fill_intensity.description=Daha yüksek yoğunluk: daha iyi renk doğruluğu, daha yumuşak gölgeleme. Daha düşük yoğunluk: farklı yönelimli yüzler arasında daha güçlü fark. Aralık: 0.0 - 1.0.
settings.ui_lighting_fill_x=Dolgu Işığı X
settings.ui_lighting_fill_x.description=Dolgu ışığının dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
settings.ui_lighting_fill_y=Dolgu Işığı Y
settings.ui_lighting_fill_y.description=Dolgu ışığının dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
settings.ui_lighting_fill_z=Dolgu Işığı Z
settings.ui_lighting_fill_z.description=Dolgu ışığının dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Kontur Işığı Etkin
settings.ui_lighting_rim_enabled.description=Bazı yüzeylerin ayrılmasına yardımcı olan zayıf ikincil ışık. Normalde hafif kalmalıdır. Bu ışığı tamamen kaldırmak için enabled=false ayarlayın.
settings.ui_lighting_rim_intensity=Kontur Işığı Yoğunluğu
settings.ui_lighting_rim_intensity.description=Bazı yüzeylerin ayrılmasına yardımcı olan zayıf ikincil ışık. Normalde hafif kalmalıdır. Aralık: 0.0 - 1.0.
settings.ui_lighting_rim_x=Kontur Işığı X
settings.ui_lighting_rim_x.description=Kontur ışığının dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
settings.ui_lighting_rim_y=Kontur Işığı Y
settings.ui_lighting_rim_y.description=Kontur ışığının dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
settings.ui_lighting_rim_z=Kontur Işığı Z
settings.ui_lighting_rim_z.description=Kontur ışığının dünya koordinatlarındaki yönü. Aralık: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Özellik Kenarları Etkin
settings.ui_edges_enabled.description=CSG nesnelerinin gerçek keskin kenarları boyunca koyu geometri çizer. Eş düzlemli çokgen sınırları yok sayılır. Kenarları tamamen kaldırmak için enabled=false ayarlayın.
settings.ui_edges_angle_degrees=Kenar Açısı (Derece)
settings.ui_edges_angle_degrees.description=Komşu yüzler arasındaki ortak kenar çizilmeden önce gereken en küçük açı. Daha yüksek değerler daha az kırışıklık çizgisi üretir. Aralık: 0 - 360.
settings.ui_edges_width_mode=Kenar Genişliği Modu
settings.ui_edges_width_mode.description=screen = Dış hattı ekran piksellerinde yaklaşık olarak sabit tutar. Her yakınlaştırma düzeyinde CAD tarzı ince çizgi görünümü için en iyisi. world = Sahne milimetrelerinde sabit bir yarıçap kullanır.
settings.ui_edges_width_px=Kenar Genişliği (Piksel)
settings.ui_edges_width_px.description=widthMode=screen iken görünür çizgi genişliği. Aralık: 0.1 - 10.0.
settings.ui_edges_radius=Kenar Yarıçapı
settings.ui_edges_radius.description=Sahne milimetrelerinde dünya uzayı kenar yarıçapı. Yalnızca widthMode=world iken kullanılır. Aralık: 0.001 - 100.0.
settings.ui_edges_brightness=Kenar Parlaklığı
settings.ui_edges_brightness.description=0.0 = siyah, 1.0 = beyaz. Aralık: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Küçük Izgaranın Görünür Yakınlaştırma Derinliği
settings.ui_grid_small_visible_zoom_depth.description=1 mm ızgaranın ne kadar uzakta görünür kaldığını denetler. Daha yüksek değer = 1 mm ızgara daha erken / daha uzakta görünür. Aralık: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Küçük Izgara Parlaklık Çarpanı
settings.ui_grid_small_brightness_multiplier.description=Tema tonunu korurken RGB parlaklığını çarpar. 1.0 = özgün tema rengi. < 1.0 = daha koyu. > 1.0 = daha parlak. Aralık: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Küçük Izgara Opaklık Çarpanı
settings.ui_grid_small_opacity_multiplier.description=Geçerli temanın sağladığı alfa değerini çarpar. 1.0 = değişmez. Aralık: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Küçük Izgara Çizgi Genişliği (px)
settings.ui_grid_small_line_width_px.description=Izgara çizgisi kalınlığı, ızgaranın eski doku piksel birimleriyle ölçülür. Geçerli tarihsel değerler 1 mm için 2 ve 10 mm için 4. Aralık: 1 - 10.
settings.ui_grid_small_z_offset_mm=Küçük Izgara Z Kayması (mm)
settings.ui_grid_small_z_offset_mm.description=Derinlik yapaylıklarını önlemek için 1 mm ızgarayı 10 mm ızgaranın hemen arkasında tutun. Aralık: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Ana Izgara Parlaklık Çarpanı
settings.ui_grid_major_brightness_multiplier.description=Tema tonunu korurken RGB parlaklığını çarpar. 1.0 = özgün tema rengi. < 1.0 = daha koyu. > 1.0 = daha parlak. Aralık: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Ana Izgara Opaklık Çarpanı
settings.ui_grid_major_opacity_multiplier.description=Geçerli temanın sağladığı alfa değerini çarpar. 1.0 = değişmez. Aralık: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Ana Izgara Çizgi Genişliği (px)
settings.ui_grid_major_line_width_px.description=Izgara çizgisi kalınlığı, ızgaranın eski doku piksel birimleriyle ölçülür. Geçerli tarihsel değerler 1 mm için 2 ve 10 mm için 4. Aralık: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Izgara Hareket Modu
settings.ui_grid_motion_mode.description=major = Hareket sırasında yalnızca net 10 mm ızgarayı görünür tutun ve yoğun 1 mm ızgarayı geçici olarak gizleyin. Hareket durduktan sonra 1 mm ızgara geri döner. all = Hareket sırasında iki net çizgi ızgarasını da görünür tutun. En iyi görsel süreklilik, ancak potansiyel olarak daha maliyetli. texture = Özgün davranış: hareket sırasında çizgi geometrisini dokulu ızgara dörtgenleriyle değiştir. Daha hızlı, ancak tırtıklanma / moire desenleri üretebilir. hidden = Hareket sırasında ızgara çizgilerini gizleyin ve kamera durduğunda geri yükleyin.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Zemin Çizim Opaklığı
settings.ui_grid_ground_render_opacity.description=Ana zemin dolgusunun opaklığı. Dolgu her yakınlaştırma düzeyinde yerinde kalır; yalnızca yoğun 1 mm ızgara yakınlaştırmaya bağlıdır. Dolguyu gizlerken seçim yüzeyini etkin tutmak için 0 olarak ayarlayın. Özel çalışma düzlemleri bu ayarı yok sayar. Aralık: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kamera Yörüngesi Min Duyarlılığı
settings.ui_camera_orbit_min.description=JavaFX fare koordinat birimi başına derece cinsinden dönüş duyarlılığı. min çok yavaş sürüklemeleri denetler. Aralık: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kamera Yörüngesi Maks Duyarlılığı
settings.ui_camera_orbit_max.description=JavaFX fare koordinat birimi başına derece cinsinden dönüş duyarlılığı. max hızlı sürüklemeler için üst sınırdır. Aralık: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kamera Yörüngesi Yarı Hız
settings.ui_camera_orbit_half.description=Duyarlılığın min ile max arasında yarı yolda olduğu, saniye başına JavaFX koordinat birimi cinsinden filtrelenmiş imleç hızı. Daha yüksek = daha yumuşak ivmelenme. Aralık: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kamera Yörüngesi Yükselme Süresi (ms)
settings.ui_camera_orbit_rise_ms.description=Hızlanırken imleç hızı tahmini için zaman sabitleri (milisaniye). Daha yüksek riseMs ivmelenmeyi yumuşatır. Aralık: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kamera Yörüngesi Düşme Süresi (ms)
settings.ui_camera_orbit_fall_ms.description=Yavaşlarken imleç hızı tahmini için zaman sabitleri (milisaniye). Daha düşük fallMs ince denetimi daha erken geri getirir. Hiçbiri kamera eylemsizliği eklemez. Aralık: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Kenar Sahne Oturma Gecikmesi (ms)
settings.ui_edges_scene_settle_delay_ms.description=Geometri / görünüm değişikliklerinden sonraki gecikme. Daha yüksek değerler hızlı geçmiş oynatımı sırasında daha fazla işi bastırır. Aralık: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Kenar Kamera Oturma Gecikmesi (ms)
settings.ui_edges_camera_settle_delay_ms.description=Kamera hareketinden sonra, ekran uzayındaki ince çizgi kalınlığı yeniden oluşturulmadan önceki gecikme. Aralık: 0 - 10000.
settings.ui_edges_topology_precision=Kenar Topolojisi Hassasiyeti
settings.ui_edges_topology_precision.description=Özellik kenarı topolojisini normalleştirmek için kullanılan nicemleme adımı. Model geometrisi ve yüz normalleri değişmez. Aralık: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Kenar Dikiş Toleransı (mm)
settings.ui_edges_stitch_tolerance.description=Sahne milimetrelerinde sınır dikiş toleransı. Yalnızca indeksli ağ komşuluğundan sonra görünen tek yüzlü kenarlar için kullanılır. Farklı şekilde alt bölünmüş ancak geometrik olarak çakışan sınırların, gerçek özellik kenarları olup olmadıklarına karar verilmeden önce yeniden bağlanmasını sağlar. Aralık: 0.0 - 1.0.
