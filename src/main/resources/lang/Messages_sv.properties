# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Gränssnittselement
settings.ui_section_lighting=Belysning
settings.ui_section_edges=Karakteristiska kanter
settings.ui_section_grid=Arbetsplanens rutnät
settings.ui_section_camera=Kameraorbit
settings.ui_section_timing=Tidsinställning för karakteristiska kanter
settings.ui_description=Beskrivning hämtad från scene-style.properties. Värdet sparas i ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Belysningsläge
settings.ui_lighting_mode.description=Behåll exakt ett belysningsläge. 'stable' = Fasta riktade ljus i världsrymden. Belysningen roterar inte med kameran. Utformat för god färgåtergivning och läsbar CAD-geometri. 'kevin' = Ursprunglig BowlerStudio-belysning. Använder tre punktljus; ett följer kameran. Inställningarna för stabilt ljus nedan ignoreras i detta läge.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Omgivningsljus
settings.ui_lighting_ambient.description=Omgivningsljus påverkar alla synliga ytor lika. Högre: ljusare skuggor, färgerna håller sig närmare sin basfärg, men ytorna ser plattare ut. Lägre: kraftigare skuggning och separation av ytor, men färger i skugga blir mörkare.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Huvudljus aktiverat
settings.ui_lighting_key_enabled.description=Huvudljus som används för att beskriva objektets form. Sätt enabled=false för att ta bort detta ljus helt.
settings.ui_lighting_key_intensity=Huvudljusets intensitet
settings.ui_lighting_key_intensity.description=Intensiteten hos huvudljuset. Intervall: 0.0 - 1.0.
settings.ui_lighting_key_x=Huvudljus X
settings.ui_lighting_key_x.description=Huvudljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
settings.ui_lighting_key_y=Huvudljus Y
settings.ui_lighting_key_y.description=Huvudljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
settings.ui_lighting_key_z=Huvudljus Z
settings.ui_lighting_key_z.description=Huvudljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Utfyllnadsljus aktiverat
settings.ui_lighting_fill_enabled.description=Mjukar upp skuggsidan som skapas av huvudljuset. Sätt enabled=false för att ta bort detta ljus helt.
settings.ui_lighting_fill_intensity=Utfyllnadsljusets intensitet
settings.ui_lighting_fill_intensity.description=Högre intensitet: bättre färgåtergivning, mjukare skuggning. Lägre intensitet: större skillnad mellan olika orienterade ytor. Intervall: 0.0 - 1.0.
settings.ui_lighting_fill_x=Utfyllnadsljus X
settings.ui_lighting_fill_x.description=Utfyllnadsljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
settings.ui_lighting_fill_y=Utfyllnadsljus Y
settings.ui_lighting_fill_y.description=Utfyllnadsljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
settings.ui_lighting_fill_z=Utfyllnadsljus Z
settings.ui_lighting_fill_z.description=Utfyllnadsljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Kantljus aktiverat
settings.ui_lighting_rim_enabled.description=Svagt sekundärt ljus som hjälper till att separera vissa ytor. Bör normalt förbli diskret. Sätt enabled=false för att ta bort detta ljus helt.
settings.ui_lighting_rim_intensity=Kantljusets intensitet
settings.ui_lighting_rim_intensity.description=Svagt sekundärt ljus som hjälper till att separera vissa ytor. Bör normalt förbli diskret. Intervall: 0.0 - 1.0.
settings.ui_lighting_rim_x=Kantljus X
settings.ui_lighting_rim_x.description=Kantljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
settings.ui_lighting_rim_y=Kantljus Y
settings.ui_lighting_rim_y.description=Kantljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
settings.ui_lighting_rim_z=Kantljus Z
settings.ui_lighting_rim_z.description=Kantljusets riktning i världskoordinater. Intervall: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Karakteristiska kanter aktiverade
settings.ui_edges_enabled.description=Ritar mörk geometri längs verkliga skarpa kanter på CSG-objekt. Gränser mellan koplanära polygoner ignoreras. Sätt enabled=false för att ta bort kanterna helt.
settings.ui_edges_angle_degrees=Kantvinkel (grader)
settings.ui_edges_angle_degrees.description=Minsta vinkel mellan intilliggande ytor innan deras gemensamma kant ritas. Högre värden ger färre vecklinjer. Intervall: 0 - 360.
settings.ui_edges_width_mode=Läge för kantbredd
settings.ui_edges_width_mode.description=screen = Håller konturen ungefär konstant i skärmpixlar. Bäst för ett CAD-liknande hårstrecksutseende vid varje zoomnivå. world = Använder en fast radie i scenens millimeter.
settings.ui_edges_width_px=Kantbredd (pixlar)
settings.ui_edges_width_px.description=Synlig linjebredd när widthMode=screen. Intervall: 0.1 - 10.0.
settings.ui_edges_radius=Kantradie
settings.ui_edges_radius.description=Kantradie i världsrymden i scenens millimeter. Används endast när widthMode=world. Intervall: 0.001 - 100.0.
settings.ui_edges_brightness=Kantljusstyrka
settings.ui_edges_brightness.description=0.0 = svart, 1.0 = vitt. Intervall: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Zoomdjup för synligt litet rutnät
settings.ui_grid_small_visible_zoom_depth.description=Styr hur långt bort rutnätet på 1 mm förblir synligt. Högre värde = rutnätet på 1 mm visas tidigare / längre bort. Intervall: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Ljusstyrkemultiplikator för det lilla rutnätet
settings.ui_grid_small_brightness_multiplier.description=Multiplicerar RGB-ljusstyrkan medan temats färgton bevaras. 1.0 = ursprunglig temafärg. < 1.0 = mörkare. > 1.0 = ljusare. Intervall: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Opacitetsmultiplikator för det lilla rutnätet
settings.ui_grid_small_opacity_multiplier.description=Multiplicerar alfat som det aktuella temat anger. 1.0 = oförändrat. Intervall: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Linjebredd för det lilla rutnätet (px)
settings.ui_grid_small_line_width_px.description=Rutnätslinjens tjocklek i rutnätets gamla texturpixelenheter. Aktuella historiska värden är 2 för 1 mm och 4 för 10 mm. Intervall: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z-förskjutning för det lilla rutnätet (mm)
settings.ui_grid_small_z_offset_mm.description=Håller rutnätet på 1 mm strax bakom rutnätet på 10 mm för att undvika djupartefakter. Intervall: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Ljusstyrkemultiplikator för det stora rutnätet
settings.ui_grid_major_brightness_multiplier.description=Multiplicerar RGB-ljusstyrkan medan temats färgton bevaras. 1.0 = ursprunglig temafärg. < 1.0 = mörkare. > 1.0 = ljusare. Intervall: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Opacitetsmultiplikator för det stora rutnätet
settings.ui_grid_major_opacity_multiplier.description=Multiplicerar alfat som det aktuella temat anger. 1.0 = oförändrat. Intervall: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Linjebredd för det stora rutnätet (px)
settings.ui_grid_major_line_width_px.description=Rutnätslinjens tjocklek i rutnätets gamla texturpixelenheter. Aktuella historiska värden är 2 för 1 mm och 4 för 10 mm. Intervall: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Rutnätets rörelseläge
settings.ui_grid_motion_mode.description=major = Håller endast det skarpa rutnätet på 10 mm synligt under rörelse och döljer tillfälligt det täta rutnätet på 1 mm. Rutnätet på 1 mm återkommer när rörelsen upphör. all = Håller båda de skarpa linjerutnäten synliga under rörelse. Bäst visuell kontinuitet, men potentiellt dyrare. texture = Ursprungligt beteende: byter linjegeometri mot texturerade rutnätskvadrater under rörelse. Snabbare, men kan ge aliasing / moirémönster. hidden = Döljer rutnätslinjer under rörelse och återställer dem när kameran stannar.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacitet för markrendering
settings.ui_grid_ground_render_opacity.description=Opaciteten hos markens huvudfyllning. Fyllningen ligger kvar på plats vid varje zoomnivå; endast det täta rutnätet på 1 mm styrs av zoom. Sätt till 0 för att dölja fyllningen medan dess yta för val förblir aktiv. Anpassade arbetsplan ignorerar denna inställning. Intervall: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Lägsta känslighet för kameraorbit
settings.ui_camera_orbit_min.description=Rotationskänslighet i grader per JavaFX-muskoordinatenhet. min styr mycket långsamma drag. Intervall: 0.0 - 1.0.
settings.ui_camera_orbit_max=Högsta känslighet för kameraorbit
settings.ui_camera_orbit_max.description=Rotationskänslighet i grader per JavaFX-muskoordinatenhet. max är en övre gräns för snabba drag. Intervall: 0.0 - 1.0.
settings.ui_camera_orbit_half=Halv hastighet för kameraorbit
settings.ui_camera_orbit_half.description=Filtrerad markörhastighet i JavaFX-koordinatenheter per sekund där känsligheten ligger halvvägs mellan min och max. Högre = mjukare acceleration. Intervall: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Stigtid för kameraorbit (ms)
settings.ui_camera_orbit_rise_ms.description=Tidskonstanter (millisekunder) för uppskattningen av markörhastigheten vid acceleration. Högre riseMs mjukar upp accelerationen. Intervall: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Falltid för kameraorbit (ms)
settings.ui_camera_orbit_fall_ms.description=Tidskonstanter (millisekunder) för uppskattningen av markörhastigheten vid inbromsning. Lägre fallMs återställer finjusteringen snabbare. Ingen av dem tillför kameratröghet. Intervall: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Fördröjning för scenens stabilisering av kanter (ms)
settings.ui_edges_scene_settle_delay_ms.description=Fördröjning efter ändringar i geometri/visning. Högre värden dämpar mer arbete under snabb uppspelning av historiken. Intervall: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Fördröjning för kamerans stabilisering av kanter (ms)
settings.ui_edges_camera_settle_delay_ms.description=Fördröjning efter kamerarörelse innan hårstreckets tjocklek i skärmrymden byggs upp igen. Intervall: 0 - 10000.
settings.ui_edges_topology_precision=Precision för kanttopologi
settings.ui_edges_topology_precision.description=Kvantiseringsteg som används för att normalisera topologin för karakteristiska kanter. Modellgeometri och ytnormaler förblir oförändrade. Intervall: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerans för kantskarvning (mm)
settings.ui_edges_stitch_tolerance.description=Tolerans för skarvning av gränser i scenens millimeter. Används endast för skenbara kanter på en enda yta efter grannskapsanalys av det indexerade nätet. Den låter olika uppdelade men geometriskt sammanfallande gränser återknytas innan det avgörs om de är verkliga karakteristiska kanter. Intervall: 0.0 - 1.0.
