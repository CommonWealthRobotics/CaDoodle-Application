settings.ui_description=विवरण scene-style.properties बाट लिइएको। मान ConfigurationDatabase मा सुरक्षित गरिन्छ।

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=प्रकाश मोड
settings.ui_lighting_mode.description=ठ्याक्कै एउटा प्रकाश मोड राख्नुहोस्। 'stable' = स्थिर विश्व-अन्तरिक्ष दिशात्मक बत्तीहरू। प्रकाश क्यामेरासँग घुम्दैन। राम्रो रङ निष्ठाको लागि र पढ्न योग्य CAD ज्यामितिको लागि डिजाइन गरिएको। 'kevin' = मूल BowlerStudio प्रकाश। तीनवटा बिन्दु बत्ती प्रयोग गर्छ; एउटा क्यामेरा पछ्याउँछ। यो मोडमा तलका स्थिर-बत्ती सेटिङहरू बेवास्ता गरिन्छन्।
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=वातावरणीय प्रकाश
settings.ui_lighting_ambient.description=वातावरणीय प्रकाशले हरेक देखिने सतहलाई समान रूपमा असर गर्छ। उच्च: छाया उज्यालो हुन्छन्, रङहरू आ-आफ्नो आधार रङको नजिक रहन्छन्, तर सतहहरू चाप्लो देखिन्छन्। न्यून: छायांकन र सतह छुट्याइ बलियो हुन्छ, तर छायामा परेका रङहरू गाढा हुन्छन्।
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=मुख्य बत्ती सक्षम
settings.ui_lighting_key_enabled.description=वस्तुको आकार वर्णन गर्न प्रयोग हुने मुख्य बत्ती। यो बत्ती पूर्ण रूपमा हटाउन enabled=false सेट गर्नुहोस्।
settings.ui_lighting_key_intensity=मुख्य बत्ती तीव्रता
settings.ui_lighting_key_intensity.description=मुख्य बत्तीको तीव्रता। दायरा: 0.0 - 1.0।
settings.ui_lighting_key_x=मुख्य बत्ती X
settings.ui_lighting_key_x.description=विश्व निर्देशांकमा मुख्य बत्तीको दिशा। दायरा: -1.0 - 1.0।
settings.ui_lighting_key_y=मुख्य बत्ती Y
settings.ui_lighting_key_y.description=विश्व निर्देशांकमा मुख्य बत्तीको दिशा। दायरा: -1.0 - 1.0।
settings.ui_lighting_key_z=मुख्य बत्ती Z
settings.ui_lighting_key_z.description=विश्व निर्देशांकमा मुख्य बत्तीको दिशा। दायरा: -1.0 - 1.0।
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=पूरक बत्ती सक्षम
settings.ui_lighting_fill_enabled.description=मुख्य बत्तीले बनाएको छाया पक्षलाई नरम बनाउँछ। यो बत्ती पूर्ण रूपमा हटाउन enabled=false सेट गर्नुहोस्।
settings.ui_lighting_fill_intensity=पूरक बत्ती तीव्रता
settings.ui_lighting_fill_intensity.description=उच्च तीव्रता: राम्रो रङ निष्ठा, नरम छायांकन। न्यून तीव्रता: फरक दिशा भएका मुहारहरूबीच बलियो भिन्नता। दायरा: 0.0 - 1.0।
settings.ui_lighting_fill_x=पूरक बत्ती X
settings.ui_lighting_fill_x.description=विश्व निर्देशांकमा पूरक बत्तीको दिशा। दायरा: -1.0 - 1.0।
settings.ui_lighting_fill_y=पूरक बत्ती Y
settings.ui_lighting_fill_y.description=विश्व निर्देशांकमा पूरक बत्तीको दिशा। दायरा: -1.0 - 1.0।
settings.ui_lighting_fill_z=पूरक बत्ती Z
settings.ui_lighting_fill_z.description=विश्व निर्देशांकमा पूरक बत्तीको दिशा। दायरा: -1.0 - 1.0।
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=किनारा बत्ती सक्षम
settings.ui_lighting_rim_enabled.description=केही सतहहरू छुट्याउन मद्दत गर्ने कमजोर द्वितीयक बत्ती। यो सामान्यतया धेरै सूक्ष्म रहनुपर्छ। यो बत्ती पूर्ण रूपमा हटाउन enabled=false सेट गर्नुहोस्।
settings.ui_lighting_rim_intensity=किनारा बत्ती तीव्रता
settings.ui_lighting_rim_intensity.description=केही सतहहरू छुट्याउन मद्दत गर्ने कमजोर द्वितीयक बत्ती। यो सामान्यतया धेरै सूक्ष्म रहनुपर्छ। दायरा: 0.0 - 1.0।
settings.ui_lighting_rim_x=किनारा बत्ती X
settings.ui_lighting_rim_x.description=विश्व निर्देशांकमा किनारा बत्तीको दिशा। दायरा: -1.0 - 1.0।
settings.ui_lighting_rim_y=किनारा बत्ती Y
settings.ui_lighting_rim_y.description=विश्व निर्देशांकमा किनारा बत्तीको दिशा। दायरा: -1.0 - 1.0।
settings.ui_lighting_rim_z=किनारा बत्ती Z
settings.ui_lighting_rim_z.description=विश्व निर्देशांकमा किनारा बत्तीको दिशा। दायरा: -1.0 - 1.0।
# ---------------- edges ----------------
settings.ui_edges_enabled=फिचर किनाराहरू सक्षम
settings.ui_edges_enabled.description=CSG वस्तुहरूका वास्तविक धारिलो किनाराहरूमा गाढा ज्यामिति कोर्नुहोस्। एउटै समतलमा रहेका बहुभुज सीमानाहरू बेवास्ता गरिन्छन्। किनाराहरू पूर्ण रूपमा हटाउन enabled=false सेट गर्नुहोस्।
settings.ui_edges_angle_degrees=किनारा कोण डिग्री
settings.ui_edges_angle_degrees.description=छेउछाउका मुहारहरूबीचको न्यूनतम कोण, त्यसपछि तिनको साझा किनारा कोरिन्छ। उच्च मानले कम चाउरी रेखा उत्पन्न गर्छ। दायरा: 0 - 360।
settings.ui_edges_width_mode=किनारा चौडाइ मोड
settings.ui_edges_width_mode.description=screen = रूपरेखालाई स्क्रिन पिक्सेलमा लगभग स्थिर राख्छ। जुनसुकै जुम स्तरमा CAD-शैलीको महीन रेखा देखिने बनाउन उत्तम। world = दृश्यको मिलिमिटरमा स्थिर अर्धव्यास प्रयोग गर्छ।
settings.ui_edges_width_px=किनारा चौडाइ पिक्सेल
settings.ui_edges_width_px.description=widthMode=screen हुँदा देखिने रेखा चौडाइ। दायरा: 0.1 - 10.0।
settings.ui_edges_radius=किनारा अर्धव्यास
settings.ui_edges_radius.description=दृश्यको मिलिमिटरमा विश्व-अन्तरिक्ष किनारा अर्धव्यास। widthMode=world हुँदा मात्र प्रयोग गरिन्छ। दायरा: 0.001 - 100.0।
settings.ui_edges_brightness=किनारा चमक
settings.ui_edges_brightness.description=0.0 = कालो, 1.0 = सेतो। दायरा: 0.0 - 1.0।
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=सानो ग्रिड देखिने जुम गहिराइ
settings.ui_grid_small_visible_zoom_depth.description=1 mm ग्रिड कति टाढासम्म देखिने रहन्छ भन्ने नियन्त्रण गर्छ। उच्च मान = 1 mm ग्रिड चाँडै / अझ टाढा देखिन्छ। दायरा: 1 - 10000।
settings.ui_grid_small_brightness_multiplier=सानो ग्रिड चमक गुणक
settings.ui_grid_small_brightness_multiplier.description=थिम ह्यु कायम राख्दै RGB चमकलाई गुणन गर्छ। 1.0 = मूल थिम रङ। < 1.0 = गाढा। > 1.0 = उज्यालो। दायरा: 0.0 - 3.0।
settings.ui_grid_small_opacity_multiplier=सानो ग्रिड अपारदर्शिता गुणक
settings.ui_grid_small_opacity_multiplier.description=हालको थिमले दिने अल्फालाई गुणन गर्छ। 1.0 = अपरिवर्तित। दायरा: 0.0 - 1.0।
settings.ui_grid_small_line_width_px=सानो ग्रिड रेखा चौडाइ (px)
settings.ui_grid_small_line_width_px.description=ग्रिडको पुरानो बनावट-पिक्सेल एकाइमा ग्रिड रेखाको मोटाइ। हालका ऐतिहासिक मानहरू 1 mm का लागि 2 र 10 mm का लागि 4 हुन्। दायरा: 1 - 10।
settings.ui_grid_small_z_offset_mm=सानो ग्रिड Z अफसेट (mm)
settings.ui_grid_small_z_offset_mm.description=गहिराइ दोषबाट बच्न 1 mm ग्रिडलाई 10 mm ग्रिडको अलिकति पछाडि राख्नुहोस्। दायरा: -1.0 - 1.0।
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=ठूलो ग्रिड चमक गुणक
settings.ui_grid_major_brightness_multiplier.description=थिम ह्यु कायम राख्दै RGB चमकलाई गुणन गर्छ। 1.0 = मूल थिम रङ। < 1.0 = गाढा। > 1.0 = उज्यालो। दायरा: 0.0 - 3.0।
settings.ui_grid_major_opacity_multiplier=ठूलो ग्रिड अपारदर्शिता गुणक
settings.ui_grid_major_opacity_multiplier.description=हालको थिमले दिने अल्फालाई गुणन गर्छ। 1.0 = अपरिवर्तित। दायरा: 0.0 - 1.0।
settings.ui_grid_major_line_width_px=ठूलो ग्रिड रेखा चौडाइ (px)
settings.ui_grid_major_line_width_px.description=ग्रिडको पुरानो बनावट-पिक्सेल एकाइमा ग्रिड रेखाको मोटाइ। हालका ऐतिहासिक मानहरू 1 mm का लागि 2 र 10 mm का लागि 4 हुन्। दायरा: 1 - 10।
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ग्रिड गति मोड
settings.ui_grid_motion_mode.description=major = सर्दै गर्दा स्पष्ट 10 mm ग्रिड मात्र देखिने राख्नुहोस् र घना 1 mm ग्रिड अस्थायी रूपमा लुकाउनुहोस्। सर्ने क्रम रोकिएपछि 1 mm ग्रिड फर्किन्छ। all = सर्दै गर्दा स्पष्ट रेखा ग्रिड दुवै देखिने राख्नुहोस्। उत्तम दृश्य निरन्तरता, तर सम्भवतः बढी खर्चिलो। texture = मूल व्यवहार: सर्दै गर्दा रेखा ज्यामितिलाई बनावटी ग्रिड चतुर्भुजहरूसँग बदल्नुहोस्। छिटो, तर aliasing / moire ढाँचा उत्पन्न गर्न सक्छ। hidden = सर्दै गर्दा ग्रिड रेखाहरू लुकाउनुहोस् र क्यामेरा रोकिएपछि तिनलाई पुनःस्थापित गर्नुहोस्।
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=जमिन रेन्डर अपारदर्शिता
settings.ui_grid_ground_render_opacity.description=मुख्य जमिन भरणको अपारदर्शिता। भरण हरेक जुम स्तरमा आफ्नै ठाउँमा रहन्छ; घना 1 mm ग्रिड मात्र जुमले नियन्त्रित हुन्छ। भरण लुकाएर त्यसको छनोट सतह सक्रिय राख्न 0 सेट गर्नुहोस्। अनुकूलन वर्कप्लेनहरूले यो सेटिङ बेवास्ता गर्छन्। दायरा: 0.0 - 1.0।
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=क्यामेरा परिक्रमा न्यूनतम संवेदनशीलता
settings.ui_camera_orbit_min.description=JavaFX माउस-निर्देशांक एकाइ प्रति डिग्रीमा घुमाइ संवेदनशीलता। min ले धेरै ढिलो तान्ने कार्य नियन्त्रण गर्छ। दायरा: 0.0 - 1.0।
settings.ui_camera_orbit_max=क्यामेरा परिक्रमा अधिकतम संवेदनशीलता
settings.ui_camera_orbit_max.description=JavaFX माउस-निर्देशांक एकाइ प्रति डिग्रीमा घुमाइ संवेदनशीलता। max छिटो तान्ने कार्यको माथिल्लो सीमा हो। दायरा: 0.0 - 1.0।
settings.ui_camera_orbit_half=क्यामेरा परिक्रमा आधा गति
settings.ui_camera_orbit_half.description=संवेदनशीलता min र max बीच आधा हुने फिल्टर गरिएको कर्सर गति (JavaFX निर्देशांक एकाइ/सेकेन्ड)। उच्च = नरम प्रवेग। दायरा: 0 - 10000।
settings.ui_camera_orbit_rise_ms=क्यामेरा परिक्रमा बढ्ने समय (ms)
settings.ui_camera_orbit_rise_ms.description=गति बढाउँदा कर्सर गति अनुमानका लागि समय स्थिरांकहरू (मिलिसेकेन्ड)। उच्च riseMs ले प्रवेगलाई नरम बनाउँछ। दायरा: 0 - 10000।
settings.ui_camera_orbit_fall_ms=क्यामेरा परिक्रमा घट्ने समय (ms)
settings.ui_camera_orbit_fall_ms.description=गति घटाउँदा कर्सर गति अनुमानका लागि समय स्थिरांकहरू (मिलिसेकेन्ड)। न्यून fallMs ले सूक्ष्म नियन्त्रण चाँडै पुनःस्थापित गर्छ। कुनैले पनि क्यामेरा जडत्व थप्दैन। दायरा: 0 - 10000।
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=किनारा दृश्य स्थिर हुने ढिलाइ (ms)
settings.ui_edges_scene_settle_delay_ms.description=ज्यामिति/प्रदर्शन परिवर्तनपछिको ढिलाइ। उच्च मानले छिटो इतिहास पुनःप्लेका क्रममा बढी काम दबाउँछ। दायरा: 0 - 10000।
settings.ui_edges_camera_settle_delay_ms=किनारा क्यामेरा स्थिर हुने ढिलाइ (ms)
settings.ui_edges_camera_settle_delay_ms.description=स्क्रिन-अन्तरिक्ष महीन रेखा मोटाइ पुनःनिर्माण गर्नुअघि क्यामेरा सर्नेपछिको ढिलाइ। दायरा: 0 - 10000।
settings.ui_edges_topology_precision=किनारा टोपोलोजी परिशुद्धता
settings.ui_edges_topology_precision.description=फिचर-किनारा टोपोलोजी सामान्य बनाउन प्रयोग हुने क्वान्टाइजेसन चरण। मोडेल ज्यामिति र मुहार नर्मलहरू अपरिवर्तित रहन्छन्। दायरा: 0.0 - 1.0।
settings.ui_edges_stitch_tolerance=किनारा सिलाई सह्यता (mm)
settings.ui_edges_stitch_tolerance.description=दृश्यको मिलिमिटरमा सीमाना सिलाई सह्यता। अनुक्रमित मेस छिमेकीपछि एक-मुहार जस्तो देखिने किनाराहरूका लागि मात्र प्रयोग गरिन्छ। यसले फरक ढंगले उपविभाजित तर ज्यामितीय रूपमा मिल्ने सीमानाहरूलाई तिनी वास्तविक फिचर किनारा हुन् वा होइनन् भन्ने निर्णय गर्नुअघि पुनः जोड्न अनुमति दिन्छ। दायरा: 0.0 - 1.0।
