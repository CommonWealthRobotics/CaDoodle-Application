# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Елементи интерфејса
settings.ui_section_lighting=Осветљење
settings.ui_section_edges=Ивице облика
settings.ui_section_grid=Мрежа радне равни
settings.ui_section_camera=Орбита камере
settings.ui_section_timing=Временски параметри ивица облика
settings.ui_description=Опис преузет из scene-style.properties. Вредност се чува у ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Режим осветљења
settings.ui_lighting_mode.description=Задржите тачно један режим осветљења. 'stable' = Фиксна усмерена светла у простору света. Осветљење се не окреће са камером. Намењено доброј верности боја и читљивој CAD геометрији. 'kevin' = Изворно BowlerStudio осветљење. Користи три тачкаста светла; једно прати камеру. Подешавања стабилног осветљења испод се игноришу у овом режиму.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Амбијентално светло
settings.ui_lighting_ambient.description=Амбијентално светло делује једнако на сваку видљиву површ. Више: светлије сенке, боје остају ближе основној боји, али површи изгледају равније. Ниже: јаче сенчење и раздвајање површи, али засењене боје постају тамније.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Главно светло укључено
settings.ui_lighting_key_enabled.description=Главно светло које описује облик објекта. Поставите enabled=false да потпуно уклоните ово светло.
settings.ui_lighting_key_intensity=Интензитет главног светла
settings.ui_lighting_key_intensity.description=Интензитет главног светла. Опсег: 0.0 - 1.0.
settings.ui_lighting_key_x=Главно светло X
settings.ui_lighting_key_x.description=Смер главног светла у координатама света. Опсег: -1.0 - 1.0.
settings.ui_lighting_key_y=Главно светло Y
settings.ui_lighting_key_y.description=Смер главног светла у координатама света. Опсег: -1.0 - 1.0.
settings.ui_lighting_key_z=Главно светло Z
settings.ui_lighting_key_z.description=Смер главног светла у координатама света. Опсег: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Помоћно светло укључено
settings.ui_lighting_fill_enabled.description=Ублажава сенчену страну коју ствара главно светло. Поставите enabled=false да потпуно уклоните ово светло.
settings.ui_lighting_fill_intensity=Интензитет помоћног светла
settings.ui_lighting_fill_intensity.description=Виши интензитет: боља верност боја, мекше сенчење. Нижи интензитет: већа разлика између различито оријентисаних лица. Опсег: 0.0 - 1.0.
settings.ui_lighting_fill_x=Помоћно светло X
settings.ui_lighting_fill_x.description=Смер помоћног светла у координатама света. Опсег: -1.0 - 1.0.
settings.ui_lighting_fill_y=Помоћно светло Y
settings.ui_lighting_fill_y.description=Смер помоћног светла у координатама света. Опсег: -1.0 - 1.0.
settings.ui_lighting_fill_z=Помоћно светло Z
settings.ui_lighting_fill_z.description=Смер помоћног светла у координатама света. Опсег: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Ободно светло укључено
settings.ui_lighting_rim_enabled.description=Слабо секундарно светло које помаже да се неке површи раздвоје. Обично треба да остане суптилно. Поставите enabled=false да потпуно уклоните ово светло.
settings.ui_lighting_rim_intensity=Интензитет ободног светла
settings.ui_lighting_rim_intensity.description=Слабо секундарно светло које помаже да се неке површи раздвоје. Обично треба да остане суптилно. Опсег: 0.0 - 1.0.
settings.ui_lighting_rim_x=Ободно светло X
settings.ui_lighting_rim_x.description=Смер ободног светла у координатама света. Опсег: -1.0 - 1.0.
settings.ui_lighting_rim_y=Ободно светло Y
settings.ui_lighting_rim_y.description=Смер ободног светла у координатама света. Опсег: -1.0 - 1.0.
settings.ui_lighting_rim_z=Ободно светло Z
settings.ui_lighting_rim_z.description=Смер ободног светла у координатама света. Опсег: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Ивице облика укључене
settings.ui_edges_enabled.description=Црта тамну геометрију дуж стварних оштрих ивица CSG објеката. Границе компланарних полигона се игноришу. Поставите enabled=false да потпуно уклоните ивице.
settings.ui_edges_angle_degrees=Угао ивице у степенима
settings.ui_edges_angle_degrees.description=Минимални угао између суседних лица пре него што се нацрта њихова заједничка ивица. Веће вредности дају мање линија превоја. Опсег: 0 - 360.
settings.ui_edges_width_mode=Режим ширине ивица
settings.ui_edges_width_mode.description=screen = Одржава контуру приближно сталном у пикселима екрана. Најбоље за танку контуру у CAD стилу при било ком зуму. world = Користи фиксни радијус у милиметрима сцене.
settings.ui_edges_width_px=Ширина ивица у пикселима
settings.ui_edges_width_px.description=Видљива дебљина линије када је widthMode=screen. Опсег: 0.1 - 10.0.
settings.ui_edges_radius=Радијус ивица
settings.ui_edges_radius.description=Радијус ивица у простору света, у милиметрима сцене. Користи се само када је widthMode=world. Опсег: 0.001 - 100.0.
settings.ui_edges_brightness=Осветљеност ивица
settings.ui_edges_brightness.description=0.0 = црно, 1.0 = бело. Опсег: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Дубина видљивости ситне мреже
settings.ui_grid_small_visible_zoom_depth.description=Контролише колико далеко ситна мрежа од 1 mm остаје видљива. Већа вредност = мрежа од 1 mm се појављује раније / даље. Опсег: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Множилац осветљености ситне мреже
settings.ui_grid_small_brightness_multiplier.description=Множи RGB осветљеност уз очување нијансе теме. 1.0 = изворна боја теме. < 1.0 = тамније. > 1.0 = светлије. Опсег: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Множилац непрозирности ситне мреже
settings.ui_grid_small_opacity_multiplier.description=Множи алфу коју даје тренутна тема. 1.0 = непромењено. Опсег: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Дебљина линија ситне мреже (px)
settings.ui_grid_small_line_width_px.description=Дебљина линија мреже у застарелим текстуралним пикселима мреже. Тренутне историјске вредности су 2 за 1 mm и 4 за 10 mm. Опсег: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z помак ситне мреже (mm)
settings.ui_grid_small_z_offset_mm.description=Држите мрежу од 1 mm мало иза мреже од 10 mm да избегнете артефакте дубине. Опсег: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Множилац осветљености главне мреже
settings.ui_grid_major_brightness_multiplier.description=Множи RGB осветљеност уз очување нијансе теме. 1.0 = изворна боја теме. < 1.0 = тамније. > 1.0 = светлије. Опсег: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Множилац непрозирности главне мреже
settings.ui_grid_major_opacity_multiplier.description=Множи алфу коју даје тренутна тема. 1.0 = непромењено. Опсег: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Дебљина линија главне мреже (px)
settings.ui_grid_major_line_width_px.description=Дебљина линија мреже у застарелим текстуралним пикселима мреже. Тренутне историјске вредности су 2 за 1 mm и 4 за 10 mm. Опсег: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Режим кретања мреже
settings.ui_grid_motion_mode.description=major = Задржава видљивом само оштру мрежу од 10 mm током кретања и привремено скрива густу мрежу од 1 mm. Мрежа од 1 mm се враћа када кретање стане. all = Задржава обе оштре линијске мреже видљивим током кретања. Најбољи визуелни континуитет, али потенцијално скупље. texture = Изворно понашање: замена линијске геометрије текстурираним квадовима мреже током кретања. Брже, али може дати алијасинг / моар. hidden = Скрива линије мреже током кретања и враћа их када се камера заустави.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Непрозирност приказа земље
settings.ui_grid_ground_render_opacity.description=Непрозирност главне испуне земље. Испуна остаје на месту при сваком зуму; зумом је ограничена само густа мрежа од 1 mm. Поставите 0 да сакријете испуну, а да њена површ за избор остане активна. Прилагођене радне равни игноришу ово подешавање. Опсег: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Мин. осетљивост орбите камере
settings.ui_camera_orbit_min.description=Осетљивост ротације у степенима по јединици координата миша JavaFX. min контролише врло спора превлачења. Опсег: 0.0 - 1.0.
settings.ui_camera_orbit_max=Макс. осетљивост орбите камере
settings.ui_camera_orbit_max.description=Осетљивост ротације у степенима по јединици координата миша JavaFX. max је горња граница за брза превлачења. Опсег: 0.0 - 1.0.
settings.ui_camera_orbit_half=Половина брзине орбите камере
settings.ui_camera_orbit_half.description=Филтрирана брзина курсора у јединицама координата JavaFX у секунди при којој је осетљивост на пола пута између min и max. Веће = блаже убрзање. Опсег: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Време успона орбите камере (ms)
settings.ui_camera_orbit_rise_ms.description=Временске константе (милисекунде) за процену брзине курсора при убрзавању. Веће riseMs ублажава убрзање. Опсег: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Време пада орбите камере (ms)
settings.ui_camera_orbit_fall_ms.description=Временске константе (милисекунде) за процену брзине курсора при успоравању. Мање fallMs брже враћа прецизну контролу. Ни једно ни друго не додаје инерцију камери. Опсег: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Одлагање смиривања сцене за ивице (ms)
settings.ui_edges_scene_settle_delay_ms.description=Одлагање после промена геометрије или приказа. Веће вредности потискују више посла током брзог понављања историје. Опсег: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Одлагање смиривања камере за ивице (ms)
settings.ui_edges_camera_settle_delay_ms.description=Одлагање после кретања камере пре него што се поново изгради дебљина танких линија у екранском простору. Опсег: 0 - 10000.
settings.ui_edges_topology_precision=Прецизност топологије ивица
settings.ui_edges_topology_precision.description=Корак квантовања који се користи за нормализацију топологије ивица облика. Геометрија модела и нормале лица остају непромењене. Опсег: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Толеранција спајања ивица (mm)
settings.ui_edges_stitch_tolerance.description=Толеранција спајања граница у милиметрима сцене. Користи се само за ивице које изгледају као граница једног лица након анализе суседства индексиране мреже. Омогућава различито подељеним, али геометријски подударним границама да се поново споје пре одлуке да ли су стварне ивице облика. Опсег: 0.0 - 1.0.
