# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Saskarnes elementi
settings.ui_section_lighting=Apgaismojums
settings.ui_section_edges=Raksturīgās šķautnes
settings.ui_section_grid=Darba plaknes režģis
settings.ui_section_camera=Kameras griešanās
settings.ui_section_timing=Raksturīgo šķautņu laiks
settings.ui_description=Apraksts ņemts no scene-style.properties. Vērtība tiek saglabāta ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Apgaismojuma režīms
settings.ui_lighting_mode.description=Ievērojiet tieši vienu apgaismojuma režīmu. 'stable' = Fiksēti virziena gaismas avoti pasaules koordinātēs. Apgaismojums negriežas līdzi kamerai. Izstrādāts, lai nodrošinātu labu krāsu precizitāti un salasāmu CAD ģeometriju. 'kevin' = Sākotnējais BowlerStudio apgaismojums. Izmanto trīs punktgaismas; viena seko kamerai. Tālāk norādītie stabilā apgaismojuma iestatījumi šajā režīmā tiek ignorēti.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Apkārtējā gaisma
settings.ui_lighting_ambient.description=Apkārtējā gaisma vienādi ietekmē katru redzamo virsmu. Augstāka: gaišākas ēnas, krāsas paliek tuvāk savai pamatkrāsai, bet virsmas izskatās plakanākas. Zemāka: spēcīgāks ēnojums un virsmu atdalīšana, bet ēnā esošās krāsas kļūst tumšākas.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Galvenā gaisma iespējota
settings.ui_lighting_key_enabled.description=Galvenā gaisma, kas raksturo objekta formu. Iestatiet enabled=false, lai šo gaismu pilnībā noņemtu.
settings.ui_lighting_key_intensity=Galvenās gaismas intensitāte
settings.ui_lighting_key_intensity.description=Galvenās gaismas intensitāte. Diapazons: 0.0 - 1.0.
settings.ui_lighting_key_x=Galvenās gaismas X
settings.ui_lighting_key_x.description=Galvenās gaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
settings.ui_lighting_key_y=Galvenās gaismas Y
settings.ui_lighting_key_y.description=Galvenās gaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
settings.ui_lighting_key_z=Galvenās gaismas Z
settings.ui_lighting_key_z.description=Galvenās gaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Aizpildgaisma iespējota
settings.ui_lighting_fill_enabled.description=Mīkstina galvenās gaismas radīto ēnas pusi. Iestatiet enabled=false, lai šo gaismu pilnībā noņemtu.
settings.ui_lighting_fill_intensity=Aizpildgaismas intensitāte
settings.ui_lighting_fill_intensity.description=Augstāka intensitāte: labāka krāsu precizitāte, mīkstāks ēnojums. Zemāka intensitāte: lielāka atšķirība starp dažādi orientētām virsmām. Diapazons: 0.0 - 1.0.
settings.ui_lighting_fill_x=Aizpildgaismas X
settings.ui_lighting_fill_x.description=Aizpildgaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
settings.ui_lighting_fill_y=Aizpildgaismas Y
settings.ui_lighting_fill_y.description=Aizpildgaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
settings.ui_lighting_fill_z=Aizpildgaismas Z
settings.ui_lighting_fill_z.description=Aizpildgaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Kontūras gaisma iespējota
settings.ui_lighting_rim_enabled.description=Vāja sekundārā gaisma, kas palīdz atdalīt dažas virsmas. Parasti tai jāpaliek smalkai. Iestatiet enabled=false, lai šo gaismu pilnībā noņemtu.
settings.ui_lighting_rim_intensity=Kontūras gaismas intensitāte
settings.ui_lighting_rim_intensity.description=Vāja sekundārā gaisma, kas palīdz atdalīt dažas virsmas. Parasti tai jāpaliek smalkai. Diapazons: 0.0 - 1.0.
settings.ui_lighting_rim_x=Kontūras gaismas X
settings.ui_lighting_rim_x.description=Kontūras gaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
settings.ui_lighting_rim_y=Kontūras gaismas Y
settings.ui_lighting_rim_y.description=Kontūras gaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
settings.ui_lighting_rim_z=Kontūras gaismas Z
settings.ui_lighting_rim_z.description=Kontūras gaismas virziens pasaules koordinātēs. Diapazons: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Raksturīgās šķautnes iespējotas
settings.ui_edges_enabled.description=Zīmē tumšu ģeometriju gar īstajām asajām CSG objektu šķautnēm. Vienā plaknē esošu daudzstūru robežas tiek ignorētas. Iestatiet enabled=false, lai šķautnes pilnībā noņemtu.
settings.ui_edges_angle_degrees=Šķautnes leņķis grādos
settings.ui_edges_angle_degrees.description=Mazākais leņķis starp blakus esošajām virsmām, pirms tiek zīmēta to kopējā šķautne. Lielākas vērtības rada mazāk lūzuma līniju. Diapazons: 0 - 360.
settings.ui_edges_width_mode=Šķautnes platuma režīms
settings.ui_edges_width_mode.description=screen = Uztur kontūru aptuveni nemainīgu ekrāna pikseļos. Vislabāk piemērots CAD stila smalkai līnijai jebkurā tālummaiņā. world = Izmanto fiksētu rādiusu ainas milimetros.
settings.ui_edges_width_px=Šķautnes platums pikseļos
settings.ui_edges_width_px.description=Redzamās līnijas platums, kad widthMode=screen. Diapazons: 0.1 - 10.0.
settings.ui_edges_radius=Šķautnes rādiuss
settings.ui_edges_radius.description=Šķautnes rādiuss pasaules telpā, ainas milimetros. Izmanto tikai tad, kad widthMode=world. Diapazons: 0.001 - 100.0.
settings.ui_edges_brightness=Šķautnes spilgtums
settings.ui_edges_brightness.description=0.0 = melns, 1.0 = balts. Diapazons: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Mazā režģa redzamības dziļums
settings.ui_grid_small_visible_zoom_depth.description=Nosaka, cik tālu 1 mm režģis paliek redzams. Lielāka vērtība = 1 mm režģis parādās agrāk / tālāk. Diapazons: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Mazā režģa spilgtuma reizinātājs
settings.ui_grid_small_brightness_multiplier.description=Reizina RGB spilgtumu, saglabājot tēmas nokrāsu. 1.0 = sākotnējā tēmas krāsa. < 1.0 = tumšāks. > 1.0 = gaišāks. Diapazons: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Mazā režģa necaurredzamības reizinātājs
settings.ui_grid_small_opacity_multiplier.description=Reizina pašreizējās tēmas piegādāto alfa vērtību. 1.0 = nemainīts. Diapazons: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Mazā režģa līnijas platums (px)
settings.ui_grid_small_line_width_px.description=Režģa līnijas biezums režģa mantotajās tekstūras pikseļu vienībās. Pašreizējās vēsturiskās vērtības ir 2 (1 mm) un 4 (10 mm). Diapazons: 1 - 10.
settings.ui_grid_small_z_offset_mm=Mazā režģa Z nobīde (mm)
settings.ui_grid_small_z_offset_mm.description=Turiet 1 mm režģi tieši aiz 10 mm režģa, lai izvairītos no dziļuma artefaktiem. Diapazons: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Lielā režģa spilgtuma reizinātājs
settings.ui_grid_major_brightness_multiplier.description=Reizina RGB spilgtumu, saglabājot tēmas nokrāsu. 1.0 = sākotnējā tēmas krāsa. < 1.0 = tumšāks. > 1.0 = gaišāks. Diapazons: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Lielā režģa necaurredzamības reizinātājs
settings.ui_grid_major_opacity_multiplier.description=Reizina pašreizējās tēmas piegādāto alfa vērtību. 1.0 = nemainīts. Diapazons: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Lielā režģa līnijas platums (px)
settings.ui_grid_major_line_width_px.description=Režģa līnijas biezums režģa mantotajās tekstūras pikseļu vienībās. Pašreizējās vēsturiskās vērtības ir 2 (1 mm) un 4 (10 mm). Diapazons: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Režģa kustības režīms
settings.ui_grid_motion_mode.description=major = Kustības laikā redzamu atstājiet tikai aso 10 mm režģi un īslaicīgi paslēpiet blīvo 1 mm režģi. 1 mm režģis atgriežas pēc kustības apstāšanās. all = Kustības laikā redzamus atstājiet abus asos līniju režģus. Labākā vizuālā nepārtrauktība, bet iespējams dārgāka. texture = Sākotnējā uzvedība: kustības laikā līniju ģeometriju aizstājiet ar teksturētiem režģa četrstūriem. Ātrāk, bet var radīt pakāpju efektu / muarē rakstus. hidden = Kustības laikā paslēpiet režģa līnijas un atjaunojiet tās, kad kamera apstājas.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Zemes attēlojuma necaurredzamība
settings.ui_grid_ground_render_opacity.description=Galvenā zemes pildījuma necaurredzamība. Pildījums paliek vietā visos tālummaiņas līmeņos; tikai blīvo 1 mm režģi ierobežo tālummaiņa. Iestatiet 0, lai paslēptu pildījumu, saglabājot tā izvēles virsmu aktīvu. Pielāgotas darba plaknes ignorē šo iestatījumu. Diapazons: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kameras griešanās minimālā jutība
settings.ui_camera_orbit_min.description=Griešanās jutība grādos uz JavaFX peles koordinātu vienību. min kontrolē ļoti lēnas vilkšanas. Diapazons: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kameras griešanās maksimālā jutība
settings.ui_camera_orbit_max.description=Griešanās jutība grādos uz JavaFX peles koordinātu vienību. max ir augšējā robeža ātrām vilkšanām. Diapazons: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kameras griešanās pusātrums
settings.ui_camera_orbit_half.description=Filtrētais kursora ātrums JavaFX koordinātu vienībās sekundē, pie kura jutība ir pusceļā starp min un max. Lielāks = maigāks paātrinājums. Diapazons: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kameras griešanās pieauguma laiks (ms)
settings.ui_camera_orbit_rise_ms.description=Laika konstantes (milisekundēs) kursora ātruma novērtējumam, paātrinoties. Lielāks riseMs mīkstina paātrinājumu. Diapazons: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kameras griešanās samazinājuma laiks (ms)
settings.ui_camera_orbit_fall_ms.description=Laika konstantes (milisekundēs) kursora ātruma novērtējumam, palēninoties. Mazāks fallMs ātrāk atjauno precīzu vadību. Neviens nepievieno kameras inerci. Diapazons: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Ainas stabilizācijas aizkave šķautnēm (ms)
settings.ui_edges_scene_settle_delay_ms.description=Aizkave pēc ģeometrijas / attēlojuma izmaiņām. Lielākas vērtības nomāc vairāk darba straujas vēstures atskaņošanas laikā. Diapazons: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Kameras stabilizācijas aizkave šķautnēm (ms)
settings.ui_edges_camera_settle_delay_ms.description=Aizkave pēc kameras kustības, pirms tiek pārbūvēts ekrāna telpas smalkās līnijas biezums. Diapazons: 0 - 10000.
settings.ui_edges_topology_precision=Šķautņu topoloģijas precizitāte
settings.ui_edges_topology_precision.description=Kvantēšanas solis, ko izmanto raksturīgo šķautņu topoloģijas normalizēšanai. Modeļa ģeometrija un virsmu normāles paliek nemainīgas. Diapazons: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Šķautņu sašūšanas tolerance (mm)
settings.ui_edges_stitch_tolerance.description=Robežu sašūšanas tolerance ainas milimetros. Izmanto tikai šķietamām vienas virsmas šķautnēm pēc indeksētā režģa blakusesības analīzes. Tā ļauj atšķirīgi sadalītas, bet ģeometriski sakrītošas robežas savienot no jauna, pirms izlemts, vai tās ir īstas raksturīgās šķautnes. Diapazons: 0.0 - 1.0.
