# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=အလင်းရောင် မုဒ်
settings.ui_lighting_mode.description=အလင်းရောင် မုဒ် တစ်ခုတည်းကိုသာ ထားရှိပါ။ 'stable' = ကမ္ဘာ့အာကာသတွင် ပုံသေဦးတည်ချက်ရှိ အလင်းများ။ အလင်းရောင်သည် ကင်မရာနှင့်အတူ မလှည့်ပါ။ အရောင်တိကျမှုကောင်းမွန်ရန်နှင့် ဖတ်ရလွယ်သော CAD ဂျီဩမေတြီအတွက် ဒီဇိုင်းထုတ်ထားသည်။ 'kevin' = မူရင်း BowlerStudio အလင်းရောင်။ အမှတ်သုံးခု အလင်းကို အသုံးပြုသည်။ တစ်ခုက ကင်မရာကို လိုက်ပါသည်။ ဤမုဒ်တွင် အောက်ပါ တည်ငြိမ်အလင်း ဆက်တင်များကို လျစ်လျူရှုသည်။
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=ပတ်ဝန်းကျင် အလင်း
settings.ui_lighting_ambient.description=ပတ်ဝန်းကျင် အလင်းသည် မြင်နိုင်သော မျက်နှာပြင်တိုင်းကို တူညီစွာ သက်ရောက်သည်။ ပိုမြင့်: အရိပ်များ ပိုတောက်ပြီး အရောင်များသည် ၎င်းတို့၏ အခြေခံအရောင်နှင့် ပိုနီးကပ်နေကာ မျက်နှာပြင်များ ပိုပြားသလို ထင်ရသည်။ ပိုနိမ့်: အရိပ်ကျမှုနှင့် မျက်နှာပြင် ကွဲပြားမှု ပိုပြင်းထန်ကာ အရိပ်ထဲရှိ အရောင်များ ပိုမှောင်လာသည်။
