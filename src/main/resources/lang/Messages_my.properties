settings.ui_grid_small_z_offset_mm.description=အတိမ်အနက် ချို့ယွင်းချက်များ မဖြစ်စေရန် 1 mm ဇယားကွက်ကို 10 mm ဇယားကွက်၏ အနည်းငယ် အနောက်တွင် ထားပါ။ အပိုင်းအခြား: -1.0 - 1.0။
