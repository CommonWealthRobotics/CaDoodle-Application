settings.ui_grid_major_opacity_multiplier.description=လက်ရှိ အပြင်အဆင် ပေးသော အက်ဖာကို မြှောက်သည်။ 1.0 = မပြောင်းလဲ။ အပိုင်းအခြား: 0.0 - 1.0။
