settings.ui_camera_orbit_min.description=JavaFX မောက်စ်-ကိုဩဒိနိတ် ယူနစ်တစ်ခုလျှင် ဒီဂရီဖြင့် လှည့်မှု တုံ့ပြန်မှု။ min သည် အလွန်နှေးသော ဆွဲခြင်းကို ထိန်းချုပ်သည်။ အပိုင်းအခြား: 0.0 - 1.0။
settings.ui_camera_orbit_max=ကင်မရာ လှည့်ပတ်မှု အများဆုံး တုံ့ပြန်မှု
settings.ui_camera_orbit_max.description=JavaFX မောက်စ်-ကိုဩဒိနိတ် ယူနစ်တစ်ခုလျှင် ဒီဂရီဖြင့် လှည့်မှု တုံ့ပြန်မှု။ max သည် လျင်မြန်သော ဆွဲခြင်းအတွက် အထက်ကန့်သတ်ချက် ဖြစ်သည်။ အပိုင်းအခြား: 0.0 - 1.0။
settings.ui_camera_orbit_half=ကင်မရာ လှည့်ပတ်မှု တစ်ဝက်အမြန်နှုန်း
settings.ui_camera_orbit_half.description=တုံ့ပြန်မှုသည် min နှင့် max အကြား တစ်ဝက်ဖြစ်သော စစ်ထုတ်ထားသည့် ကာဆာ အမြန်နှုန်း (JavaFX ကိုဩဒိနိတ် ယူနစ်/စက္ကန့်)။ ပိုမြင့် = ပိုပျော့ပျောင်းသော အရှိန်တင်မှု။ အပိုင်းအခြား: 0 - 10000။
settings.ui_camera_orbit_rise_ms=ကင်မရာ လှည့်ပတ်မှု တက်ချိန် (ms)
settings.ui_camera_orbit_rise_ms.description=အမြန်နှုန်း တင်စဉ် ကာဆာ အမြန်နှုန်း ခန့်မှန်းမှုအတွက် အချိန်ကိန်းသေများ (မီလီစက္ကန့်)။ ပိုမြင့်သော riseMs က အရှိန်တင်မှုကို ပျော့ပျောင်းစေသည်။ အပိုင်းအခြား: 0 - 10000။
settings.ui_camera_orbit_fall_ms=ကင်မရာ လှည့်ပတ်မှု ကျချိန် (ms)
settings.ui_camera_orbit_fall_ms.description=အမြန်နှုန်း လျှော့စဉ် ကာဆာ အမြန်နှုန်း ခန့်မှန်းမှုအတွက် အချိန်ကိန်းသေများ (မီလီစက္ကန့်)။ ပိုနိမ့်သော fallMs က သိမ်မွေ့သော ထိန်းချုပ်မှုကို ပိုမြန်စွာ ပြန်လည်ပေးသည်။ နှစ်ခုစလုံး ကင်မရာ အားငွေ့မှုကို မထည့်ပါ။ အပိုင်းအခြား: 0 - 10000။
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=အနားသတ် မြင်ကွင်း တည်ငြိမ်ရန် ကြန့်ကြာချိန် (ms)
settings.ui_edges_scene_settle_delay_ms.description=ဂျီဩမေတြီ/ပြသမှု ပြောင်းလဲမှုများပြီးနောက် ကြန့်ကြာချိန်။ ပိုမြင့်သော တန်ဖိုးများက လျင်မြန်သော သမိုင်း ပြန်ဖွင့်မှုအတွင်း အလုပ်ပိုများကို နှိမ်နင်းသည်။ အပိုင်းအခြား: 0 - 10000။
settings.ui_edges_camera_settle_delay_ms=အနားသတ် ကင်မရာ တည်ငြိမ်ရန် ကြန့်ကြာချိန် (ms)
settings.ui_edges_camera_settle_delay_ms.description=မျက်နှာပြင် အာကာသ ပါးလွှာသော မျဉ်းအထူကို ပြန်လည်တည်ဆောက်မည့်အခါ ကင်မရာ ရွေ့လျားမှုပြီးနောက် ကြန့်ကြာချိန်။ အပိုင်းအခြား: 0 - 10000။
settings.ui_edges_topology_precision=အနားသတ် တိုပိုလိုဂျီ တိကျမှု
settings.ui_edges_topology_precision.description=အနားသတ်လိုင်း တိုပိုလိုဂျီကို ပုံမှန်ဖြစ်စေရန် အသုံးပြုသော ကွမ်တမ်ပြုလုပ်မှု အဆင့်။ မော်ဒယ် ဂျီဩမေတြီနှင့် မျက်နှာ နော်မယ်များ မပြောင်းလဲဘဲ ရှိနေသည်။ အပိုင်းအခြား: 0.0 - 1.0။
settings.ui_edges_stitch_tolerance=အနားသတ် ချုပ်ဆက်မှု သည်းခံနိုင်မှု (mm)
settings.ui_edges_stitch_tolerance.description=မြင်ကွင်း မီလီမီတာတွင် နယ်နိမိတ် ချုပ်ဆက်မှု သည်းခံနိုင်မှု။ အညွှန်းပြုထားသော မားရှ် ကပ်လျက်မှုပြီးနောက် တစ်မျက်နှာတည်း အနားများအဖြစ် ထင်ရသော အနားများအတွက်သာ အသုံးပြုသည်။ မတူညီစွာ ခွဲထားသော်လည်း ဂျီဩမေတြီအားဖြင့် ထပ်တူကျသော နယ်နိမိတ်များကို အမှန်တကယ် အနားသတ်လိုင်းများ ဟုတ်မဟုတ် ဆုံးဖြတ်မီ ပြန်လည်ချိတ်ဆက်နိုင်စေသည်။ အပိုင်းအခြား: 0.0 - 1.0။
