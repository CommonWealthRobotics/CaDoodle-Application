settings.ui_grid_small_brightness_multiplier.description=အပြင်အဆင် အရောင်သမ်းကို ထိန်းထားရင်း RGB တောက်ပမှုကို မြှောက်သည်။ 1.0 = မူရင်း အပြင်အဆင် အရောင်။ < 1.0 = ပိုမှောင်။ > 1.0 = ပိုတောက်။ အပိုင်းအခြား: 0.0 - 3.0။
