# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ဇယားကွက် ရွေ့လျားမှု မုဒ်
settings.ui_grid_motion_mode.description=major = ရွေ့လျားနေစဉ် ကြည်လင်သော 10 mm ဇယားကွက်ကိုသာ မြင်နိုင်ထားပြီး ထူထပ်သော 1 mm ဇယားကွက်ကို ယာယီဖျောက်ထားပါ။ ရွေ့လျားမှု ရပ်ပြီးနောက် 1 mm ဇယားကွက် ပြန်လာသည်။ all = ရွေ့လျားနေစဉ် ကြည်လင်သော မျဉ်းဇယားကွက် နှစ်ခုလုံးကို မြင်နိုင်ထားပါ။ အကောင်းဆုံး အမြင်ဆက်လက်မှု ဖြစ်သော်လည်း ပိုကုန်ကျနိုင်သည်။ texture = မူရင်း အပြုအမူ: ရွေ့လျားနေစဉ် မျဉ်းဂျီဩမေတြီကို အထည်အလိပ်ဇယားကွက် လေးထောင့်များဖြင့် လဲလှယ်ပါ။ ပိုမြန်သော်လည်း aliasing / moire ပုံစံများ ဖြစ်ပေါ်နိုင်သည်။ hidden = ရွေ့လျားနေစဉ် ဇယားကွက်မျဉ်းများကို ဖျောက်ပြီး ကင်မရာ ရပ်သောအခါ ပြန်လည်ဖော်ပါ။
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=မြေပြင် ပြသမှု အလင်းမဖောက်နိုင်မှု
settings.ui_grid_ground_render_opacity.description=အဓိက မြေပြင် ဖြည့်စွက်မှု၏ အလင်းမဖောက်နိုင်မှု။ ဖြည့်စွက်မှုသည် ချဲ့ကြည့်မှု အဆင့်တိုင်းတွင် နေရာမှာတင် ရှိနေသည်။ ထူထပ်သော 1 mm ဇယားကွက်ကိုသာ ချဲ့ကြည့်မှုက ထိန်းချုပ်သည်။ ဖြည့်စွက်မှုကို ဖျောက်ပြီး ၎င်း၏ ရွေးချယ်မှု မျက်နှာပြင်ကို သက်ဝင်ထားလိုပါက 0 သတ်မှတ်ပါ။ စိတ်ကြိုက် လုပ်ငန်းမျက်နှာပြင်များသည် ဤဆက်တင်ကို လျစ်လျူရှုသည်။ အပိုင်းအခြား: 0.0 - 1.0။
