settings.ui_edges_enabled.description=CSG အရာဝတ္ထုများ၏ အမှန်တကယ် ချွန်ထက်သော အနားများတစ်လျှောက် မှောင်သော ဂျီဩမေတြီကို ဆွဲပါ။ တူညီသော ပြန့်ပြူးနေသည့် ဗဟုဂံနယ်နိမိတ်များကို လျစ်လျူရှုသည်။ အနားများကို လုံးဝဖယ်ရှားရန် enabled=false သတ်မှတ်ပါ။
