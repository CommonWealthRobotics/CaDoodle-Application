settings.ui_edges_width_px=အနားသတ် အကျယ် ပစ်ဆယ်
settings.ui_edges_width_px.description=widthMode=screen ဖြစ်စဉ် မြင်နိုင်သော မျဉ်းအကျယ်။ အပိုင်းအခြား: 0.1 - 10.0။
