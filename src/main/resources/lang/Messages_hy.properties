settings.ui_grid_major_line_width_px.description=Ցանցի գծերի հաստությունը ցանցի հնացած հյուսվածքային պիքսել միավորներով: Ընթացիկ պատմական արժեքներն են 2՝ 1 mm-ի համար և 4՝ 10 mm-ի համար: Շրջանակ՝ 1 - 10:
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Ցանցի շարժման ռեժիմ
settings.ui_grid_motion_mode.description=major = Շարժման ընթացքում տեսանելի է պահում միայն հստակ 10 mm ցանցը և ժամանակավորապես թաքցնում խիտ 1 mm ցանցը: 1 mm ցանցը վերադառնում է շարժման դադարելուց հետո: all = Շարժման ընթացքում տեսանելի է պահում երկու հստակ գծային ցանցերը: Լավագույն տեսողական շարունակականություն, բայց հնարավոր է ավելի ծախսատար: texture = Սկզբնական վարքը՝ շարժման ընթացքում գծային երկրաչափությունը փոխարինվում է հյուսվածքային ցանցի քառանկյուններով: Ավելի արագ, բայց կարող է առաջացնել ալիասինգ / մուարե նախշեր: hidden = Շարժման ընթացքում թաքցնում է ցանցի գծերը և վերականգնում դրանք, երբ տեսախցիկը կանգ է առնում:
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Գետնի արտապատկերման անթափանցիկությունը
settings.ui_grid_ground_render_opacity.description=Գետնի հիմնական լցվածքի անթափանցիկությունը: Լցվածքը մնում է տեղում ցանկացած խոշորացման դեպքում. խոշորացմամբ սահմանափակվում է միայն խիտ 1 mm ցանցը: Սահմանեք 0՝ լցվածքը թաքցնելու և դրա ընտրության մակերևույթն ակտիվ պահելու համար: Հատուկ աշխատանքային հարթքները անտեսում են այս կարգավորումը: Շրջանակ՝ 0.0 - 1.0:
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Տեսախցիկի ուղեծրի նվազագույն զգայունությունը
settings.ui_camera_orbit_min.description=Պտտման զգայունությունը աստիճաններով JavaFX մկնիկի կոորդինատի միավորի համար: min-ը կառավարում է շատ դանդաղ քաշումները: Շրջանակ՝ 0.0 - 1.0:
settings.ui_camera_orbit_max=Տեսախցիկի ուղեծրի առավելագույն զգայունությունը
settings.ui_camera_orbit_max.description=Պտտման զգայունությունը աստիճաններով JavaFX մկնիկի կոորդինատի միավորի համար: max-ը արագ քաշումների վերին սահմանն է: Շրջանակ՝ 0.0 - 1.0:
settings.ui_camera_orbit_half=Տեսախցիկի ուղեծրի կիսարագությունը
settings.ui_camera_orbit_half.description=Զտված կուրսորի արագությունը JavaFX կոորդինատային միավորներով վայրկյանում, որի դեպքում զգայունությունը գտնվում է min-ի և max-ի միջև կեսին: Ավելի բարձր = ավելի մեղմ արագացում: Շրջանակ՝ 0 - 10000:
settings.ui_camera_orbit_rise_ms=Տեսախցիկի ուղեծրի աճի ժամանակը (ms)
settings.ui_camera_orbit_rise_ms.description=Ժամանակի հաստատունները (միլիվայրկյան) կուրսորի արագության գնահատման համար արագացման ընթացքում: Ավելի բարձր riseMs-ը մեղմացնում է արագացումը: Շրջանակ՝ 0 - 10000:
settings.ui_camera_orbit_fall_ms=Տեսախցիկի ուղեծրի անկման ժամանակը (ms)
settings.ui_camera_orbit_fall_ms.description=Ժամանակի հաստատունները (միլիվայրկյան) կուրսորի արագության գնահատման համար դանդաղման ընթացքում: Ավելի ցածր fallMs-ը ավելի շուտ վերականգնում է նուրբ կառավարումը: Ոչ մեկը իներցիա չի ավելացնում տեսախցիկին: Շրջանակ՝ 0 - 10000:
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Եզրերի տեսարանի հանգստացման ուշացումը (ms)
settings.ui_edges_scene_settle_delay_ms.description=Ուշացում երկրաչափության կամ ցուցադրման փոփոխություններից հետո: Ավելի բարձր արժեքները ճնշում են ավելի շատ աշխատանք պատմության արագ վերարտադրման ընթացքում: Շրջանակ՝ 0 - 10000:
settings.ui_edges_camera_settle_delay_ms=Եզրերի տեսախցիկի հանգստացման ուշացումը (ms)
settings.ui_edges_camera_settle_delay_ms.description=Ուշացում տեսախցիկի շարժումից հետո, մինչև էկրանային տարածությունում բարակ գծերի հաստությունը նորից կառուցվի: Շրջանակ՝ 0 - 10000:
settings.ui_edges_topology_precision=Եզրերի տոպոլոգիայի ճշգրտությունը
settings.ui_edges_topology_precision.description=Քվանտացման քայլը, որն օգտագործվում է տարրի եզրերի տոպոլոգիան նորմալացնելու համար: Մոդելի երկրաչափությունը և նիստերի նորմալները մնում են անփոփոխ: Շրջանակ՝ 0.0 - 1.0:
settings.ui_edges_stitch_tolerance=Եզրերի կարելու թույլատրանքը (mm)
settings.ui_edges_stitch_tolerance.description=Սահմանների կարելու թույլատրանքը տեսարանի միլիմետրերով: Օգտագործվում է միայն այն եզրերի համար, որոնք ինդեքսավորված ցանցի հարևանության վերլուծությունից հետո երևում են որպես մեկ նիստի սահման: Այն թույլ է տալիս տարբեր կերպ բաժանված, բայց երկրաչափորեն համընկնող սահմաններին վերամիավորվել նախքան որոշելը, թե արդյոք դրանք իրական տարրի եզրեր են: Շրջանակ՝ 0.0 - 1.0:
