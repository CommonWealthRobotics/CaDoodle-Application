# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Միջերեսի տարրեր
settings.ui_section_lighting=Լուսավորում
settings.ui_section_edges=Տարրի եզրեր
settings.ui_section_grid=Աշխատանքային հարթքի ցանց
settings.ui_section_camera=Տեսախցիկի ուղեծիր
settings.ui_section_timing=Տարրի եզրերի ժամանակավորում
settings.ui_description=Նկարագրությունը վերցված է scene-style.properties-ից: Արժեքը պահվում է ConfigurationDatabase-ում:

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Լուսավորման ռեժիմ
settings.ui_lighting_mode.description=Պահեք ուղիղ մեկ լուսավորման ռեժիմ: 'stable' = Ֆիքսված ուղղորդված լույսեր համաշխարհային տարածությունում: Լուսավորումը չի պտտվում տեսախցիկի հետ: Նախատեսված է լավ գունային հավատարմության և ընթեռնելի CAD երկրաչափության համար: 'kevin' = BowlerStudio-ի սկզբնական լուսավորում: Օգտագործում է երեք կետային լույս; մեկը հետևում է տեսախցիկին: Ներքևի կայուն լույսերի կարգավորումները այս ռեժիմում անտեսվում են:
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Միջավայրի լույս
settings.ui_lighting_ambient.description=Միջավայրի լույսը հավասարապես ազդում է յուրաքանչյուր տեսանելի մակերևույթի վրա: Ավելի բարձր՝ ստվերներն ավելի պայծառ են, գույները մնում են ավելի մոտ բազային գույնին, բայց մակերևույթները հարթ են երևում: Ավելի ցածր՝ ստվերումն ու մակերևույթների բաժանումն ավելի ուժեղ են, բայց ստվերված գույները մգանում են:
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Հիմնական լույսը միացված է
settings.ui_lighting_key_enabled.description=Գլխավոր լույսը, որ նկարագրում է օբյեկտի ձևը: Սահմանեք enabled=false, որպեսզի այս լույսն ամբողջությամբ հեռացվի:
settings.ui_lighting_key_intensity=Հիմնական լույսի ինտենսիվությունը
settings.ui_lighting_key_intensity.description=Հիմնական լույսի ինտենսիվությունը: Շրջանակ՝ 0.0 - 1.0:
settings.ui_lighting_key_x=Հիմնական լույս X
settings.ui_lighting_key_x.description=Հիմնական լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
settings.ui_lighting_key_y=Հիմնական լույս Y
settings.ui_lighting_key_y.description=Հիմնական լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
settings.ui_lighting_key_z=Հիմնական լույս Z
settings.ui_lighting_key_z.description=Հիմնական լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Լրացուցիչ լույսը միացված է
settings.ui_lighting_fill_enabled.description=Մեղմացնում է հիմնական լույսի ստեղծած ստվերային կողմը: Սահմանեք enabled=false, որպեսզի այս լույսն ամբողջությամբ հեռացվի:
settings.ui_lighting_fill_intensity=Լրացուցիչ լույսի ինտենսիվությունը
settings.ui_lighting_fill_intensity.description=Ավելի բարձր ինտենսիվություն՝ ավելի լավ գունային հավատարմություն, ավելի մեղմ ստվերում: Ավելի ցածր ինտենսիվություն՝ ավելի ուժեղ տարբերություն տարբեր կողմնորոշված նիստերի միջև: Շրջանակ՝ 0.0 - 1.0:
settings.ui_lighting_fill_x=Լրացուցիչ լույս X
settings.ui_lighting_fill_x.description=Լրացուցիչ լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
settings.ui_lighting_fill_y=Լրացուցիչ լույս Y
settings.ui_lighting_fill_y.description=Լրացուցիչ լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
settings.ui_lighting_fill_z=Լրացուցիչ լույս Z
settings.ui_lighting_fill_z.description=Լրացուցիչ լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Եզրային լույսը միացված է
settings.ui_lighting_rim_enabled.description=Թույլ երկրորդական լույս, որն օգնում է առանձնացնել որոշ մակերևույթներ: Սովորաբար պետք է մնա նուրբ: Սահմանեք enabled=false, որպեսզի այս լույսն ամբողջությամբ հեռացվի:
settings.ui_lighting_rim_intensity=Եզրային լույսի ինտենսիվությունը
settings.ui_lighting_rim_intensity.description=Թույլ երկրորդական լույս, որն օգնում է առանձնացնել որոշ մակերևույթներ: Սովորաբար պետք է մնա նուրբ: Շրջանակ՝ 0.0 - 1.0:
settings.ui_lighting_rim_x=Եզրային լույս X
settings.ui_lighting_rim_x.description=Եզրային լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
settings.ui_lighting_rim_y=Եզրային լույս Y
settings.ui_lighting_rim_y.description=Եզրային լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
settings.ui_lighting_rim_z=Եզրային լույս Z
settings.ui_lighting_rim_z.description=Եզրային լույսի ուղղությունը համաշխարհային կոորդինատներում: Շրջանակ՝ -1.0 - 1.0:
# ---------------- edges ----------------
settings.ui_edges_enabled=Տարրի եզրերը միացված են
settings.ui_edges_enabled.description=Գծում է մուգ երկրաչափություն CSG օբյեկտների իրական սուր եզրերի երկայնքով: Համահարթ բազմանկյունների սահմանները անտեսվում են: Սահմանեք enabled=false, որպեսզի եզրերն ամբողջությամբ հեռացվեն:
settings.ui_edges_angle_degrees=Եզրի անկյունը աստիճաններով
settings.ui_edges_angle_degrees.description=Նվազագույն անկյունը հարևան նիստերի միջև, որից հետո գծվում է նրանց ընդհանուր եզրը: Ավելի բարձր արժեքները տալիս են ավելի քիչ ծալքի գծեր: Շրջանակ՝ 0 - 360:
settings.ui_edges_width_mode=Եզրի լայնության ռեժիմ
settings.ui_edges_width_mode.description=screen = Եզրագիծը մոտավորապես հաստատուն է պահում էկրանի պիքսելներում: Լավագույնը CAD ոճի բարակ եզրագծի համար ցանկացած խոշորացման դեպքում: world = Օգտագործում է ֆիքսված շառավիղ տեսարանի միլիմետրերով:
settings.ui_edges_width_px=Եզրի լայնությունը պիքսելներով
settings.ui_edges_width_px.description=Գծի տեսանելի հաստությունը, երբ widthMode=screen: Շրջանակ՝ 0.1 - 10.0:
settings.ui_edges_radius=Եզրի շառավիղը
settings.ui_edges_radius.description=Եզրի շառավիղը համաշխարհային տարածությունում՝ տեսարանի միլիմետրերով: Օգտագործվում է միայն widthMode=world դեպքում: Շրջանակ՝ 0.001 - 100.0:
settings.ui_edges_brightness=Եզրի պայծառությունը
settings.ui_edges_brightness.description=0.0 = սև, 1.0 = սպիտակ: Շրջանակ՝ 0.0 - 1.0:
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Փոքր ցանցի տեսանելիության խորությունը
settings.ui_grid_small_visible_zoom_depth.description=Կառավարում է, թե որքան հեռու է 1 mm ցանցը մնում տեսանելի: Ավելի բարձր արժեք = 1 mm ցանցը հայտնվում է ավելի շուտ / ավելի հեռու: Շրջանակ՝ 1 - 10000:
settings.ui_grid_small_brightness_multiplier=Փոքր ցանցի պայծառության բազմապատիկը
settings.ui_grid_small_brightness_multiplier.description=Բազմապատկում է RGB պայծառությունը՝ պահպանելով թեմայի երանգը: 1.0 = թեմայի սկզբնական գույնը: < 1.0 = ավելի մուգ: > 1.0 = ավելի պայծառ: Շրջանակ՝ 0.0 - 3.0:
settings.ui_grid_small_opacity_multiplier=Փոքր ցանցի անթափանցիկության բազմապատիկը
settings.ui_grid_small_opacity_multiplier.description=Բազմապատկում է ընթացիկ թեմայի տված ալֆան: 1.0 = անփոփոխ: Շրջանակ՝ 0.0 - 1.0:
settings.ui_grid_small_line_width_px=Փոքր ցանցի գծի հաստությունը (px)
settings.ui_grid_small_line_width_px.description=Ցանցի գծերի հաստությունը ցանցի հնացած հյուսվածքային պիքսել միավորներով: Ընթացիկ պատմական արժեքներն են 2՝ 1 mm-ի համար և 4՝ 10 mm-ի համար: Շրջանակ՝ 1 - 10:
