settings.ui_grid_small_z_offset_mm.description=Պահեք 1 mm ցանցը 10 mm ցանցից փոքր-ինչ հետևում՝ խորության արտեֆակտներից խուսափելու համար: Շրջանակ՝ -1.0 - 1.0:
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Հիմնական ցանցի պայծառության բազմապատիկը
settings.ui_grid_major_brightness_multiplier.description=Բազմապատկում է RGB պայծառությունը՝ պահպանելով թեմայի երանգը: 1.0 = թեմայի սկզբնական գույնը: < 1.0 = ավելի մուգ: > 1.0 = ավելի պայծառ: Շրջանակ՝ 0.0 - 3.0:
settings.ui_grid_major_opacity_multiplier=Հիմնական ցանցի անթափանցիկության բազմապատիկը
settings.ui_grid_major_opacity_multiplier.description=Բազմապատկում է ընթացիկ թեմայի տված ալֆան: 1.0 = անփոփոխ: Շրջանակ՝ 0.0 - 1.0:
