settings.ui_lighting_mode=روشنی کا موڈ
settings.ui_lighting_mode.description=بالکل ایک روشنی کا موڈ رکھیں۔ 'stable' = عالمی فضا میں مقرر سمت والی روشنیاں۔ روشنی کیمرے کے ساتھ نہیں گھومتی۔ بہتر رنگ کی وفاداری اور پڑھنے کے قابل CAD جیومیٹری کے لیے بنایا گیا۔ 'kevin' = اصل BowlerStudio روشنی۔ تین نقطہ روشنیاں استعمال کرتا ہے؛ ایک کیمرے کی پیروی کرتی ہے۔ اس موڈ میں نیچے کی مقرر روشنی کی ترتیبات نظرانداز ہوتی ہیں۔
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=محیطی روشنی
settings.ui_lighting_ambient.description=محیطی روشنی ہر نظر آنے والی سطح پر یکساں اثر ڈالتی ہے۔ زیادہ: روشن سائے، رنگ اپنے بنیادی رنگ کے قریب رہتے ہیں، مگر سطحیں چپٹی دکھتی ہیں۔ کم: مضبوط شیڈنگ اور سطحوں کی بہتر علیحدگی، مگر سایہ دار رنگ گہرے ہو جاتے ہیں۔
