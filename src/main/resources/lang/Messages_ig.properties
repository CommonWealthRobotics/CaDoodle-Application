# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Ihe Ndị Dị na Ihu Ngwa
settings.ui_section_lighting=Ìhè
settings.ui_section_edges=Ọnụ Njirimara
settings.ui_section_grid=Grịd nke Ebe Ọrụ
settings.ui_section_camera=Ntugharị Igwefoto
settings.ui_section_timing=Oge Ọnụ Njirimara
settings.ui_description=Nkọwa e si na scene-style.properties nweta. A na-echekwa uru ahụ na ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Ụdị Ìhè
settings.ui_lighting_mode.description=Debe ụdị ìhè kpọmkwem otu. 'stable' = Ìhè ntụzi aka kwụsiri ike na oghere ụwa. Ìhè anaghị agba gburugburu tinyere igwefoto. E mere ya maka ezi ntụkwasị obi agba na jịọmitiri CAD a na-agụ. 'kevin' = Ìhè mbụ nke BowlerStudio. Ọ na-eji ìhè ntụpọ atọ; otu na-eso igwefoto. A na-eleghara ntọala ìhè kwụsiri ike dị n'okpuru anya na ụdị a.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ìhè Gburugburu
settings.ui_lighting_ambient.description=Ìhè gburugburu na-emetụta ihu ọ bụla a na-ahụ anya otu aka. Nke dị elu: onyinyo na-egbuke egbuke, agba na-anọgide nso agba ha bụ isi, mana ihu na-adị ka nke dị larịị. Nke dị ala: ndò siri ike na nkewa dị n'etiti ihu, mana agba ndị dị na ndò na-arịwanye ojii.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Ìhè Isi Agbanyere
settings.ui_lighting_key_enabled.description=Ìhè isi a na-eji egosi ọdịdị ihe. Debe enabled=false iji wepụ ìhè a kpamkpam.
settings.ui_lighting_key_intensity=Ike Ìhè Isi
settings.ui_lighting_key_intensity.description=Ike ìhè isi. Oke: 0.0 - 1.0.
settings.ui_lighting_key_x=Ìhè Isi X
settings.ui_lighting_key_x.description=Ntụzi aka nke ìhè isi na nhazi ụwa. Oke: -1.0 - 1.0.
settings.ui_lighting_key_y=Ìhè Isi Y
settings.ui_lighting_key_y.description=Ntụzi aka nke ìhè isi na nhazi ụwa. Oke: -1.0 - 1.0.
settings.ui_lighting_key_z=Ìhè Isi Z
settings.ui_lighting_key_z.description=Ntụzi aka nke ìhè isi na nhazi ụwa. Oke: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Ìhè Mmekwata Agbanyere
settings.ui_lighting_fill_enabled.description=Ọ na-eme ka akụkụ ndò nke ìhè isi kere dị nro. Debe enabled=false iji wepụ ìhè a kpamkpam.
settings.ui_lighting_fill_intensity=Ike Ìhè Mmekwata
settings.ui_lighting_fill_intensity.description=Ike kachasị elu: ezi ntụkwasị obi agba, ndò dị nro. Ike dị ala: nnukwu ọdịiche dị n'etiti ihu ndị dị n'akụkụ dịgasị iche. Oke: 0.0 - 1.0.
settings.ui_lighting_fill_x=Ìhè Mmekwata X
settings.ui_lighting_fill_x.description=Ntụzi aka nke ìhè mmekwata na nhazi ụwa. Oke: -1.0 - 1.0.
settings.ui_lighting_fill_y=Ìhè Mmekwata Y
settings.ui_lighting_fill_y.description=Ntụzi aka nke ìhè mmekwata na nhazi ụwa. Oke: -1.0 - 1.0.
settings.ui_lighting_fill_z=Ìhè Mmekwata Z
settings.ui_lighting_fill_z.description=Ntụzi aka nke ìhè mmekwata na nhazi ụwa. Oke: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Ìhè Ọnụ Agbanyere
settings.ui_lighting_rim_enabled.description=Obere ìhè nke abụọ na-enyere aka ịkewa ụfọdụ ihu. Ọ kwesịrị ịdị na-adị nro mgbe niile. Debe enabled=false iji wepụ ìhè a kpamkpam.
settings.ui_lighting_rim_intensity=Ike Ìhè Ọnụ
settings.ui_lighting_rim_intensity.description=Obere ìhè nke abụọ na-enyere aka ịkewa ụfọdụ ihu. Ọ kwesịrị ịdị na-adị nro mgbe niile. Oke: 0.0 - 1.0.
settings.ui_lighting_rim_x=Ìhè Ọnụ X
settings.ui_lighting_rim_x.description=Ntụzi aka nke ìhè ọnụ na nhazi ụwa. Oke: -1.0 - 1.0.
settings.ui_lighting_rim_y=Ìhè Ọnụ Y
settings.ui_lighting_rim_y.description=Ntụzi aka nke ìhè ọnụ na nhazi ụwa. Oke: -1.0 - 1.0.
settings.ui_lighting_rim_z=Ìhè Ọnụ Z
settings.ui_lighting_rim_z.description=Ntụzi aka nke ìhè ọnụ na nhazi ụwa. Oke: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Ọnụ Njirimara Agbanyere
settings.ui_edges_enabled.description=See jịọmitiri gbara ọchịchịrị n'akụkụ ezigbo ọnụ dị nkọ nke ihe CSG. A na-eleghara ókè pọlịgọn dị n'otu ihu anya. Debe enabled=false iji wepụ ọnụ ndị ahụ kpamkpam.
settings.ui_edges_angle_degrees=Ogo Nkuku Ọnụ
settings.ui_edges_angle_degrees.description=Nkuku kachasị nta n'etiti ihu ndị agbata obi tupu esee ọnụ ha na-eketa. Uru dị elu na-eweta obere ahịrị mpịachi. Oke: 0 - 360.
settings.ui_edges_width_mode=Ụdị Obosara Ọnụ
settings.ui_edges_width_mode.description=screen = Ọ na-edebe ahịrị mpụta ihe fọrọ nke nta ka ọ bụrụ otu na piksels ihu. Kachasị mma maka ọdịdị ahịrị dị gịrịgịrị nke ụdị CAD n'ogo mbugharị ọ bụla. world = Ọ na-eji rediosi kwụsiri ike na milimita nke ebe ahụ.
settings.ui_edges_width_px=Obosara Ọnụ na Piksels
settings.ui_edges_width_px.description=Obosara ahịrị a na-ahụ anya mgbe widthMode=screen. Oke: 0.1 - 10.0.
settings.ui_edges_radius=Rediosi Ọnụ
settings.ui_edges_radius.description=Rediosi ọnụ n'oghere ụwa na milimita nke ebe ahụ. A na-eji ya naanị mgbe widthMode=world. Oke: 0.001 - 100.0.
settings.ui_edges_brightness=Ọchịchịrị Ọnụ
settings.ui_edges_brightness.description=0.0 = ojii, 1.0 = ọcha. Oke: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Omimi Mbugharị nke Obere Grịd A Na-ahụ
settings.ui_grid_small_visible_zoom_depth.description=Ọ na-achịkwa ebe dị anya obere grịd 1 mm na-anọgide na-ahụ anya. Uru dị elu = obere grịd 1 mm na-apụta mbụ / n'ebe dị anya. Oke: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Ihe Na-amụba Ọchịchịrị Obere Grịd
settings.ui_grid_small_brightness_multiplier.description=Ọ na-amụba ọchịchịrị RGB ma na-edebe agba isiokwu. 1.0 = agba isiokwu mbụ. < 1.0 = gbara ọchịchịrị. > 1.0 = na-egbuke egbuke. Oke: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Ihe Na-amụba Ngosipụta Obere Grịd
settings.ui_grid_small_opacity_multiplier.description=Ọ na-amụba ngosipụta nke isiokwu ugbu a nyere. 1.0 = agbanweghị. Oke: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Obosara Ahịrị Obere Grịd (px)
settings.ui_grid_small_line_width_px.description=Oke ahịrị grịd na nkeji piksel ochie nke grịd. Uru akụkọ ihe mere eme ugbu a bụ 2 maka 1 mm na 4 maka 10 mm. Oke: 1 - 10.
settings.ui_grid_small_z_offset_mm=Nkwụsị Z nke Obere Grịd (mm)
settings.ui_grid_small_z_offset_mm.description=Debe grịd 1 mm n'azụ grịd 10 mm iji zere ntụpọ omimi. Oke: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Ihe Na-amụba Ọchịchịrị Isi Grịd
settings.ui_grid_major_brightness_multiplier.description=Ọ na-amụba ọchịchịrị RGB ma na-edebe agba isiokwu. 1.0 = agba isiokwu mbụ. < 1.0 = gbara ọchịchịrị. > 1.0 = na-egbuke egbuke. Oke: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Ihe Na-amụba Ngosipụta Isi Grịd
settings.ui_grid_major_opacity_multiplier.description=Ọ na-amụba ngosipụta nke isiokwu ugbu a nyere. 1.0 = agbanweghị. Oke: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Obosara Ahịrị Isi Grịd (px)
settings.ui_grid_major_line_width_px.description=Oke ahịrị grịd na nkeji piksel ochie nke grịd. Uru akụkọ ihe mere eme ugbu a bụ 2 maka 1 mm na 4 maka 10 mm. Oke: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Ụdị Mmegharị Grịd
settings.ui_grid_motion_mode.description=major = Debe naanị grịd 10 mm doro anya na-ahụ anya mgbe ọ na-akpụ akpụ ma zobe obere grịd 1 mm nwa oge. Obere grịd 1 mm na-alọta mgbe mmegharị kwụsịrị. all = Debe grịd abụọ ahịrị doro anya na-ahụ anya mgbe ọ na-akpụ akpụ. Ọga n'ihu anya kachasị mma, mana ọ nwere ike ịdị oke ọnụ. texture = Omume mbụ: gbanwee jịọmitiri ahịrị na akụkụ anọ grịd nwere ederede mgbe ọ na-akpụ akpụ. Ọsọ ọsọ, mana nwere ike iwepụta mgwakọta piksel / ụkpụrụ ebili mmiri. hidden = Zobe ahịrị grịd mgbe ọ na-akpụ akpụ ma weghachi ha mgbe igwefoto kwụsịrị.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Ngosipụta Mbufe Ala
settings.ui_grid_ground_render_opacity.description=Ngosipụta nke isi mbufe ala. Mbufe ahụ na-anọgide n'ebe ọ nọ n'ogo mbugharị ọ bụla; ọ bụ naanị obere grịd 1 mm ka mbugharị na-achịkwa. Debe 0 iji zoo mbufe ahụ ma debe ihu nhọrọ ya na-arụ ọrụ. Ebe ọrụ ahaziri iche na-eleghara ntọala a anya. Oke: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Obere Mmetụta Ntugharị Igwefoto
settings.ui_camera_orbit_min.description=Mmetụta ntugharị na ogo maka otu nkeji nhazi igwe nrịba nke JavaFX. min na-achịkwa ịdọrọ dị nnọọ nwayọọ. Oke: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kasị Elu Mmetụta Ntugharị Igwefoto
settings.ui_camera_orbit_max.description=Mmetụta ntugharị na ogo maka otu nkeji nhazi igwe nrịba nke JavaFX. max bụ oke elu maka ịdọrọ ọsọ ọsọ. Oke: 0.0 - 1.0.
settings.ui_camera_orbit_half=Ọkara Ọsọ Ntugharị Igwefoto
settings.ui_camera_orbit_half.description=Ọsọ igwe nrịba a sụchara na nkeji nhazi JavaFX kwa sekọnd ebe mmetụta dị n'etiti min na max. Elu karị = mmụba dị nro. Oke: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Oge Ịrịgo Ntugharị Igwefoto (ms)
settings.ui_camera_orbit_rise_ms.description=Nkeji oge (milisẹkọnd) maka atụmatụ ọsọ igwe nrịba mgbe ọ na-abawanye ọsọ. riseMs buru ibu na-eme mmụba ka ọ dị nro. Oke: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Oge Ịda Ntugharị Igwefoto (ms)
settings.ui_camera_orbit_fall_ms.description=Nkeji oge (milisẹkọnd) maka atụmatụ ọsọ igwe nrịba mgbe ọ na-ebelata ọsọ. fallMs nta na-eweghachi ezigbo njikwa ngwa ngwa. Ha abụọ anaghị agbakwụnye inetịshịa igwefoto. Oke: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Igbu Oge Ịdị Jụụ nke Ebe Ọnụ (ms)
settings.ui_edges_scene_settle_delay_ms.description=Igbu oge mgbe mgbanwe jịọmitiri/ngosi gasịrị. Uru dị elu na-egbochi ọrụ karịa n'oge ngwaghachi akụkọ ihe mere eme ọsọ ọsọ. Oke: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Igbu Oge Ịdị Jụụ Igwefoto nke Ọnụ (ms)
settings.ui_edges_camera_settle_delay_ms.description=Igbu oge mgbe mmegharị igwefoto gasịrị tupu e wulite ọzọ oke ahịrị dị gịrịgịrị nke oghere ihu. Oke: 0 - 10000.
settings.ui_edges_topology_precision=Nzira Topolọji Ọnụ Njirimara
settings.ui_edges_topology_precision.description=Nrịgo ọnụọgụgụ a na-eji ahazi topolọji ọnụ njirimara. Jịọmitiri ụdị na ntụzi ihu anaghị agbanwe. Oke: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Ndagharị Ịkwa Ọnụ Njirimara (mm)
settings.ui_edges_stitch_tolerance.description=Ndagharị ịkwa ókè na milimita nke ebe ahụ. A na-eji ya naanị maka ọnụ ndị yiri ihu otu mgbe njikọ mẹṣị nwere ndepụta gasịrị. Ọ na-enye ohere ka ókè ndị e kewara n'ụzọ dịgasị iche mana ha dabara na jịọmitiri jikọọ ọzọ tupu ekpebie ma ha bụ ezigbo ọnụ njirimara. Oke: 0.0 - 1.0.
