# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=UI-elementer
settings.ui_section_lighting=Belysning
settings.ui_section_edges=Karakteristiske kanter
settings.ui_section_grid=Workplane-gitter
settings.ui_section_camera=Kameraorbit
settings.ui_section_timing=Tidsindstilling for karakteristiske kanter
settings.ui_description=Beskrivelse hentet fra scene-style.properties. Værdien gemmes i ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Belysningstilstand
settings.ui_lighting_mode.description=Behold præcis én belysningstilstand. 'stable' = Faste retningsbestemte lys i verdensrummet. Belysningen roterer ikke med kameraet. Designet til god farvegengivelse og læsbar CAD-geometri. 'kevin' = Original BowlerStudio-belysning. Bruger tre punktlys; ét følger kameraet. Indstillingerne for stabilt lys nedenfor ignoreres i denne tilstand.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Omgivelseslys
settings.ui_lighting_ambient.description=Omgivelseslys påvirker alle synlige overflader lige meget. Højere: lysere skygger, farverne holder sig tættere på deres grundfarve, men overfladerne virker fladere. Lavere: kraftigere skygge og adskillelse af overflader, men farver i skygge bliver mørkere.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Hovedlys aktiveret
settings.ui_lighting_key_enabled.description=Hovedlys, der bruges til at beskrive objektets form. Sæt enabled=false for at fjerne dette lys helt.
settings.ui_lighting_key_intensity=Hovedlysets intensitet
settings.ui_lighting_key_intensity.description=Intensitet af hovedlyset. Interval: 0.0 - 1.0.
settings.ui_lighting_key_x=Hovedlys X
settings.ui_lighting_key_x.description=Retning af hovedlyset i verdenskoordinater. Interval: -1.0 - 1.0.
settings.ui_lighting_key_y=Hovedlys Y
settings.ui_lighting_key_y.description=Retning af hovedlyset i verdenskoordinater. Interval: -1.0 - 1.0.
settings.ui_lighting_key_z=Hovedlys Z
settings.ui_lighting_key_z.description=Retning af hovedlyset i verdenskoordinater. Interval: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Udfyldningslys aktiveret
settings.ui_lighting_fill_enabled.description=Blødgør skyggesiden, som hovedlyset skaber. Sæt enabled=false for at fjerne dette lys helt.
settings.ui_lighting_fill_intensity=Udfyldningslysets intensitet
settings.ui_lighting_fill_intensity.description=Højere intensitet: bedre farvegengivelse, blødere skygge. Lavere intensitet: større forskel mellem forskelligt orienterede flader. Interval: 0.0 - 1.0.
settings.ui_lighting_fill_x=Udfyldningslys X
settings.ui_lighting_fill_x.description=Retning af udfyldningslyset i verdenskoordinater. Interval: -1.0 - 1.0.
settings.ui_lighting_fill_y=Udfyldningslys Y
settings.ui_lighting_fill_y.description=Retning af udfyldningslyset i verdenskoordinater. Interval: -1.0 - 1.0.
settings.ui_lighting_fill_z=Udfyldningslys Z
settings.ui_lighting_fill_z.description=Retning af udfyldningslyset i verdenskoordinater. Interval: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Kantlys aktiveret
settings.ui_lighting_rim_enabled.description=Svagt sekundært lys, der hjælper med at adskille nogle overflader. Bør normalt forblive diskret. Sæt enabled=false for at fjerne dette lys helt.
settings.ui_lighting_rim_intensity=Kantlysets intensitet
settings.ui_lighting_rim_intensity.description=Svagt sekundært lys, der hjælper med at adskille nogle overflader. Bør normalt forblive diskret. Interval: 0.0 - 1.0.
settings.ui_lighting_rim_x=Kantlys X
settings.ui_lighting_rim_x.description=Retning af kantlyset i verdenskoordinater. Interval: -1.0 - 1.0.
settings.ui_lighting_rim_y=Kantlys Y
settings.ui_lighting_rim_y.description=Retning af kantlyset i verdenskoordinater. Interval: -1.0 - 1.0.
settings.ui_lighting_rim_z=Kantlys Z
settings.ui_lighting_rim_z.description=Retning af kantlyset i verdenskoordinater. Interval: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Karakteristiske kanter aktiveret
settings.ui_edges_enabled.description=Tegner mørk geometri langs reelle skarpe kanter på CSG-objekter. Grænser for koplanare polygoner ignoreres. Sæt enabled=false for at fjerne kanterne helt.
settings.ui_edges_angle_degrees=Kantvinkel (grader)
settings.ui_edges_angle_degrees.description=Mindste vinkel mellem tilstødende flader, før deres fælles kant tegnes. Højere værdier giver færre knæklinjer. Interval: 0 - 360.
settings.ui_edges_width_mode=Tilstand for kantbredde
settings.ui_edges_width_mode.description=screen = Holder omridset nogenlunde konstant i skærmpixels. Bedst til et CAD-lignende hårstreget udseende ved enhver zoom. world = Bruger en fast radius i scenens millimeter.
settings.ui_edges_width_px=Kantbredde (pixels)
settings.ui_edges_width_px.description=Synlig linjebredde når widthMode=screen. Interval: 0.1 - 10.0.
settings.ui_edges_radius=Kantradius
settings.ui_edges_radius.description=Kantradius i verdensrummet i scenens millimeter. Bruges kun ved widthMode=world. Interval: 0.001 - 100.0.
settings.ui_edges_brightness=Lysstyrke for kanter
settings.ui_edges_brightness.description=0.0 = sort, 1.0 = hvid. Interval: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Zoom-dybde for synligt lille gitter
settings.ui_grid_small_visible_zoom_depth.description=Styrer, hvor langt væk gitteret på 1 mm forbliver synligt. Højere værdi = gitteret på 1 mm vises tidligere / længere væk. Interval: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Lysstyrkemultiplikator for det lille gitter
settings.ui_grid_small_brightness_multiplier.description=Multiplicerer RGB-lysstyrken, mens temaets farvetone bevares. 1.0 = oprindelig temafarve. < 1.0 = mørkere. > 1.0 = lysere. Interval: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Opacitetsmultiplikator for det lille gitter
settings.ui_grid_small_opacity_multiplier.description=Multiplicerer den alfa, som det aktuelle tema angiver. 1.0 = uændret. Interval: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Linjebredde for det lille gitter (px)
settings.ui_grid_small_line_width_px.description=Gitterlinjetykkelse i gitterets gamle teksturpixel-enheder. Aktuelle historiske værdier er 2 for 1 mm og 4 for 10 mm. Interval: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z-forskydning for det lille gitter (mm)
settings.ui_grid_small_z_offset_mm.description=Holder gitteret på 1 mm lige bag gitteret på 10 mm for at undgå dybdeartefakter. Interval: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Lysstyrkemultiplikator for det store gitter
settings.ui_grid_major_brightness_multiplier.description=Multiplicerer RGB-lysstyrken, mens temaets farvetone bevares. 1.0 = oprindelig temafarve. < 1.0 = mørkere. > 1.0 = lysere. Interval: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Opacitetsmultiplikator for det store gitter
settings.ui_grid_major_opacity_multiplier.description=Multiplicerer den alfa, som det aktuelle tema angiver. 1.0 = uændret. Interval: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Linjebredde for det store gitter (px)
settings.ui_grid_major_line_width_px.description=Gitterlinjetykkelse i gitterets gamle teksturpixel-enheder. Aktuelle historiske værdier er 2 for 1 mm og 4 for 10 mm. Interval: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Gitterets bevægelsestilstand
settings.ui_grid_motion_mode.description=major = Holder kun det skarpe gitter på 10 mm synligt under bevægelse og skjuler midlertidigt det tætte gitter på 1 mm. Gitteret på 1 mm vender tilbage, når bevægelsen stopper. all = Holder begge de skarpe linjegitre synlige under bevægelse. Bedst visuel kontinuitet, men potentielt dyrere. texture = Oprindelig adfærd: udskifter linjegeometri med teksturerede gitterkvadrater under bevægelse. Hurtigere, men kan give aliasing / moirémønstre. hidden = Skjuler gitterlinjer under bevægelse og gendanner dem, når kameraet stopper.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacitet for grundrendering
settings.ui_grid_ground_render_opacity.description=Opacitet af den primære grundfyldning. Fyldningen bliver på plads ved enhver zoom; kun det tætte gitter på 1 mm styres af zoom. Sæt til 0 for at skjule fyldningen, mens dens valgoverflade forbliver aktiv. Brugerdefinerede workplanes ignorerer denne indstilling. Interval: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Mindste følsomhed for kameraorbit
settings.ui_camera_orbit_min.description=Rotationsfølsomhed i grader pr. JavaFX-musekoordinatenhed. min styrer meget langsomme træk. Interval: 0.0 - 1.0.
settings.ui_camera_orbit_max=Største følsomhed for kameraorbit
settings.ui_camera_orbit_max.description=Rotationsfølsomhed i grader pr. JavaFX-musekoordinatenhed. max er en øvre grænse for hurtige træk. Interval: 0.0 - 1.0.
settings.ui_camera_orbit_half=Halv hastighed for kameraorbit
settings.ui_camera_orbit_half.description=Filtreret markørhastighed i JavaFX-koordinatenheder pr. sekund, hvor følsomheden ligger halvvejs mellem min og max. Højere = blødere acceleration. Interval: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Stigetid for kameraorbit (ms)
settings.ui_camera_orbit_rise_ms.description=Tidskonstanter (millisekunder) for estimatet af markørhastigheden, når der accelereres. Højere riseMs blødgør accelerationen. Interval: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Faldetid for kameraorbit (ms)
settings.ui_camera_orbit_fall_ms.description=Tidskonstanter (millisekunder) for estimatet af markørhastigheden, når der bremses. Lavere fallMs genskaber fin kontrol hurtigere. Ingen af dem tilføjer kamerainerti. Interval: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Forsinkelse for scenens indstilling af kanter (ms)
settings.ui_edges_scene_settle_delay_ms.description=Forsinkelse efter ændringer i geometri/visning. Højere værdier undertrykker mere arbejde under hurtig afspilning af historikken. Interval: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Forsinkelse for kameraets indstilling af kanter (ms)
settings.ui_edges_camera_settle_delay_ms.description=Forsinkelse efter kamerabevægelse, før hårstregtykkelsen i skærmrummet genopbygges. Interval: 0 - 10000.
settings.ui_edges_topology_precision=Præcision for kanttopologi
settings.ui_edges_topology_precision.description=Kvantiseringstrin, der bruges til at normalisere topologien for karakteristiske kanter. Modelgeometri og fladenormaler forbliver uændrede. Interval: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolerance for kantsammenføjning (mm)
settings.ui_edges_stitch_tolerance.description=Tolerance for sammenføjning af grænser i scenens millimeter. Bruges kun til tilsyneladende kanter på én flade efter naboanalyse af det indekserede mesh. Den gør det muligt at genforbinde forskelligt underopdelte, men geometrisk sammenfaldende grænser, før det afgøres, om de er reelle karakteristiske kanter. Interval: 0.0 - 1.0.
