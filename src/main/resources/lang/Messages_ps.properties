# ---------------- edges ----------------
settings.ui_edges_enabled=د ځانګړتیا څنډو فعالول
settings.ui_edges_enabled.description=تیاره هندسه د CSG شیانو د ریښتینو تیزو څنډو په اوږدو کې رسم کوي. په یوه سطحه کې پرتې د څوګونو پولې نه دي پام‌په‌کار. د څنډو بشپړې لرې کولو لپاره enabled=false وټاکئ.
