settings.ui_camera_orbit_max.description=د څرخېدنې حساسیت په درجو کې د JavaFX د ماوس همغږي هر واحد لپاره. max د ژر کش کولو لپاره پورتنۍ پوله ده. حد: 0.0 - 1.0.
