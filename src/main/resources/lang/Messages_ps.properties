settings.ui_grid_small_line_width_px.description=د شبې د خط پنډوالی په شبې د زوړ ټيڪسچر-پکسل واحدونو کې. اوسني تاریخي ارزښتونه 2 د 1 mm لپاره او 4 د 10 mm لپاره دي. حد: 1 - 10.
