settings.ui_lighting_ambient.description=چاپېریالي رڼا پر هر لیدل کېدونکي سطحه په مساوي توګه اغېزه کوي. لوړه: روښانه سیوري، رنګونه خپل اصلي رنګ ته نږدې پاتې کیږي، خو سطحې هوارې ښکاري. ټیټه: قوي سیوري او د سطحو ښه جلاوالی، خو سیوری شوي رنګونه تیاره کیږي.
