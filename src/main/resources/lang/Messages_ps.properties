settings.ui_lighting_mode.description=یوازې یو د رڼا حالت وساتئ. 'stable' = په نړیوال فضا کې ثابت لوریز رڼاوي. رڼا د کامرې سره نه څرخي. د رنګ د ښه وفادارۍ او لوستلو وړ CAD هندسې لپاره جوړ شوی. 'kevin' = د BowlerStudio اصلي رڼا. درې نقطوي رڼاوي کاروي؛ یوه کامره تعقیبوي. لاندې د ثابتې رڼا ترتیبات په دې حالت کې نه دي پام‌په‌کار.
