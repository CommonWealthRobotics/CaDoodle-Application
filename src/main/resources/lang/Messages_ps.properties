settings.ui_camera_orbit_half.description=د JavaFX د همغږیو واحدونو له مخې فلټر شوې کرسر چټکتیا په ثانیه کې چې حساسیت په هغې کې د min او max ترمنځ نیمایي وي. لوړ = نرمه چټکتیا. حد: 0 - 10000.
settings.ui_camera_orbit_rise_ms=د کامرې د څرخېدنې د پورته کېدو وخت (ms)
settings.ui_camera_orbit_rise_ms.description=د وخت ثابتونه (میلی‌ثانیې) د کرسر د چټکتیا اټکل لپاره کله چې چټکتیا زیاتیږي. لوړ riseMs چټکتیا نرمه کوي. حد: 0 - 10000.
settings.ui_camera_orbit_fall_ms=د کامرې د څرخېدنې د کښته کېدو وخت (ms)
settings.ui_camera_orbit_fall_ms.description=د وخت ثابتونه (میلی‌ثانیې) د کرسر د چټکتیا اټکل لپاره کله چې چټکتیا کموي. ټیټ fallMs سم کنټرول ژر بیرته راولي. هېڅ یې هم کامرې ته اینرشیا نه ورزیاتوي. حد: 0 - 10000.
