settings.ui_edges_topology_precision=د څنډو د توپولوژي دقت
settings.ui_edges_topology_precision.description=د کوانټایز کولو ګام چې د ځانګړتیا څنډو توپولوژي نورمالول کارول کیږي. د ماډل هندسه او مخ نورمالونه نه بدلیږي. حد: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=د څنډو د نښلولو زغمل (mm)
settings.ui_edges_stitch_tolerance.description=د پولو د نښلولو زغمل په صحنې ملی‌مترو. یوازې هغو څنډو لپاره کار کیږي چې د فهرست شوې شبې له ګاونډیتوب وروسته یو مخ لرونکې ښکاري. بېلابېلې وېشل شوې خو هندسي یو ځای پولې ته اجازه ورکوي چې مخکې لدې چې پرېکړه وشي چې ایا ریښتینې د ځانګړتیا څنډې دي، بیا ونښلول شي. حد: 0.0 - 1.0.
