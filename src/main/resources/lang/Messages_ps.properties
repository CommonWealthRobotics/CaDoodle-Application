# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=د شبې د خوځښت حالت
settings.ui_grid_motion_mode.description=major = د خوځښت پر مهال یوازې روښانه 10 mm شبه لیدل کېدونکې وساتئ او غونډه 1 mm شبه په لنډمهاله توګه پټه کړئ. 1 mm شبه د خوځښت له ودرېدو وروسته بیرته راځي. all = د خوځښت پر مهال دواړه روښانه خطي شبې لیدل کېدونکې وساتئ. غوره بصري دوام، خو کېدای شي لږ ګران وي. texture = اصلي چلند: د خوځښت پر مهال د خط هندسه په ټيڪسچر لرونکو شبې څلورګونو بدله کړئ. ژرتر، خو کېدای شي الیاسینګ / موجي نمونې جوړې کړي. hidden = د خوځښت پر مهال د شبې خطونه پټ کړئ او د کامرې له ودرېدو سره یې بیرته راوړئ.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=د ځمکې د ښودنې شفافیت
settings.ui_grid_ground_render_opacity.description=د اصلي ځمکې د ډکولو شفافیت. ډکول په هر زوم کچه خپل ځای کې پاتې کیږي؛ یوازې غونډه 1 mm شبه د زوم له مخې کنټرول کیږي. د ډکولو د پټولو او د هغې د ټاکلو سطحې د فعال ساتلو لپاره 0 ته وټاکئ. دودیز کارموقعیتونه دا ترتیب نه پام‌په‌کار کوي. حد: 0.0 - 1.0.
