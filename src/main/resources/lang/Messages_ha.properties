# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Abubuwan Fuskar Mai Amfani
settings.ui_section_lighting=Haske
settings.ui_section_edges=Gefen Siffofi
settings.ui_section_grid=Gridi ɗin Aiki
settings.ui_section_camera=Juyawar Kamara
settings.ui_section_timing=Lokacin Gefen Siffofi
settings.ui_description=Bayanin an ɗauke shi daga scene-style.properties. Ana ajiye ƙimar a ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Yanayin Haske
settings.ui_lighting_mode.description=Riƙe yanayi ɗaya tak na haske. 'stable' = Fitilun kwatance da ba sa motsi a sararin duniya. Hasken ba ya juyawa tare da kamara. An tsara shi don kyakkyawan amincin launi da lissafin CAD mai sauƙin karantawa. 'kevin' = Asalin hasken BowlerStudio. Yana amfani da fitilu uku na aya; ɗaya yana bin kamara. Ana watsi da saitunan haske masu tsayawa da ke ƙasa a wannan yanayin.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Hasken Muhalli
settings.ui_lighting_ambient.description=Hasken muhalli yana shafar kowace fuska da ake gani daidai. Mafi girma: inuwa mai haske, launuka suna kusa da ainihin launinsu, amma fuskoki suna kama da fili. Mafi ƙasa: inuwa mai ƙarfi da rabuwar fuska, amma launukan da ke cikin inuwa suna yin duhu.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Babban Haske A Kunne
settings.ui_lighting_key_enabled.description=Babban hasken da ake amfani da shi wajen bayyana siffar abu. Saita enabled=false don cire wannan hasken gaba ɗaya.
settings.ui_lighting_key_intensity=Ƙarfin Babban Haske
settings.ui_lighting_key_intensity.description=Ƙarfin babban haske. Iyaka: 0.0 - 1.0.
settings.ui_lighting_key_x=Babban Haske X
settings.ui_lighting_key_x.description=Alƙiblar babban haske a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
settings.ui_lighting_key_y=Babban Haske Y
settings.ui_lighting_key_y.description=Alƙiblar babban haske a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
settings.ui_lighting_key_z=Babban Haske Z
settings.ui_lighting_key_z.description=Alƙiblar babban haske a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Hasken Cikawa A Kunne
settings.ui_lighting_fill_enabled.description=Yana tausasa gefen inuwa da babban haske ya haifar. Saita enabled=false don cire wannan hasken gaba ɗaya.
settings.ui_lighting_fill_intensity=Ƙarfin Hasken Cikawa
settings.ui_lighting_fill_intensity.description=Mafi girman ƙarfi: kyakkyawan amincin launi, tausasan inuwa. Mafi ƙarancin ƙarfi: babban bambanci tsakanin fuskoki masu alƙibla daban. Iyaka: 0.0 - 1.0.
settings.ui_lighting_fill_x=Hasken Cikawa X
settings.ui_lighting_fill_x.description=Alƙiblar hasken cikawa a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
settings.ui_lighting_fill_y=Hasken Cikawa Y
settings.ui_lighting_fill_y.description=Alƙiblar hasken cikawa a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
settings.ui_lighting_fill_z=Hasken Cikawa Z
settings.ui_lighting_fill_z.description=Alƙiblar hasken cikawa a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Hasken Gefe A Kunne
settings.ui_lighting_rim_enabled.description=Raunanan haske na biyu da ke taimakawa raba wasu fuskoki. Ya kamata ya kasance a hankali koyaushe. Saita enabled=false don cire wannan hasken gaba ɗaya.
settings.ui_lighting_rim_intensity=Ƙarfin Hasken Gefe
settings.ui_lighting_rim_intensity.description=Raunanan haske na biyu da ke taimakawa raba wasu fuskoki. Ya kamata ya kasance a hankali koyaushe. Iyaka: 0.0 - 1.0.
settings.ui_lighting_rim_x=Hasken Gefe X
settings.ui_lighting_rim_x.description=Alƙiblar hasken gefe a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
settings.ui_lighting_rim_y=Hasken Gefe Y
settings.ui_lighting_rim_y.description=Alƙiblar hasken gefe a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
settings.ui_lighting_rim_z=Hasken Gefe Z
settings.ui_lighting_rim_z.description=Alƙiblar hasken gefe a haɗin gwiwar duniya. Iyaka: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Gefen Siffofi A Kunne
settings.ui_edges_enabled.description=Zana duhun lissafi tare da ainihin kaifi gefuna na abubuwan CSG. Ana watsi da iyakokin siffa mai kusurori da yawa da ke kan fuska ɗaya. Saita enabled=false don cire gefuna gaba ɗaya.
settings.ui_edges_angle_degrees=Kwana na Gefuna a Digiri
settings.ui_edges_angle_degrees.description=Mafi ƙarancin kwana tsakanin fuskoki makwabta kafin a zana gefen da suka raba. Manyan ƙimomi suna samar da ƙananan layukan murɗawa. Iyaka: 0 - 360.
settings.ui_edges_width_mode=Yanayin Faɗin Gefuna
settings.ui_edges_width_mode.description=screen = Yana riƙe layin iyaka kusan a tsaye a cikin piksel na allo. Mafi kyau don kamannin siririn layi irin na CAD a kowane matakin zuƙo. world = Yana amfani da nisan tsakiya mai tsayawa a cikin milimita na fage.
settings.ui_edges_width_px=Faɗin Gefuna a Piksel
settings.ui_edges_width_px.description=Faɗin layin da ake gani lokacin widthMode=screen. Iyaka: 0.1 - 10.0.
settings.ui_edges_radius=Nisan Tsakiya na Gefuna
settings.ui_edges_radius.description=Nisan tsakiya na gefe a sararin duniya cikin milimita na fage. Ana amfani da shi ne kawai lokacin widthMode=world. Iyaka: 0.001 - 100.0.
settings.ui_edges_brightness=Hasken Gefuna
settings.ui_edges_brightness.description=0.0 = baƙi, 1.0 = fari. Iyaka: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Zurfin Zuƙon Gridi Ƙarami Mai Gani
settings.ui_grid_small_visible_zoom_depth.description=Yana sarrafa yadda nisa ƙaramin gridi ɗin 1 mm zai ci gaba da gani. Mafi girma = ƙaramin gridi ɗin 1 mm yana bayyana da wuri / daga nesa. Iyaka: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Ninka Hasken Gridi Ƙarami
settings.ui_grid_small_brightness_multiplier.description=Yana ninka hasken RGB tare da riƙe launin jigo. 1.0 = ainihin launin jigo. < 1.0 = duhu. > 1.0 = haske. Iyaka: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Ninka Bayyanuwar Gridi Ƙarami
settings.ui_grid_small_opacity_multiplier.description=Yana ninka bayyanuwar da jigon yanzu ya bayar. 1.0 = bai canza ba. Iyaka: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Faɗin Layin Gridi Ƙarami (px)
settings.ui_grid_small_line_width_px.description=Kaurin layin gridi a cikin tsoffin raka'o'in piksel na hoton gridii. Ƙimomin tarihi na yanzu sune 2 don 1 mm da 4 don 10 mm. Iyaka: 1 - 10.
settings.ui_grid_small_z_offset_mm=Matsayin Z na Gridi Ƙarami (mm)
settings.ui_grid_small_z_offset_mm.description=Riƙe gridi ɗin 1 mm a bayan gridi ɗin 10 mm don guje wa lahani na zurfi. Iyaka: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Ninka Hasken Babban Gridi
settings.ui_grid_major_brightness_multiplier.description=Yana ninka hasken RGB tare da riƙe launin jigo. 1.0 = ainihin launin jigo. < 1.0 = duhu. > 1.0 = haske. Iyaka: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Ninka Bayyanuwar Babban Gridi
settings.ui_grid_major_opacity_multiplier.description=Yana ninka bayyanuwar da jigon yanzu ya bayar. 1.0 = bai canza ba. Iyaka: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Faɗin Layin Babban Gridi (px)
settings.ui_grid_major_line_width_px.description=Kaurin layin gridi a cikin tsoffin raka'o'in piksel na hoton gridii. Ƙimomin tarihi na yanzu sune 2 don 1 mm da 4 don 10 mm. Iyaka: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Yanayin Motsin Gridi
settings.ui_grid_motion_mode.description=major = Riƙe kawai tsayayyen gridi ɗin 10 mm a gani yayin motsi sannan a ɓoye ƙaramin gridi ɗin 1 mm na ɗan lokaci. Gridi ɗin 1 mm yana dawowa bayan motsi ya tsaya. all = Riƙe duk gridi ɗin layuka masu tsayawa a gani yayin motsi. Mafi kyawun ci gaba na gani, amma mai yiwuwa ya fi tsada. texture = Asalin hali: musanya lissafin layuka da quad ɗin gridi mai zane yayin motsi. Sauri, amma na iya haifar da haɗuwar piksel / tsarin raƙuman hoto. hidden = Ɓoye layukan gridi yayin motsi sannan a mayar da su idan kamara ta tsaya.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Bayyanuwar Zanen Ƙasa
settings.ui_grid_ground_render_opacity.description=Bayyanuwar babban cikon ƙasa. Cikon yana zama a wurinsa a kowane matakin zuƙo; ƙaramin gridi ɗin 1 mm ne kawai ake sarrafawa da zuƙo. Saita 0 don ɓoye cikon tare da barin fuskar zaɓinsa a kunne. Aikin da aka keɓance yana watsi da wannan saitin. Iyaka: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Mafi Ƙarancin Ma'amalar Juyawa
settings.ui_camera_orbit_min.description=Ma'amalar juyawa a digiri a kowace raka'ar haɗin gwiwar linzamin kwamfuta na JavaFX. min yana sarrafa janyo a hankali ƙwarai. Iyaka: 0.0 - 1.0.
settings.ui_camera_orbit_max=Mafi Girman Ma'amalar Juyawa
settings.ui_camera_orbit_max.description=Ma'amalar juyawa a digiri a kowace raka'ar haɗin gwiwar linzamin kwamfuta na JavaFX. max shine iyaka na sama don saurin janyo. Iyaka: 0.0 - 1.0.
settings.ui_camera_orbit_half=Rabin Gudun Juyawar Kamara
settings.ui_camera_orbit_half.description=Gudun linzamin kwamfuta da aka tace a raka'o'in haɗin gwiwa na JavaFX a sakan ɗaya inda ma'amalar ta ke tsakiyar min da max. Mafi girma = haɓakar a hankali. Iyaka: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Lokacin Tashi na Juyawar Kamara (ms)
settings.ui_camera_orbit_rise_ms.description=Ma'aunin lokaci (millisekondi) don kiyasin gudun linzamin kwamfuta yayin ƙaruwa. Babban riseMs yana tausasa haɓaka. Iyaka: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Lokacin Faɗuwa na Juyawar Kamara (ms)
settings.ui_camera_orbit_fall_ms.description=Ma'aunin lokaci (millisekondi) don kiyasin gudun linzamin kwamfuta yayin raguwa. Ƙaramin fallMs yana maido da kyakkyawan iko da wuri. Dukansu ba sa ƙara ƙarfin motsi na kamara. Iyaka: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Jinkirin Kwanciyar Wurin Gefuna (ms)
settings.ui_edges_scene_settle_delay_ms.description=Jinkiri bayan canje-canjen lissafi/nuni. Manyan ƙimomi suna hana ƙarin aiki yayin sake kunnawa cikin sauri. Iyaka: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Jinkirin Kwanciyar Kamara na Gefuna (ms)
settings.ui_edges_camera_settle_delay_ms.description=Jinkiri bayan motsin kamara kafin a sake gina kaurin siririn sararin allo. Iyaka: 0 - 10000.
settings.ui_edges_topology_precision=Tsarin Haɗin Fuska na Gefuna
settings.ui_edges_topology_precision.description=Matakin ƙididdigewa da ake amfani da shi wajen daidaita tsarin haɗin fuska na gefen siffofi. Lissafin samfuri da alƙiblar fuska ba sa canzawa. Iyaka: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Haƙurin Dinkin Gefuna (mm)
settings.ui_edges_stitch_tolerance.description=Haƙurin dinkin iyaka a cikin milimita na fage. Ana amfani da shi ne kawai ga gefuna da suka bayyana a matsayin fuska ɗaya bayan haɗin fuska mai jeri. Yana barin iyakoki da aka raba daban amma suka yi daidai a lissafi su sake haɗuwa kafin a yanke hukunci ko ainihin gefen siffa ne. Iyaka: 0.0 - 1.0.
