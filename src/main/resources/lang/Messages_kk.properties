settings.ui_description=Сипаттама scene-style.properties файлынан алынған. Мән ConfigurationDatabase ішінде сақталады.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Жарықтандыру режимі
settings.ui_lighting_mode.description=Дәл бір жарықтандыру режимін ұстаңыз. 'stable' = Әлемдік кеңістіктегі бекітілген бағытталған жарықтар. Жарықтандыру камерамен бірге айналмайды. Жақсы түс дәлдігі мен оқылатын CAD геометриясына арналған. 'kevin' = BowlerStudio бастапқы жарықтандыруы. Үш нүктелік жарықты пайдаланады; біреуі камераны қадағалайды. Төмендегі тұрақты жарық параметрлері бұл режимде еленбейді.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Қоршаған жарық
settings.ui_lighting_ambient.description=Қоршаған жарық әрбір көрінетін бетке бірдей әсер етеді. Жоғары: көлеңкелер жарығырақ, түстер негізгі түске жақынырақ қалады, бірақ беттер жалпақырақ көрінеді. Төмен: көлеңкелеу және беттердің ажырауы күшейеді, бірақ көлеңкедегі түстер қараңғырақ болады.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Негізгі жарық қосылған
settings.ui_lighting_key_enabled.description=Объект пішінін сипаттайтын басты жарық. Бұл жарықты толығымен алып тастау үшін enabled=false орнатыңыз.
settings.ui_lighting_key_intensity=Негізгі жарық қарқындылығы
settings.ui_lighting_key_intensity.description=Негізгі жарықтың қарқындылығы. Ауқым: 0.0 - 1.0.
settings.ui_lighting_key_x=Негізгі жарық X
settings.ui_lighting_key_x.description=Негізгі жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
settings.ui_lighting_key_y=Негізгі жарық Y
settings.ui_lighting_key_y.description=Негізгі жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
settings.ui_lighting_key_z=Негізгі жарық Z
settings.ui_lighting_key_z.description=Негізгі жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Толықтырушы жарық қосылған
settings.ui_lighting_fill_enabled.description=Негізгі жарық жасаған көлеңкелі жақты жұмсартады. Бұл жарықты толығымен алып тастау үшін enabled=false орнатыңыз.
settings.ui_lighting_fill_intensity=Толықтырушы жарық қарқындылығы
settings.ui_lighting_fill_intensity.description=Жоғары қарқындылық: жақсырақ түс дәлдігі, жұмсақ көлеңкелеу. Төмен қарқындылық: әртүрлі бағытталған жақтар арасындағы айырмашылық күшейеді. Ауқым: 0.0 - 1.0.
settings.ui_lighting_fill_x=Толықтырушы жарық X
settings.ui_lighting_fill_x.description=Толықтырушы жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
settings.ui_lighting_fill_y=Толықтырушы жарық Y
settings.ui_lighting_fill_y.description=Толықтырушы жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
settings.ui_lighting_fill_z=Толықтырушы жарық Z
settings.ui_lighting_fill_z.description=Толықтырушы жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Контурлық жарық қосылған
settings.ui_lighting_rim_enabled.description=Кейбір беттерді ажыратуға көмектесетін әлсіз қосымша жарық. Әдетте байқалмайтын болып қалуы керек. Бұл жарықты толығымен алып тастау үшін enabled=false орнатыңыз.
settings.ui_lighting_rim_intensity=Контурлық жарық қарқындылығы
settings.ui_lighting_rim_intensity.description=Кейбір беттерді ажыратуға көмектесетін әлсіз қосымша жарық. Әдетте байқалмайтын болып қалуы керек. Ауқым: 0.0 - 1.0.
settings.ui_lighting_rim_x=Контурлық жарық X
settings.ui_lighting_rim_x.description=Контурлық жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
settings.ui_lighting_rim_y=Контурлық жарық Y
settings.ui_lighting_rim_y.description=Контурлық жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
settings.ui_lighting_rim_z=Контурлық жарық Z
settings.ui_lighting_rim_z.description=Контурлық жарықтың әлемдік координаттардағы бағыты. Ауқым: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Ерекшелік қырлары қосылған
settings.ui_edges_enabled.description=CSG объектілерінің нақты өткір қырларының бойымен қараңғы геометрия салады. Компланар көпбұрыштардың шекаралары еленбейді. Қырларды толығымен алып тастау үшін enabled=false орнатыңыз.
settings.ui_edges_angle_degrees=Қыр бұрышы градуспен
settings.ui_edges_angle_degrees.description=Көршілес жақтар арасындағы ең аз бұрыш, одан кейін олардың ортақ қыры салынады. Жоғары мәндер бүктелу сызықтарын азайтады. Ауқым: 0 - 360.
settings.ui_edges_width_mode=Қыр ені режимі
settings.ui_edges_width_mode.description=screen = Контурды экран пиксельдерінде шамамен тұрақты ұстайды. Кез келген масштабта CAD стиліндегі жіңішке контурға ең қолайлы. world = Сахна миллиметрлеріндегі бекітілген радиусты пайдаланады.
settings.ui_edges_width_px=Қыр ені пиксельмен
settings.ui_edges_width_px.description=widthMode=screen кезіндегі сызықтың көрінетін қалыңдығы. Ауқым: 0.1 - 10.0.
settings.ui_edges_radius=Қыр радиусы
settings.ui_edges_radius.description=Әлемдік кеңістіктегі қыр радиусы, сахна миллиметрлерінде. Тек widthMode=world кезінде пайдаланылады. Ауқым: 0.001 - 100.0.
settings.ui_edges_brightness=Қыр жарықтығы
settings.ui_edges_brightness.description=0.0 = қара, 1.0 = ақ. Ауқым: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Кіші тордың көріну тереңдігі
settings.ui_grid_small_visible_zoom_depth.description=1 mm тордың қаншалықты алысқа дейін көрінетінін басқарады. Жоғары мән = 1 mm тор ертерек / алысырақ пайда болады. Ауқым: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Кіші тор жарықтығының көбейткіші
settings.ui_grid_small_brightness_multiplier.description=Тақырып реңкін сақтай отырып, RGB жарықтығын көбейтеді. 1.0 = тақырыптың бастапқы түсі. < 1.0 = қараңғырақ. > 1.0 = жарығырақ. Ауқым: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Кіші тор мөлдірсіздігінің көбейткіші
settings.ui_grid_small_opacity_multiplier.description=Ағымдағы тақырып берген альфаны көбейтеді. 1.0 = өзгеріссіз. Ауқым: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Кіші тор сызығының қалыңдығы (px)
settings.ui_grid_small_line_width_px.description=Тор сызықтарының қалыңдығы тордың ескірген текстура-пиксель бірліктерінде. Ағымдағы тарихи мәндер: 1 mm үшін 2 және 10 mm үшін 4. Ауқым: 1 - 10.
settings.ui_grid_small_z_offset_mm=Кіші тордың Z жылжуы (mm)
settings.ui_grid_small_z_offset_mm.description=Тереңдік артефактілерін болдырмау үшін 1 mm торды 10 mm тордың сәл артында ұстаңыз. Ауқым: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Негізгі тор жарықтығының көбейткіші
settings.ui_grid_major_brightness_multiplier.description=Тақырып реңкін сақтай отырып, RGB жарықтығын көбейтеді. 1.0 = тақырыптың бастапқы түсі. < 1.0 = қараңғырақ. > 1.0 = жарығырақ. Ауқым: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Негізгі тор мөлдірсіздігінің көбейткіші
settings.ui_grid_major_opacity_multiplier.description=Ағымдағы тақырып берген альфаны көбейтеді. 1.0 = өзгеріссіз. Ауқым: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Негізгі тор сызығының қалыңдығы (px)
settings.ui_grid_major_line_width_px.description=Тор сызықтарының қалыңдығы тордың ескірген текстура-пиксель бірліктерінде. Ағымдағы тарихи мәндер: 1 mm үшін 2 және 10 mm үшін 4. Ауқым: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Тор қозғалысының режимі
settings.ui_grid_motion_mode.description=major = Қозғалыс кезінде тек айқын 10 mm торды көрінетін күйде ұстап, тығыз 1 mm торды уақытша жасырады. Қозғалыс тоқтағаннан кейін 1 mm тор қайтады. all = Қозғалыс кезінде екі айқын сызықтық торды да көрінетін күйде ұстайды. Ең жақсы визуалды үздіксіздік, бірақ қымбатырақ болуы мүмкін. texture = Бастапқы әрекет: қозғалыс кезінде сызықтық геометрия текстураланған тор квадтарына ауыстырылады. Жылдамырақ, бірақ алиасинг / муар өрнектерін тудыруы мүмкін. hidden = Қозғалыс кезінде тор сызықтарын жасырып, камера тоқтағанда қалпына келтіреді.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Жерді көрсету мөлдірсіздігі
settings.ui_grid_ground_render_opacity.description=Жердің негізгі толтырмасының мөлдірсіздігі. Толтырма кез келген масштабта орнында қалады; масштабпен тек тығыз 1 mm тор шектеледі. Толтырманы жасырып, оның таңдау бетін белсенді ұстау үшін 0 орнатыңыз. Реттелген жұмыс беттері бұл параметрді елемейді. Ауқым: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Камера орбитасының ең аз сезімталдығы
settings.ui_camera_orbit_min.description=Айналу сезімталдығы градуспен JavaFX тінтуір координатының бірлігіне. min өте баяу сүйреулерді басқарады. Ауқым: 0.0 - 1.0.
settings.ui_camera_orbit_max=Камера орбитасының ең көп сезімталдығы
settings.ui_camera_orbit_max.description=Айналу сезімталдығы градуспен JavaFX тінтуір координатының бірлігіне. max жылдам сүйреулер үшін жоғарғы шек. Ауқым: 0.0 - 1.0.
settings.ui_camera_orbit_half=Камера орбитасының жарты жылдамдығы
settings.ui_camera_orbit_half.description=Курсордың сүзілген жылдамдығы JavaFX координат бірліктерімен секундына, бұл кезде сезімталдық min мен max арасында дәл ортасында болады. Жоғары = жұмсақ үдеу. Ауқым: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Камера орбитасының өсу уақыты (ms)
settings.ui_camera_orbit_rise_ms.description=Үдеу кезінде курсор жылдамдығын бағалауға арналған уақыт тұрақтылары (миллисекунд). Жоғары riseMs үдеуді жұмсартады. Ауқым: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Камера орбитасының кему уақыты (ms)
settings.ui_camera_orbit_fall_ms.description=Баяулау кезінде курсор жылдамдығын бағалауға арналған уақыт тұрақтылары (миллисекунд). Төмен fallMs нақты басқаруды тезірек қалпына келтіреді. Екеуі де камераға инерция қоспайды. Ауқым: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Қырлар үшін сахнаның тынышталу кідірісі (ms)
settings.ui_edges_scene_settle_delay_ms.description=Геометрия немесе көрсету өзгерістерінен кейінгі кідіріс. Жоғары мәндер тарихты жылдам қайта ойнату кезінде көбірек жұмысты басады. Ауқым: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Қырлар үшін камераның тынышталу кідірісі (ms)
settings.ui_edges_camera_settle_delay_ms.description=Камера қозғалысынан кейін экран кеңістігіндегі жіңішке сызықтардың қалыңдығы қайта құрылғанға дейінгі кідіріс. Ауқым: 0 - 10000.
settings.ui_edges_topology_precision=Қыр топологиясының дәлдігі
settings.ui_edges_topology_precision.description=Ерекшелік қырларының топологиясын қалыпқа келтіруге пайдаланылатын кванттау қадамы. Модель геометриясы мен жақ нормальдары өзгеріссіз қалады. Ауқым: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Қырларды тігу толеранттығы (mm)
settings.ui_edges_stitch_tolerance.description=Шекараларды тігу толеранттығы, сахна миллиметрлерінде. Индекстелген тор іргелестігі талданғаннан кейін бір жақтың шекарасындай көрінетін қырларға ғана пайдаланылады. Ол әртүрлі бөлінген, бірақ геометриялық тұрғыдан сәйкес келетін шекараларға шынайы ерекшелік қырлары ма, жоқ па деп шешпес бұрын қайта қосылуға мүмкіндік береді. Ауқым: 0.0 - 1.0.
