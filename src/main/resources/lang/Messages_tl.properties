# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Mga Elemento ng Interfaz
settings.ui_section_lighting=Pag-iilaw
settings.ui_section_edges=Mga Tampok na Gilid
settings.ui_section_grid=Grid ng Workplane
settings.ui_section_camera=Pag-orbita ng Kamera
settings.ui_section_timing=Oras ng Tampok na Gilid
settings.ui_description=Paglalarawan na hinango sa scene-style.properties. Ang halaga ay naka-save sa ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Paraan ng Pag-iilaw
settings.ui_lighting_mode.description=Panatilihin ang eksaktong isang paraan ng pag-iilaw. 'stable' = Mga nakapirming direksyonal na ilaw sa espasyo ng mundo. Hindi umiikot ang pag-iilaw kasama ng kamera. Dinisenyo para sa magandang katapatan ng kulay at nababasang heometriyang CAD. 'kevin' = Orihinal na pag-iilaw ng BowlerStudio. Gumagamit ng tatlong ilaw na panturo; isa ang sumusunod sa kamera. Hindi pinapansin sa paraang ito ang mga setting ng nakapirming ilaw sa ibaba.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ilaw sa Paligid
settings.ui_lighting_ambient.description=Pantay na naaapektuhan ng ilaw sa paligid ang bawat nakikitang ibabaw. Mas mataas: mas maliwanag ang mga anino, mas malapit ang mga kulay sa kanilang base na kulay, pero mas patag ang itsura ng mga ibabaw. Mas mababa: mas malakas ang pagtatabing at paghihiwalay ng ibabaw, pero mas dumidilim ang mga kulay sa anino.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Naka-enable ang Pangunahing Ilaw
settings.ui_lighting_key_enabled.description=Pangunahing ilaw na ginagamit upang ilarawan ang hugis ng bagay. Itakda ang enabled=false upang tuluyang alisin ang ilaw na ito.
settings.ui_lighting_key_intensity=Tindi ng Pangunahing Ilaw
settings.ui_lighting_key_intensity.description=Tindi ng pangunahing ilaw. Saklaw: 0.0 - 1.0.
settings.ui_lighting_key_x=X ng Pangunahing Ilaw
settings.ui_lighting_key_x.description=Direksyon ng pangunahing ilaw sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
settings.ui_lighting_key_y=Y ng Pangunahing Ilaw
settings.ui_lighting_key_y.description=Direksyon ng pangunahing ilaw sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
settings.ui_lighting_key_z=Z ng Pangunahing Ilaw
settings.ui_lighting_key_z.description=Direksyon ng pangunahing ilaw sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Naka-enable ang Ilaw na Pampuno
settings.ui_lighting_fill_enabled.description=Pinapalambot ang panig ng anino na nilikha ng pangunahing ilaw. Itakda ang enabled=false upang tuluyang alisin ang ilaw na ito.
settings.ui_lighting_fill_intensity=Tindi ng Ilaw na Pampuno
settings.ui_lighting_fill_intensity.description=Mas mataas na tindi: mas magandang katapatan ng kulay, mas malambot na pagtatabing. Mas mababang tindi: mas malakas na pagkakaiba sa pagitan ng mga mukhang magkaiba ang oryentasyon. Saklaw: 0.0 - 1.0.
settings.ui_lighting_fill_x=X ng Ilaw na Pampuno
settings.ui_lighting_fill_x.description=Direksyon ng ilaw na pampuno sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
settings.ui_lighting_fill_y=Y ng Ilaw na Pampuno
settings.ui_lighting_fill_y.description=Direksyon ng ilaw na pampuno sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
settings.ui_lighting_fill_z=Z ng Ilaw na Pampuno
settings.ui_lighting_fill_z.description=Direksyon ng ilaw na pampuno sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Naka-enable ang Ilaw sa Gilid
settings.ui_lighting_rim_enabled.description=Mahinang pangalawang ilaw na tumutulong sa paghihiwalay ng ilang ibabaw. Dapat itong manatiling banayad. Itakda ang enabled=false upang tuluyang alisin ang ilaw na ito.
settings.ui_lighting_rim_intensity=Tindi ng Ilaw sa Gilid
settings.ui_lighting_rim_intensity.description=Mahinang pangalawang ilaw na tumutulong sa paghihiwalay ng ilang ibabaw. Dapat itong manatiling banayad. Saklaw: 0.0 - 1.0.
settings.ui_lighting_rim_x=X ng Ilaw sa Gilid
settings.ui_lighting_rim_x.description=Direksyon ng ilaw sa gilid sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
settings.ui_lighting_rim_y=Y ng Ilaw sa Gilid
settings.ui_lighting_rim_y.description=Direksyon ng ilaw sa gilid sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
settings.ui_lighting_rim_z=Z ng Ilaw sa Gilid
settings.ui_lighting_rim_z.description=Direksyon ng ilaw sa gilid sa mga koordinado ng mundo. Saklaw: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Naka-enable ang mga Tampok na Gilid
settings.ui_edges_enabled.description=Gumuhit ng madilim na heometriya sa mga tunay na matalim na gilid ng mga bagay na CSG. Hindi pinapansin ang mga hangganan ng poligonong koplanar. Itakda ang enabled=false upang tuluyang alisin ang mga gilid.
settings.ui_edges_angle_degrees=Mga Degree ng Anggulo ng Gilid
settings.ui_edges_angle_degrees.description=Pinakamababang anggulo sa pagitan ng magkatabing mukha bago iguhit ang pinagsasaluhang gilid nila. Mas mataas na halaga, mas kaunting linya ng tiklop. Saklaw: 0 - 360.
settings.ui_edges_width_mode=Paraan ng Lapad ng Gilid
settings.ui_edges_width_mode.description=screen = Pinapanatiling halos di-nagbabago ang balangkas sa mga piksel ng screen. Pinakamainam para sa manipis na linya na may estilong CAD sa anumang antas ng pag-zoom. world = Gumagamit ng nakapirming radyus sa mga milimetro ng tanawin.
settings.ui_edges_width_px=Lapad ng Gilid sa mga Piksel
settings.ui_edges_width_px.description=Nakikitang lapad ng linya kapag widthMode=screen. Saklaw: 0.1 - 10.0.
settings.ui_edges_radius=Radyus ng Gilid
settings.ui_edges_radius.description=Radyus ng gilid sa espasyo ng mundo sa mga milimetro ng tanawin. Ginagamit lamang kapag widthMode=world. Saklaw: 0.001 - 100.0.
settings.ui_edges_brightness=Liwanag ng Gilid
settings.ui_edges_brightness.description=0.0 = itim, 1.0 = puti. Saklaw: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Lalim ng Pag-zoom kung Saan Nakikita ang Maliit na Grid
settings.ui_grid_small_visible_zoom_depth.description=Kinokontrol kung gaano kalayo nananatiling nakikita ang 1 mm na grid. Mas mataas na halaga = mas maagang / mas malayong lumilitaw ang 1 mm na grid. Saklaw: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Pampaparami ng Liwanag ng Maliit na Grid
settings.ui_grid_small_brightness_multiplier.description=Pinaparami ang liwanag ng RGB habang pinapanatili ang kakulayan ng tema. 1.0 = orihinal na kulay ng tema. < 1.0 = mas madilim. > 1.0 = mas maliwanag. Saklaw: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Pampaparami ng Opasidad ng Maliit na Grid
settings.ui_grid_small_opacity_multiplier.description=Pinaparami ang alpha na ibinibigay ng kasalukuyang tema. 1.0 = walang pagbabago. Saklaw: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Lapad ng Linya ng Maliit na Grid (px)
settings.ui_grid_small_line_width_px.description=Kapal ng linya ng grid sa lumang yunit na piksel ng tekstura ng grid. Ang kasalukuyang makasaysayang halaga ay 2 para sa 1 mm at 4 para sa 10 mm. Saklaw: 1 - 10.
settings.ui_grid_small_z_offset_mm=Z na Paglilipat ng Maliit na Grid (mm)
settings.ui_grid_small_z_offset_mm.description=Panatilihing bahagyang nasa likod ng 10 mm na grid ang 1 mm na grid upang maiwasan ang mga depekto sa lalim. Saklaw: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Pampaparami ng Liwanag ng Malaking Grid
settings.ui_grid_major_brightness_multiplier.description=Pinaparami ang liwanag ng RGB habang pinapanatili ang kakulayan ng tema. 1.0 = orihinal na kulay ng tema. < 1.0 = mas madilim. > 1.0 = mas maliwanag. Saklaw: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Pampaparami ng Opasidad ng Malaking Grid
settings.ui_grid_major_opacity_multiplier.description=Pinaparami ang alpha na ibinibigay ng kasalukuyang tema. 1.0 = walang pagbabago. Saklaw: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Lapad ng Linya ng Malaking Grid (px)
settings.ui_grid_major_line_width_px.description=Kapal ng linya ng grid sa lumang yunit na piksel ng tekstura ng grid. Ang kasalukuyang makasaysayang halaga ay 2 para sa 1 mm at 4 para sa 10 mm. Saklaw: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Paraan ng Paggalaw ng Grid
settings.ui_grid_motion_mode.description=major = Panatilihing nakikita lamang ang malinaw na 10 mm na grid habang gumagalaw at pansamantalang itago ang siksik na 1 mm na grid. Babalik ang 1 mm na grid pagkatapos huminto ng paggalaw. all = Panatilihing nakikita ang parehong malinaw na grid ng linya habang gumagalaw. Pinakamainam na tuloy-tuloy na tanawin, pero maaaring mas magastos. texture = Orihinal na pag-uugali: palitan ang heometriya ng linya ng mga quad ng grid na may tekstura habang gumagalaw. Mas mabilis, pero maaaring magdulot ng aliasing / moire na padron. hidden = Itago ang mga linya ng grid habang gumagalaw at ibalik ang mga ito kapag huminto ang kamera.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opasidad ng Pag-render ng Lupa
settings.ui_grid_ground_render_opacity.description=Opasidad ng pangunahing pagpuno ng lupa. Nananatili sa lugar ang puno sa bawat antas ng pag-zoom; ang siksik na 1 mm na grid lang ang kinokontrol ng zoom. Itakda sa 0 upang itago ang pagpuno habang pinapanatiling aktibo ang ibabaw na pinipili nito. Hindi pinapansin ng mga pasadyang workplane ang setting na ito. Saklaw: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Pinakamababang Sentitibidad sa Pag-orbita ng Kamera
settings.ui_camera_orbit_min.description=Sentitibidad sa pag-ikot sa mga grado kada yunit ng koordinado ng mouse sa JavaFX. Kinokontrol ng min ang napakabagal na paghila. Saklaw: 0.0 - 1.0.
settings.ui_camera_orbit_max=Pinakamataas na Sentitibidad sa Pag-orbita ng Kamera
settings.ui_camera_orbit_max.description=Sentitibidad sa pag-ikot sa mga grado kada yunit ng koordinado ng mouse sa JavaFX. Ang max ay pinakamataas na hangganan para sa mabilis na paghila. Saklaw: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kalahating Bilis ng Pag-orbita ng Kamera
settings.ui_camera_orbit_half.description=Salang bilis ng kursor sa mga yunit ng koordinado ng JavaFX kada segundo kung saan ang sentitibidad ay kalahati sa pagitan ng min at max. Mas mataas = mas banayad na pagbilis. Saklaw: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Oras ng Pag-angat ng Pag-orbita ng Kamera (ms)
settings.ui_camera_orbit_rise_ms.description=Mga oras na palagian (milisegundo) para sa pagtatantya ng bilis ng kursor kapag bumibilis. Pinapalambot ng mas mataas na riseMs ang pagbilis. Saklaw: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Oras ng Pagbaba ng Pag-orbita ng Kamera (ms)
settings.ui_camera_orbit_fall_ms.description=Mga oras na palagian (milisegundo) para sa pagtatantya ng bilis ng kursor kapag bumabagal. Ibinebalik ng mas mababang fallMs ang pinong kontrol nang mas maaga. Wala sa dalawa ang nagdaragdag ng inersya ng kamera. Saklaw: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Pagkaantala ng Pagkapanatag ng Tanawin ng Gilid (ms)
settings.ui_edges_scene_settle_delay_ms.description=Pagkaantala pagkatapos ng mga pagbabago sa heometriya / pagpapakita. Mas mataas na halaga ang sumusupil ng mas maraming trabaho habang mabilis na nagre-replay ng kasaysayan. Saklaw: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Pagkaantala ng Pagkapanatag ng Kamera ng Gilid (ms)
settings.ui_edges_camera_settle_delay_ms.description=Pagkaantala pagkatapos ng paggalaw ng kamera bago muling itayo ang kapal ng manipis na linya sa espasyo ng screen. Saklaw: 0 - 10000.
settings.ui_edges_topology_precision=Katumpakan ng Topolohiya ng Gilid
settings.ui_edges_topology_precision.description=Hakbang ng kwantisasyon na ginagamit upang gawing karaniwan ang topolohiya ng tampok na gilid. Hindi nagbabago ang heometriya ng modelo at ang mga normal ng mukha. Saklaw: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Toleransya ng Pagtahi ng Gilid (mm)
settings.ui_edges_stitch_tolerance.description=Toleransya ng pagtahi ng hangganan sa mga milimetro ng tanawin. Ginagamit lamang para sa mga gilid na mukhang iisang mukha pagkatapos ng pagsasama ng naka-index na mesh. Pinapayagan nitong muling ikonekta ang mga hangganang magkaiba ang subdibisyon pero magkatugma sa heometriya bago magpasya kung tunay na tampok na gilid ang mga ito. Saklaw: 0.0 - 1.0.
