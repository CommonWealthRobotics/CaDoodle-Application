# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ජාලක චලන ප්‍රකාරය
settings.ui_grid_motion_mode.description=major = චලනය වන විට පැහැදිලි 10 mm ජාලකය පමණක් දෘශ්‍යමානව තබා ඝන 1 mm ජාලකය තාවකාලිකව සඟවන්න. චලනය නතර වූ පසු 1 mm ජාලකය ආපසු පැමිණේ. all = චලනය වන විට පැහැදිලි රේඛා ජාලක දෙකම දෘශ්‍යමානව තබන්න. හොඳම දෘශ්‍ය අඛණ්ඩතාව, නමුත් සමහරවිට වඩා මිල අධික. texture = මුල් හැසිරීම: චලනය වන විට රේඛා ජ්‍යාමිතිය ටෙක්ස්චර් ජාලක චතුරස්‍ර සමඟ මාරු කරන්න. වේගවත්, නමුත් aliasing / moire රටා ඇති කළ හැක. hidden = චලනය වන විට ජාලක රේඛා සඟවා කැමරාව නතර වූ විට ඒවා ප්‍රතිසාධනය කරන්න.
