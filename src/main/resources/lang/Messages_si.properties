settings.ui_grid_small_z_offset_mm.description=ගැඹුරු දෝෂ වළක්වා ගැනීමට 1 mm ජාලකය 10 mm ජාලකයට මඳක් පිටුපසින් තබන්න. පරාසය: -1.0 - 1.0.
