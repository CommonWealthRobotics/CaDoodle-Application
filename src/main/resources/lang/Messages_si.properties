settings.ui_grid_major_brightness_multiplier.description=තේමා වර්ණය රඳවා ගනිමින් RGB දීප්තිය ගුණ කරයි. 1.0 = මුල් තේමා වර්ණය. < 1.0 = අඳුරු. > 1.0 = දීප්තිමත්. පරාසය: 0.0 - 3.0.
