settings.ui_lighting_mode.description=හරියටම එක් ආලෝකකරණ ප්‍රකාරයක් තබා ගන්න. 'stable' = ස්ථාවර ලෝක අවකාශ දිශානුගත ආලෝක. ආලෝකය කැමරාව සමඟ කරකැවෙන්නේ නැත. හොඳ වර්ණ නිරවද්‍යතාවය සහ කියවිය හැකි CAD ජ්‍යාමිතිය සඳහා නිර්මාණය කර ඇත. 'kevin' = මුල් BowlerStudio ආලෝකකරණය. තුන් ලක්ෂ්‍ය ආලෝක භාවිතා කරයි; එකක් කැමරාව අනුගමනය කරයි. මෙම ප්‍රකාරයේදී පහත ස්ථාවර-ආලෝක සැකසීම් නොසලකා හරිනු ලැබේ.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=පරිසර ආලෝකය
settings.ui_lighting_ambient.description=පරිසර ආලෝකය දෘශ්‍යමාන සෑම පෘෂ්ඨයකටම සමානව බලපායි. ඉහළ: සෙවනැලි දීප්තිමත් වේ, වර්ණ ඒවායේ මූලික වර්ණයට සමීපව පවතී, නමුත් පෘෂ්ඨ පැතලි ලෙස පෙනේ. පහළ: සෙවනැලිකරණය සහ පෘෂ්ඨ වෙන්වීම ශක්තිමත් වේ, නමුත් සෙවනැලි වර්ණ අඳුරු වේ.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=ප්‍රධාන ආලෝකය සක්‍රීයයි
settings.ui_lighting_key_enabled.description=වස්තුවේ හැඩය විස්තර කිරීමට භාවිතා කරන ප්‍රධාන ආලෝකය. මෙම ආලෝකය සම්පූර්ණයෙන්ම ඉවත් කිරීමට enabled=false සකසන්න.
settings.ui_lighting_key_intensity=ප්‍රධාන ආලෝක තීව්‍රතාවය
settings.ui_lighting_key_intensity.description=ප්‍රධාන ආලෝකයේ තීව්‍රතාවය. පරාසය: 0.0 - 1.0.
settings.ui_lighting_key_x=ප්‍රධාන ආලෝකය X
settings.ui_lighting_key_x.description=ලෝක ඛණ්ඩාංකවල ප්‍රධාන ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
settings.ui_lighting_key_y=ප්‍රධාන ආලෝකය Y
settings.ui_lighting_key_y.description=ලෝක ඛණ්ඩාංකවල ප්‍රධාන ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
settings.ui_lighting_key_z=ප්‍රධාන ආලෝකය Z
settings.ui_lighting_key_z.description=ලෝක ඛණ්ඩාංකවල ප්‍රධාන ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=පූරක ආලෝකය සක්‍රීයයි
settings.ui_lighting_fill_enabled.description=ප්‍රධාන ආලෝකය නිර්මාණය කරන සෙවනැලි පැත්ත මෘදු කරයි. මෙම ආලෝකය සම්පූර්ණයෙන්ම ඉවත් කිරීමට enabled=false සකසන්න.
settings.ui_lighting_fill_intensity=පූරක ආලෝක තීව්‍රතාවය
settings.ui_lighting_fill_intensity.description=වැඩි තීව්‍රතාවය: හොඳ වර්ණ නිරවද්‍යතාවය, මෘදු සෙවනැලිකරණය. අඩු තීව්‍රතාවය: විවිධ දිශානතියේ මුහුණතවලට අතර වඩාත් ශක්තිමත් වෙනස. පරාසය: 0.0 - 1.0.
settings.ui_lighting_fill_x=පූරක ආලෝකය X
settings.ui_lighting_fill_x.description=ලෝක ඛණ්ඩාංකවල පූරක ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
settings.ui_lighting_fill_y=පූරක ආලෝකය Y
settings.ui_lighting_fill_y.description=ලෝක ඛණ්ඩාංකවල පූරක ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
settings.ui_lighting_fill_z=පූරක ආලෝකය Z
settings.ui_lighting_fill_z.description=ලෝක ඛණ්ඩාංකවල පූරක ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=දාර ආලෝකය සක්‍රීයයි
settings.ui_lighting_rim_enabled.description=සමහර පෘෂ්ඨ වෙන් කිරීමට උපකාර වන දුර්වල ද්විතීයික ආලෝකය. මෙය සාමාන්‍යයෙන් ඉතා සියුම්ව තිබිය යුතුය. මෙම ආලෝකය සම්පූර්ණයෙන්ම ඉවත් කිරීමට enabled=false සකසන්න.
settings.ui_lighting_rim_intensity=දාර ආලෝක තීව්‍රතාවය
settings.ui_lighting_rim_intensity.description=සමහර පෘෂ්ඨ වෙන් කිරීමට උපකාර වන දුර්වල ද්විතීයික ආලෝකය. මෙය සාමාන්‍යයෙන් ඉතා සියුම්ව තිබිය යුතුය. පරාසය: 0.0 - 1.0.
settings.ui_lighting_rim_x=දාර ආලෝකය X
settings.ui_lighting_rim_x.description=ලෝක ඛණ්ඩාංකවල දාර ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
settings.ui_lighting_rim_y=දාර ආලෝකය Y
settings.ui_lighting_rim_y.description=ලෝක ඛණ්ඩාංකවල දාර ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
settings.ui_lighting_rim_z=දාර ආලෝකය Z
settings.ui_lighting_rim_z.description=ලෝක ඛණ්ඩාංකවල දාර ආලෝකයේ දිශාව. පරාසය: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=විශේෂාංග දාර සක්‍රීයයි
settings.ui_edges_enabled.description=CSG වස්තුවල සැබෑ තියුණු දාර දිගේ අඳුරු ජ්‍යාමිතිය අඳින්න. එකම තලයේ ඇති බහුඅස්‍ර මායිම් නොසලකා හරිනු ලැබේ. දාර සම්පූර්ණයෙන්ම ඉවත් කිරීමට enabled=false සකසන්න.
settings.ui_edges_angle_degrees=දාර කෝණ අංශක
settings.ui_edges_angle_degrees.description=යාබද මුහුණතවලට අතර අවම කෝණය, ඉන් පසු ඒවායේ හවුල් දාරය අඳිනු ලැබේ. වැඩි අගයන් අඩු රැළි රේඛා නිපදවයි. පරාසය: 0 - 360.
settings.ui_edges_width_mode=දාර පළල ප්‍රකාරය
settings.ui_edges_width_mode.description=screen = රේඛා සටහන තිර පික්සලවල ආසන්න වශයෙන් ස්ථාවරව තබයි. ඕනෑම විශාලන මට්ටමක CAD-විලාසී සියුම් රේඛා පෙනුමට හොඳම. world = දර්ශනයේ මිලිමීටරවල ස්ථාවර අරයක් භාවිතා කරයි.
settings.ui_edges_width_px=දාර පළල පික්සල
settings.ui_edges_width_px.description=widthMode=screen විට දෘශ්‍යමාන රේඛා පළල. පරාසය: 0.1 - 10.0.
settings.ui_edges_radius=දාර අරය
settings.ui_edges_radius.description=දර්ශනයේ මිලිමීටරවල ලෝක අවකාශ දාර අරය. widthMode=world විට පමණක් භාවිතා වේ. පරාසය: 0.001 - 100.0.
settings.ui_edges_brightness=දාර දීප්තිය
settings.ui_edges_brightness.description=0.0 = කළු, 1.0 = සුදු. පරාසය: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=කුඩා ජාලකය දෘශ්‍යමාන විශාලන ගැඹුර
settings.ui_grid_small_visible_zoom_depth.description=1 mm ජාලකය කොපමණ දුරක් පෙනෙමින් පවතින්නේද යන්න පාලනය කරයි. වැඩි අගයක් = 1 mm ජාලකය වඩාත් කලින් / වඩාත් දුරින් පෙනේ. පරාසය: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=කුඩා ජාලක දීප්ති ගුණකය
settings.ui_grid_small_brightness_multiplier.description=තේමා වර්ණය රඳවා ගනිමින් RGB දීප්තිය ගුණ කරයි. 1.0 = මුල් තේමා වර්ණය. < 1.0 = අඳුරු. > 1.0 = දීප්තිමත්. පරාසය: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=කුඩා ජාලක විනිවිදභාව ගුණකය
settings.ui_grid_small_opacity_multiplier.description=වත්මන් තේමාව විසින් සපයන ඇල්ෆා ගුණ කරයි. 1.0 = වෙනස් නොවේ. පරාසය: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=කුඩා ජාලක රේඛා පළල (px)
