settings.ui_grid_ground_render_opacity.description=ප්‍රධාන භූමි පිරවුමේ විනිවිදභාවය. පිරවුම සෑම විශාලන මට්ටමකම එහි තැනම පවතී; ඝන 1 mm ජාලකය පමණක් විශාලනයෙන් පාලනය වේ. පිරවුම සඟවා එහි තේරීම් පෘෂ්ඨය සක්‍රීයව තබා ගැනීමට 0 සකසන්න. අභිරුචි වැඩ පොල මෙම සැකසීම නොසලකා හරියි. පරාසය: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=කැමරා කක්ෂගත අවම සංවේදීතාව
settings.ui_camera_orbit_min.description=JavaFX මූසික-ඛණ්ඩාංක ඒකකයකට අංශකවල භ්‍රමණ සංවේදීතාව. min ඉතා මන්දගාමී ඇදීම් පාලනය කරයි. පරාසය: 0.0 - 1.0.
settings.ui_camera_orbit_max=කැමරා කක්ෂගත උපරිම සංවේදීතාව
settings.ui_camera_orbit_max.description=JavaFX මූසික-ඛණ්ඩාංක ඒකකයකට අංශකවල භ්‍රමණ සංවේදීතාව. max වේගවත් ඇදීම් සඳහා ඉහළ සීමාවයි. පරාසය: 0.0 - 1.0.
settings.ui_camera_orbit_half=කැමරා කක්ෂගත අඩක් වේගය
settings.ui_camera_orbit_half.description=සංවේදීතාව min සහ max අතර අඩක් වන පෙරන ලද කර්සර වේගය (JavaFX ඛණ්ඩාංක ඒකක/තත්පරය). වැඩි = මෘදු ත්වරණය. පරාසය: 0 - 10000.
settings.ui_camera_orbit_rise_ms=කැමරා කක්ෂගත නැගීමේ කාලය (ms)
settings.ui_camera_orbit_rise_ms.description=වේගය වැඩි කරන විට කර්සර වේග ඇස්තමේන්තුව සඳහා කාල නියත (මිලිතත්පර). වැඩි riseMs ත්වරණය මෘදු කරයි. පරාසය: 0 - 10000.
settings.ui_camera_orbit_fall_ms=කැමරා කක්ෂගත වැටීමේ කාලය (ms)
settings.ui_camera_orbit_fall_ms.description=වේගය අඩු කරන විට කර්සර වේග ඇස්තමේන්තුව සඳහා කාල නියත (මිලිතත්පර). අඩු fallMs සියුම් පාලනය වඩාත් ඉක්මනින් ප්‍රතිසාධනය කරයි. දෙකම කැමරා අවස්ථිතිය එකතු නොකරයි. පරාසය: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=දාර දර්ශනය ස්ථාවර වීමේ ප්‍රමාදය (ms)
settings.ui_edges_scene_settle_delay_ms.description=ජ්‍යාමිතික/දර්ශන වෙනස්කම්වලට පසු ප්‍රමාදය. වැඩි අගයන් වේගවත් ඉතිහාස නැවත ධාවනයේදී වැඩි වැඩ මර්දනය කරයි. පරාසය: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=දාර කැමරා ස්ථාවර වීමේ ප්‍රමාදය (ms)
settings.ui_edges_camera_settle_delay_ms.description=තිර-අවකාශ සියුම් රේඛා ඝනකම නැවත ගොඩනැගීමට පෙර කැමරා චලනයෙන් පසු ප්‍රමාදය. පරාසය: 0 - 10000.
settings.ui_edges_topology_precision=දාර ස්ථල විද්‍යා නිරවද්‍යතාව
settings.ui_edges_topology_precision.description=විශේෂාංග-දාර ස්ථල විද්‍යාව සාමාන්‍යකරණය කිරීමට භාවිතා කරන ක්වොන්ටීකරණ පියවර. ආකෘති ජ්‍යාමිතිය සහ මුහුණත සාමාන්‍යයන් නොවෙනස්ව පවතී. පරාසය: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=දාර මැහුම් ඉවසීම (mm)
settings.ui_edges_stitch_tolerance.description=දර්ශනයේ මිලිමීටරවල මායිම් මැහුම් ඉවසීම. සුචිගත මෙෂ් යාබදභාවයෙන් පසු එක්-මුහුණක් ලෙස පෙනෙන දාර සඳහා පමණක් භාවිතා වේ. එය වෙනස් ලෙස උප-බෙදා ඇති නමුත් ජ්‍යාමිතිකව සමපාත වන මායිම් ඒවා සැබෑ විශේෂාංග දාර ද යන්න තීරණය කිරීමට පෙර නැවත සම්බන්ධ කිරීමට ඉඩ දෙයි. පරාසය: 0.0 - 1.0.
