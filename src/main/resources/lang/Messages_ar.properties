# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=وضع الإضاءة
settings.ui_lighting_mode.description=احتفظ بوضع إضاءة واحد فقط. 'stable' = أضواء اتجاهية ثابتة في فضاء العالم. لا تدور الإضاءة مع الكاميرا. مصمم لدقة ألوان جيدة وهندسة CAD قابلة للقراءة. 'kevin' = إضاءة BowlerStudio الأصلية. يستخدم ثلاثة أضواء نقطية؛ أحدها يتبع الكاميرا. تُتجاهل إعدادات الإضاءة الثابتة أدناه في هذا الوضع.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=الضوء المحيط
settings.ui_lighting_ambient.description=يؤثر الضوء المحيط على كل سطح مرئي بالتساوي. أعلى: ظلال أكثر سطوعًا، وتبقى الألوان أقرب إلى لونها الأساسي، لكن تبدو الأسطح أكثر تسطحًا. أدنى: تظليل أقوى وفصل أوضح للأسطح، لكن تصبح ألوان الظلال أغمق.
