settings.ui_edges_angle_degrees.description=أدنى زاوية بين الأوجه المتجاورة قبل رسم الحافة المشتركة بينها. القيم الأعلى تنتج عددًا أقل من خطوط الطي. النطاق: 0 - 360.
settings.ui_edges_width_mode=وضع عرض الحافة
settings.ui_edges_width_mode.description=screen = يحافظ على الحد الخارجي ثابتًا تقريبًا بوحدات بكسل الشاشة. الأفضل لمظهر خط رفيع بنمط CAD عند أي مستوى تكبير. world = يستخدم نصف قطر ثابتًا بملليمترات المشهد.
settings.ui_edges_width_px=عرض الحافة بالبكسل
settings.ui_edges_width_px.description=عرض الخط المرئي عندما يكون widthMode=screen. النطاق: 0.1 - 10.0.
settings.ui_edges_radius=نصف قطر الحافة
settings.ui_edges_radius.description=نصف قطر الحافة في فضاء العالم بملليمترات المشهد. يُستخدم فقط عندما يكون widthMode=world. النطاق: 0.001 - 100.0.
settings.ui_edges_brightness=سطوع الحافة
settings.ui_edges_brightness.description=0.0 = أسود، 1.0 = أبيض. النطاق: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=عمق التكبير المرئي للشبكة الصغيرة
settings.ui_grid_small_visible_zoom_depth.description=يتحكم في مدى بقاء شبكة 1 mm مرئية على مسافة بعيدة. قيمة أعلى = تظهر شبكة 1 mm أبكر / على مسافة أبعد. النطاق: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=مضاعف سطوع الشبكة الصغيرة
settings.ui_grid_small_brightness_multiplier.description=يضاعف سطوع RGB مع الحفاظ على صبغة السمة. 1.0 = لون السمة الأصلي. < 1.0 = أغمق. > 1.0 = أكثر سطوعًا. النطاق: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=مضاعف عتامة الشبكة الصغيرة
settings.ui_grid_small_opacity_multiplier.description=يضاعف قيمة ألفا التي توفرها السمة الحالية. 1.0 = دون تغيير. النطاق: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=عرض خط الشبكة الصغيرة (px)
settings.ui_grid_small_line_width_px.description=سُمك خط الشبكة بوحدات بكسل النسيج القديمة للشبكة. القيم التاريخية الحالية هي 2 لـ 1 mm و4 لـ 10 mm. النطاق: 1 - 10.
settings.ui_grid_small_z_offset_mm=إزاحة Z للشبكة الصغيرة (mm)
settings.ui_grid_small_z_offset_mm.description=أبقِ شبكة 1 mm خلف شبكة 10 mm مباشرة لتجنب تشوهات العمق. النطاق: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=مضاعف سطوع الشبكة الرئيسية
settings.ui_grid_major_brightness_multiplier.description=يضاعف سطوع RGB مع الحفاظ على صبغة السمة. 1.0 = لون السمة الأصلي. < 1.0 = أغمق. > 1.0 = أكثر سطوعًا. النطاق: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=مضاعف عتامة الشبكة الرئيسية
settings.ui_grid_major_opacity_multiplier.description=يضاعف قيمة ألفا التي توفرها السمة الحالية. 1.0 = دون تغيير. النطاق: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=عرض خط الشبكة الرئيسية (px)
settings.ui_grid_major_line_width_px.description=سُمك خط الشبكة بوحدات بكسل النسيج القديمة للشبكة. القيم التاريخية الحالية هي 2 لـ 1 mm و4 لـ 10 mm. النطاق: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=وضع حركة الشبكة
settings.ui_grid_motion_mode.description=major = أبقِ شبكة 10 mm الواضحة فقط مرئية أثناء الحركة وأخفِ شبكة 1 mm الكثيفة مؤقتًا. تعود شبكة 1 mm بعد توقف الحركة. all = أبقِ شبكتي الخطوط الواضحتين مرئيتين أثناء الحركة. أفضل استمرارية بصرية، لكن قد تكون أكثر تكلفة. texture = السلوك الأصلي: استبدل هندسة الخطوط بمربعات شبكة ذات نسيج أثناء الحركة. أسرع، لكنه قد يُنتج التسنن / أنماط تمويج. hidden = أخفِ خطوط الشبكة أثناء الحركة وأعدها عند توقف الكاميرا.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=عتامة عرض الأرضية
settings.ui_grid_ground_render_opacity.description=عتامة تعبئة الأرضية الرئيسية. تبقى التعبئة في مكانها عند كل مستوى تكبير؛ فقط شبكة 1 mm الكثيفة تتأثر بالتكبير. اضبطها على 0 لإخفاء التعبئة مع إبقاء سطح الالتقاط نشطًا. تتجاهل مستويات العمل المخصصة هذا الإعداد. النطاق: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=حساسية دوران الكاميرا الدنيا
settings.ui_camera_orbit_min.description=حساسية الدوران بالدرجات لكل وحدة إحداثيات فأرة في JavaFX. يتحكم min في السحب البطيء جدًا. النطاق: 0.0 - 1.0.
settings.ui_camera_orbit_max=حساسية دوران الكاميرا القصوى
settings.ui_camera_orbit_max.description=حساسية الدوران بالدرجات لكل وحدة إحداثيات فأرة في JavaFX. max حد أعلى للسحب السريع. النطاق: 0.0 - 1.0.
settings.ui_camera_orbit_half=سرعة نصف دوران الكاميرا
settings.ui_camera_orbit_half.description=سرعة المؤشر المفلترة بوحدات إحداثيات JavaFX في الثانية التي تكون عندها الحساسية في منتصف الطريق بين min و max. أعلى = تسارع ألطف. النطاق: 0 - 10000.
settings.ui_camera_orbit_rise_ms=زمن صعود دوران الكاميرا (ms)
settings.ui_camera_orbit_rise_ms.description=ثوابت زمنية (بالمللي ثانية) لتقدير سرعة المؤشر عند التسارع. ارتفاع riseMs يلطف التسارع. النطاق: 0 - 10000.
settings.ui_camera_orbit_fall_ms=زمن هبوط دوران الكاميرا (ms)
settings.ui_camera_orbit_fall_ms.description=ثوابت زمنية (بالمللي ثانية) لتقدير سرعة المؤشر عند التباطؤ. انخفاض fallMs يعيد التحكم الدقيق أسرع. لا يضيف أي منهما عطالة إلى الكاميرا. النطاق: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=تأخير استقرار حواف المشهد (ms)
settings.ui_edges_scene_settle_delay_ms.description=تأخير بعد تغييرات الهندسة/العرض. القيم الأعلى تكبح مزيدًا من العمل أثناء إعادة تشغيل السجل السريعة. النطاق: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=تأخير استقرار حواف الكاميرا (ms)
settings.ui_edges_camera_settle_delay_ms.description=تأخير بعد حركة الكاميرا قبل إعادة بناء سُمك الخط الرفيع في فضاء الشاشة. النطاق: 0 - 10000.
settings.ui_edges_topology_precision=دقة طوبولوجيا الحواف
settings.ui_edges_topology_precision.description=خطوة تكميم تُستخدم لتطبيع طوبولوجيا حواف الميزات. تبقى هندسة النموذج والمتجهات الطبيعية للأوجه دون تغيير. النطاق: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=تفاوت ربط الحواف (mm)
settings.ui_edges_stitch_tolerance.description=تفاوت ربط الحدود بملليمترات المشهد. يُستخدم فقط للحواف التي تبدو ذات وجه واحد بعد تجاور الشبكة المفهرسة. يسمح بإعادة ربط الحدود المتطابقة هندسيًا رغم تقسيمها المختلف قبل تحديد ما إذا كانت حواف ميزات حقيقية. النطاق: 0.0 - 1.0.
