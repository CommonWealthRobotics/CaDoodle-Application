# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=ఇంటర్ఫేస్ అంశాలు
settings.ui_section_lighting=లైటింగ్
settings.ui_section_edges=ఫీచర్ అంచులు
settings.ui_section_grid=వర్క్‌ప్లేన్ గ్రిడ్
settings.ui_section_camera=కెమెరా ఆర్బిట్
settings.ui_section_timing=ఫీచర్ అంచు సమయం
settings.ui_description=scene-style.properties నుండి తీసుకున్న వివరణ. విలువ ConfigurationDatabase లో సేవ్ చేయబడుతుంది.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=లైటింగ్ మోడ్
settings.ui_lighting_mode.description=సరిగ్గా ఒక లైటింగ్ మోడ్ ఉంచండి. 'stable' = స్థిర ప్రపంచ-స్థల దిశాత్మక కాంతులు. లైటింగ్ కెమెరాతో తిరగదు. మంచి రంగ విశ్వసనీయత మరియు చదవగల CAD జ్యామితి కోసం రూపొందించబడింది. 'kevin' = అసలు BowlerStudio లైటింగ్. మూడు పాయింట్ కాంతులను ఉపయోగిస్తుంది; ఒకటి కెమెరాను అనుసరిస్తుంది. ఈ మోడ్‌లో క్రింది స్థిర-కాంతి సెట్టింగ్‌లు విస్మరించబడతాయి.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=పరిసర కాంతి
settings.ui_lighting_ambient.description=పరిసర కాంతి ప్రతి కనిపించే ఉపరితలాన్ని సమానంగా ప్రభావితం చేస్తుంది. ఎక్కువ: ప్రకాశవంతమైన నీడలు, రంగులు తమ మూల రంగుకు దగ్గరగా ఉంటాయి, కానీ ఉపరితలాలు చదునుగా కనిపిస్తాయి. తక్కువ: బలమైన షేడింగ్ మరియు ఉపరితలాల మధ్య ఎక్కువ వేర్పాటు, కానీ నీడ ఉన్న రంగులు చీకటిగా మారుతాయి.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=ప్రధాన కాంతి ప్రారంభించబడింది
settings.ui_lighting_key_enabled.description=వస్తువు ఆకృతిని వివరించడానికి ఉపయోగించే ప్రధాన కాంతి. ఈ కాంతిని పూర్తిగా తీసివేయడానికి enabled=false సెట్ చేయండి.
settings.ui_lighting_key_intensity=ప్రధాన కాంతి తీవ్రత
settings.ui_lighting_key_intensity.description=ప్రధాన కాంతి తీవ్రత. పరిధి: 0.0 - 1.0.
settings.ui_lighting_key_x=ప్రధాన కాంతి X
settings.ui_lighting_key_x.description=ప్రపంచ నిర్దేశాంకాలలో ప్రధాన కాంతి దిశ. పరిధి: -1.0 - 1.0.
settings.ui_lighting_key_y=ప్రధాన కాంతి Y
settings.ui_lighting_key_y.description=ప్రపంచ నిర్దేశాంకాలలో ప్రధాన కాంతి దిశ. పరిధి: -1.0 - 1.0.
settings.ui_lighting_key_z=ప్రధాన కాంతి Z
settings.ui_lighting_key_z.description=ప్రపంచ నిర్దేశాంకాలలో ప్రధాన కాంతి దిశ. పరిధి: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=ఫిల్ కాంతి ప్రారంభించబడింది
settings.ui_lighting_fill_enabled.description=ప్రధాన కాంతి సృష్టించిన నీడ వైపును మృదువుగా చేస్తుంది. ఈ కాంతిని పూర్తిగా తీసివేయడానికి enabled=false సెట్ చేయండి.
settings.ui_lighting_fill_intensity=ఫిల్ కాంతి తీవ్రత
settings.ui_lighting_fill_intensity.description=ఎక్కువ తీవ్రత: మంచి రంగ విశ్వసనీయత, మృదువైన షేడింగ్. తక్కువ తీవ్రత: వేర్వేరు దిశల ముఖాల మధ్య బలమైన భేదం. పరిధి: 0.0 - 1.0.
settings.ui_lighting_fill_x=ఫిల్ కాంతి X
settings.ui_lighting_fill_x.description=ప్రపంచ నిర్దేశాంకాలలో ఫిల్ కాంతి దిశ. పరిధి: -1.0 - 1.0.
settings.ui_lighting_fill_y=ఫిల్ కాంతి Y
settings.ui_lighting_fill_y.description=ప్రపంచ నిర్దేశాంకాలలో ఫిల్ కాంతి దిశ. పరిధి: -1.0 - 1.0.
settings.ui_lighting_fill_z=ఫిల్ కాంతి Z
settings.ui_lighting_fill_z.description=ప్రపంచ నిర్దేశాంకాలలో ఫిల్ కాంతి దిశ. పరిధి: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=రిమ్ కాంతి ప్రారంభించబడింది
settings.ui_lighting_rim_enabled.description=కొన్ని ఉపరితలాలను వేరు చేయడానికి సహాయపడే బలహీనమైన ద్వితీయ కాంతి. ఇది సాధారణంగా సూక్ష్మంగా ఉండాలి. ఈ కాంతిని పూర్తిగా తీసివేయడానికి enabled=false సెట్ చేయండి.
settings.ui_lighting_rim_intensity=రిమ్ కాంతి తీవ్రత
settings.ui_lighting_rim_intensity.description=కొన్ని ఉపరితలాలను వేరు చేయడానికి సహాయపడే బలహీనమైన ద్వితీయ కాంతి. ఇది సాధారణంగా సూక్ష్మంగా ఉండాలి. పరిధి: 0.0 - 1.0.
settings.ui_lighting_rim_x=రిమ్ కాంతి X
settings.ui_lighting_rim_x.description=ప్రపంచ నిర్దేశాంకాలలో రిమ్ కాంతి దిశ. పరిధి: -1.0 - 1.0.
settings.ui_lighting_rim_y=రిమ్ కాంతి Y
settings.ui_lighting_rim_y.description=ప్రపంచ నిర్దేశాంకాలలో రిమ్ కాంతి దిశ. పరిధి: -1.0 - 1.0.
settings.ui_lighting_rim_z=రిమ్ కాంతి Z
settings.ui_lighting_rim_z.description=ప్రపంచ నిర్దేశాంకాలలో రిమ్ కాంతి దిశ. పరిధి: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=ఫీచర్ అంచులు ప్రారంభించబడింది
settings.ui_edges_enabled.description=CSG వస్తువుల నిజమైన పదునైన అంచుల వెంట చీకటి జ్యామితిని గీయండి. సమతల బహుభుజి సరిహద్దులు విస్మరించబడతాయి. అంచులను పూర్తిగా తీసివేయడానికి enabled=false సెట్ చేయండి.
settings.ui_edges_angle_degrees=అంచు కోణం (డిగ్రీలు)
settings.ui_edges_angle_degrees.description=పొరుగు ముఖాల మధ్య కనీస కోణం, దాని తర్వాత వాటి ఉమ్మడి అంచు గీయబడుతుంది. ఎక్కువ విలువలు తక్కువ మడత గీతలను ఉత్పత్తి చేస్తాయి. పరిధి: 0 - 360.
settings.ui_edges_width_mode=అంచు వెడల్పు మోడ్
settings.ui_edges_width_mode.description=screen = బాహ్యరేఖను స్క్రీన్ పిక్సెల్‌లలో సుమారుగా స్థిరంగా ఉంచుతుంది. ఏదైనా జూమ్ స్థాయిలో CAD-శైలి సన్నని గీత రూపానికి ఉత్తమం. world = దృశ్య మిల్లీమీటర్లలో స్థిర వ్యాసార్థాన్ని ఉపయోగిస్తుంది.
settings.ui_edges_width_px=అంచు వెడల్పు పిక్సెల్‌లు
settings.ui_edges_width_px.description=widthMode=screen ఉన్నప్పుడు కనిపించే గీత వెడల్పు. పరిధి: 0.1 - 10.0.
settings.ui_edges_radius=అంచు వ్యాసార్థం
settings.ui_edges_radius.description=దృశ్య మిల్లీమీటర్లలో ప్రపంచ-స్థల అంచు వ్యాసార్థం. widthMode=world ఉన్నప్పుడు మాత్రమే ఉపయోగించబడుతుంది. పరిధి: 0.001 - 100.0.
settings.ui_edges_brightness=అంచు ప్రకాశం
settings.ui_edges_brightness.description=0.0 = నలుపు, 1.0 = తెలుపు. పరిధి: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=చిన్న గ్రిడ్ కనిపించే జూమ్ లోతు
settings.ui_grid_small_visible_zoom_depth.description=1 mm గ్రిడ్ ఎంత దూరం వరకు కనిపిస్తుందో నియంత్రిస్తుంది. ఎక్కువ విలువ = 1 mm గ్రిడ్ ముందుగా / ఎక్కువ దూరం నుండి కనిపిస్తుంది. పరిధి: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=చిన్న గ్రిడ్ ప్రకాశ గుణకం
settings.ui_grid_small_brightness_multiplier.description=థీమ్ వర్ణవైవిధ్యాన్ని కాపాడుతూ RGB ప్రకాశాన్ని గుణిస్తుంది. 1.0 = అసలు థీమ్ రంగు. < 1.0 = చీకటిగా. > 1.0 = ప్రకాశవంతంగా. పరిధి: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=చిన్న గ్రిడ్ అపారదర్శకత గుణకం
settings.ui_grid_small_opacity_multiplier.description=ప్రస్తుత థీమ్ అందించే ఆల్ఫాను గుణిస్తుంది. 1.0 = మారలేదు. పరిధి: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=చిన్న గ్రిడ్ గీత వెడల్పు (px)
settings.ui_grid_small_line_width_px.description=గ్రిడ్ యొక్క లెగసీ టెక్స్చర్-పిక్సెల్ యూనిట్లలో గ్రిడ్ గీత మందం. ప్రస్తుత చారిత్రక విలువలు 1 mm కి 2 మరియు 10 mm కి 4. పరిధి: 1 - 10.
settings.ui_grid_small_z_offset_mm=చిన్న గ్రిడ్ Z ఆఫ్‌సెట్ (mm)
settings.ui_grid_small_z_offset_mm.description=లోతు లోపాలను నివారించడానికి 1 mm గ్రిడ్‌ను 10 mm గ్రిడ్ కి సరిగ్గా వెనుక ఉంచండి. పరిధి: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=ప్రధాన గ్రిడ్ ప్రకాశ గుణకం
settings.ui_grid_major_brightness_multiplier.description=థీమ్ వర్ణవైవిధ్యాన్ని కాపాడుతూ RGB ప్రకాశాన్ని గుణిస్తుంది. 1.0 = అసలు థీమ్ రంగు. < 1.0 = చీకటిగా. > 1.0 = ప్రకాశవంతంగా. పరిధి: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=ప్రధాన గ్రిడ్ అపారదర్శకత గుణకం
settings.ui_grid_major_opacity_multiplier.description=ప్రస్తుత థీమ్ అందించే ఆల్ఫాను గుణిస్తుంది. 1.0 = మారలేదు. పరిధి: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=ప్రధాన గ్రిడ్ గీత వెడల్పు (px)
settings.ui_grid_major_line_width_px.description=గ్రిడ్ యొక్క లెగసీ టెక్స్చర్-పిక్సెల్ యూనిట్లలో గ్రిడ్ గీత మందం. ప్రస్తుత చారిత్రక విలువలు 1 mm కి 2 మరియు 10 mm కి 4. పరిధి: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=గ్రిడ్ చలన మోడ్
settings.ui_grid_motion_mode.description=major = కదలిక సమయంలో స్పష్టమైన 10 mm గ్రిడ్ మాత్రమే కనిపించేలా ఉంచి దట్టమైన 1 mm గ్రిడ్‌ను తాత్కాలికంగా దాచండి. కదలిక ఆగిన తర్వాత 1 mm గ్రిడ్ తిరిగి వస్తుంది. all = కదలిక సమయంలో రెండు స్పష్టమైన గీత గ్రిడ్‌లను కనిపించేలా ఉంచండి. ఉత్తమ దృశ్య నిరంతరత, కానీ ఎక్కువ ఖర్చుతో కూడుకున్నది కావచ్చు. texture = అసలు ప్రవర్తన: కదలిక సమయంలో గీత జ్యామితికి బదులు టెక్స్చర్ గ్రిడ్ చతుర్భుజాలను ఉపయోగించండి. వేగంగా, కానీ ఏలియాసింగ్ / మోయిరే నమూనాలను ఉత్పత్తి చేయవచ్చు. hidden = కదలిక సమయంలో గ్రిడ్ గీతలను దాచి కెమెరా ఆగినప్పుడు వాటిని పునరుద్ధరించండి.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=నేల రెండర్ అపారదర్శకత
settings.ui_grid_ground_render_opacity.description=ప్రధాన నేల నింపు అపారదర్శకత. నింపు ప్రతి జూమ్ స్థాయిలో తన స్థానంలో ఉంటుంది; దట్టమైన 1 mm గ్రిడ్ మాత్రమే జూమ్‌పై ఆధారపడి ఉంటుంది. నింపును దాచి దాని ఎంపిక ఉపరితలాన్ని యాక్టివ్‌గా ఉంచడానికి 0 సెట్ చేయండి. అనుకూల వర్క్‌ప్లేన్‌లు ఈ సెట్టింగ్‌ను విస్మరిస్తాయి. పరిధి: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=కెమెరా ఆర్బిట్ కనీస సున్నితత్వం
settings.ui_camera_orbit_min.description=JavaFX మౌస్-నిర్దేశాంక యూనిట్‌కు డిగ్రీలలో భ్రమణ సున్నితత్వం. min చాలా నెమ్మదైన లాగడాలను నియంత్రిస్తుంది. పరిధి: 0.0 - 1.0.
settings.ui_camera_orbit_max=కెమెరా ఆర్బిట్ గరిష్ఠ సున్నితత్వం
settings.ui_camera_orbit_max.description=JavaFX మౌస్-నిర్దేశాంక యూనిట్‌కు డిగ్రీలలో భ్రమణ సున్నితత్వం. max వేగవంతమైన లాగడాలకు ఎగువ పరిమితి. పరిధి: 0.0 - 1.0.
settings.ui_camera_orbit_half=కెమెరా ఆర్బిట్ సగం వేగం
settings.ui_camera_orbit_half.description=ఫిల్టర్ చేసిన కర్సర్ వేగం (JavaFX నిర్దేశాంక యూనిట్‌లు సెకనుకు); దీనిలో సున్నితత్వం min మరియు max మధ్య సగంగా ఉంటుంది. ఎక్కువ = మృదువైన త్వరణం. పరిధి: 0 - 10000.
settings.ui_camera_orbit_rise_ms=కెమెరా ఆర్బిట్ రైజ్ సమయం (ms)
settings.ui_camera_orbit_rise_ms.description=వేగాన్ని పెంచేటప్పుడు కర్సర్-వేగ అంచనా కోసం సమయ స్థిరాంకాలు (మిల్లీసెకన్లు). ఎక్కువ riseMs త్వరణాన్ని మృదువుగా చేస్తుంది. పరిధి: 0 - 10000.
settings.ui_camera_orbit_fall_ms=కెమెరా ఆర్బిట్ ఫాల్ సమయం (ms)
settings.ui_camera_orbit_fall_ms.description=వేగాన్ని తగ్గించేటప్పుడు కర్సర్-వేగ అంచనా కోసం సమయ స్థిరాంకాలు (మిల్లీసెకన్లు). తక్కువ fallMs సూక్ష్మ నియంత్రణను త్వరగా పునరుద్ధరిస్తుంది. ఇవి ఏవీ కెమెరా జడత్వాన్ని జోడించవు. పరిధి: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=అంచు దృశ్య స్థిరత్వ ఆలస్యం (ms)
settings.ui_edges_scene_settle_delay_ms.description=జ్యామితి/ప్రదర్శన మార్పుల తర్వాత ఆలస్యం. ఎక్కువ విలువలు వేగవంతమైన చరిత్ర రీప్లే సమయంలో ఎక్కువ పనిని అణచివేస్తాయి. పరిధి: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=అంచు కెమెరా స్థిరత్వ ఆలస్యం (ms)
settings.ui_edges_camera_settle_delay_ms.description=కెమెరా కదలిక తర్వాత ఆలస్యం, దాని తర్వాత స్క్రీన్-స్థల సన్నని గీత మందం తిరిగి నిర్మించబడుతుంది. పరిధి: 0 - 10000.
settings.ui_edges_topology_precision=అంచు టోపాలజీ ఖచ్చితత్వం
settings.ui_edges_topology_precision.description=ఫీచర్-అంచు టోపాలజీని సాధారణీకరించడానికి ఉపయోగించే క్వాంటీకరణ దశ. మోడల్ జ్యామితి మరియు ముఖ సాధారణాలు మారవు. పరిధి: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=అంచు కుట్టు సహనం (mm)
settings.ui_edges_stitch_tolerance.description=దృశ్య మిల్లీమీటర్లలో సరిహద్దు కుట్టు సహనం. ఇండెక్స్డ్-మెష్ సామీప్యం తర్వాత కనిపించే ఏక-ముఖ అంచులకు మాత్రమే ఉపయోగించబడుతుంది. ఇది వేర్వేరుగా ఉపవిభజించబడినా జ్యామితిగా ఏకీభవించే సరిహద్దులను తిరిగి కలపడానికి అనుమతిస్తుంది, అవి నిజమైన ఫీచర్ అంచులు అని నిర్ణయించే ముందు. పరిధి: 0.0 - 1.0.
