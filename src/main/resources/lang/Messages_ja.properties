# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=UI 要素
settings.ui_section_lighting=ライティング
settings.ui_section_edges=フィーチャエッジ
settings.ui_section_grid=作業面グリッド
settings.ui_section_camera=カメラオービット
settings.ui_section_timing=フィーチャエッジのタイミング
settings.ui_description=scene-style.properties から取得した説明。値は ConfigurationDatabase に保存されます。

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=ライティングモード
settings.ui_lighting_mode.description=ライティングモードをちょうど一つだけ保持します。 'stable' = ワールド空間に固定された指向性ライト。ライティングはカメラとともに回転しません。良好な色忠実度と読みやすい CAD ジオメトリのために設計されています。 'kevin' = 元の BowlerStudio ライティング。三つのポイントライトを使用し、そのうち一つがカメラに追従します。このモードでは以下の安定ライト設定は無視されます。
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=環境光
settings.ui_lighting_ambient.description=環境光はすべての可視表面に均等に影響します。高くすると、影が明るくなり、色は基本色に近づきますが、表面は平坦に見えます。低くすると、シェーディングと表面の分離が強まりますが、影の色は暗くなります。
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=キーライト有効
settings.ui_lighting_key_enabled.description=オブジェクトの形状を表現するメインライト。 enabled=false に設定するとこのライトを完全に削除します。
settings.ui_lighting_key_intensity=キーライト強度
settings.ui_lighting_key_intensity.description=キーライトの強度。範囲: 0.0 - 1.0。
settings.ui_lighting_key_x=キーライト X
settings.ui_lighting_key_x.description=ワールド座標でのキーライトの方向。範囲: -1.0 - 1.0。
settings.ui_lighting_key_y=キーライト Y
settings.ui_lighting_key_y.description=ワールド座標でのキーライトの方向。範囲: -1.0 - 1.0。
settings.ui_lighting_key_z=キーライト Z
settings.ui_lighting_key_z.description=ワールド座標でのキーライトの方向。範囲: -1.0 - 1.0。
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=フィルライト有効
settings.ui_lighting_fill_enabled.description=キーライトが作る影側を和らげます。 enabled=false に設定するとこのライトを完全に削除します。
settings.ui_lighting_fill_intensity=フィルライト強度
settings.ui_lighting_fill_intensity.description=強度を高くすると色忠実度が向上し、シェーディングが柔らかくなります。強度を低くすると、向きの異なる面間の差が強まります。範囲: 0.0 - 1.0。
settings.ui_lighting_fill_x=フィルライト X
settings.ui_lighting_fill_x.description=ワールド座標でのフィルライトの方向。範囲: -1.0 - 1.0。
settings.ui_lighting_fill_y=フィルライト Y
settings.ui_lighting_fill_y.description=ワールド座標でのフィルライトの方向。範囲: -1.0 - 1.0。
settings.ui_lighting_fill_z=フィルライト Z
settings.ui_lighting_fill_z.description=ワールド座標でのフィルライトの方向。範囲: -1.0 - 1.0。
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=リムライト有効
settings.ui_lighting_rim_enabled.description=一部の表面を分離するのに役立つ弱い補助ライト。通常は控えめに保つべきです。 enabled=false に設定するとこのライトを完全に削除します。
settings.ui_lighting_rim_intensity=リムライト強度
settings.ui_lighting_rim_intensity.description=一部の表面を分離するのに役立つ弱い補助ライト。通常は控えめに保つべきです。範囲: 0.0 - 1.0。
settings.ui_lighting_rim_x=リムライト X
settings.ui_lighting_rim_x.description=ワールド座標でのリムライトの方向。範囲: -1.0 - 1.0。
settings.ui_lighting_rim_y=リムライト Y
settings.ui_lighting_rim_y.description=ワールド座標でのリムライトの方向。範囲: -1.0 - 1.0。
settings.ui_lighting_rim_z=リムライト Z
settings.ui_lighting_rim_z.description=ワールド座標でのリムライトの方向。範囲: -1.0 - 1.0。
# ---------------- edges ----------------
settings.ui_edges_enabled=フィーチャエッジ有効
settings.ui_edges_enabled.description=CSG オブジェクトの実際の鋭いエッジに沿って暗いジオメトリを描画します。同一平面上のポリゴン境界は無視されます。 enabled=false に設定するとエッジを完全に削除します。
settings.ui_edges_angle_degrees=エッジ角度 (度)
settings.ui_edges_angle_degrees.description=隣接する面の共有エッジが描画される前の最小角度。値を大きくすると折れ線が減ります。範囲: 0 - 360。
settings.ui_edges_width_mode=エッジ幅モード
settings.ui_edges_width_mode.description=screen = 輪郭をスクリーンピクセルでほぼ一定に保ちます。どのズームレベルでも CAD 風のヘアライン表示に最適です。 world = シーンのミリメートル単位で固定の半径を使用します。
settings.ui_edges_width_px=エッジ幅 (px)
settings.ui_edges_width_px.description=widthMode=screen の場合の表示線幅。範囲: 0.1 - 10.0。
settings.ui_edges_radius=エッジ半径
settings.ui_edges_radius.description=シーンのミリメートル単位のワールド空間エッジ半径。 widthMode=world の場合のみ使用されます。範囲: 0.001 - 100.0。
settings.ui_edges_brightness=エッジの明るさ
settings.ui_edges_brightness.description=0.0 = 黒、1.0 = 白。範囲: 0.0 - 1.0。
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=小グリッド表示ズーム深度
settings.ui_grid_small_visible_zoom_depth.description=1 mm グリッドが見え続ける距離を制御します。値が大きいほど = 1 mm グリッドが早く / 遠くに表示されます。範囲: 1 - 10000。
settings.ui_grid_small_brightness_multiplier=小グリッドの明るさ倍率
settings.ui_grid_small_brightness_multiplier.description=テーマの色相を保ちながら RGB の明るさを乗算します。1.0 = 元のテーマ色。< 1.0 = 暗く。> 1.0 = 明るく。範囲: 0.0 - 3.0。
settings.ui_grid_small_opacity_multiplier=小グリッドの不透明度倍率
settings.ui_grid_small_opacity_multiplier.description=現在のテーマが提供するアルファを乗算します。1.0 = 変更なし。範囲: 0.0 - 1.0。
settings.ui_grid_small_line_width_px=小グリッド線幅 (px)
settings.ui_grid_small_line_width_px.description=グリッドの従来のテクスチャピクセル単位でのグリッド線の太さ。現在の履歴値は 1 mm で 2、10 mm で 4 です。範囲: 1 - 10。
settings.ui_grid_small_z_offset_mm=小グリッド Z オフセット (mm)
settings.ui_grid_small_z_offset_mm.description=深度アーティファクトを避けるため、1 mm グリッドを 10 mm グリッドのすぐ後ろに保ちます。範囲: -1.0 - 1.0。
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=大グリッドの明るさ倍率
settings.ui_grid_major_brightness_multiplier.description=テーマの色相を保ちながら RGB の明るさを乗算します。1.0 = 元のテーマ色。< 1.0 = 暗く。> 1.0 = 明るく。範囲: 0.0 - 3.0。
settings.ui_grid_major_opacity_multiplier=大グリッドの不透明度倍率
settings.ui_grid_major_opacity_multiplier.description=現在のテーマが提供するアルファを乗算します。1.0 = 変更なし。範囲: 0.0 - 1.0。
settings.ui_grid_major_line_width_px=大グリッド線幅 (px)
settings.ui_grid_major_line_width_px.description=グリッドの従来のテクスチャピクセル単位でのグリッド線の太さ。現在の履歴値は 1 mm で 2、10 mm で 4 です。範囲: 1 - 10。
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=グリッド動作モード
settings.ui_grid_motion_mode.description=major = 移動中は鮮明な 10 mm グリッドのみを表示し、密な 1 mm グリッドを一時的に隠します。移動が止まると 1 mm グリッドが戻ります。 all = 移動中も両方の鮮明な線グリッドを表示します。視覚的な連続性は最高ですが、コストが高くなる可能性があります。 texture = 元の動作: 移動中に線ジオメトリをテクスチャ付きグリッドクワッドに置き換えます。高速ですが、エイリアシング / モアレ模様が発生する可能性があります。 hidden = 移動中はグリッド線を隠し、カメラが停止したら復元します。
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=地面レンダリングの不透明度
settings.ui_grid_ground_render_opacity.description=メインの地面塗りつぶしの不透明度。塗りつぶしはどのズームレベルでもその場に留まり、密な 1 mm グリッドのみがズームによって制御されます。0 に設定すると、ピッキングサーフェスを有効に保ったまま塗りつぶしを隠します。カスタム作業面はこの設定を無視します。範囲: 0.0 - 1.0。
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=カメラオービット最小感度
settings.ui_camera_orbit_min.description=JavaFX マウス座標単位あたりの度での回転感度。min は非常に遅いドラッグを制御します。範囲: 0.0 - 1.0。
settings.ui_camera_orbit_max=カメラオービット最大感度
settings.ui_camera_orbit_max.description=JavaFX マウス座標単位あたりの度での回転感度。max は高速ドラッグの上限です。範囲: 0.0 - 1.0。
settings.ui_camera_orbit_half=カメラオービット半速
settings.ui_camera_orbit_half.description=感度が min と max の中間になる、毎秒の JavaFX 座標単位で表したフィルタ済みカーソル速度。値が大きいほど = 加速が穏やかになります。範囲: 0 - 10000。
settings.ui_camera_orbit_rise_ms=カメラオービット立ち上がり時間 (ms)
settings.ui_camera_orbit_rise_ms.description=加速時のカーソル速度推定に使用する時定数 (ミリ秒)。 riseMs を大きくすると加速が柔らかくなります。範囲: 0 - 10000。
settings.ui_camera_orbit_fall_ms=カメラオービット下降時間 (ms)
settings.ui_camera_orbit_fall_ms.description=減速時のカーソル速度推定に使用する時定数 (ミリ秒)。 fallMs を小さくすると微調整が早く戻ります。どちらもカメラの慣性を追加しません。範囲: 0 - 10000。
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=エッジシーン安定遅延 (ms)
settings.ui_edges_scene_settle_delay_ms.description=ジオメトリ / 表示の変更後の遅延。値が大きいほど、高速な履歴再生中の処理をより抑えます。範囲: 0 - 10000。
settings.ui_edges_camera_settle_delay_ms=エッジカメラ安定遅延 (ms)
settings.ui_edges_camera_settle_delay_ms.description=カメラ移動後、スクリーン空間のヘアライン太さが再構築されるまでの遅延。範囲: 0 - 10000。
settings.ui_edges_topology_precision=エッジトポロジ精度
settings.ui_edges_topology_precision.description=フィーチャエッジのトポロジを正規化するために使用される量子化ステップ。モデルのジオメトリと面法線は変更されません。範囲: 0.0 - 1.0。
settings.ui_edges_stitch_tolerance=エッジスティッチ許容値 (mm)
settings.ui_edges_stitch_tolerance.description=シーンのミリメートル単位の境界スティッチ許容値。インデックス付きメッシュの隣接関係の後で、見かけ上単一の面のエッジにのみ使用されます。分割が異なるが幾何学的に一致する境界を、実際のフィーチャエッジかどうかを判断する前に再接続できるようにします。範囲: 0.0 - 1.0。
