# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Thành phần UI
settings.ui_section_lighting=Ánh sáng
settings.ui_section_edges=Cạnh đặc trưng
settings.ui_section_grid=Lưới mặt phẳng làm việc
settings.ui_section_camera=Quỹ đạo camera
settings.ui_section_timing=Thời gian cạnh đặc trưng
settings.ui_description=Mô tả lấy từ scene-style.properties. Giá trị được lưu vào ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Chế độ ánh sáng
settings.ui_lighting_mode.description=Chỉ giữ đúng một chế độ ánh sáng. 'stable' = Đèn định hướng cố định trong không gian thế giới. Ánh sáng không xoay cùng camera. Được thiết kế để có độ trung thực màu tốt và hình học CAD dễ đọc. 'kevin' = Ánh sáng BowlerStudio gốc. Dùng ba đèn điểm; một đèn đi theo camera. Các thiết lập đèn ổn định bên dưới bị bỏ qua trong chế độ này.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Ánh sáng môi trường
settings.ui_lighting_ambient.description=Ánh sáng môi trường ảnh hưởng đều lên mọi bề mặt nhìn thấy. Cao hơn: bóng sáng hơn, màu sát với màu gốc hơn, nhưng bề mặt trông phẳng hơn. Thấp hơn: đổ bóng và tách bề mặt mạnh hơn, nhưng màu trong vùng bóng tối hơn.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Bật đèn chính
settings.ui_lighting_key_enabled.description=Đèn chính dùng để mô tả hình dạng của vật thể. Đặt enabled=false để loại bỏ hoàn toàn đèn này.
settings.ui_lighting_key_intensity=Cường độ đèn chính
settings.ui_lighting_key_intensity.description=Cường độ của đèn chính. Phạm vi: 0.0 - 1.0.
settings.ui_lighting_key_x=Đèn chính X
settings.ui_lighting_key_x.description=Hướng của đèn chính trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
settings.ui_lighting_key_y=Đèn chính Y
settings.ui_lighting_key_y.description=Hướng của đèn chính trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
settings.ui_lighting_key_z=Đèn chính Z
settings.ui_lighting_key_z.description=Hướng của đèn chính trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Bật đèn phụ
settings.ui_lighting_fill_enabled.description=Làm dịu phía bóng do đèn chính tạo ra. Đặt enabled=false để loại bỏ hoàn toàn đèn này.
settings.ui_lighting_fill_intensity=Cường độ đèn phụ
settings.ui_lighting_fill_intensity.description=Cường độ cao hơn: độ trung thực màu tốt hơn, đổ bóng mềm hơn. Cường độ thấp hơn: khác biệt giữa các mặt có hướng khác nhau mạnh hơn. Phạm vi: 0.0 - 1.0.
settings.ui_lighting_fill_x=Đèn phụ X
settings.ui_lighting_fill_x.description=Hướng của đèn phụ trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
settings.ui_lighting_fill_y=Đèn phụ Y
settings.ui_lighting_fill_y.description=Hướng của đèn phụ trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
settings.ui_lighting_fill_z=Đèn phụ Z
settings.ui_lighting_fill_z.description=Hướng của đèn phụ trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Bật đèn viền
settings.ui_lighting_rim_enabled.description=Đèn phụ yếu giúp tách một số bề mặt. Bình thường nên giữ ở mức tinh tế. Đặt enabled=false để loại bỏ hoàn toàn đèn này.
settings.ui_lighting_rim_intensity=Cường độ đèn viền
settings.ui_lighting_rim_intensity.description=Đèn phụ yếu giúp tách một số bề mặt. Bình thường nên giữ ở mức tinh tế. Phạm vi: 0.0 - 1.0.
settings.ui_lighting_rim_x=Đèn viền X
settings.ui_lighting_rim_x.description=Hướng của đèn viền trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
settings.ui_lighting_rim_y=Đèn viền Y
settings.ui_lighting_rim_y.description=Hướng của đèn viền trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
settings.ui_lighting_rim_z=Đèn viền Z
settings.ui_lighting_rim_z.description=Hướng của đèn viền trong tọa độ thế giới. Phạm vi: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Bật cạnh đặc trưng
settings.ui_edges_enabled.description=Vẽ hình học tối dọc theo các cạnh sắc thực của đối tượng CSG. Ranh giới đa giác đồng phẳng bị bỏ qua. Đặt enabled=false để loại bỏ hoàn toàn các cạnh.
settings.ui_edges_angle_degrees=Góc cạnh (độ)
settings.ui_edges_angle_degrees.description=Góc tối thiểu giữa các mặt kề nhau trước khi cạnh chung của chúng được vẽ. Giá trị cao hơn tạo ra ít đường gấp hơn. Phạm vi: 0 - 360.
settings.ui_edges_width_mode=Chế độ độ rộng cạnh
settings.ui_edges_width_mode.description=screen = Giữ đường viền gần như không đổi theo pixel màn hình. Phù hợp nhất cho vẻ ngoài nét mảnh kiểu CAD ở mọi mức thu phóng. world = Dùng bán kính cố định theo milimét của cảnh.
settings.ui_edges_width_px=Độ rộng cạnh (px)
settings.ui_edges_width_px.description=Độ rộng nét nhìn thấy khi widthMode=screen. Phạm vi: 0.1 - 10.0.
settings.ui_edges_radius=Bán kính cạnh
settings.ui_edges_radius.description=Bán kính cạnh trong không gian thế giới theo milimét của cảnh. Chỉ dùng khi widthMode=world. Phạm vi: 0.001 - 100.0.
settings.ui_edges_brightness=Độ sáng cạnh
settings.ui_edges_brightness.description=0.0 = đen, 1.0 = trắng. Phạm vi: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Độ sâu thu phóng hiển thị lưới nhỏ
settings.ui_grid_small_visible_zoom_depth.description=Điều khiển khoảng cách mà lưới 1 mm còn hiển thị. Giá trị cao hơn = lưới 1 mm xuất hiện sớm hơn / xa hơn. Phạm vi: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Hệ số độ sáng lưới nhỏ
settings.ui_grid_small_brightness_multiplier.description=Nhân độ sáng RGB trong khi giữ nguyên sắc thái của chủ đề. 1.0 = màu chủ đề gốc. < 1.0 = tối hơn. > 1.0 = sáng hơn. Phạm vi: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Hệ số độ mờ lưới nhỏ
settings.ui_grid_small_opacity_multiplier.description=Nhân alpha do chủ đề hiện tại cung cấp. 1.0 = không đổi. Phạm vi: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Độ rộng nét lưới nhỏ (px)
settings.ui_grid_small_line_width_px.description=Độ dày nét lưới theo đơn vị pixel kết cấu cũ của lưới. Các giá trị lịch sử hiện tại là 2 cho 1 mm và 4 cho 10 mm. Phạm vi: 1 - 10.
settings.ui_grid_small_z_offset_mm=Độ lệch Z lưới nhỏ (mm)
settings.ui_grid_small_z_offset_mm.description=Giữ lưới 1 mm ngay phía sau lưới 10 mm để tránh hiện tượng lạ về độ sâu. Phạm vi: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Hệ số độ sáng lưới chính
settings.ui_grid_major_brightness_multiplier.description=Nhân độ sáng RGB trong khi giữ nguyên sắc thái của chủ đề. 1.0 = màu chủ đề gốc. < 1.0 = tối hơn. > 1.0 = sáng hơn. Phạm vi: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Hệ số độ mờ lưới chính
settings.ui_grid_major_opacity_multiplier.description=Nhân alpha do chủ đề hiện tại cung cấp. 1.0 = không đổi. Phạm vi: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Độ rộng nét lưới chính (px)
settings.ui_grid_major_line_width_px.description=Độ dày nét lưới theo đơn vị pixel kết cấu cũ của lưới. Các giá trị lịch sử hiện tại là 2 cho 1 mm và 4 cho 10 mm. Phạm vi: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Chế độ chuyển động lưới
settings.ui_grid_motion_mode.description=major = Chỉ giữ lưới 10 mm sắc nét hiển thị khi di chuyển và tạm ẩn lưới 1 mm dày đặc. Lưới 1 mm trở lại sau khi ngừng di chuyển. all = Giữ cả hai lưới nét sắc hiển thị khi di chuyển. Độ liên tục thị giác tốt nhất, nhưng có thể tốn kém hơn. texture = Hành vi gốc: thay hình học nét bằng các tứ giác lưới có kết cấu khi di chuyển. Nhanh hơn, nhưng có thể sinh răng cưa / hoa văn moire. hidden = Ẩn các nét lưới khi di chuyển và khôi phục khi camera dừng.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Độ mờ kết xuất mặt đất
settings.ui_grid_ground_render_opacity.description=Độ mờ của phần tô mặt đất chính. Phần tô giữ nguyên tại mọi mức thu phóng; chỉ lưới 1 mm dày đặc bị giới hạn theo thu phóng. Đặt 0 để ẩn phần tô trong khi vẫn giữ bề mặt chọn hoạt động. Mặt phẳng làm việc tùy chỉnh bỏ qua thiết lập này. Phạm vi: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Độ nhạy tối thiểu quỹ đạo camera
settings.ui_camera_orbit_min.description=Độ nhạy xoay tính bằng độ trên một đơn vị tọa độ chuột JavaFX. min điều khiển các thao tác kéo rất chậm. Phạm vi: 0.0 - 1.0.
settings.ui_camera_orbit_max=Độ nhạy tối đa quỹ đạo camera
settings.ui_camera_orbit_max.description=Độ nhạy xoay tính bằng độ trên một đơn vị tọa độ chuột JavaFX. max là giới hạn trên cho các thao tác kéo nhanh. Phạm vi: 0.0 - 1.0.
settings.ui_camera_orbit_half=Tốc độ một nửa quỹ đạo camera
settings.ui_camera_orbit_half.description=Tốc độ con trỏ đã lọc tính bằng đơn vị tọa độ JavaFX mỗi giây mà tại đó độ nhạy nằm giữa min và max. Cao hơn = gia tốc nhẹ nhàng hơn. Phạm vi: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Thời gian tăng quỹ đạo camera (ms)
settings.ui_camera_orbit_rise_ms.description=Hằng số thời gian (mili giây) cho ước lượng tốc độ con trỏ khi tăng tốc. riseMs cao hơn làm gia tốc mềm hơn. Phạm vi: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Thời gian giảm quỹ đạo camera (ms)
settings.ui_camera_orbit_fall_ms.description=Hằng số thời gian (mili giây) cho ước lượng tốc độ con trỏ khi giảm tốc. fallMs thấp hơn khôi phục điều khiển tinh tế sớm hơn. Cả hai đều không thêm quán tính cho camera. Phạm vi: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Độ trễ ổn định cảnh cạnh (ms)
settings.ui_edges_scene_settle_delay_ms.description=Độ trễ sau khi thay đổi hình học / hiển thị. Giá trị cao hơn ức chế nhiều công việc hơn trong khi phát lại lịch sử nhanh. Phạm vi: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Độ trễ ổn định camera cạnh (ms)
settings.ui_edges_camera_settle_delay_ms.description=Độ trễ sau khi di chuyển camera trước khi độ dày nét mảnh trong không gian màn hình được tạo lại. Phạm vi: 0 - 10000.
settings.ui_edges_topology_precision=Độ chính xác tôpô cạnh
settings.ui_edges_topology_precision.description=Bước lượng tử hóa dùng để chuẩn hóa tôpô cạnh đặc trưng. Hình học mô hình và pháp tuyến mặt không đổi. Phạm vi: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Dung sai khâu cạnh (mm)
settings.ui_edges_stitch_tolerance.description=Dung sai khâu ranh giới theo milimét của cảnh. Chỉ dùng cho các cạnh trông như một mặt sau khi ghép kề lưới có chỉ mục. Nó cho phép nối lại các ranh giới được chia nhỏ khác nhau nhưng trùng khớp về hình học trước khi quyết định chúng có phải là cạnh đặc trưng thật hay không. Phạm vi: 0.0 - 1.0.
