settings.ui_lighting_key_enabled.description=വസ്തുവിന്റെ രൂപം വിവരിക്കാൻ ഉപയോഗിക്കുന്ന പ്രധാന വിളക്ക്. ഈ വിളക്ക് പൂർണ്ണമായി നീക്കം ചെയ്യാൻ enabled=false ക്രമീകരിക്കുക.
