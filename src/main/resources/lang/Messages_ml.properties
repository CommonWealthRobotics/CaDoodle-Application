settings.ui_lighting_fill_enabled.description=കീ ലൈറ്റ് സൃഷ്ടിക്കുന്ന നിഴൽ വശം മൃദുവാക്കുന്നു. ഈ വിളക്ക് പൂർണ്ണമായി നീക്കം ചെയ്യാൻ enabled=false ക്രമീകരിക്കുക.
