settings.ui_lighting_fill_intensity.description=ഉയർന്ന തീവ്രത: മികച്ച നിറകൃത്യത, മൃദുവായ ഷേഡിംഗ്. താഴ്ന്ന തീവ്രത: വ്യത്യസ്ത ദിശകളിലുള്ള മുഖങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ശക്തമാകും. പരിധി: 0.0 - 1.0.
