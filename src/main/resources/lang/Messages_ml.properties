settings.ui_lighting_rim_enabled.description=ചില ഉപരിതലങ്ങൾ വേർതിരിക്കാൻ സഹായിക്കുന്ന ദുർബലമായ ദ്വിതീയ വിളക്ക്. ഇത് സാധാരണയായി വളരെ സൂക്ഷ്മമായി നിൽക്കണം. ഈ വിളക്ക് പൂർണ്ണമായി നീക്കം ചെയ്യാൻ enabled=false ക്രമീകരിക്കുക.
