settings.ui_lighting_fill_y=ഫിൽ ലൈറ്റ് Y
settings.ui_lighting_fill_y.description=ലോക കോർഡിനേറ്റുകളിൽ ഫിൽ ലൈറ്റിന്റെ ദിശ. പരിധി: -1.0 - 1.0.
