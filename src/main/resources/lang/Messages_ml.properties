settings.ui_description=scene-style.properties എന്നതിൽ നിന്ന് എടുത്ത വിവരണം. മൂല്യം ConfigurationDatabase-ൽ സംരക്ഷിക്കുന്നു.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=ലൈറ്റിംഗ് മോഡ്
settings.ui_lighting_mode.description=കൃത്യം ഒരു ലൈറ്റിംഗ് മോഡ് മാത്രം സൂക്ഷിക്കുക. 'stable' = സ്ഥിരമായ ലോക-സ്ഥലത്തെ ദിശാബോധമുള്ള വിളക്കുകൾ. ലൈറ്റിംഗ് ക്യാമറയോടൊപ്പം കറങ്ങുന്നില്ല. നല്ല നിറകൃത്യതയ്ക്കും വായിക്കാവുന്ന CAD ജ്യാമിതിക്കും വേണ്ടി രൂപകൽപ്പന ചെയ്തത്. 'kevin' = യഥാർത്ഥ BowlerStudio ലൈറ്റിംഗ്. മൂന്ന് പോയിന്റ് വിളക്കുകൾ ഉപയോഗിക്കുന്നു; ഒന്ന് ക്യാമറയെ പിന്തുടരുന്നു. ഈ മോഡിൽ താഴെയുള്ള സ്ഥിര-വിളക്ക് ക്രമീകരണങ്ങൾ അവഗണിക്കുന്നു.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=അംബിയന്റ് ലൈറ്റ്
settings.ui_lighting_ambient.description=അംബിയന്റ് ലൈറ്റ് ദൃശ്യമായ എല്ലാ ഉപരിതലത്തെയും ഒരുപോലെ ബാധിക്കുന്നു. ഉയർന്നത്: നിഴലുകൾ തെളിച്ചമുള്ളതാകും, നിറങ്ങൾ അവയുടെ അടിസ്ഥാന നിറത്തോട് അടുത്തു നിൽക്കും, പക്ഷേ ഉപരിതലങ്ങൾ പരന്നതായി തോന്നും. താഴ്ന്നത്: ഷേഡിംഗും ഉപരിതല വേർതിരിവും ശക്തമാകും, പക്ഷേ നിഴലുള്ള നിറങ്ങൾ ഇരുണ്ടതാകും.
