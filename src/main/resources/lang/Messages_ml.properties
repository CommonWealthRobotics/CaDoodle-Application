settings.ui_edges_angle_degrees.description=അയൽ മുഖങ്ങൾക്കിടയിലെ ഏറ്റവും കുറഞ്ഞ കോൺ, അതിനു ശേഷമാണ് അവയുടെ പങ്കിട്ട അരിക് വരയ്ക്കുന്നത്. ഉയർന്ന മൂല്യങ്ങൾ കുറച്ച് ചുളിവ് രേഖകൾ ഉണ്ടാക്കുന്നു. പരിധി: 0 - 360.
settings.ui_edges_width_mode=അരിക് വീതി മോഡ്
settings.ui_edges_width_mode.description=screen = രൂപരേഖയെ സ്ക്രീൻ പിക്സലിൽ ഏകദേശം സ്ഥിരമായി നിർത്തുന്നു. ഏത് സൂം ലെവലിലും CAD-ശൈലിയിലുള്ള നേർത്ത രേഖയ്ക്ക് മികച്ചത്. world = രംഗത്തിന്റെ മില്ലിമീറ്ററിൽ സ്ഥിരമായ ആരം ഉപയോഗിക്കുന്നു.
settings.ui_edges_width_px=അരിക് വീതി പിക്സൽ
settings.ui_edges_width_px.description=widthMode=screen ആയിരിക്കുമ്പോൾ ദൃശ്യമായ രേഖാ വീതി. പരിധി: 0.1 - 10.0.
settings.ui_edges_radius=അരിക് ആരം
settings.ui_edges_radius.description=രംഗത്തിന്റെ മില്ലിമീറ്ററിൽ ലോക-സ്ഥലത്തെ അരിക് ആരം. widthMode=world ആയിരിക്കുമ്പോൾ മാത്രം ഉപയോഗിക്കുന്നു. പരിധി: 0.001 - 100.0.
settings.ui_edges_brightness=അരിക് തെളിച്ചം
settings.ui_edges_brightness.description=0.0 = കറുപ്പ്, 1.0 = വെളുപ്പ്. പരിധി: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=ചെറിയ ഗ്രിഡ് ദൃശ്യമാകുന്ന സൂം ആഴം
settings.ui_grid_small_visible_zoom_depth.description=1 mm ഗ്രിഡ് എത്ര അകലെ വരെ ദൃശ്യമായി തുടരുന്നു എന്ന് നിയന്ത്രിക്കുന്നു. ഉയർന്ന മൂല്യം = 1 mm ഗ്രിഡ് നേരത്തെ / കൂടുതൽ അകലെ ദൃശ്യമാകുന്നു. പരിധി: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=ചെറിയ ഗ്രിഡ് തെളിച്ച ഗുണകം
settings.ui_grid_small_brightness_multiplier.description=തീം ഹ്യൂ സംരക്ഷിച്ചുകൊണ്ട് RGB തെളിച്ചം ഗുണിക്കുന്നു. 1.0 = യഥാർത്ഥ തീം നിറം. < 1.0 = ഇരുണ്ടത്. > 1.0 = തെളിച്ചമുള്ളത്. പരിധി: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=ചെറിയ ഗ്രിഡ് അതാര്യത ഗുണകം
settings.ui_grid_small_opacity_multiplier.description=നിലവിലെ തീം നൽകുന്ന ആൽഫ ഗുണിക്കുന്നു. 1.0 = മാറ്റമില്ല. പരിധി: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=ചെറിയ ഗ്രിഡ് രേഖാ വീതി (px)
settings.ui_grid_small_line_width_px.description=ഗ്രിഡിന്റെ പഴയ ടെക്സ്ചർ-പിക്സൽ യൂണിറ്റുകളിൽ ഗ്രിഡ് രേഖയുടെ കട്ടി. നിലവിലെ ചരിത്ര മൂല്യങ്ങൾ 1 mm-ന് 2, 10 mm-ന് 4 എന്നിവയാണ്. പരിധി: 1 - 10.
settings.ui_grid_small_z_offset_mm=ചെറിയ ഗ്രിഡ് Z ഓഫ്സെറ്റ് (mm)
settings.ui_grid_small_z_offset_mm.description=ആഴ വൈകല്യങ്ങൾ ഒഴിവാക്കാൻ 1 mm ഗ്രിഡ് 10 mm ഗ്രിഡിന് അൽപം പിന്നിലായി നിർത്തുക. പരിധി: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=വലിയ ഗ്രിഡ് തെളിച്ച ഗുണകം
settings.ui_grid_major_brightness_multiplier.description=തീം ഹ്യൂ സംരക്ഷിച്ചുകൊണ്ട് RGB തെളിച്ചം ഗുണിക്കുന്നു. 1.0 = യഥാർത്ഥ തീം നിറം. < 1.0 = ഇരുണ്ടത്. > 1.0 = തെളിച്ചമുള്ളത്. പരിധി: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=വലിയ ഗ്രിഡ് അതാര്യത ഗുണകം
settings.ui_grid_major_opacity_multiplier.description=നിലവിലെ തീം നൽകുന്ന ആൽഫ ഗുണിക്കുന്നു. 1.0 = മാറ്റമില്ല. പരിധി: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=വലിയ ഗ്രിഡ് രേഖാ വീതി (px)
settings.ui_grid_major_line_width_px.description=ഗ്രിഡിന്റെ പഴയ ടെക്സ്ചർ-പിക്സൽ യൂണിറ്റുകളിൽ ഗ്രിഡ് രേഖയുടെ കട്ടി. നിലവിലെ ചരിത്ര മൂല്യങ്ങൾ 1 mm-ന് 2, 10 mm-ന് 4 എന്നിവയാണ്. പരിധി: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=ഗ്രിഡ് ചലന മോഡ്
settings.ui_grid_motion_mode.description=major = ചലിക്കുമ്പോൾ വ്യക്തമായ 10 mm ഗ്രിഡ് മാത്രം ദൃശ്യമായി നിർത്തി സാന്ദ്രമായ 1 mm ഗ്രിഡ് താൽക്കാലികമായി മറയ്ക്കുക. ചലനം നിലച്ചതിന് ശേഷം 1 mm ഗ്രിഡ് തിരികെ വരും. all = ചലിക്കുമ്പോൾ വ്യക്തമായ രേഖാ ഗ്രിഡുകൾ രണ്ടും ദൃശ്യമായി നിർത്തുക. മികച്ച ദൃശ്യ തുടർച്ച, പക്ഷേ കൂടുതൽ ചെലവേറിയതാകാം. texture = യഥാർത്ഥ സ്വഭാവം: ചലിക്കുമ്പോൾ രേഖാ ജ്യാമിതി ടെക്സ്ചർ ചെയ്ത ഗ്രിഡ് ചതുർഭുജങ്ങളാൽ മാറ്റുക. വേഗതയേറിയത്, പക്ഷേ aliasing / moire പാറ്റേണുകൾ ഉണ്ടാക്കാം. hidden = ചലിക്കുമ്പോൾ ഗ്രിഡ് രേഖകൾ മറച്ച് ക്യാമറ നിൽക്കുമ്പോൾ അവ പുനഃസ്ഥാപിക്കുക.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=ഗ്രൗണ്ട് റെൻഡർ അതാര്യത
settings.ui_grid_ground_render_opacity.description=പ്രധാന ഭൂമി പൂരിപ്പിക്കലിന്റെ അതാര്യത. പൂരിപ്പിക്കൽ എല്ലാ സൂം ലെവലിലും അതേ സ്ഥലത്ത് നിൽക്കുന്നു; സാന്ദ്രമായ 1 mm ഗ്രിഡ് മാത്രമാണ് സൂമിനാൽ നിയന്ത്രിക്കപ്പെടുന്നത്. പൂരിപ്പിക്കൽ മറയ്ക്കാനും അതിന്റെ തിരഞ്ഞെടുപ്പ് ഉപരിതലം സജീവമായി നിർത്താനും 0 ക്രമീകരിക്കുക. ഇഷ്ടാനുസൃത വർക്ക്പ്ലെയിനുകൾ ഈ ക്രമീകരണം അവഗണിക്കുന്നു. പരിധി: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=ക്യാമറ ഓർബിറ്റ് കുറഞ്ഞ സംവേദനക്ഷമത
settings.ui_camera_orbit_min.description=JavaFX മൗസ്-കോർഡിനേറ്റ് യൂണിറ്റിന് ഡിഗ്രിയിൽ ഭ്രമണ സംവേദനക്ഷമത. min വളരെ സാവധാനമുള്ള വലിച്ചിൽ നിയന്ത്രിക്കുന്നു. പരിധി: 0.0 - 1.0.
settings.ui_camera_orbit_max=ക്യാമറ ഓർബിറ്റ് പരമാവധി സംവേദനക്ഷമത
settings.ui_camera_orbit_max.description=JavaFX മൗസ്-കോർഡിനേറ്റ് യൂണിറ്റിന് ഡിഗ്രിയിൽ ഭ്രമണ സംവേദനക്ഷമത. max വേഗത്തിലുള്ള വലിച്ചിലിനുള്ള ഉപരിപരിധിയാണ്. പരിധി: 0.0 - 1.0.
settings.ui_camera_orbit_half=ക്യാമറ ഓർബിറ്റ് പകുതി വേഗത
settings.ui_camera_orbit_half.description=സംവേദനക്ഷമത min-നും max-നും ഇടയിൽ പകുതിയാകുന്ന ഫിൽട്ടർ ചെയ്ത കർസർ വേഗത (JavaFX കോർഡിനേറ്റ് യൂണിറ്റ്/സെക്കൻഡ്). ഉയർന്നത് = മൃദുവായ ത്വരണം. പരിധി: 0 - 10000.
settings.ui_camera_orbit_rise_ms=ക്യാമറ ഓർബിറ്റ് ഉയരുന്ന സമയം (ms)
settings.ui_camera_orbit_rise_ms.description=വേഗത കൂട്ടുമ്പോൾ കർസർ വേഗതാ അനുമാനത്തിനുള്ള സമയ സ്ഥിരാങ്കങ്ങൾ (മില്ലിസെക്കൻഡ്). ഉയർന്ന riseMs ത്വരണം മൃദുവാക്കുന്നു. പരിധി: 0 - 10000.
settings.ui_camera_orbit_fall_ms=ക്യാമറ ഓർബിറ്റ് താഴുന്ന സമയം (ms)
settings.ui_camera_orbit_fall_ms.description=വേഗത കുറയ്ക്കുമ്പോൾ കർസർ വേഗതാ അനുമാനത്തിനുള്ള സമയ സ്ഥിരാങ്കങ്ങൾ (മില്ലിസെക്കൻഡ്). താഴ്ന്ന fallMs സൂക്ഷ്മ നിയന്ത്രണം വേഗത്തിൽ പുനഃസ്ഥാപിക്കുന്നു. രണ്ടും ക്യാമറ ജഡത്വം ചേർക്കുന്നില്ല. പരിധി: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=അരിക് രംഗം സ്ഥിരപ്പെടാനുള്ള കാലതാമസം (ms)
settings.ui_edges_scene_settle_delay_ms.description=ജ്യാമിതി/ഡിസ്പ്ലേ മാറ്റങ്ങൾക്ക് ശേഷമുള്ള കാലതാമസം. ഉയർന്ന മൂല്യങ്ങൾ വേഗത്തിലുള്ള ചരിത്ര പുനഃപ്രദർശനത്തിൽ കൂടുതൽ ജോലി അടക്കുന്നു. പരിധി: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=അരിക് ക്യാമറ സ്ഥിരപ്പെടാനുള്ള കാലതാമസം (ms)
settings.ui_edges_camera_settle_delay_ms.description=സ്ക്രീൻ-സ്ഥലത്തെ നേർത്ത രേഖാ കട്ടി പുനർനിർമ്മിക്കുന്നതിന് മുമ്പ് ക്യാമറ ചലനത്തിന് ശേഷമുള്ള കാലതാമസം. പരിധി: 0 - 10000.
settings.ui_edges_topology_precision=അരിക് ടോപ്പോളജി കൃത്യത
settings.ui_edges_topology_precision.description=ഫീച്ചർ-അരിക് ടോപ്പോളജി സാധാരണരൂപത്തിലാക്കാൻ ഉപയോഗിക്കുന്ന ക്വാണ്ടൈസേഷൻ ഘട്ടം. മോഡൽ ജ്യാമിതിയും മുഖ നോർമലുകളും മാറ്റമില്ലാതെ തുടരുന്നു. പരിധി: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=അരിക് സ്റ്റിച്ച് ടോളറൻസ് (mm)
settings.ui_edges_stitch_tolerance.description=രംഗത്തിന്റെ മില്ലിമീറ്ററിൽ അതിർത്തി സ്റ്റിച്ചിംഗ് ടോളറൻസ്. ഇൻഡക്സ് ചെയ്ത മെഷ് അടുപ്പത്തിന് ശേഷം ഒരു മുഖം പോലെ തോന്നുന്ന അരികുകൾക്ക് മാത്രം ഉപയോഗിക്കുന്നു. വ്യത്യസ്തമായി സബ്ഡിവൈഡ് ചെയ്തതും എന്നാൽ ജ്യാമിതീയമായി യോജിക്കുന്നതുമായ അതിർത്തികൾ യഥാർത്ഥ ഫീച്ചർ അരികുകളാണോ എന്ന് തീരുമാനിക്കുന്നതിന് മുമ്പ് വീണ്ടും ബന്ധിപ്പിക്കാൻ ഇത് അനുവദിക്കുന്നു. പരിധി: 0.0 - 1.0.
