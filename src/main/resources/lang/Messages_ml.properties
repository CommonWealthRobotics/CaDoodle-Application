# ---------------- edges ----------------
settings.ui_edges_enabled=ഫീച്ചർ അരികുകൾ പ്രവർത്തനക്ഷമം
settings.ui_edges_enabled.description=CSG വസ്തുക്കളുടെ യഥാർത്ഥ മൂർച്ചയുള്ള അരികുകളിലൂടെ ഇരുണ്ട ജ്യാമിതി വരയ്ക്കുക. ഒരേ തലത്തിലുള്ള ബഹുഭുജ അതിരുകൾ അവഗണിക്കുന്നു. അരികുകൾ പൂർണ്ണമായി നീക്കം ചെയ്യാൻ enabled=false ക്രമീകരിക്കുക.
