# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Felhasználói felület elemei
settings.ui_section_lighting=Világítás
settings.ui_section_edges=Jellemző élek
settings.ui_section_grid=Munkasík-rács
settings.ui_section_camera=Kamera keringés
settings.ui_section_timing=Jellemző élek időzítése
settings.ui_description=A leírás a scene-style.properties fájlból származik. Az érték a ConfigurationDatabase adatbázisba kerül mentésre.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Világítási mód
settings.ui_lighting_mode.description=Pontosan egy világítási módot tartson be. 'stable' = Rögzített, irányított fények világkoordinátákban. A világítás nem forog a kamerával. A jó színhűség és az olvasható CAD-geometria érdekében tervezték. 'kevin' = A BowlerStudio eredeti világítása. Három pontfényt használ; közülük egy követi a kamerát. Az alábbi stabil fény beállításait ebben a módban figyelmen kívül hagyja.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Környezeti fény
settings.ui_lighting_ambient.description=A környezeti fény minden látható felületre egyformán hat. Magasabb: világosabb árnyékok, a színek közelebb maradnak az alapszínükhöz, de a felületek laposabbnak tűnnek. Alacsonyabb: erősebb árnyalás és felületelválasztás, de az árnyékolt színek sötétebbé válnak.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Fő fény engedélyezve
settings.ui_lighting_key_enabled.description=A fő fény, amely az objektum formáját írja le. Állítsa enabled=false értékre a fény teljes eltávolításához.
settings.ui_lighting_key_intensity=Fő fény intenzitása
settings.ui_lighting_key_intensity.description=A fő fény intenzitása. Tartomány: 0.0 - 1.0.
settings.ui_lighting_key_x=Fő fény X
settings.ui_lighting_key_x.description=A fő fény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
settings.ui_lighting_key_y=Fő fény Y
settings.ui_lighting_key_y.description=A fő fény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
settings.ui_lighting_key_z=Fő fény Z
settings.ui_lighting_key_z.description=A fő fény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Kitöltő fény engedélyezve
settings.ui_lighting_fill_enabled.description=Lágyítja a fő fény által létrehozott árnyékos oldalt. Állítsa enabled=false értékre a fény teljes eltávolításához.
settings.ui_lighting_fill_intensity=Kitöltő fény intenzitása
settings.ui_lighting_fill_intensity.description=Magasabb intenzitás: jobb színhűség, lágyabb árnyalás. Alacsonyabb intenzitás: erősebb különbség az eltérő irányultságú lapok között. Tartomány: 0.0 - 1.0.
settings.ui_lighting_fill_x=Kitöltő fény X
settings.ui_lighting_fill_x.description=A kitöltő fény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
settings.ui_lighting_fill_y=Kitöltő fény Y
settings.ui_lighting_fill_y.description=A kitöltő fény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
settings.ui_lighting_fill_z=Kitöltő fény Z
settings.ui_lighting_fill_z.description=A kitöltő fény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Peremfény engedélyezve
settings.ui_lighting_rim_enabled.description=Gyenge másodlagos fény, amely segít néhány felület elkülönítésében. Rendszerint finomnak kell maradnia. Állítsa enabled=false értékre a fény teljes eltávolításához.
settings.ui_lighting_rim_intensity=Peremfény intenzitása
settings.ui_lighting_rim_intensity.description=Gyenge másodlagos fény, amely segít néhány felület elkülönítésében. Rendszerint finomnak kell maradnia. Tartomány: 0.0 - 1.0.
settings.ui_lighting_rim_x=Peremfény X
settings.ui_lighting_rim_x.description=A peremfény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
settings.ui_lighting_rim_y=Peremfény Y
settings.ui_lighting_rim_y.description=A peremfény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
settings.ui_lighting_rim_z=Peremfény Z
settings.ui_lighting_rim_z.description=A peremfény iránya világkoordinátákban. Tartomány: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Jellemző élek engedélyezve
settings.ui_edges_enabled.description=Sötét geometriát rajzol a CSG objektumok valódi éles élei mentén. Az egy síkban fekvő sokszögek határait figyelmen kívül hagyja. Állítsa enabled=false értékre az élek teljes eltávolításához.
settings.ui_edges_angle_degrees=Élszög fokban
settings.ui_edges_angle_degrees.description=A szomszédos lapok közötti legkisebb szög, amelynél a közös élük kirajzolódik. A nagyobb értékek kevesebb törésvonalat eredményeznek. Tartomány: 0 - 360.
settings.ui_edges_width_mode=Élszélesség mód
settings.ui_edges_width_mode.description=screen = A körvonalat megközelítőleg állandó értéken tartja képpontokban. A legjobb CAD-stílusú hajszálvonal megjelenéshez bármilyen nagyításnál. world = Rögzített sugarat használ a jelenet millimétereiben.
settings.ui_edges_width_px=Élszélesség képpontban
settings.ui_edges_width_px.description=A látható vonal szélessége, amikor widthMode=screen. Tartomány: 0.1 - 10.0.
settings.ui_edges_radius=Él sugara
settings.ui_edges_radius.description=Az él sugara világkoordinátákban, a jelenet millimétereiben. Csak akkor használatos, ha widthMode=world. Tartomány: 0.001 - 100.0.
settings.ui_edges_brightness=Él fényessége
settings.ui_edges_brightness.description=0.0 = fekete, 1.0 = fehér. Tartomány: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Kis rács láthatósági nagyítási mélysége
settings.ui_grid_small_visible_zoom_depth.description=Szabályozza, milyen messziről marad látható az 1 mm-es rács. Nagyobb érték = az 1 mm-es rács korábban / messzebbről jelenik meg. Tartomány: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Kis rács fényesség szorzója
settings.ui_grid_small_brightness_multiplier.description=Megszorozza az RGB fényességet, megőrizve a téma színárnyalatát. 1.0 = az eredeti téma szín. < 1.0 = sötétebb. > 1.0 = világosabb. Tartomány: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Kis rács átlátszatlanság szorzója
settings.ui_grid_small_opacity_multiplier.description=Megszorozza az aktuális téma által biztosított alfát. 1.0 = változatlan. Tartomány: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Kis rács vonalvastagsága (px)
settings.ui_grid_small_line_width_px.description=A rácsvonal vastagsága a rács örökölt textúrapixel-egységeiben. A jelenlegi történelmi értékek 2 az 1 mm-es és 4 a 10 mm-es rácshoz. Tartomány: 1 - 10.
settings.ui_grid_small_z_offset_mm=Kis rács Z eltolása (mm)
settings.ui_grid_small_z_offset_mm.description=Tartsa az 1 mm-es rácsot közvetlenül a 10 mm-es rács mögött a mélységi hibák elkerüléséhez. Tartomány: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Nagy rács fényesség szorzója
settings.ui_grid_major_brightness_multiplier.description=Megszorozza az RGB fényességet, megőrizve a téma színárnyalatát. 1.0 = az eredeti téma szín. < 1.0 = sötétebb. > 1.0 = világosabb. Tartomány: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Nagy rács átlátszatlanság szorzója
settings.ui_grid_major_opacity_multiplier.description=Megszorozza az aktuális téma által biztosított alfát. 1.0 = változatlan. Tartomány: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Nagy rács vonalvastagsága (px)
settings.ui_grid_major_line_width_px.description=A rácsvonal vastagsága a rács örökölt textúrapixel-egységeiben. A jelenlegi történelmi értékek 2 az 1 mm-es és 4 a 10 mm-es rácshoz. Tartomány: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Rács mozgás mód
settings.ui_grid_motion_mode.description=major = Mozgás közben csak az éles 10 mm-es rácsot tartsa láthatóan, és ideiglenesen rejtse el a sűrű 1 mm-es rácsot. Az 1 mm-es rács a mozgás leállása után visszatér. all = Mozgás közben mindkét éles vonalrácsot tartsa láthatóan. A legjobb vizuális folytonosság, de esetleg költségesebb. texture = Eredeti viselkedés: mozgás közben a vonalgeometriát textúrázott rácsnégyzetekre cseréli. Gyorsabb, de lépcsősödést / moiré-mintázatot okozhat. hidden = Mozgás közben rejtse el a rácsvonalakat, és a kamera megállásakor állítsa vissza őket.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Talaj megjelenítés átlátszatlansága
settings.ui_grid_ground_render_opacity.description=A fő talajkitöltés átlátszatlansága. A kitöltés minden nagyítási szinten helyben marad; csak a sűrű 1 mm-es rácsot korlátozza a nagyítás. Állítsa 0 értékre a kitöltés elrejtéséhez, miközben a kiválasztó felülete aktív marad. Az egyéni munkasíkok figyelmen kívül hagyják ezt a beállítást. Tartomány: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Kamera keringés minimális érzékenysége
settings.ui_camera_orbit_min.description=Forgási érzékenység fokban JavaFX egységenként. A min a nagyon lassú húzásokat szabályozza. Tartomány: 0.0 - 1.0.
settings.ui_camera_orbit_max=Kamera keringés maximális érzékenysége
settings.ui_camera_orbit_max.description=Forgási érzékenység fokban JavaFX egységenként. A max a gyors húzások felső határa. Tartomány: 0.0 - 1.0.
settings.ui_camera_orbit_half=Kamera keringés fél sebesség
settings.ui_camera_orbit_half.description=Szűrt kurzorsebesség JavaFX koordináta-egységben másodpercenként, amelynél az érzékenység a min és a max között félúton van. Nagyobb = szelídebb gyorsulás. Tartomány: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Kamera keringés felfutási idő (ms)
settings.ui_camera_orbit_rise_ms.description=Időállandók (ezredmásodpercben) a kurzorsebesség becsléséhez gyorsításkor. A nagyobb riseMs lágyítja a gyorsulást. Tartomány: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Kamera keringés lefutási idő (ms)
settings.ui_camera_orbit_fall_ms.description=Időállandók (ezredmásodpercben) a kurzorsebesség becsléséhez lassításkor. A kisebb fallMs hamarabb állítja vissza a finom vezérlést. Egyik sem ad kameratehetetlenséget. Tartomány: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Késleltetés jelenetváltozás után az élekhez (ms)
settings.ui_edges_scene_settle_delay_ms.description=Késleltetés a geometria/megjelenítés változásai után. A nagyobb értékek több munkát elnyomnak a gyors előzmény-visszajátszás során. Tartomány: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Késleltetés kameramozgás után az élekhez (ms)
settings.ui_edges_camera_settle_delay_ms.description=Késleltetés a kamera mozgása után, mielőtt a képernyőtérbeli hajszálvonal-vastagság újraépül. Tartomány: 0 - 10000.
settings.ui_edges_topology_precision=Élek topológiai pontossága
settings.ui_edges_topology_precision.description=A jellemző élek topológiájának normalizálásához használt kvantálási lépés. A modell geometriája és a lapnormálisok változatlanok maradnak. Tartomány: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Élek összevarrási tűrése (mm)
settings.ui_edges_stitch_tolerance.description=A határok összevarrási tűrése a jelenet millimétereiben. Csak látszólagos egyfelületű éleknél használatos az indexelt háló szomszédsága után. Lehetővé teszi, hogy az eltérően felosztott, de geometriailag egybeeső határok újra összekapcsolódjanak, mielőtt eldől, hogy valódi jellemző élek-e. Tartomány: 0.0 - 1.0.
