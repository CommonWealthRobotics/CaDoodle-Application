settings.ui_lighting_fill_enabled=ማሟያ መብራት በርቷል
settings.ui_lighting_fill_enabled.description=በዋና መብራት የተፈጠረውን የጥላ ጎን ያለሰልሳል። ይህን መብራት ሙሉ በሙሉ ለማስወገድ enabled=false ያዘጋጁ።
settings.ui_lighting_fill_intensity=የማሟያ መብራት ኃይለኛነት
settings.ui_lighting_fill_intensity.description=ከፍ ያለ ኃይለኛነት፡ የተሻለ የቀለም ታማኝነት፣ ለስላሳ ጥላ። ዝቅ ያለ ኃይለኛነት፡ በተለያየ አቅጣጫ ባሉ ገጾች መካከል ጠንካራ ልዩነት። ክልል፡ 0.0 - 1.0።
settings.ui_lighting_fill_x=ማሟያ መብራት X
settings.ui_lighting_fill_x.description=የማሟያ መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
settings.ui_lighting_fill_y=ማሟያ መብራት Y
settings.ui_lighting_fill_y.description=የማሟያ መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
settings.ui_lighting_fill_z=ማሟያ መብራት Z
settings.ui_lighting_fill_z.description=የማሟያ መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=የጎን መብራት በርቷል
settings.ui_lighting_rim_enabled.description=አንዳንድ ገጾችን ለመለየት የሚረዳ ደካማ ሁለተኛ መብራት። በመደበኛነት ረቂቅ ሆኖ መቆየት አለበት። ይህን መብራት ሙሉ በሙሉ ለማስወገድ enabled=false ያዘጋጁ።
settings.ui_lighting_rim_intensity=የጎን መብራት ኃይለኛነት
settings.ui_lighting_rim_intensity.description=አንዳንድ ገጾችን ለመለየት የሚረዳ ደካማ ሁለተኛ መብራት። በመደበኛነት ረቂቅ ሆኖ መቆየት አለበት። ክልል፡ 0.0 - 1.0።
settings.ui_lighting_rim_x=የጎን መብራት X
settings.ui_lighting_rim_x.description=የጎን መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
settings.ui_lighting_rim_y=የጎን መብራት Y
settings.ui_lighting_rim_y.description=የጎን መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
