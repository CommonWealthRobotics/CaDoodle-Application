# ---------------- edges ----------------
settings.ui_edges_enabled=የቅርጽ ጠርዞች በርተዋል
settings.ui_edges_enabled.description=በ CSG ነገሮች እውነተኛ ሹል ጠርዞች ላይ ጥቁር ጂኦሜትሪ ይሳሉ። በአንድ ጠፍጣፋ ላይ ያሉ የፖሊጎን ወሰኖች ችላ ይባላሉ። ጠርዞቹን ሙሉ በሙሉ ለማስወገድ enabled=false ያዘጋጁ።
settings.ui_edges_angle_degrees=የጠርዝ ማዕዘን ዲግሪ
settings.ui_edges_angle_degrees.description=ጋራ ጠርዛቸው ከመሳሉ በፊት በጎረቤት ገጾች መካከል ያለው ዝቅተኛ ማዕዘን። ከፍ ያሉ እሴቶች ጥቂት የመታጠፍ መስመሮችን ይሰጣሉ። ክልል፡ 0 - 360።
settings.ui_edges_width_mode=የጠርዝ ስፋት ሁነታ
