# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=የብርሃን ሁነታ
settings.ui_lighting_mode.description=በትክክል አንድ የብርሃን ሁነታ ይያዙ። 'stable' = በዓለም ቦታ የተስተካከሉ የአቅጣጫ መብራቶች። ብርሃኑ ከካሜራ ጋር አይሽከረከርም። ለጥሩ የቀለም ታማኝነት እና ለሚነበብ CAD ጂኦሜትሪ የተነደፈ። 'kevin' = የመጀመሪያው የ BowlerStudio ብርሃን። ሶስት የነጥብ መብራቶችን ይጠቀማል፤ አንዱ ካሜራውን ይከተላል። ከዚህ በታች ያሉት የተረጋጋ ብርሃን ቅንብሮች በዚህ ሁነታ ውስጥ ችላ ይባላሉ።
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=የአካባቢ ብርሃን
settings.ui_lighting_ambient.description=የአካባቢ ብርሃን በሚታየው ገጽ ሁሉ ላይ እኩል ተጽዕኖ ያሳድራል። ከፍ ያለ፡ ብሩህ ጥላዎች፣ ቀለሞች ወደ መሰረታዊ ቀለማቸው ይቀራሉ፣ ገጾች ግን የበለጠ ጠፍጣፋ ይመስላሉ። ዝቅ ያለ፡ ጠንካራ ጥላ እና የገጽ ልዩነት፣ ነገር ግን በጥላ ውስጥ ያሉ ቀለሞች ይጨልማሉ።
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=ዋና መብራት በርቷል
settings.ui_lighting_key_enabled.description=የነገሩን ቅርጽ ለመግለጽ የሚያገለግል ዋና መብራት። ይህን መብራት ሙሉ በሙሉ ለማስወገድ enabled=false ያዘጋጁ።
settings.ui_lighting_key_intensity=የዋና መብራት ኃይለኛነት
settings.ui_lighting_key_intensity.description=የዋና መብራት ኃይለኛነት። ክልል፡ 0.0 - 1.0።
settings.ui_lighting_key_x=ዋና መብራት X
settings.ui_lighting_key_x.description=የዋና መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
settings.ui_lighting_key_y=ዋና መብራት Y
settings.ui_lighting_key_y.description=የዋና መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
settings.ui_lighting_key_z=ዋና መብራት Z
settings.ui_lighting_key_z.description=የዋና መብራት አቅጣጫ በዓለም መጋጠሚያዎች። ክልል፡ -1.0 - 1.0።
