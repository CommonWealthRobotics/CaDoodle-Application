# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=የትንሽ ግሪድ የሚታይ የማጉላት ጥልቀት
settings.ui_grid_small_visible_zoom_depth.description=የ1 mm ግሪድ ምን ያህል ርቀት ላይ እንደሚታይ ይቆጣጠራል። ከፍ ያለ እሴት = የ1 mm ግሪድ ቀድሞ / በሩቅ ይታያል። ክልል፡ 1 - 10000።
settings.ui_grid_small_brightness_multiplier=የትንሽ ግሪድ ደምበር አባዢ
settings.ui_grid_small_brightness_multiplier.description=የገጽታ ቀለምን እየጠበቀ RGB ደምበርን ያባዛል። 1.0 = የመጀመሪያው የገጽታ ቀለም። < 1.0 = ጠቁር። > 1.0 = ብሩህ። ክልል፡ 0.0 - 3.0።
settings.ui_grid_small_opacity_multiplier=የትንሽ ግሪድ ግልጽነት አባዢ
settings.ui_grid_small_opacity_multiplier.description=በአሁኑ ገጽታ የሚሰጠውን ግልጽነት ያባዛል። 1.0 = ያልተቀየረ። ክልል፡ 0.0 - 1.0።
settings.ui_grid_small_line_width_px=የትንሽ ግሪድ መስመር ስፋት (px)
settings.ui_grid_small_line_width_px.description=የግሪድ መስመር ውፍረት በግሪድ አሮጌ የገጽታ-ፒክሰል አሃዶች። የአሁኑ ታሪካዊ እሴቶች ለ1 mm 2 እና ለ10 mm 4 ናቸው። ክልል፡ 1 - 10።
settings.ui_grid_small_z_offset_mm=የትንሽ ግሪድ Z መፈናቀል (mm)
settings.ui_grid_small_z_offset_mm.description=የጥልቀት ጉድለቶችን ለማስወገድ የ1 mm ግሪድን ከ10 mm ግሪድ በስተኋላ ያቆዩት። ክልል፡ -1.0 - 1.0።
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=የዋና ግሪድ ደምበር አባዢ
settings.ui_grid_major_brightness_multiplier.description=የገጽታ ቀለምን እየጠበቀ RGB ደምበርን ያባዛል። 1.0 = የመጀመሪያው የገጽታ ቀለም። < 1.0 = ጠቁር። > 1.0 = ብሩህ። ክልል፡ 0.0 - 3.0።
settings.ui_grid_major_opacity_multiplier=የዋና ግሪድ ግልጽነት አባዢ
settings.ui_grid_major_opacity_multiplier.description=በአሁኑ ገጽታ የሚሰጠውን ግልጽነት ያባዛል። 1.0 = ያልተቀየረ። ክልል፡ 0.0 - 1.0።
settings.ui_grid_major_line_width_px=የዋና ግሪድ መስመር ስፋት (px)
settings.ui_grid_major_line_width_px.description=የግሪድ መስመር ውፍረት በግሪድ አሮጌ የገጽታ-ፒክሰል አሃዶች። የአሁኑ ታሪካዊ እሴቶች ለ1 mm 2 እና ለ10 mm 4 ናቸው። ክልል፡ 1 - 10።
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=የግሪድ እንቅስቃሴ ሁነታ
settings.ui_grid_motion_mode.description=major = በሚንቀሳቀስበት ጊዜ የ10 mm ንጹህ ግሪድ ብቻ እንዲታይ ያድርጉ እና ጥቅጥቅ ያለውን የ1 mm ግሪድ ለጊዜው ይደብቁ። እንቅስቃሴው ከቆመ በኋላ የ1 mm ግሪድ ይመለሳል። all = በሚንቀሳቀስበት ጊዜ ሁለቱም ንጹህ የመስመር ግሪዶች እንዲታዩ ያድርጉ። ምርጥ የእይታ ቀጣይነት፣ ግን የበለጠ ውድ ሊሆን ይችላል። texture = የመጀመሪያ ባህሪ፡ በሚንቀሳቀስበት ጊዜ የመስመር ጂኦሜትሪን በገጽታ ያላቸው የግሪድ ኳዶች ይቀይሩ። ፈጣን፣ ግን የፒክሰል መጋጠሚያ / የማዕበል ንድፎችን ሊያመጣ ይችላል። hidden = በሚንቀሳቀስበት ጊዜ የግሪድ መስመሮችን ይደብቁ እና ካሜራው ሲቆም ይመልሷቸው።
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=የመሬት መቅረቢያ ግልጽነት
settings.ui_grid_ground_render_opacity.description=የዋናው የመሬት ሙሌት ግልጽነት። ሙሌቱ በማንኛውም የማጉላት ደረጃ በቦታው ይቆያል፤ በማጉላት የሚቆጣጠረው ጥቅጥቅ ያለው የ1 mm ግሪድ ብቻ ነው። ሙሌቱን ስውር ለማድረግ 0 ያዘጋጁ ነገር ግን የመምረጫ ገጹ ንቁ ሆኖ ይቆያል። ብጁ የስራ ጠለሎች ይህን ቅንብር ችላ ይላሉ። ክልል፡ 0.0 - 1.0።
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=ዝቅተኛ የካሜራ ሽክርክር ተጣጣፊነት
settings.ui_camera_orbit_min.description=የሽክርክር ተጣጣፊነት በዲግሪ በአንድ JavaFX የመዳፊት መጋጠሚያ አሃድ። min በጣም ቀርፋፋ ጎተትን ይቆጣጠራል። ክልል፡ 0.0 - 1.0።
settings.ui_camera_orbit_max=ከፍተኛ የካሜራ ሽክርክር ተጣጣፊነት
settings.ui_camera_orbit_max.description=የሽክርክር ተጣጣፊነት በዲግሪ በአንድ JavaFX የመዳፊት መጋጠሚያ አሃድ። max ለፈጣን ጎተት የላይኛው ገደብ ነው። ክልል፡ 0.0 - 1.0።
settings.ui_camera_orbit_half=የካሜራ ሽክርክር ግማሽ ፍጥነት
settings.ui_camera_orbit_half.description=የተጣራ የመዳፊት ፍጥነት በ JavaFX መጋጠሚያ አሃዶች በሰከንድ ሲሆን ተጣጣፊነቱ በmin እና max መካከል ግማሽ የሚሆንበት። ከፍ ያለ = ለስላሳ ፍጥነት መጨመር። ክልል፡ 0 - 10000።
settings.ui_camera_orbit_rise_ms=የካሜራ ሽክርክር የመጨመሪያ ጊዜ (ms)
settings.ui_camera_orbit_rise_ms.description=ፍጥነት በሚጨምርበት ጊዜ ለመዳፊት ፍጥነት ግምት የሚያገለግሉ የጊዜ ቋሚዎች (ሚሊሰከንድ)። ትልቅ riseMs ፍጥነት መጨመርን ያለሰልሳል። ክልል፡ 0 - 10000።
settings.ui_camera_orbit_fall_ms=የካሜራ ሽክርክር የመቀነሻ ጊዜ (ms)
settings.ui_camera_orbit_fall_ms.description=ፍጥነት በሚቀንስበት ጊዜ ለመዳፊት ፍጥነት ግምት የሚያገለግሉ የጊዜ ቋሚዎች (ሚሊሰከንድ)። ትንሽ fallMs ጥሩ ቁጥጥርን ቀድሞ ይመልሳል። ሁለቱም የካሜራ ኢንርሺያ አይጨምሩም። ክልል፡ 0 - 10000።
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=የጠርዝ ትእይንት የመረጋጋት መዘግየት (ms)
settings.ui_edges_scene_settle_delay_ms.description=ከጂኦሜትሪ/ማሳያ ለውጦች በኋላ ያለ መዘግየት። ከፍ ያሉ እሴቶች በፈጣን የታሪክ ድጋሚ ጨዋታ ወቅት ተጨማሪ ስራን ይገድባሉ። ክልል፡ 0 - 10000።
settings.ui_edges_camera_settle_delay_ms=የጠርዝ ካሜራ የመረጋጋት መዘግየት (ms)
settings.ui_edges_camera_settle_delay_ms.description=የስክሪን-ቦታ ቀጭን ውፍረት እንደገና ከመገነቡ በፊት ከካሜራ እንቅስቃሴ በኋላ ያለ መዘግየት። ክልል፡ 0 - 10000።
settings.ui_edges_topology_precision=የጠርዝ ቶፖሎጂ ትክክለኛነት
settings.ui_edges_topology_precision.description=የቅርጽ-ጠርዝ ቶፖሎጂን ለማስተካከል የሚያገለግል የመለኪያ ደረጃ። የሞዴል ጂኦሜትሪ እና የገጽ ቀጥተኛ አቅጣጫዎች ሳይቀየሩ ይቆያሉ። ክልል፡ 0.0 - 1.0።
settings.ui_edges_stitch_tolerance=የጠርዝ ስፌት መቻቻል (mm)
settings.ui_edges_stitch_tolerance.description=የወሰን ስፌት መቻቻል በቦታ ሚሊሜትር። ከተመዘገበ-መሽ ተያያዥነት በኋላ አንድ-ገጽ የሚመስሉ ጠርዞች ላይ ብቻ ይጠቀማል። እውነተኛ የቅርጽ ጠርዞች መሆናቸውን ከመወሰን በፊት በተለያየ መንገድ የተከፋፈሉ ግን በጂኦሜትሪ የሚገጣጠሙ ወሰኖች እንደገና እንዲገናኙ ይፈቅዳል። ክልል፡ 0.0 - 1.0።
