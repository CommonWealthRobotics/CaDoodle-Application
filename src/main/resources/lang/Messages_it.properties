# ============================================================
# UI ELEMENTS SETTINGS
# (every entry below maps to one key in scene-style.properties)
# The text of the setting is the short name, the description
# is shown under the control in the settings window.
# ============================================================
settings.ui_elements=Elementi dell'interfaccia
settings.ui_section_lighting=Illuminazione
settings.ui_section_edges=Bordi caratteristici
settings.ui_section_grid=Griglia del piano di lavoro
settings.ui_section_camera=Orbita della fotocamera
settings.ui_section_timing=Temporizzazione dei bordi caratteristici
settings.ui_description=Descrizione presa da scene-style.properties. Il valore viene salvato in ConfigurationDatabase.

# ---------------- lighting.mode ----------------
settings.ui_lighting_mode=Modalità di illuminazione
settings.ui_lighting_mode.description=Mantieni esattamente una modalità di illuminazione. 'stable' = Luci direzionali fisse nello spazio mondo. L'illuminazione non ruota con la fotocamera. Pensata per una buona fedeltà dei colori e una geometria CAD leggibile. 'kevin' = Illuminazione originale di BowlerStudio. Usa tre luci puntuali; una segue la fotocamera. Le impostazioni delle luci stabili qui sotto vengono ignorate in questa modalità.
# ---------------- lighting.ambient ----------------
settings.ui_lighting_ambient=Luce ambientale
settings.ui_lighting_ambient.description=La luce ambientale agisce allo stesso modo su ogni superficie visibile. Più alta: ombre più chiare, i colori restano più vicini al loro colore di base, ma le superfici appaiono più piatte. Più bassa: ombreggiatura e separazione delle superfici più forti, ma i colori in ombra diventano più scuri.
# ---------------- lighting.key ----------------
settings.ui_lighting_key_enabled=Luce principale attiva
settings.ui_lighting_key_enabled.description=Luce principale usata per descrivere la forma dell'oggetto. Imposta enabled=false per rimuovere completamente questa luce.
settings.ui_lighting_key_intensity=Intensità della luce principale
settings.ui_lighting_key_intensity.description=Intensità della luce principale. Intervallo: 0.0 - 1.0.
settings.ui_lighting_key_x=Luce principale X
settings.ui_lighting_key_x.description=Direzione della luce principale in coordinate mondo. Intervallo: -1.0 - 1.0.
settings.ui_lighting_key_y=Luce principale Y
settings.ui_lighting_key_y.description=Direzione della luce principale in coordinate mondo. Intervallo: -1.0 - 1.0.
settings.ui_lighting_key_z=Luce principale Z
settings.ui_lighting_key_z.description=Direzione della luce principale in coordinate mondo. Intervallo: -1.0 - 1.0.
# ---------------- lighting.fill ----------------
settings.ui_lighting_fill_enabled=Luce di riempimento attiva
settings.ui_lighting_fill_enabled.description=Attenua il lato in ombra creato dalla luce principale. Imposta enabled=false per rimuovere completamente questa luce.
settings.ui_lighting_fill_intensity=Intensità della luce di riempimento
settings.ui_lighting_fill_intensity.description=Intensità più alta: migliore fedeltà dei colori, ombreggiatura più morbida. Intensità più bassa: maggiore differenza tra facce con orientamenti diversi. Intervallo: 0.0 - 1.0.
settings.ui_lighting_fill_x=Luce di riempimento X
settings.ui_lighting_fill_x.description=Direzione della luce di riempimento in coordinate mondo. Intervallo: -1.0 - 1.0.
settings.ui_lighting_fill_y=Luce di riempimento Y
settings.ui_lighting_fill_y.description=Direzione della luce di riempimento in coordinate mondo. Intervallo: -1.0 - 1.0.
settings.ui_lighting_fill_z=Luce di riempimento Z
settings.ui_lighting_fill_z.description=Direzione della luce di riempimento in coordinate mondo. Intervallo: -1.0 - 1.0.
# ---------------- lighting.rim ----------------
settings.ui_lighting_rim_enabled=Luce di contorno attiva
settings.ui_lighting_rim_enabled.description=Luce secondaria debole che aiuta a separare alcune superfici. Dovrebbe normalmente restare discreta. Imposta enabled=false per rimuovere completamente questa luce.
settings.ui_lighting_rim_intensity=Intensità della luce di contorno
settings.ui_lighting_rim_intensity.description=Luce secondaria debole che aiuta a separare alcune superfici. Dovrebbe normalmente restare discreta. Intervallo: 0.0 - 1.0.
settings.ui_lighting_rim_x=Luce di contorno X
settings.ui_lighting_rim_x.description=Direzione della luce di contorno in coordinate mondo. Intervallo: -1.0 - 1.0.
settings.ui_lighting_rim_y=Luce di contorno Y
settings.ui_lighting_rim_y.description=Direzione della luce di contorno in coordinate mondo. Intervallo: -1.0 - 1.0.
settings.ui_lighting_rim_z=Luce di contorno Z
settings.ui_lighting_rim_z.description=Direzione della luce di contorno in coordinate mondo. Intervallo: -1.0 - 1.0.
# ---------------- edges ----------------
settings.ui_edges_enabled=Bordi caratteristici attivi
settings.ui_edges_enabled.description=Disegna geometria scura lungo i bordi realmente netti degli oggetti CSG. I confini di poligoni complanari vengono ignorati. Imposta enabled=false per rimuovere completamente i bordi.
settings.ui_edges_angle_degrees=Angolo del bordo (gradi)
settings.ui_edges_angle_degrees.description=Angolo minimo tra facce adiacenti prima che venga disegnato il bordo condiviso. Valori più alti producono meno linee di piega. Intervallo: 0 - 360.
settings.ui_edges_width_mode=Modalità larghezza bordo
settings.ui_edges_width_mode.description=screen = Mantiene il contorno approssimativamente costante in pixel dello schermo. Ideale per un aspetto a linea sottile in stile CAD a qualsiasi livello di zoom. world = Usa un raggio fisso in millimetri della scena.
settings.ui_edges_width_px=Larghezza bordo (pixel)
settings.ui_edges_width_px.description=Larghezza visibile della linea quando widthMode=screen. Intervallo: 0.1 - 10.0.
settings.ui_edges_radius=Raggio del bordo
settings.ui_edges_radius.description=Raggio del bordo nello spazio mondo, in millimetri della scena. Usato solo quando widthMode=world. Intervallo: 0.001 - 100.0.
settings.ui_edges_brightness=Luminosità del bordo
settings.ui_edges_brightness.description=0.0 = nero, 1.0 = bianco. Intervallo: 0.0 - 1.0.
# ---------------- grid.small ----------------
settings.ui_grid_small_visible_zoom_depth=Profondità di zoom visibile della griglia piccola
settings.ui_grid_small_visible_zoom_depth.description=Controlla a quale distanza la griglia da 1 mm resta visibile. Valore più alto = la griglia da 1 mm appare prima / più lontano. Intervallo: 1 - 10000.
settings.ui_grid_small_brightness_multiplier=Moltiplicatore di luminosità della griglia piccola
settings.ui_grid_small_brightness_multiplier.description=Moltiplica la luminosità RGB preservando la tonalità del tema. 1.0 = colore originale del tema. < 1.0 = più scuro. > 1.0 = più chiaro. Intervallo: 0.0 - 3.0.
settings.ui_grid_small_opacity_multiplier=Moltiplicatore di opacità della griglia piccola
settings.ui_grid_small_opacity_multiplier.description=Moltiplica l'alfa fornito dal tema corrente. 1.0 = invariato. Intervallo: 0.0 - 1.0.
settings.ui_grid_small_line_width_px=Larghezza linea della griglia piccola (px)
settings.ui_grid_small_line_width_px.description=Spessore delle linee della griglia nelle vecchie unità pixel di texture della griglia. I valori storici attuali sono 2 per 1 mm e 4 per 10 mm. Intervallo: 1 - 10.
settings.ui_grid_small_z_offset_mm=Scostamento Z della griglia piccola (mm)
settings.ui_grid_small_z_offset_mm.description=Mantiene la griglia da 1 mm appena dietro quella da 10 mm per evitare artefatti di profondità. Intervallo: -1.0 - 1.0.
# ---------------- grid.major ----------------
settings.ui_grid_major_brightness_multiplier=Moltiplicatore di luminosità della griglia principale
settings.ui_grid_major_brightness_multiplier.description=Moltiplica la luminosità RGB preservando la tonalità del tema. 1.0 = colore originale del tema. < 1.0 = più scuro. > 1.0 = più chiaro. Intervallo: 0.0 - 3.0.
settings.ui_grid_major_opacity_multiplier=Moltiplicatore di opacità della griglia principale
settings.ui_grid_major_opacity_multiplier.description=Moltiplica l'alfa fornito dal tema corrente. 1.0 = invariato. Intervallo: 0.0 - 1.0.
settings.ui_grid_major_line_width_px=Larghezza linea della griglia principale (px)
settings.ui_grid_major_line_width_px.description=Spessore delle linee della griglia nelle vecchie unità pixel di texture della griglia. I valori storici attuali sono 2 per 1 mm e 4 per 10 mm. Intervallo: 1 - 10.
# ---------------- grid.motionMode ----------------
settings.ui_grid_motion_mode=Modalità movimento griglia
settings.ui_grid_motion_mode.description=major = Mantiene visibile solo la griglia nitida da 10 mm durante il movimento e nasconde temporaneamente quella densa da 1 mm. La griglia da 1 mm ritorna quando il movimento si ferma. all = Mantiene visibili entrambe le griglie a linee nitide durante il movimento. Migliore continuità visiva, ma potenzialmente più costoso. texture = Comportamento originale: sostituisce la geometria delle linee con quadrilateri di griglia texturizzati durante il movimento. Più veloce, ma può produrre aliasing / pattern moiré. hidden = Nasconde le linee della griglia durante il movimento e le ripristina quando la fotocamera si ferma.
# ---------------- grid.ground ----------------
settings.ui_grid_ground_render_opacity=Opacità del terreno
settings.ui_grid_ground_render_opacity.description=Opacità del riempimento principale del terreno. Il riempimento resta al suo posto a ogni livello di zoom; solo la griglia densa da 1 mm dipende dallo zoom. Imposta 0 per nascondere il riempimento mantenendo attiva la sua superficie di selezione. I piani di lavoro personalizzati ignorano questa impostazione. Intervallo: 0.0 - 1.0.
# ---------------- camera.orbit ----------------
settings.ui_camera_orbit_min=Sensibilità minima dell'orbita della fotocamera
settings.ui_camera_orbit_min.description=Sensibilità di rotazione in gradi per unità di coordinata mouse JavaFX. min controlla i trascinamenti molto lenti. Intervallo: 0.0 - 1.0.
settings.ui_camera_orbit_max=Sensibilità massima dell'orbita della fotocamera
settings.ui_camera_orbit_max.description=Sensibilità di rotazione in gradi per unità di coordinata mouse JavaFX. max è un limite superiore per i trascinamenti veloci. Intervallo: 0.0 - 1.0.
settings.ui_camera_orbit_half=Velocità media dell'orbita della fotocamera
settings.ui_camera_orbit_half.description=Velocità filtrata del cursore, in unità di coordinata JavaFX al secondo, alla quale la sensibilità è a metà tra min e max. Più alta = accelerazione più dolce. Intervallo: 0 - 10000.
settings.ui_camera_orbit_rise_ms=Tempo di salita dell'orbita della fotocamera (ms)
settings.ui_camera_orbit_rise_ms.description=Costanti di tempo (millisecondi) per la stima della velocità del cursore in accelerazione. Un riseMs più alto attenua l'accelerazione. Intervallo: 0 - 10000.
settings.ui_camera_orbit_fall_ms=Tempo di discesa dell'orbita della fotocamera (ms)
settings.ui_camera_orbit_fall_ms.description=Costanti di tempo (millisecondi) per la stima della velocità del cursore in decelerazione. Un fallMs più basso ripristina prima il controllo fine. Nessuno dei due aggiunge inerzia alla fotocamera. Intervallo: 0 - 10000.
# ---------------- edge timing ----------------
settings.ui_edges_scene_settle_delay_ms=Ritardo di stabilizzazione della scena dei bordi (ms)
settings.ui_edges_scene_settle_delay_ms.description=Ritardo dopo modifiche a geometria o visualizzazione. Valori più alti sopprimono più lavoro durante la riproduzione rapida della cronologia. Intervallo: 0 - 10000.
settings.ui_edges_camera_settle_delay_ms=Ritardo di stabilizzazione della fotocamera dei bordi (ms)
settings.ui_edges_camera_settle_delay_ms.description=Ritardo dopo il movimento della fotocamera prima che lo spessore della linea sottile in spazio schermo venga ricostruito. Intervallo: 0 - 10000.
settings.ui_edges_topology_precision=Precisione topologica dei bordi
settings.ui_edges_topology_precision.description=Passo di quantizzazione usato per normalizzare la topologia dei bordi caratteristici. La geometria del modello e le normali delle facce restano invariate. Intervallo: 0.0 - 1.0.
settings.ui_edges_stitch_tolerance=Tolleranza di cucitura dei bordi (mm)
settings.ui_edges_stitch_tolerance.description=Tolleranza di cucitura dei confini in millimetri della scena. Usata solo per bordi apparenti a faccia singola dopo l'analisi di adiacenza della mesh indicizzata. Consente di riconnettere confini suddivisi diversamente ma geometricamente coincidenti prima di decidere se sono veri bordi caratteristici. Intervallo: 0.0 - 1.0.
