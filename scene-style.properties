# ============================================================
# CaDoodle 3D scene style
# ============================================================
#
# This file controls viewport lighting, object edge rendering, and the workplane grid.
# Values are read when the application starts.
#
# ------------------------------------------------------------
# LIGHTING MODEL
# ------------------------------------------------------------
#
# Keep exactly one lighting.mode line active.
#
# stable
#   Fixed world-space directional lights.
#   Lighting does not rotate with the camera.
#   Designed for good color fidelity and readable CAD geometry.
#
# kevin
#   Original BowlerStudio lighting.
#   Uses three point lights; one follows the camera.
#   The stable-light settings below are ignored in this mode.
#

lighting.mode=stable
# lighting.mode=kevin

# Scene presets
#
# Current recommended scene:
#   lighting.mode=stable
#   grid.small.visibleZoomDepth=350
#   grid.motionMode=all
#
# Original BowlerStudio-style scene:
#   lighting.mode=kevin
#   grid.small.visibleZoomDepth=200
#   grid.motionMode=texture
#
# These are ordinary settings, not a separate preset system.
# Change the active values in this file to switch between them.


# ------------------------------------------------------------
# STABLE LIGHTING
# ------------------------------------------------------------
#
# Ambient light affects every visible surface equally.
#
# Higher:
#   brighter shadows, colors stay closer to their base color,
#   but surfaces look flatter.
#
# Lower:
#   stronger shading and surface separation,
#   but shadowed colors become darker.
#

lighting.ambient=0.47


# ------------------------------------------------------------
# KEY LIGHT
# ------------------------------------------------------------
#
# Main light used to describe the shape of the object.
#
# intensity: 0.0 - 1.0
# x/y/z: direction of the light in world coordinates.
#
# Set enabled=false to remove this light completely.
#

lighting.key.enabled=true
lighting.key.intensity=0.52
lighting.key.x=-0.80
lighting.key.y=-1.00
lighting.key.z=-0.45


# ------------------------------------------------------------
# FILL LIGHT
# ------------------------------------------------------------
#
# Softens the shadow side created by the key light.
#
# Higher intensity:
#   better color fidelity, softer shading.
#
# Lower intensity:
#   stronger difference between differently oriented faces.
#

lighting.fill.enabled=true
lighting.fill.intensity=0.16
lighting.fill.x=0.65
lighting.fill.y=-0.10
lighting.fill.z=-0.25


# ------------------------------------------------------------
# RIM LIGHT
# ------------------------------------------------------------
#
# Weak secondary light used to help separate some surfaces.
# This should normally stay subtle.
#

lighting.rim.enabled=true
lighting.rim.intensity=0.08
lighting.rim.x=0.20
lighting.rim.y=0.90
lighting.rim.z=-0.15


# ============================================================
# FEATURE EDGES
# ============================================================
#
# Draw dark geometry along real sharp edges of CSG objects.
#
# Coplanar polygon boundaries are ignored.
#
# angleDegrees
#   Minimum angle between neighboring faces before their shared
#   edge is drawn. Higher values produce fewer crease lines.
#
# radius
#   World-space edge radius in scene millimeters.
#   Used only when widthMode=world.
#
# brightness
#   0.0 = black
#   1.0 = white
#

edges.enabled=true
edges.angleDegrees=35

# Edge thickness mode:
#
# screen
#   Keeps the outline approximately constant in screen pixels.
#   Best for a CAD-style hairline appearance at any zoom level.
#
# world
#   Uses a fixed radius in scene millimetres.
#
edges.widthMode=screen

# Visible line width when widthMode=screen.
edges.widthPx=1.6

edges.radius=0.15
edges.brightness=0.0


# ============================================================
# WORKPLANE GRID
# ============================================================
#
# The grid keeps its theme colors; the values below modify them.
#
# visibleZoomDepth
#   Controls how far away the 1 mm grid remains visible.
#   Higher value = 1 mm grid appears earlier / farther away.
#
# brightnessMultiplier
#   Multiplies RGB brightness while preserving the theme hue.
#   1.0 = original theme color
#   < 1.0 = darker
#   > 1.0 = brighter
#
# opacityMultiplier
#   Multiplies the alpha supplied by the current theme.
#   1.0 = unchanged.
#
# lineWidthPx
#   Grid line thickness in the grid's legacy texture-pixel units.
#   Current historical values are 2 for 1 mm and 4 for 10 mm.
#

grid.small.visibleZoomDepth=350
grid.small.brightnessMultiplier=0.85
grid.small.opacityMultiplier=1.0
grid.small.lineWidthPx=2

grid.major.brightnessMultiplier=1.0
grid.major.opacityMultiplier=1.0
grid.major.lineWidthPx=4

# ------------------------------------------------------------
# GRID WHILE MOVING THE CAMERA
# ------------------------------------------------------------
#
# major
#   Keep only the crisp 10 mm grid visible while moving and temporarily
#   hide the dense 1 mm grid. The 1 mm grid returns after movement stops.
#
# all
#   Keep both crisp line grids visible while moving.
#   Best visual continuity, but potentially more expensive.
#
# texture
#   Original behavior: swap line geometry for textured grid quads
#   while moving. Faster, but may produce aliasing / moire patterns.
#
# hidden
#   Hide grid lines while moving and restore them when the camera stops.
#

grid.motionMode=all


# ------------------------------------------------------------
# FEATURE EDGE REBUILD TIMING
# ------------------------------------------------------------
#
# Edges are intentionally NOT regenerated for every intermediate
# scene state.
#
# This is especially important while loading/replaying project
# history: transient states remain edge-free and only the final,
# settled scene gets an edge mesh.
#
# sceneSettleDelayMs:
#   Delay after geometry/display changes.
#   Higher values suppress more work during rapid history replay.
#
# cameraSettleDelayMs:
#   Delay after camera movement before screen-space hairline
#   thickness is rebuilt.
#

edges.sceneSettleDelayMs=500
edges.cameraSettleDelayMs=120

# Quantization step used to normalize feature-edge topology.
# Model geometry and face normals remain unchanged.
edges.topologyPrecision=0.00001

# Boundary stitching tolerance in scene millimeters.
# Used only for apparent one-face edges after indexed-mesh adjacency.
# It allows differently subdivided but geometrically coincident borders
# to be reconnected before deciding whether they are real feature edges.
edges.stitchTolerance=0.002
